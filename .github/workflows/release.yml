        run: cargo xtask channels rpm repo index --suite testing --current "$RUNNER_TEMP/rpm-current" --out "$RUNNER_TEMP/rpm-next" --rpms "$RUNNER_TEMP/rpm-signed" --version "${TAG#v}" --date "$(date +%s)"
      - name: Sign repomd.xml of each architecture with the signing subkey (repomd.xml.asc), then remove the key
        id: sign
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: cargo xtask channels rpm repo sign --dir "$RUNNER_TEMP/rpm-next/testing" --work "$RUNNER_TEMP/rpm-sign" --fingerprint "$APT_GPG_FINGERPRINT" --output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: rpm-next-3
          path: |
            ${{ runner.temp }}/rpm-next/testing
            ${{ runner.temp }}/rpm-next/etags.txt
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: rpm-signed-3
          path: ${{ runner.temp }}/rpm-signed
          if-no-files-found: error
          retention-days: 1

  testing-rpm-write-3:
    needs: [plan, newest, testing-rpm-read-3, testing-rpm-index-3]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && needs.testing-rpm-read-3.result == 'success' && needs.testing-rpm-index-3.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      attestations: read
      id-token: write
    outputs:
      conflict: ${{ steps.put.outputs.conflict }}
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the apt repository and on the signed repodata (a job without them does nothing and ends green)
        id: gate
        env:
          READ_ENABLED: ${{ needs.testing-rpm-read-3.outputs.enabled }}
          INDEX_SIGNED: ${{ needs.testing-rpm-index-3.outputs.signed }}
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels gate --label testing-rpm-write-3 --output "$GITHUB_OUTPUT" --require "READ_ENABLED=$READ_ENABLED" --require "INDEX_SIGNED=$INDEX_SIGNED" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: rpm-next-3
          path: ${{ runner.temp }}/rpm-next
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: rpm-signed-3
          path: ${{ runner.temp }}/rpm-signed
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: release-${{ needs.newest.outputs.tag }}
          path: dist
      - name: The files match SHA256SUMS
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The files are the attested assets of this commit
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release check dist --version "${TAG#v}" --commit "$COMMIT"
      - name: The signed .rpms are the attested packages plus a signature (checked against SHA256SUMS and the digests of the signing job)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: cargo xtask channels rpm check-signed --dir "$RUNNER_TEMP/rpm-signed" --version "${TAG#v}" --sums dist/SHA256SUMS --signed-sums "$RUNNER_TEMP/rpm-signed/SHA256SUMS.signed"
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: cargo xtask channels assume --role-arn "$ROLE_ARN" --session-name "hostkeeper-apt-$GITHUB_RUN_ID" --region us-east-1 --token-url "$ACTIONS_ID_TOKEN_REQUEST_URL" --env-file "$GITHUB_ENV"
      - name: Upload the .rpms once each, then write the signed repodata with If-Match on the ETags that were read, then invalidate /rpm/testing/<arch>/repodata/*
        id: put
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels rpm repo write --suite testing --bucket "$APT_BUCKET" --distribution-id "$APT_DISTRIBUTION_ID" --hostname "$APT_HOSTNAME" --next "$RUNNER_TEMP/rpm-next" --rpms "$RUNNER_TEMP/rpm-signed" --version "${TAG#v}" --last --output "$GITHUB_OUTPUT"

  # TESTING, the macOS installers: hostkeeper-<version>-macos-arm64.pkg and hello's
  # hello-<version>-macos-arm64.pkg, their bundles and a SHA256SUMS of the four, once each, into
  # pkg/hostkeeper/<version>/ of the same bucket (cargo xtask channels pkg upload; a second put of
  # the same bytes is accepted, other bytes at the same key fail). Both installers are signed by
  # artifacts.yml (Developer ID Installer) and not notarized; nothing here signs them: the pointer
  # below moves the same signed bytes.

  testing-pkg-upload:
    needs: [plan, newest]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      attestations: read
      id-token: write
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the repository (a job without them does nothing and ends green)
        id: gate
        env:
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels gate --label testing-pkg-upload --output "$GITHUB_OUTPUT" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: release-${{ needs.newest.outputs.tag }}
          path: dist
      - name: The files match SHA256SUMS
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The files are the attested assets of this commit
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release check dist --version "${TAG#v}" --commit "$COMMIT"
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: cargo xtask channels assume --role-arn "$ROLE_ARN" --session-name "hostkeeper-testing-pkg-upload-$GITHUB_RUN_ID" --region us-east-1 --token-url "$ACTIONS_ID_TOKEN_REQUEST_URL" --env-file "$GITHUB_ENV"
      - name: Put the installers, their bundles and their SHA256SUMS once each (the pointer is not touched)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
        run: cargo xtask channels pkg upload --dir dist --tag "$TAG" --commit "$COMMIT" --bucket "$APT_BUCKET" --work "$RUNNER_TEMP/pkg-upload"

  # descriptor  the repository's descriptor, `hostkeeper-repository.json` at the root of the host
  #          (docs/deploy/package-repositories.md, "Structure of a repository"), which lets an operator
  #          add the whole repository to a coordinator by its URL. After the apt write that listed the
  #          release's packages and the installers' upload, so that what it describes is there:
  #          `cargo xtask channels descriptor write` merges this product's channels, architectures,
  #          installers and packages into the object that is there (it keeps every other product's
  #          and never changes the key), judges the result by the coordinator's own rules, and writes
  #          it with If-Match on the ETag it read. The cloud role through OIDC, no signing key. A
  #          green no-op until the settings exist and the upload ran with them. It is not a need of
  #          no-downgrade, set-desired or any promotion: a failing descriptor never holds a release,
  #          and the coordinator's built-in `komira` carries the same facts until this has run.
  descriptor:
    needs: [plan, testing-pkg-upload, testing-apt-write, testing-apt-write-2, testing-apt-write-3]
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && needs.testing-pkg-upload.outputs.enabled == 'true' && (needs.testing-apt-write.outputs.conflict == 'false' || needs.testing-apt-write-2.outputs.conflict == 'false' || needs.testing-apt-write-3.outputs.conflict == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # The workflow's own commit, not the release's: this job writes nothing of the release, and
      # the verb is newer than the oldest release a run may publish.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the repository (a job without them does nothing and ends green)
        id: gate
        env:
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels gate --label descriptor --output "$GITHUB_OUTPUT" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: cargo xtask channels assume --role-arn "$ROLE_ARN" --session-name "hostkeeper-descriptor-$GITHUB_RUN_ID" --region us-east-1 --token-url "$ACTIONS_ID_TOKEN_REQUEST_URL" --env-file "$GITHUB_ENV"
      - name: Merge this product's facts into the repository's descriptor
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
        run: cargo xtask channels descriptor write --bucket "$APT_BUCKET" --distribution-id "$APT_DISTRIBUTION_ID" --keyring-key apt/komira-archive-keyring.gpg --work "$RUNNER_TEMP/descriptor"

  # TESTING, the Mac (the macOS stage, run for the newest release of the run, after its build,
  # publish and image and beside the uploads above; never for a pull request). The tests of the
  # Mac used to run on every pull request, and a burst of pushes used up the hosted macOS runners
  # for a day, so no macos-arm64 build could start. They are this stage instead, as the beta stage
  # of the macOS installer. Two jobs, each on macos-15, reading the repository (`contents: read`)
  # at the commit of the release and nothing else:
  #
  # macos-test    the tests of the crates the `hostkeeper` and `hello` binaries are built from
  #               (the code a Mac runs), as the runner's user, with no fail-fast so that a run
  #               reports every failure. The rest of the workspace (the coordinator's MDM and
  #               network-install servers, the release tooling) runs on Linux only and does not
  #               build for macOS; the workflow lint holds the crate list to the binaries' path
  #               dependencies.
  # macos-device  the device tests under launchd as root (crates/hostkeeper-privileged: the
  #               launchd adapters, hello's update end to end, hostkeeper's update of itself, the
  #               macos-pkg installer with the Mac's real installer and pkgutil).
  #
  # What a failure holds: only the macOS installer. promote-pkg, which moves the pointer
  # pkg/hostkeeper/stable.json, needs both jobs to have succeeded; the apt and rpm promotions
  # (promote-check and the stable-* jobs), the coordinator and the fleet's desired version wait
  # for neither, so a Mac that is red or a macOS runner that never comes holds back the Mac's
  # stable installer and nothing else. The jobs are idempotent: re-running a failed one resumes the
  # run and promotes the installer once both have passed. privileged.yml has no macOS job, so no
  # merge to main waits for a macOS runner before its Linux release; artifacts.yml's macos-arm64
  # build and its signing remain the one macOS work of every merge.

  # macos-test: the stage above. The build restores the cache macos-device saves, whose
  # dependencies it shares (this job saves none).
  macos-test:
    needs: [plan, newest]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    permissions:
      contents: read
    # A bound on the whole job, against a test that hangs; no test depends on it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      # The system the tests run on, for the log (evidence, not a gate).
      - name: sw_vers
        run: sw_vers
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-macos-device-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-macos-device-
      - name: Build the tests of the Mac's crates
        run: cargo test --locked --no-run -p hello -p hostkeeper -p hostkeeper-config -p hostkeeper-daemon -p hostkeeper-enroll -p hostkeeper-hook -p hostkeeper-install -p hostkeeper-launchd -p hostkeeper-link -p hostkeeper-observe -p hostkeeper-openrc -p hostkeeper-package -p hostkeeper-placed -p hostkeeper-proto -p hostkeeper-release -p hostkeeper-steps -p hostkeeper-wire
      - name: Run the tests of the Mac's crates
        run: cargo test --locked --no-fail-fast -p hello -p hostkeeper -p hostkeeper-config -p hostkeeper-daemon -p hostkeeper-enroll -p hostkeeper-hook -p hostkeeper-install -p hostkeeper-launchd -p hostkeeper-link -p hostkeeper-observe -p hostkeeper-openrc -p hostkeeper-package -p hostkeeper-placed -p hostkeeper-proto -p hostkeeper-release -p hostkeeper-steps -p hostkeeper-wire

  # macos-device: the stage above, privileged.yml's job of that name as it ran after a merge to
  # main until this stage took it over. It saves the cargo cache (its key holds the hashes of
  # Cargo.lock and rust-toolchain.toml) when the restore missed; macos-test restores it.
  # The launchd adapters, the process probe, the boot id, the enrollment claims and the package
  # check run against a GitHub-hosted arm64 macOS runner (passwordless sudo, launchd): in
  # device_mac.rs the real daemon under launchd and a hook step as a launchd job, in
  # install_macos_pkg.rs the macos-pkg installer against the real pkgutil, installer, lsbom and
  # launchctl, in device_mac_e2e.rs hello's .pkg installed, updated, rolled back and
  # uninstalled, and in device_mac_selfupdate.rs hostkeeper's update of itself under launchd
  # through its .pkg. The tests print what they find to the log.
  macos-device:
    needs: [plan, newest]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    permissions:
      contents: read
    # A bound on the whole job, against a test that hangs; no test depends on it.
    timeout-minutes: 45
    env:
      # The gh of artifacts.yml's macOS build, the same version and SHA-256. No test of this job
      # reads it; the workflow lint (pinned_cache_tests.rs) still lists its download here.
      GH_VERSION: 2.103.3
      GH_SHA256: d700207eae9ae98fe2b89535c2c087c07823d4628c56364695a5a07ef311c062
      PREVIOUS_RELEASE_URL: https://github.com/komira-ai/hostkeeper/releases/download/v0.1.218/hostkeeper-0.1.218-macos-arm64.tar.gz
      PREVIOUS_RELEASE_SHA256: 5f2a333b3c180f94538ed3fee80e7941f6c33c0e2d42684cf3d367554cebcce7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      # The system the tests run against, for the log (evidence, not a gate).
      - name: sw_vers
        run: sw_vers
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Restore the pinned gh.zip from the cache
        id: gh-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.zip
          key: pinned-gh-${{ env.GH_VERSION }}-${{ env.GH_SHA256 }}
      - name: Download gh on a cache miss (HTTPS only, redirects included)
        id: gh-download
        if: ${{ steps.gh-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/gh.zip" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_macOS_arm64.zip"
      - name: Say why the job stops when gh.zip is neither cached nor downloadable
        if: ${{ !cancelled() && steps.gh-download.outcome == 'failure' }}
        run: echo "::error::gh.zip is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Check gh (pinned checksum)
        id: gh-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/gh.zip" --sha256 "$GH_SHA256" --out "$RUNNER_TEMP/gh-checked.zip"
      - name: Save the checked gh.zip to the cache
        if: ${{ !cancelled() && steps.gh-check.outcome == 'success' && steps.gh-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.zip
          key: ${{ steps.gh-cache.outputs.cache-primary-key }}
      # The binary tarball of the release crates/hostkeeper-privileged/previous-release.toml pins
      # for this platform (the workflow lint holds PREVIOUS_RELEASE_URL and PREVIOUS_RELEASE_SHA256
      # equal to it). No test of this job reads it: self_update_across_releases.rs runs on Linux
      # only.
      - name: Restore the pinned previous-release.tar.gz from the cache
        id: previous-release-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/previous-release.tar.gz
          key: pinned-previous-release-${{ env.PREVIOUS_RELEASE_URL }}-${{ env.PREVIOUS_RELEASE_SHA256 }}
      - name: Download the previous release on a cache miss (HTTPS only, redirects included)
        id: previous-release-download
        if: ${{ steps.previous-release-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/previous-release.tar.gz" "$PREVIOUS_RELEASE_URL"
      - name: Say why the job stops when previous-release.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.previous-release-download.outcome == 'failure' }}
        run: echo "::error::previous-release.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Check the previous release (pinned checksum)
        id: previous-release-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/previous-release.tar.gz" --sha256 "$PREVIOUS_RELEASE_SHA256" --out target/previous-release/hostkeeper.tar.gz
      - name: Save the checked previous-release.tar.gz to the cache
        if: ${{ !cancelled() && steps.previous-release-check.outcome == 'success' && steps.previous-release-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/previous-release.tar.gz
          key: ${{ steps.previous-release-cache.outputs.cache-primary-key }}
      - name: Build the macOS device tests as the runner's user
        run: cargo test -p hostkeeper-privileged --features privileged --locked --no-run --test device_mac --test device_mac_e2e --test device_mac_selfupdate --test install_macos_pkg
      - name: Run the macOS device tests as root
        run: cargo test -p hostkeeper-privileged --features privileged --locked --config "target.'cfg(unix)'.runner = 'sudo'" --test device_mac --test device_mac_e2e --test device_mac_selfupdate --test install_macos_pkg -- --test-threads=1 --nocapture
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # INSTALL CHECKS (release time only; a failure stops the promotion to `stable`, which
  # promote-check refuses, while the packages stay in `testing`). check-apt: a clean Ubuntu container, pinned by digest, on a hosted runner of each
  # architecture, adds packages.komira.ai with the published keyring (deb822, Signed-By) and the
  # suite `testing`, installs the package at the version, and holds the installed system to what the
  # package promises (cargo xtask channels check-apt), for each package on each architecture it is
  # built for: the daemon's and the coordinator's, and the services' native packages, hello's,
  # pxe's and mdm's (amd64 alone). The xtask binary built on the runner is mounted into the container, which
  # has nothing else of this repository.
  check-apt:
    needs: [plan, newest, testing-apt-write, testing-apt-write-2, testing-apt-write-3]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && (needs.testing-apt-write.outputs.conflict == 'false' || needs.testing-apt-write-2.outputs.conflict == 'false' || needs.testing-apt-write-3.outputs.conflict == 'false') }}
    strategy:
      fail-fast: false
      matrix:
        package: [hostkeeper, hostkeeper-coordinator, hello, mdm, pxe]
        arch: [amd64, arm64]
        exclude:
          - package: mdm
            arch: arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Install the package from the suite testing in a clean Ubuntu container
        env:
          PACKAGE: ${{ matrix.package }}
          ARCH: ${{ matrix.arch }}
        run: docker run --rm --volume "$PWD/target/debug/xtask:/usr/local/bin/xtask:ro" ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852 xtask channels check-apt --package "$PACKAGE" --arch "$ARCH" --version "${TAG#v}" --commit "$COMMIT"

  # check-rpm: the release installed with dnf from the suite testing, in a clean container of the
  # current Fedora (pinned by digest), on a hosted runner of each architecture, for each of the two
  # packages. The container is the system that is checked and the verb runs on the runner
  # (`docker exec`): the runner's binary is built against a newer C library than the image has.
  # More distributions are more entries of `image`, each pinned by digest.
  check-rpm:
    needs: [plan, newest, testing-rpm-write, testing-rpm-write-2, testing-rpm-write-3]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && (needs.testing-rpm-write.outputs.conflict == 'false' || needs.testing-rpm-write-2.outputs.conflict == 'false' || needs.testing-rpm-write-3.outputs.conflict == 'false') }}
    strategy:
      fail-fast: false
      matrix:
        package: [hostkeeper, hostkeeper-coordinator]
        arch: [x86_64, aarch64]
        image:
          - fedora@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Start a clean container of the image
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --detach --name check-rpm "$IMAGE" sleep infinity
      - name: Install the package from the suite testing in it with dnf, and hold the installed system to what the package promises
        env:
          PACKAGE: ${{ matrix.package }}
          ARCH: ${{ matrix.arch }}
        run: cargo xtask channels check-rpm --package "$PACKAGE" --container check-rpm --arch "$ARCH" --version "${TAG#v}" --commit "$COMMIT" --work /root --scratch "$RUNNER_TEMP"

  # check-pkg: the installers, their bundles and the directory's SHA256SUMS as packages.komira.ai
  # serves them (HTTPS), against the release's SHA256SUMS.
  check-pkg:
    needs: [plan, newest, testing-pkg-upload]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && needs.testing-pkg-upload.outputs.enabled == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.newest.outputs.tag }}
          path: dist
      - name: The files match SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The installers, their bundles and their SHA256SUMS as the public host serves them, against the release's SHA256SUMS
        run: cargo xtask channels pkg check --sums dist/SHA256SUMS --version "${TAG#v}" --url https://packages.komira.ai --work "$RUNNER_TEMP/pkg-check"

  # PROMOTION. promote-check re-reads the results of everything before it (cargo xtask channels
  # decide): the release is promoted when it was published to testing and installed or downloaded
  # from there. Re-running the failed jobs of a run resumes: every write is write-once or idempotent
  # and this job reads the results again.
  promote-check:
    needs: [plan, newest, testing-apt-write, testing-apt-write-2, testing-apt-write-3, testing-rpm-write, testing-rpm-write-2, testing-rpm-write-3, testing-pkg-upload, check-apt, check-rpm, check-pkg]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      promote: ${{ steps.decide.outputs.promote }}
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Decide whether the release in testing is promoted
        id: decide
        env:
          TESTING_APT_WRITE: ${{ needs.testing-apt-write.result }}
          TESTING_APT_WRITE_2: ${{ needs.testing-apt-write-2.result }}
          TESTING_APT_WRITE_3: ${{ needs.testing-apt-write-3.result }}
          TESTING_RPM_WRITE: ${{ needs.testing-rpm-write.result }}
          TESTING_RPM_WRITE_2: ${{ needs.testing-rpm-write-2.result }}
          TESTING_RPM_WRITE_3: ${{ needs.testing-rpm-write-3.result }}
          TESTING_PKG_UPLOAD: ${{ needs.testing-pkg-upload.result }}
          CHECK_APT: ${{ needs.check-apt.result }}
          CHECK_RPM: ${{ needs.check-rpm.result }}
          CHECK_PKG: ${{ needs.check-pkg.result }}
        run: cargo xtask channels decide --result "testing-apt-write=$TESTING_APT_WRITE" --result "testing-apt-write-2=$TESTING_APT_WRITE_2" --result "testing-apt-write-3=$TESTING_APT_WRITE_3" --result "testing-rpm-write=$TESTING_RPM_WRITE" --result "testing-rpm-write-2=$TESTING_RPM_WRITE_2" --result "testing-rpm-write-3=$TESTING_RPM_WRITE_3" --result "testing-pkg-upload=$TESTING_PKG_UPLOAD" --result "check-apt=$CHECK_APT" --result "check-rpm=$CHECK_RPM" --result "check-pkg=$CHECK_PKG" --output "$GITHUB_OUTPUT"

  # PROMOTION, the apt repository: the same three jobs for the suite `stable`. The read job reads
  # the index of testing and of stable; the index job lists the entries of this release that
  # testing holds in the index of stable (cargo xtask channels apt promote: held to the digests
  # of SHA256SUMS, every other product's entries kept, an older version or other bytes at the
  # same version refused); the write job writes the index with If-Match (apt write --no-pool: the
  # packages are in the pool already, none is uploaded). They run after promote-check, and only
  # when testing-apt-read had its settings.

  stable-apt-read:
    needs: [plan, newest, promote-check, testing-apt-read]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && needs.promote-check.outputs.promote == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the apt repository (a job without them does nothing and ends green)
        id: gate
        env:
          TESTING_ENABLED: ${{ needs.testing-apt-read.outputs.enabled }}
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels gate --label stable-apt-read --output "$GITHUB_OUTPUT" --require "TESTING_ENABLED=$TESTING_ENABLED" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: cargo xtask channels assume --role-arn "$ROLE_ARN" --session-name "hostkeeper-apt-$GITHUB_RUN_ID" --region us-east-1 --token-url "$ACTIONS_ID_TOKEN_REQUEST_URL" --env-file "$GITHUB_ENV"
      - name: Read the index of testing (what is promoted), with the ETag of each object, from S3
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
        run: cargo xtask channels apt read --suite testing --bucket "$APT_BUCKET" --out "$RUNNER_TEMP/apt-read/testing"
      - name: Read the index of stable (what it is merged into), with the ETag of each object, from S3
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
        run: cargo xtask channels apt read --suite stable --bucket "$APT_BUCKET" --out "$RUNNER_TEMP/apt-read/stable"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-read
          path: ${{ runner.temp }}/apt-read
          if-no-files-found: error
          retention-days: 1

  stable-apt-index:
    needs: [plan, newest, promote-check, stable-apt-read, testing-apt-index]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && needs.promote-check.outputs.promote == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-signing
    permissions:
      contents: read
      attestations: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      signed: ${{ steps.sign.outputs.signed }}
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the signing key and on the read (a job without them does nothing and ends green)
        id: gate
        env:
          READ_ENABLED: ${{ needs.stable-apt-read.outputs.enabled }}
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: cargo xtask channels gate --label stable-apt-index --output "$GITHUB_OUTPUT" --require "READ_ENABLED=$READ_ENABLED" --setting "APT_GPG_FINGERPRINT=${APT_GPG_FINGERPRINT:+set}" --setting "APT_GPG_PRIVATE_KEY=${APT_GPG_PRIVATE_KEY:+set}" --setting "APT_GPG_PASSPHRASE=${APT_GPG_PASSPHRASE:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-read
          path: ${{ runner.temp }}/apt-read
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: release-${{ needs.newest.outputs.tag }}
          path: dist
      - name: The files match SHA256SUMS
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The files are the attested assets of this commit
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release check dist --version "${TAG#v}" --commit "$COMMIT"
      - name: Promote the entries of this release that testing lists into the index of stable (held to the digests of SHA256SUMS; the entries of every other product are kept)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          OWNER: ${{ github.repository_owner }}
        run: cargo xtask channels apt promote --testing "$RUNNER_TEMP/apt-read/testing" --stable "$RUNNER_TEMP/apt-read/stable" --out "$RUNNER_TEMP/apt-next" --version "${TAG#v}" --sums dist/SHA256SUMS --origin "$OWNER" --label "$OWNER" --description "$OWNER packages" --date "$(date +%s)"
      - name: Sign Release with the signing subkey (InRelease and Release.gpg), then remove the key
        id: sign
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: cargo xtask channels apt sign --dir "$RUNNER_TEMP/apt-next/dists/stable" --work "$RUNNER_TEMP/apt-sign" --fingerprint "$APT_GPG_FINGERPRINT" --output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-promoted
          path: |
            ${{ runner.temp }}/apt-next/dists
            ${{ runner.temp }}/apt-next/etags.txt
          if-no-files-found: error
          retention-days: 1

  stable-apt-write:
    needs: [plan, newest, promote-check, stable-apt-read, stable-apt-index, testing-apt-write]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && needs.promote-check.outputs.promote == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      conflict: ${{ steps.put.outputs.conflict }}
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the apt repository and on the signed index (a job without them does nothing and ends green)
        id: gate
        env:
          READ_ENABLED: ${{ needs.stable-apt-read.outputs.enabled }}
          INDEX_SIGNED: ${{ needs.stable-apt-index.outputs.signed }}
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels gate --label stable-apt-write --output "$GITHUB_OUTPUT" --require "READ_ENABLED=$READ_ENABLED" --require "INDEX_SIGNED=$INDEX_SIGNED" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-promoted
          path: ${{ runner.temp }}/apt-next
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: cargo xtask channels assume --role-arn "$ROLE_ARN" --session-name "hostkeeper-apt-$GITHUB_RUN_ID" --region us-east-1 --token-url "$ACTIONS_ID_TOKEN_REQUEST_URL" --env-file "$GITHUB_ENV"
      - name: Write the signed index of stable with If-Match on the ETags that were read (the packages are in the pool already), then invalidate /apt/dists/*
        id: put
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels apt write --suite stable --bucket "$APT_BUCKET" --distribution-id "$APT_DISTRIBUTION_ID" --hostname "$APT_HOSTNAME" --next "$RUNNER_TEMP/apt-next" --no-pool --output "$GITHUB_OUTPUT"

  # Attempt 2: the write of attempt 1 lost the race for the index.

  stable-apt-read-2:
    needs: [plan, newest, stable-apt-write]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && needs.stable-apt-write.outputs.conflict == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the apt repository (a job without them does nothing and ends green)
        id: gate
        env:
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels gate --label stable-apt-read-2 --output "$GITHUB_OUTPUT" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: cargo xtask channels assume --role-arn "$ROLE_ARN" --session-name "hostkeeper-apt-$GITHUB_RUN_ID" --region us-east-1 --token-url "$ACTIONS_ID_TOKEN_REQUEST_URL" --env-file "$GITHUB_ENV"
      - name: Read the index of testing (what is promoted), with the ETag of each object, from S3
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
        run: cargo xtask channels apt read --suite testing --bucket "$APT_BUCKET" --out "$RUNNER_TEMP/apt-read/testing"
      - name: Read the index of stable (what it is merged into), with the ETag of each object, from S3
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
        run: cargo xtask channels apt read --suite stable --bucket "$APT_BUCKET" --out "$RUNNER_TEMP/apt-read/stable"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-read-2
          path: ${{ runner.temp }}/apt-read
          if-no-files-found: error
          retention-days: 1

  stable-apt-index-2:
    needs: [plan, newest, stable-apt-read-2]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && needs.stable-apt-read-2.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-signing
    permissions:
      contents: read
      attestations: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      signed: ${{ steps.sign.outputs.signed }}
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the signing key and on the read (a job without them does nothing and ends green)
        id: gate
        env:
          READ_ENABLED: ${{ needs.stable-apt-read-2.outputs.enabled }}
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
