  # TESTING, the rpm tree of the repository packages.komira.ai: the release's RPM packages, signed,
  # into the pool rpm/pool/hostkeeper and the repodata of the suite `testing`. The same three jobs
  # and up to three attempts as the apt repository, and the same environments, settings and key; no
  # job holds both the signing key and the cloud role:
  #   testing-rpm-read   (environment apt-publish: the role, no key) reads repomd.xml and
  #                      repomd.xml.asc of each architecture, with their ETags, and the files they
  #                      list, from S3;
  #   testing-rpm-index  (environment apt-signing: the key, no role) signs the .rpms (the signature
  #                      header only: the unsigned bytes are the attested ones), merges them into
  #                      that repodata, keeping every other product's packages, and signs
  #                      repomd.xml;
  #   testing-rpm-write  (environment apt-publish) checks the signed packages against SHA256SUMS,
  #                      uploads them once each, then the repodata, with If-Match on the ETags that
  #                      were read.
  # A write that finds repomd.xml changed in between (another product's release) reports
  # conflict=true and ends green; attempt 2 (the jobs with the suffix -2), and then 3, read, merge
  # and sign again, and the last one fails instead of asking for a fourth. A job without its
  # settings ends green with a notice and writes nothing; so does one while the repository variable
  # RPM_REPO_READY is not `true` (it is set once the rpm tree of the repository is deployed, so a
  # release before that does not fail on AccessDenied).

  testing-rpm-read:
    needs: [plan, newest]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
