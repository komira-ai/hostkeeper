    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      attestations: read
      id-token: write
    outputs:
      conflict: ${{ steps.put.outputs.conflict }}
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the apt repository and on the signed index (a job without them does nothing and ends green)
        id: gate
        env:
          READ_ENABLED: ${{ needs.testing-apt-read-3.outputs.enabled }}
          INDEX_SIGNED: ${{ needs.testing-apt-index-3.outputs.signed }}
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels gate --label testing-apt-write-3 --output "$GITHUB_OUTPUT" --require "READ_ENABLED=$READ_ENABLED" --require "INDEX_SIGNED=$INDEX_SIGNED" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-next-3
          path: ${{ runner.temp }}/apt-next
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
