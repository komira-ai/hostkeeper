      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: cargo xtask channels assume --role-arn "$ROLE_ARN" --session-name "hostkeeper-testing-apt-write-3-$GITHUB_RUN_ID" --region us-east-1 --token-url "$ACTIONS_ID_TOKEN_REQUEST_URL" --env-file "$GITHUB_ENV"
      - name: Upload the .debs once each, then write the signed index with If-Match on the ETags that were read, then invalidate /apt/dists/*
        id: put
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels apt write --suite testing --bucket "$APT_BUCKET" --distribution-id "$APT_DISTRIBUTION_ID" --hostname "$APT_HOSTNAME" --next "$RUNNER_TEMP/apt-next" --debs dist --version "${TAG#v}" --last --output "$GITHUB_OUTPUT"

  # TESTING-FAIL, hello's failing build (the service version X.Y.Z-fail-ready, started with
  # --fail-ready, whose /readyz answers 503), published to the suite `testing-fail` of the same apt
  # repository: its .debs for both architectures, whose Debian version is X.Y.Z~fail.ready (a `~`
  # sorts below X.Y.Z, so apt never takes it for the release's hello, and `testing` and `stable`
  # never list it). The same three jobs as the testing-apt-* jobs above, with the same
  # environments, settings, key and checks of the release's files, and one attempt: the write
  # passes --last, so a lost race for the index fails the job instead of asking for another.
  # They are not stages of promote-check: the failing build is never promoted, and a publish that
  # fails or ends green without its settings holds nothing (cargo xtask channels decide reads the
  # stages alone). The suite lists nothing but hello's failing build, in the one form
  # X.Y.Z~fail.ready; the files are read from the release's assets, hello_X.Y.Z-fail-ready_<arch>.deb
  # (an asset name has no `~`), and written to the pool as hello_X.Y.Z~fail.ready_<arch>.deb.
  # The artifacts are apt-fail-current and apt-fail-next.

  testing-fail-apt-read:
    needs: [plan, newest]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the apt repository (a job without them does nothing and ends green)
        id: gate
        env:
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels gate --label testing-fail-apt-read --output "$GITHUB_OUTPUT" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: cargo xtask channels assume --role-arn "$ROLE_ARN" --session-name "hostkeeper-testing-fail-apt-read-$GITHUB_RUN_ID" --region us-east-1 --token-url "$ACTIONS_ID_TOKEN_REQUEST_URL" --env-file "$GITHUB_ENV"
      - name: Read the current index and the ETag of each object from S3 (never through the CDN, which caches the index)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
        run: cargo xtask channels apt read --suite testing-fail --bucket "$APT_BUCKET" --out "$RUNNER_TEMP/apt-fail-current"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-fail-current
          path: ${{ runner.temp }}/apt-fail-current
          if-no-files-found: error
          retention-days: 1

