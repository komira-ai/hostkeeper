  stable-rpm-write-3:
    needs: [plan, newest, stable-rpm-read-3, stable-rpm-index-3]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && needs.stable-rpm-read-3.result == 'success' && needs.stable-rpm-index-3.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      conflict: ${{ steps.put.outputs.conflict }}
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the apt repository and on the signed repodata (a job without them does nothing and ends green)
        id: gate
        env:
          READ_ENABLED: ${{ needs.stable-rpm-read-3.outputs.enabled }}
          INDEX_SIGNED: ${{ needs.stable-rpm-index-3.outputs.signed }}
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels gate --label stable-rpm-write-3 --output "$GITHUB_OUTPUT" --require "READ_ENABLED=$READ_ENABLED" --require "INDEX_SIGNED=$INDEX_SIGNED" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: rpm-promoted-3
          path: ${{ runner.temp }}/rpm-next
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: cargo xtask channels assume --role-arn "$ROLE_ARN" --session-name "hostkeeper-apt-$GITHUB_RUN_ID" --region us-east-1 --token-url "$ACTIONS_ID_TOKEN_REQUEST_URL" --env-file "$GITHUB_ENV"
      - name: Write the signed repodata of stable with If-Match on the ETags that were read (the packages are in the pool already), then invalidate /rpm/stable/<arch>/repodata/*
        id: put
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels rpm repo write --suite stable --bucket "$APT_BUCKET" --distribution-id "$APT_DISTRIBUTION_ID" --hostname "$APT_HOSTNAME" --next "$RUNNER_TEMP/rpm-next" --no-pool --last --output "$GITHUB_OUTPUT"

  # promote-pkg: pkg/hostkeeper/stable.json, the pointer the installers' users follow, moved to this
  # release after the testing directory is read back and held to SHA256SUMS (cargo xtask channels
  # pkg promote): nothing is uploaded again, the bytes that were downloaded and checked are the
  # bytes that become the stable installers. Same environment and role as testing-pkg-upload. It
  # waits for the macOS stage (macos-test and macos-device) and runs only when both succeeded; no
  # other promotion waits for it.
  promote-pkg:
    needs: [plan, newest, promote-check, testing-pkg-upload, macos-test, macos-device]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && needs.promote-check.outputs.promote == 'true' && needs.macos-test.result == 'success' && needs.macos-device.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      attestations: read
      id-token: write
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the repository and on the upload (a job without them does nothing and ends green)
        id: gate
        env:
          UPLOADED: ${{ needs.testing-pkg-upload.outputs.enabled }}
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels gate --label promote-pkg --output "$GITHUB_OUTPUT" --require "UPLOADED=$UPLOADED" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: release-${{ needs.newest.outputs.tag }}
          path: dist
      - name: The files match SHA256SUMS
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The files are the attested assets of this commit
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release check dist --version "${TAG#v}" --commit "$COMMIT"
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: cargo xtask channels assume --role-arn "$ROLE_ARN" --session-name "hostkeeper-promote-pkg-$GITHUB_RUN_ID" --region us-east-1 --token-url "$ACTIONS_ID_TOKEN_REQUEST_URL" --env-file "$GITHUB_ENV"
      - name: Read the testing directory back against SHA256SUMS, then move the pointer pkg/hostkeeper/stable.json to this release (never to an older one) and invalidate it
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
        run: cargo xtask channels pkg promote --dir dist --tag "$TAG" --commit "$COMMIT" --bucket "$APT_BUCKET" --distribution-id "$APT_DISTRIBUTION_ID" --work "$RUNNER_TEMP/pkg-promote"
