# A GitHub release of the exact files a push to main built and signed for one commit
# (artifacts.yml), at the tag v<X.Y.Z> of that commit's version. Nothing is built here, and no
# release file is attested or changed: the files are the ones that run left, checked again, so a
# consumer can pin a release asset, which outlives the run's 90-day workflow artifacts. (The
# package-channel jobs at the end sign the indexes of the apt and rpm repositories and the
# signature header of the rpm packages with the repository's archive subkey; see below.)
#
# Every push to main that changes code becomes a release by itself, with no tag step and no
# manual gate, once each of `ci`, `privileged` and `artifacts` has a successful push run on main
# for that exact commit. The triggers:
#
# - `workflow_run`: the completion of a push run of `ci`, `privileged` or `artifacts` on main.
#   The three run side by side for every push, so this starts once for each.
# - `schedule`, daily, and `workflow_dispatch`, from main, by hand.
#
# Every trigger plans the same way: the plan walks the first-parent history of main from the
# tip down to the last release, oldest first, and releases each commit that qualifies under the
# number that commit has, whatever the run that started it concluded. A run that a newer run
# replaced while it waited in the concurrency group therefore leaves nothing behind: the newer
# run releases every commit the replaced one would have, and more. (Planning only the commit
# whose run started it, a busy main never released: each waiting run was replaced before it ran.)
# Releases keep the order of their versions: while a required run of a commit has not completed,
# the newer commits wait for it, and the completion of that run releases them all, oldest first.
#
# The workflow lint (crates/xtask/tests/workflows) holds the triggers to these three and nothing
# else, and to no pull-request trigger; the plan job to one plan step, the same for every
# trigger; and the concurrency groups to those described below. Until a workflow named `privileged` exists on main, no
# commit has its successful run, and the plan releases nothing: it says which run is missing.
#
# plan     decides which commits are released and as which version (cargo xtask release plan),
#          and prints them as a matrix, oldest first. No release while the repository variable
#          RELEASE_FREEZE is set to anything but empty or `false`; while a required run is
#          pending or missing; for a commit already released; or for a commit that changes
#          documentation only (it still has its number). A failed `privileged` run for any
#          commit after the last release holds every later release, and the plan opens (or
#          brings up to date) the one issue that tracks the hold: so `plan` holds
#          `issues: write`, and nothing else that writes. When it releases no commit, it plans
#          the newest published release again if the latest run of this workflow that released
#          it (the run with its job `publish (<version>, <tag>, <commit>)`) completed other than
#          successfully, so a release whose image push or set-desired failed is tried again by
#          the next run, every job of it idempotent; it waits for such a run still going, and
#          stops after three such runs of the release in a row (then a maintainer re-runs the
#          failed jobs once the cause is fixed). A commit not yet released whose own verify job
#          failed in each of its last three release runs is passed over, its line naming those
#          runs, and the newer commits are released without it: the jobs after verify wait for
#          every verify of the run, so a verify that can never pass would otherwise hold every
#          release after it for ever.
# verify   read-only, per release: refuses a commit that is not on main or lacks a successful
#          push run of each required workflow (cargo xtask release locate), downloads the files
#          of its artifacts run, checks them against SHA256SUMS, verifies every attestation
#          online as a deployment does and every bundle offline as a host does
#          (cargo xtask release check, the released commit's own, which holds the files to
#          exactly that commit's assets), and runs the downloaded linux-x86_64 binaries, which
#          must print exactly `hostkeeper X.Y.Z+<12 hex>`, `hostkeeper-coordinator
#          X.Y.Z+<12 hex>`, `hostkeeper-mdm X.Y.Z+<12 hex>` and `hostkeeper-coordinator-update
#          X.Y.Z+<12 hex>` (cargo xtask release check-binary); the coordinator updater's only in
#          a release whose build made its tarball, since a release of a commit from before it has
#          none (crates/xtask/tests/workflows/release_assets.rs). These are the commands of
#          docs/deploy/verify-a-release.md, and a test keeps the two the same
#          (crates/xtask/src/release/doc_tests.rs).
# publish  the one job that holds `contents: write`, per release: creates a draft release at the
#          commit with the tag v<X.Y.Z>, uploads the checked files, reads the draft back, then
#          publishes it (cargo xtask release publish). A release that holds exactly these files
#          is success with nothing written; one that differs in any file fails naming it; a
#          draft left by an earlier run with the same files is completed. Never rebuilds.
# image    after every publish of the run, per release: the coordinator's multi-platform image
#          into the registry, ghcr.io/komira-ai/hostkeeper-coordinator, tagged <X.Y.Z>. Nothing is
#          built: `cargo xtask release image-layout` lays out the blobs and manifests of the two
#          checked image tarballs and the checked image index (`hostkeeper-coordinator-<X.Y.Z>.image.json`,
#          which artifacts.yml made of them and attested), and `cargo xtask release push-image`
#          pushes that layout with `skopeo copy --all --preserve-digests`, refusing any change of
#          a digest; the registry then serves the image index by its SHA-256, byte for byte, or
#          the job fails. So the digest the release notes name is the attested one. A push or
#          read back that fails (the registry has refused the job's valid token for single
#          requests) is tried again whole after a wait, in up to five attempts over about a
#          quarter of an hour. The one job that holds `packages: write`, with the job's own
#          token; pushing the same release again changes nothing, so a re-run of the job, or the
#          next run's plan, pushes it again.
# targets, coordinator, no-downgrade, set-desired
#          only while the repository variable RELEASE_SETS_DESIRED is `true`, after every
#          publish of the run: write the targets of the newest release, wait until the
#          coordinator runs at least that release (after cp-deploy while that deploy is on; else
#          its own machine updates it; these four jobs never change it) and the package channels
#          its targets point at list it (the apt suite `testing`, written by
#          testing-apt-write; the installers' `testing` directory, by testing-pkg-upload),
#          check again, in the same attempt of the run as the set, that
#          no newer release is published (a re-run of an older release's jobs must not move the
#          fleet back), then set the release as hostkeeper's desired version on the
#          coordinator, by one call of the CI client (set-desired.yml) with an OIDC token. See
#          the comment above the jobs.
# cp-deploy-digest, cp-deploy
#          only while the repository variables CP_DEPLOY_ENDPOINT and CP_DEPLOY_TAILSCALE_TAGS are
#          not empty, after `newest`: deploy the newest release's linux-x86_64 coordinator image
#          to the control plane's Docker Swarm service `hostkeeper-coordinator` by calling the
#          reusable workflow deploy.yml of komira-ai/docker-swarm-updater (the job `cp-deploy`
#          holds `id-token: write` for that alone, and no other scope); the job coordinator
#          waits for it. See the comment above the two jobs.
#
# macos-test, macos-device
#          the beta stage of the Mac, for the newest release of the run, after its publish and
#          image: the tests of the Mac's crates and the device tests under launchd, on macos-15.
#          No pull request runs a Mac (or an arm64) job: a pull request is checked on Linux x86_64
#          alone, and the other platforms are tested here. A failure holds back the macOS
#          installer alone: promote-pkg needs both and runs only when both succeeded, and no other
#          job waits for them. linux-arm64 is tested by check-apt and check-rpm on the
#          arm runner, likewise after the release and never for a pull request. See the comment
#          above the jobs, and crates/xtask/tests/workflows/release_macos.rs.
#
# newest, testing-apt-*, testing-fail-apt-*, testing-rpm-*, testing-pkg-upload, check-apt,
# check-rpm, check-pkg, promote-check, stable-apt-*, stable-rpm-*, promote-pkg
#          the package channels, docs/deploy/package-repositories.md: after every publish and
#          image of the run, only for the newest release of the run (job `newest`; the older ones
#          are passed over, the newer carries their changes). The release's deb and rpm packages
#          of hostkeeper and hostkeeper-coordinator, and the native .debs of the services it
#          releases (hello's and pxe's, and mdm's for amd64), go into the apt and rpm repositories at
#          packages.komira.ai, the suite `testing` first (testing-apt-*, testing-rpm-*: read the
#          index, merge and sign it, write it, each in up to three attempts), and the macOS
#          installers, hostkeeper's and hello's, into pkg/hostkeeper/<version>/
#          (testing-pkg-upload). Hello's failing build, whose Debian version is X.Y.Z~fail.ready,
#          goes into the suite `testing-fail` alone (testing-fail-apt-*: the same three jobs in
#          one attempt, not stages of promote-check, since that build is never promoted).
#          check-apt, check-rpm and
#          check-pkg install or download the release from there on clean machines.
#          promote-check decides (cargo xtask channels decide); only then do stable-apt-*,
#          stable-rpm-* and promote-pkg make the same bytes the stable suite and the stable
#          pointer. No job holds both the signing key (environment apt-signing) and the cloud role
#          (environment apt-publish, through OIDC). The tool, `cargo xtask channels`, is copied from
#          komira-ai/tierstore at ff4777831c08fc13aa025b54e6e0531c2f350f4f with the package names as
#          data; its move into ucdk's package publishers is out of scope here. Every one of these jobs
#          is a green no-op until the repository's environments hold their settings (variables
#          APT_PUBLISH_ROLE_ARN, APT_BUCKET, APT_DISTRIBUTION_ID and APT_HOSTNAME of apt-publish;
#          APT_GPG_FINGERPRINT and the secrets APT_GPG_PRIVATE_KEY and APT_GPG_PASSPHRASE of
#          apt-signing; and, for the rpm tree, the repository variable RPM_REPO_READY).
#
# Concurrency, never cancelled. A group keeps one running and one waiting run, and a newer run
# replaces the waiting one:
#
# - `release-main`: the `workflow_run` runs of main of this repository. With merges every few
#   minutes most of them are replaced while they wait, which is safe since each walks it all.
# - `release-main-dispatch`: the `workflow_dispatch` and `schedule` runs of main, so that a run
#   by hand is never replaced by the next completion of a push run and cancelled unseen. It may
#   run beside a run of `release-main`; the two can plan the same commit, and the job-level group
#   of `publish`, one per tag (`release-publish-<tag>`), keeps them from creating that release
#   twice: the second waits, then finds it published with the same files and changes nothing
#   (and the plan of any later run declines it as already released).
# - any other run (a pull request's `workflow_run` from a fork's branch named main, a dispatch
#   from another branch) takes a group of its own, so that it cannot replace a release waiting;
#   its plan job does not run.
#
# artifacts.yml is outside these groups: it builds and attests, never tags or publishes, and has
# a group per commit.
name: release

on:
  workflow_run:
    workflows: [ci, privileged, artifacts]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ (github.ref == 'refs/heads/main' && github.event_name != 'workflow_run') && 'main-dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) && 'main' || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  plan:
    # A run of main: by hand, on the schedule, or the completion of a push run on main of this
    # repository (never a pull request, never a fork's branch named main).
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    outputs:
      release: ${{ steps.walk.outputs.release }}
      matrix: ${{ steps.walk.outputs.matrix }}
    steps:
      # The tip of main (`github.sha`, for every trigger: for a `workflow_run` it is the newest
      # commit of main, not the commit the completed run built), with the whole history the
      # version is counted on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      # xtask is compiled before any step holds the token.
      - name: Compile xtask
        run: cargo xtask --help
      - name: Which commits since the last release are released, oldest first
        id: walk
        env:
          GH_TOKEN: ${{ github.token }}
          FREEZE: ${{ vars.RELEASE_FREEZE }}
        run: cargo xtask release plan --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --version-file VERSION --freeze "$FREEZE" --output "$GITHUB_OUTPUT"

  verify:
    needs: [plan]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    strategy:
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      COMMIT: ${{ matrix.commit }}
      RELEASE_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Refuse a commit not on main, or without a successful push run of each workflow
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release locate --repo "$GITHUB_REPOSITORY" --commit "$COMMIT" --output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: dist
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles
          path: dist
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Verify every file and attestation as a consumer does
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release check dist --version "$RELEASE_VERSION" --commit "$COMMIT"
      # The runner is linux-x86_64: the binaries of those tarballs run here, unpacked outside
      # dist. The linux-arm64 and macos-arm64 binaries were run and checked the same way by their
      # own build jobs. A binary newer than the oldest commit a release can be of (the floor
      # release of crates/xtask/tests/workflows/release_assets.rs) is unpacked and run only when
      # the release's own build made its tarball: this file is main's, while the commit released
      # may predate the binary. `release check` above, the commit's own, has already held dist to
      # exactly that commit's assets, so a commit that ships the binary and lacks its tarball
      # failed there.
      - run: mkdir "$RUNNER_TEMP/binary"
      - run: tar -xzf "dist/hostkeeper-$RELEASE_VERSION-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/binary" hostkeeper
      - name: hostkeeper says the version and the commit it is released under
        run: cargo xtask release check-binary "$RUNNER_TEMP/binary/hostkeeper" "$RELEASE_VERSION" "$COMMIT"
      - run: tar -xzf "dist/hostkeeper-coordinator-$RELEASE_VERSION-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/binary" hostkeeper-coordinator
      - name: hostkeeper-coordinator says the version and the commit it is released under
        run: cargo xtask release check-binary "$RUNNER_TEMP/binary/hostkeeper-coordinator" "$RELEASE_VERSION" "$COMMIT"
      - run: tar -xzf "dist/hostkeeper-mdm-$RELEASE_VERSION-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/binary" hostkeeper-mdm
      - name: hostkeeper-mdm says the version and the commit it is released under
        run: cargo xtask release check-binary "$RUNNER_TEMP/binary/hostkeeper-mdm" "$RELEASE_VERSION" "$COMMIT"
      - if: ${{ hashFiles(format('dist/hostkeeper-coordinator-update-{0}-linux-x86_64.tar.gz', env.RELEASE_VERSION)) != '' }}
        run: tar -xzf "dist/hostkeeper-coordinator-update-$RELEASE_VERSION-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/binary" hostkeeper-coordinator-update
      - name: hostkeeper-coordinator-update says the version and the commit it is released under
        if: ${{ hashFiles(format('dist/hostkeeper-coordinator-update-{0}-linux-x86_64.tar.gz', env.RELEASE_VERSION)) != '' }}
        run: cargo xtask release check-binary "$RUNNER_TEMP/binary/hostkeeper-coordinator-update" "$RELEASE_VERSION" "$COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.tag }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [plan, verify]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One publish of a tag at a time, across both groups of main (see the top of this file).
    concurrency:
      group: release-publish-${{ matrix.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      attestations: read
    strategy:
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      COMMIT: ${{ matrix.commit }}
      RELEASE_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.tag }}
          path: dist
      # The same checks as verify, on the files this job downloaded: they crossed the run's
      # artifact store.
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Verify every file and attestation again
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release check dist --version "$RELEASE_VERSION" --commit "$COMMIT"
      - name: Create the release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release publish dist --repo "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --commit "$COMMIT"

  image:
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      RELEASE_VERSION: ${{ matrix.version }}
    steps:
      # The workflow's own commit: `release push-image` is newer than the oldest commit a run
      # can release (see release_ref.rs of the workflow lint). The image is the release's files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.tag }}
          path: dist
      # The files verify checked, once more: they crossed the run's artifact store.
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The image's layout, of the two image tarballs and the image index they make
        run: cargo xtask release image-layout dist --version "$RELEASE_VERSION" --out "$RUNNER_TEMP/layout"
      # The token is the job's own, `packages: write` on this repository's packages only; it is
      # read from standard input and is on no command line.
      - name: Sign in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
      - name: Push the image, refusing any change of a digest, until the registry serves the released image index by its digest, byte for byte (up to five attempts)
        run: cargo xtask release push-image dist --version "$RELEASE_VERSION" --layout "$RUNNER_TEMP/layout"

  # targets, coordinator, no-downgrade and set-desired: hostkeeper's own deploy (docs/deploy/github-actions.md). They run
  # only once every release of this run is published, and only while the repository variable
  # RELEASE_SETS_DESIRED is `true`: unset, or anything else, they are skipped and the release
  # is all this workflow does. Nothing here uploads: a release is set with native entries alone
  # (docs/design/packages-native.md section 10.5, A24), which a host installs from the project's
  # package repository. The workflow lint (crates/xtask/tests/workflows, `desired.rs`,
  # `coordinator_wait.rs` and `no_downgrade.rs`) holds the four jobs to this shape.
  #
  # targets  reads the repository (`contents: read`) and nothing else. Takes the newest release
  #          of the run (the last of the matrix, which is oldest first) and the files verify
  #          checked and publish published, from the run's own artifact. Then `cargo xtask
  #          release targets`, compiled from the release's own commit (the workflow lint,
  #          `release_ref.rs`, holds its command line to that of a published release), writes
  #          the targets from those files: per Linux platform, hostkeeper's .deb in `testing`
  #          alone, pinned by its SHA-256, and for macOS its signed .pkg alone (a Mac whose
  #          daemon announces `macos-pkg` takes it; any other is ordered nothing). Last, it checks
  #          that no newer release is published already (a late run of an older commit): then
  #          set-desired is skipped, since setting this version would move the fleet back.
  targets:
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && vars.RELEASE_SETS_DESIRED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      newest: ${{ steps.latest.outputs.newest }}
      version: ${{ steps.newest.outputs.version }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: The newest version this run published
        id: newest
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: jq --raw-output '.include[-1] | "version=\(.version)", "tag=\(.tag)", "commit=\(.commit)"' <<< "$MATRIX" >> "$GITHUB_OUTPUT"
      # The xtask of the release's own commit, as verify and publish run it, compiled before the
      # files are downloaded (a checkout empties the workspace).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ steps.newest.outputs.tag }}
          path: dist
      # Per platform, from the checked files: hostkeeper's .deb alone, pinned by its SHA-256, and
      # for macOS its signed .pkg alone, pinned by its SHA-256 and size; the manifests the ones
      # compiled into xtask.
      - name: The targets of the release
        id: targets
        env:
          VERSION: ${{ steps.newest.outputs.version }}
        run: cargo xtask release targets --version "$VERSION" --dir dist --repo "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"
      # `newest=true` only when the highest published X.Y.Z is this run's version.
      - name: Whether this run's release is the newest published
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.newest.outputs.version }}
        run: gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("v") | split(".") | map(tonumber)] | max | "newest=\(map(tostring) | join(".") == env.VERSION)"' >> "$GITHUB_OUTPUT"

  # coordinator  waits until the coordinator runs at least this release, so that set-desired
  #          never sends the fields of a newer release to an older coordinator (it would
  #          answer `invalid_request`). The jobs targets, coordinator, no-downgrade and set-desired never change the coordinator: the job
  #          cp-deploy deploys it to the control plane, and without that deploy the coordinator's
  #          own machine updates it from each published release (the release asset
  #          `hostkeeper-coordinator-update` on a timer there, docs/deploy/coordinator-update.md).
  #          So the job needs cp-deploy: while CP_DEPLOY_ENDPOINT and CP_DEPLOY_TAILSCALE_TAGS are
  #          both set it runs only once cp-deploy succeeded, never beside it (the coordinator the
  #          deploy is replacing answers 409); while either is empty (cp-deploy skipped for that)
  #          it runs after targets alone; when cp-deploy failed, was cancelled, or was skipped
  #          for a failure before it, the job is skipped, and set-desired with it.
  #          The job joins the tailnet as set-desired does, and asks the private listener
  #          `GET /v1/version?at_least=<version>`, which takes no token: 200 once the coordinator
  #          is at least that version, 409 while it is older, 404 from a coordinator before the
  #          route; curl retries every failed answer (`--fail`, `--retry-all-errors`) for 30
  #          minutes, then the job fails and the hosts' desired version is not set. `--fail`, not
  #          `--fail-with-body`: curl 8.5 (ubuntu-24.04's) cannot retry once it has written a
  #          body to /dev/null, and ends at the first 409 with exit 23 and no status. curl writes the last answer's HTTP status (000 for none) to the step's
  #          output `status`, and one of two error steps says why the wait failed: after a 409 or
  #          a 404, that no coordinator updater reported this release (is the timer installed?);
  #          after anything else, that the coordinator did not answer. It holds `id-token: write`
  #          for the tailnet join alone, and no repository: no checkout, no artifact, no code of
  #          ours; curl, jq and the pinned tailscale action only.
  coordinator:
    needs: [plan, targets, cp-deploy]
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && vars.RELEASE_SETS_DESIRED == 'true' && needs.targets.result == 'success' && needs.targets.outputs.newest == 'true' && (needs.cp-deploy.result == 'success' || (needs.cp-deploy.result == 'skipped' && (vars.CP_DEPLOY_ENDPOINT == '' || vars.CP_DEPLOY_TAILSCALE_TAGS == ''))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      id-token: write
    steps:
      - name: Check the tailnet tag
        id: tailnet-tag
        env:
          TAILNET_TAG: ${{ vars.HOSTKEEPER_TAILNET_TAG }}
        run: |
          jq --null-input --arg tag "$TAILNET_TAG" 'if $tag | test("^tag:[a-z][a-z0-9-]*\\z") then empty else error("tailnet_tag is not tag: followed by a Tailscale tag name (a lower-case letter, then lower-case letters, digits and -)") end'
      - name: Join the tailnet
        id: tailnet
        if: ${{ vars.HOSTKEEPER_TAILNET_CLIENT_ID != '' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.HOSTKEEPER_TAILNET_CLIENT_ID }}
          audience: ${{ vars.HOSTKEEPER_TAILNET_AUDIENCE }}
          tags: ${{ vars.HOSTKEEPER_TAILNET_TAG }}
          version: 1.94.2
          sha256sum: c6f99a5d774c7783b56902188d69e9756fc3dddfb08ac6be4cb2585f3fecdc32
          use-cache: false
          ping: ${{ vars.HOSTKEEPER_TAILNET_COORDINATOR }}
      - name: Write the coordinator's CA
        id: ca
        env:
          COORDINATOR_CA: ${{ vars.HOSTKEEPER_COORDINATOR_CA }}
        run: printf '%s\n' "$COORDINATOR_CA" > "$RUNNER_TEMP/coordinator-ca.pem"
      - name: Wait until the coordinator runs this release
        id: wait
        env:
          COORDINATOR_URL: ${{ vars.HOSTKEEPER_COORDINATOR_URL }}
          VERSION: ${{ needs.targets.outputs.version }}
        run: curl --proto =https --tlsv1.2 --cacert "$RUNNER_TEMP/coordinator-ca.pem" --fail --silent --show-error --max-time 20 --retry 180 --retry-delay 10 --retry-max-time 1800 --retry-all-errors --output /dev/null --write-out 'status=%{http_code}\n' --url "$COORDINATOR_URL/v1/version?at_least=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Say that no coordinator updater reported this release
        if: ${{ failure() && steps.wait.outcome == 'failure' && (steps.wait.outputs.status == '409' || steps.wait.outputs.status == '404') }}
        env:
          STATUS: ${{ steps.wait.outputs.status }}
          VERSION: ${{ needs.targets.outputs.version }}
        run: echo "::error::No coordinator updater reported this release ($VERSION) (is the timer installed?). For 30 minutes the coordinator answered that it runs an older release (its last answer was HTTP $STATUS; 404 is a coordinator from before the version route). Install the timer of hostkeeper-coordinator-update on the coordinator's machine, or read its journal there, as docs/deploy/coordinator-update.md says. With the control-plane deploy on (CP_DEPLOY_ENDPOINT and CP_DEPLOY_TAILSCALE_TAGS both set), the job cp-deploy reported this release deployed, so check that HOSTKEEPER_COORDINATOR_URL names the coordinator it deploys. The hosts' desired version is not set."
      - name: Say that the coordinator did not answer
        if: ${{ failure() && steps.wait.outcome == 'failure' && steps.wait.outputs.status != '409' && steps.wait.outputs.status != '404' }}
        env:
          STATUS: ${{ steps.wait.outputs.status }}
          VERSION: ${{ needs.targets.outputs.version }}
        run: echo "::error::The coordinator did not say whether it runs this release ($VERSION) within 30 minutes; its last answer was HTTP $STATUS (000 is no answer). Check the tailnet join and the repository variables HOSTKEEPER_COORDINATOR_URL and HOSTKEEPER_COORDINATOR_CA. The hosts' desired version is not set."

  # no-downgrade  read-only, right before set-desired, under its condition: whether this run's
  #          release is still the newest published. targets checked that once, but a re-run of
  #          an older release's failed jobs keeps targets' old outputs: a release published since
  #          (and set) would be moved back to this one on every host. So this job needs every job
  #          set-desired needs, and is re-run whenever one of them is; it lists the published
  #          releases again, and when a higher X.Y.Z than this run's is published it says so in a
  #          warning annotation, gives `set=false` and ends green, and set-desired is skipped: a
  #          run of an older release never sets it. Its output `attempt` is the attempt of the
  #          run it ran in, and set-desired runs only in that same attempt, so re-running
  #          set-desired alone (its own failure, with **Re-run failed jobs**) skips it; re-run
  #          this job instead, which re-runs set-desired after it. Moving the fleet back is an
  #          operator's step on the coordinator, never this workflow's. Holds `contents: read`
  #          alone; gh and its jq only, no checkout and no code of ours.
  no-downgrade:
    needs: [plan, targets, coordinator, testing-apt-write, testing-apt-write-2, testing-apt-write-3, testing-pkg-upload]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && vars.RELEASE_SETS_DESIRED == 'true' && needs.targets.outputs.newest == 'true' && needs.coordinator.result == 'success' && (needs.testing-apt-write.outputs.conflict == 'false' || needs.testing-apt-write-2.outputs.conflict == 'false' || needs.testing-apt-write-3.outputs.conflict == 'false') && needs.testing-pkg-upload.outputs.enabled == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      set: ${{ steps.newest.outputs.set }}
      newest: ${{ steps.newest.outputs.newest }}
      attempt: ${{ github.run_attempt }}
    steps:
      # `newest=` the highest published X.Y.Z, and `set=true` only when it is not higher than
      # this run's version. No published release (or a failed list) fails the job.
      - name: Whether this run's release is still the newest published
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.targets.outputs.version }}
        run: gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("v") | split(".") | map(tonumber)] | max | "newest=\(map(tostring) | join("."))", "set=\(. <= (env.VERSION | split(".") | map(tonumber)))"' >> "$GITHUB_OUTPUT"
      - name: Say that an older release is not set
        if: ${{ steps.newest.outputs.set != 'true' }}
        env:
          VERSION: ${{ needs.targets.outputs.version }}
          NEWEST: ${{ steps.newest.outputs.newest }}
        run: |
          echo "::warning::Not setting hostkeeper $VERSION as the desired version on the coordinator: $NEWEST is published, a newer release, and setting $VERSION would move every host back. This is a run of an older release (a re-run of its jobs, or a late run); the newest release's own run sets the fleet. A move back is an operator's step on the coordinator, never this workflow's."

  # set-desired  the CI client (set-desired.yml, docs/deploy/ci-client.md), pinned like any
  #          caller's, at the CI client's revision the workflow lint names (`callers.rs`,
  #          `CLIENT_COMMIT`), the one hello-desired.yml pins too. It runs that release's hkctl:
  #          one call with an OIDC token, which names the release by its targets alone, so each
  #          host is ordered its own platform's native package. It does not wait
  #          for the fleet: the coordinator's rollout gate orders the hosts, the canary hosts of
  #          the service `hostkeeper` first, then the rest once they have baked, stage by stage by the
  #          service's update plan, which is longer than a job should hold the release group.
  #          The job ends once the coordinator stored the version (`reason` `not_waited`).
  #          It runs only once the channels the targets point at hold the release: a host
  #          defers an entry its channel does not list yet (`not_in_repository`). So it needs
  #          the three attempts of the testing apt write, and runs once one of them reported
  #          `conflict` `false` (its index lists the .debs), and the pkg upload, and runs once
  #          that ran with its settings (`enabled` `true`); `!cancelled() && !failure()`, since
  #          attempts 2 and 3 are skipped when attempt 1 landed, and any job it needs that
  #          failed, at any depth, still stops it. The release's targets name no other channel
  #          (no rpm entry): the workflow lint holds these needs to the channels of the targets
  #          the real `release targets` writes (crates/xtask/tests/workflows/desired.rs, and
  #          desired_channels_tests.rs beside it). It needs no-downgrade too, and runs only
  #          when that job said `set=true` in this same attempt of the run.
  #          The join, when HOSTKEEPER_TAILNET_CLIENT_ID is set, asks for the tag of the
  #          repository variable HOSTKEEPER_TAILNET_TAG (`tag:ci`), the one the federation's trust
  #          credential issues; the client checks it at its first step, with or without the join,
  #          so the variable must be set.
  set-desired:
    needs: [plan, targets, coordinator, testing-apt-write, testing-apt-write-2, testing-apt-write-3, testing-pkg-upload, no-downgrade]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && vars.RELEASE_SETS_DESIRED == 'true' && needs.targets.outputs.newest == 'true' && needs.coordinator.result == 'success' && (needs.testing-apt-write.outputs.conflict == 'false' || needs.testing-apt-write-2.outputs.conflict == 'false' || needs.testing-apt-write-3.outputs.conflict == 'false') && needs.testing-pkg-upload.outputs.enabled == 'true' && needs.no-downgrade.outputs.set == 'true' && needs.no-downgrade.outputs.attempt == github.run_attempt }}
    permissions:
      contents: read
      id-token: write
    uses: komira-ai/hostkeeper/.github/workflows/set-desired.yml@2c767d1842a88edb7120073d2dff3b4bfccc834c # v0.1.184
    with:
      service: hostkeeper
      version: ${{ needs.targets.outputs.version }}
      targets: ${{ needs.targets.outputs.targets }}
      hostkeeper_version: 0.1.184
      hostkeeper_commit: 2c767d1842a88edb7120073d2dff3b4bfccc834c
      coordinator_url: ${{ vars.HOSTKEEPER_COORDINATOR_URL }}
      coordinator_ca: ${{ vars.HOSTKEEPER_COORDINATOR_CA }}
      audience: ${{ vars.HOSTKEEPER_CI_AUDIENCE }}
      wait: false
      join_tailnet: ${{ vars.HOSTKEEPER_TAILNET_CLIENT_ID != '' }}
      tailnet_client_id: ${{ vars.HOSTKEEPER_TAILNET_CLIENT_ID }}
      tailnet_audience: ${{ vars.HOSTKEEPER_TAILNET_AUDIENCE }}
      tailnet_coordinator: ${{ vars.HOSTKEEPER_TAILNET_COORDINATOR }}
      tailnet_tag: ${{ vars.HOSTKEEPER_TAILNET_TAG }}

  # newest  read-only, after every publish and image of the run: the newest release of the run (the
  #         last of the matrix, which is oldest first) as version, tag and commit. The package
  #         channels below take only it: a package repository serves the newest version, and the
  #         older releases of the same run are passed over, since the newer one carries their changes.

  newest:
    needs: [plan, publish, image]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.newest.outputs.version }}
      tag: ${{ steps.newest.outputs.tag }}
      commit: ${{ steps.newest.outputs.commit }}
    steps:
      - name: The newest version this run published
        id: newest
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: jq --raw-output '.include[-1] | "version=\(.version)", "tag=\(.tag)", "commit=\(.commit)"' <<< "$MATRIX" >> "$GITHUB_OUTPUT"

  # cp-deploy-digest and cp-deploy: the coordinator on the control plane's Docker Swarm, the
  # service `hostkeeper-coordinator` (docs/deploy/control-plane.md). They run only while the
  # repository variables CP_DEPLOY_ENDPOINT and CP_DEPLOY_TAILSCALE_TAGS are both not empty: with
  # either unset or empty, both jobs are skipped and the release ends as it did without them.
  # They take the newest release of the run alone (job `newest`), after every publish and image
  # of the run. The workflow lint (crates/xtask/tests/workflows, `cp_deploy.rs`) holds the two
  # jobs to this shape.
  #
  # cp-deploy-digest  reads the repository (`contents: read`) and nothing else: from the files
  #          verify checked (the run's artifact `release-<tag>`, checked against SHA256SUMS once
  #          more), `cargo xtask release image-digest`, compiled from the workflow's own commit,
  #          outputs the digest of the one manifest the linux-x86_64 image tarball's index.json
  #          names and the release's download addresses of that tarball and its bundle.
  # cp-deploy  calls the reusable workflow deploy.yml of komira-ai/docker-swarm-updater, pinned
  #          like any action by a full commit with its version comment, with exactly
  #          `id-token: write`: the called workflow joins the tailnet, asks GitHub for an OIDC
  #          token for every request, and runs in this repository's environment `controlplane`
  #          (main only, no required reviewer). It sends the service `hostkeeper-coordinator`,
  #          the release's version, that digest and those addresses, and the default signer
  #          (this repository's artifacts.yml on refs/heads/main); docker-swarm-updater checks
  #          the token's claims and the bundle against that signer, refuses an image signed
  #          before the one the service runs, then updates the service by digest, and Swarm rolls
  #          back an update whose task does not become ready. The job ends once the deploy is
  #          reported converged and fails otherwise, waiting up to 60 minutes. The release stays
  #          published whatever it says; the job coordinator (and so set-desired) runs only once
  #          it succeeded.
  cp-deploy-digest:
    needs: [plan, newest]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && vars.CP_DEPLOY_ENDPOINT != '' && vars.CP_DEPLOY_TAILSCALE_TAGS != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      image-url: ${{ steps.image.outputs.image-url }}
      bundle-url: ${{ steps.image.outputs.bundle-url }}
    steps:
      # The workflow's own commit: `release image-digest` is newer than the oldest commit a run
      # can release (see release_ref.rs of the workflow lint). The image is the release's files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.newest.outputs.tag }}
          path: dist
      # The files verify checked, once more: they crossed the run's artifact store.
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The linux-x86_64 image's manifest digest and the release's addresses of it and its bundle
        id: image
        env:
          VERSION: ${{ needs.newest.outputs.version }}
        run: cargo xtask release image-digest dist --version "$VERSION" --repo "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"

  cp-deploy:
    needs: [plan, newest, cp-deploy-digest]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && vars.CP_DEPLOY_ENDPOINT != '' && vars.CP_DEPLOY_TAILSCALE_TAGS != '' }}
    permissions:
      id-token: write
    uses: komira-ai/docker-swarm-updater/.github/workflows/deploy.yml@c1fcc47610e2886d4d9e561be3c0c76f0452d1f6 # v0.1.3
    with:
      service: hostkeeper-coordinator
      version: ${{ needs.newest.outputs.version }}
      image-digest: ${{ needs.cp-deploy-digest.outputs.digest }}
      image-url: ${{ needs.cp-deploy-digest.outputs.image-url }}
      bundle-url: ${{ needs.cp-deploy-digest.outputs.bundle-url }}
      endpoint: ${{ vars.CP_DEPLOY_ENDPOINT }}
      audience: ${{ vars.CP_DEPLOY_AUDIENCE }}
      environment: controlplane
      wait-minutes: 60
      tailscale-oauth-client-id: ${{ vars.CP_DEPLOY_TAILSCALE_CLIENT_ID }}
      tailscale-audience: ${{ vars.CP_DEPLOY_TAILSCALE_AUDIENCE }}
      tailscale-tags: ${{ vars.CP_DEPLOY_TAILSCALE_TAGS }}

  # PACKAGE CHANNELS (docs/deploy/package-repositories.md). The tool the jobs below run,
  # `cargo xtask channels`, is copied from komira-ai/tierstore (crates/xtask/src/channels, at
  # ff4777831c08fc13aa025b54e6e0531c2f350f4f), with the package names, the pool and the checks made
  # data (crates/xtask/src/channels/spec.rs); its move into ucdk's package publishers is out of
  # scope here. Every job is a green no-op until the repository's environments hold their settings
  # (`cargo xtask channels gate`), so this file is safe before the owner has set them up. The
  # workflow lint (crates/xtask/tests/workflows/packages.rs) holds each job to its row (needs, `if:`,
  # environment, permissions, verbs) and to checking the release's files' sums and attestations first.
  #
  # TESTING, the apt repository packages.komira.ai, which the organisation's products share, in
  # three jobs and up to three attempts: the release's Debian packages (hostkeeper and
  # hostkeeper-coordinator, both architectures) into the pool pool/hostkeeper and the index of the
  # suite `testing`. No job holds both the signing key and the cloud role, so a compromise of one
  # step cannot sign and publish:
  #   testing-apt-read   (environment apt-publish: the role, no key) reads the current index and the
  #                      ETag of each of its objects from S3;
  #   testing-apt-index  (environment apt-signing: the key, no role) merges the .debs into that
  #                      index, keeping every other product's entries, and signs it;
  #   testing-apt-write  (environment apt-publish) uploads the .debs once each, then the index,
  #                      with If-Match on the ETags that were read.
  # A write that finds the index changed in between (another product's release) reports
  # conflict=true and ends green; attempt 2 (the jobs with the suffix -2), and then 3, read, merge
  # and sign again, and the last one fails instead of asking for a fourth. A job without its
  # settings ends green with a notice and writes nothing.

  testing-apt-read:
    needs: [plan, newest]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the apt repository (a job without them does nothing and ends green)
        id: gate
        env:
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels gate --label testing-apt-read --output "$GITHUB_OUTPUT" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: cargo xtask channels assume --role-arn "$ROLE_ARN" --session-name "hostkeeper-testing-apt-read-$GITHUB_RUN_ID" --region us-east-1 --token-url "$ACTIONS_ID_TOKEN_REQUEST_URL" --env-file "$GITHUB_ENV"
      - name: Read the current index and the ETag of each object from S3 (never through the CDN, which caches the index)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
        run: cargo xtask channels apt read --suite testing --bucket "$APT_BUCKET" --out "$RUNNER_TEMP/apt-current"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-current
          path: ${{ runner.temp }}/apt-current
          if-no-files-found: error
          retention-days: 1

  testing-apt-index:
    needs: [plan, newest, testing-apt-read]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-signing
    permissions:
      contents: read
      attestations: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      signed: ${{ steps.sign.outputs.signed }}
    env:
      COMMIT: ${{ needs.newest.outputs.commit }}
      TAG: ${{ needs.newest.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the signing key and on the read (a job without them does nothing and ends green)
        id: gate
        env:
          READ_ENABLED: ${{ needs.testing-apt-read.outputs.enabled }}
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: cargo xtask channels gate --label testing-apt-index --output "$GITHUB_OUTPUT" --require "READ_ENABLED=$READ_ENABLED" --setting "APT_GPG_FINGERPRINT=${APT_GPG_FINGERPRINT:+set}" --setting "APT_GPG_PRIVATE_KEY=${APT_GPG_PRIVATE_KEY:+set}" --setting "APT_GPG_PASSPHRASE=${APT_GPG_PASSPHRASE:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
