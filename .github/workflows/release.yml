        run: cargo xtask channels gate --label testing-fail-apt-index --output "$GITHUB_OUTPUT" --require "READ_ENABLED=$READ_ENABLED" --setting "APT_GPG_FINGERPRINT=${APT_GPG_FINGERPRINT:+set}" --setting "APT_GPG_PRIVATE_KEY=${APT_GPG_PRIVATE_KEY:+set}" --setting "APT_GPG_PASSPHRASE=${APT_GPG_PASSPHRASE:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-fail-current
          path: ${{ runner.temp }}/apt-fail-current
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: release-${{ needs.newest.outputs.tag }}
          path: dist
      - name: The files match SHA256SUMS
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The files are the attested assets of this commit
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release check dist --version "${TAG#v}" --commit "$COMMIT"
      - name: Merge the .debs into the index that was read (the entries of every other product are kept)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          OWNER: ${{ github.repository_owner }}
        run: cargo xtask channels apt index --suite testing-fail --current "$RUNNER_TEMP/apt-fail-current" --out "$RUNNER_TEMP/apt-fail-next" --debs dist --version "${TAG#v}" --origin "$OWNER" --label "$OWNER" --description "$OWNER packages" --date "$(date +%s)"
      - name: Sign Release with the signing subkey (InRelease and Release.gpg), then remove the key
        id: sign
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: cargo xtask channels apt sign --dir "$RUNNER_TEMP/apt-fail-next/dists/testing-fail" --work "$RUNNER_TEMP/apt-sign" --fingerprint "$APT_GPG_FINGERPRINT" --output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-fail-next
          path: |
            ${{ runner.temp }}/apt-fail-next/dists
            ${{ runner.temp }}/apt-fail-next/etags.txt
          if-no-files-found: error
          retention-days: 1

