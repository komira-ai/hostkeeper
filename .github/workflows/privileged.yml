# The privileged run: the tests of crates/hostkeeper-privileged, as root, against the real systemd
# of a GitHub-hosted Ubuntu runner (passwordless sudo, systemd as PID 1), and, in the job
# macos-device, against the real launchd of a GitHub-hosted macOS runner. Everything a pull
# request runs proves the daemon against fakes of the host; here the adapters behind those fakes
# meet the real thing: the step launcher's transient units and their bound, the dead-man's stop
# by name, the observer's systemctl and /proc adapters, the unit control's systemctl
# (daemon-reload, start, stop, is-active), hostkeeper's update of itself as a unit made of
# packaging/linux/units/hostkeeper.service (and, for the bootstrap start, packaging/linux/hostkeeper.service) by the hand-over (the
# restart into the old binary, which execs the new one, the settle at the new binary's start,
# three starts that do not settle falling back to the old one, a SIGKILL before and after the
# exec while the update waits for its restart), and, in
# tierstore_shaped.rs, the whole update path: the real daemon under a Type=notify unit and the
# real coordinator in process update a tierstore-shaped package fetched from a loopback release
# channel, checked by the pinned gh against a test trust root, unpacked, switched and run by its
# hook in step units, roll it back on a failed verify, and force it back to the previous version
# with the channel down; in self_update_across_releases.rs, on Linux and on the Mac, hostkeeper's
# update of itself from the published release crates/hostkeeper-privileged/previous-release.toml
# pins to this build, with the same coordinator, channel and verifier: the released daemon as the
# host's own unit hostkeeper.service (or its own launchd job dev.hostkeeper.hostkeeper) updating to
# this build by the hand-over, and falling back to its own binary (three tries, then the update
# settles Failed) from this build made to fail its start, and this build updating to itself under a newer version name; on the Mac the daemon started as a
# launchd job and binding no socket, a hook step as a launchd job stopped at its
# bound, the observer's launchd and proc_pidpath adapters, and the package check's codesign and
# quarantine verdicts, and in
# device_mac_e2e.rs hello's macOS package installed, updated, rolled back and uninstalled by the
# real daemon and coordinator, its plists linked into /Library/LaunchDaemons and loaded by
# launchd, in device_mac_selfupdate.rs hostkeeper's update of itself under launchd (the
# hand-over, the clean exit, launchd starting the old binary, which execs the new one, the settle
# at its start, a new binary that cannot start fallen back from, and an install of the running
# version with no restart), and in
# unpack_mac.rs a package with read-only
# directories unpacked by the production unpacker, once as the runner's own user and once as
# root. In the job first-boot the programs themselves
# meet: the coordinator and the
# daemon, each started by the tests as a child process, through a host's first boot (enrollment,
# approval, the host certificate, heartbeats over mutual TLS, a restart of each) and a package
# assigned and installed. In the job openrc-device the daemon meets the OpenRC of Alpine Linux:
# the tests of openrc_device.rs run in a docker container built from
# crates/hostkeeper-privileged/openrc, with the programs built for x86_64-unknown-linux-musl.
# Network install end to end (docs/design/network-install.md section 11)
# is no job of this file: it runs in net-install.yml, on its own triggers, and no release waits
# for it.
#
# It runs after a merge to main and by hand (workflow_dispatch), never on a pull request. The
# workflow lint (crates/xtask/tests/workflows) holds its triggers to exactly these two, its jobs
# to exactly these four, each on its runner (ubuntu-24.04; macos-15 for macos-device), the
# previous release the jobs privileged and macos-device download to
# crates/hostkeeper-privileged/previous-release.toml, and gives it no write scope; it refuses root
# in every other workflow but net-install.yml, and
# macOS in every workflow that runs for a pull request, but in pr-device.yml,
# whose jobs privileged, macos-device and openrc-device are copies of this file's, step for step,
# run on a pull request (macos-device when the pull request changes a path the macOS jobs build
# or read). A release waits for a successful push run of
# this workflow on its commit (release.yml); pr-device.yml is no part of a release.
#
# In the job privileged, linux_packages.rs also installs the deb and the rpm,
# which the job builds from the static programs (musl) into target/linux-packages, in a
# container of each release of crates/hostkeeper-privileged/linux-releases.toml (images pinned by
# digest, each pulled in a step of its own; the workflow lint holds the steps to the list) and
# runs the programs the packages install; the containers have no network and are removed when
# they end, and the test writes nothing on the host.
#
# In each job the test binaries are built as the runner's own user; only their run is as root,
# through the cargo runner `sudo`, the one use of it in the job (on the Mac, unpack_mac also runs
# once as the runner's user, before the run as root). So no file of the Cargo registry
# or of target/ is owned by root, and a test writes only its scratch directory under target/ (and,
# for the failed end-to-end tests, what it keeps for the job's
# artifact under target/privileged-artifacts/; but
# the self-update tests, whose scratch directory is under /run/hostkeeper-ci, because the release
# trees the daemon checks must have root's directories all the way up, and whose drop-in is in
# /run/systemd/system; on the Mac, what the daemon's fixed paths name: the step jobs' directory
# under /var/run, and the pki directory its enrollment loop opens, and for device_mac_e2e a tree
# under /private/var, gh and the trusted root in /usr/local/lib/hostkeeper, the placed state in
# /var/lib/hostkeeper, hello's plists in /Library/LaunchDaemons
# (each moved aside if the host already has it and put back when the test ends) and the release
# channel's CA appended to /etc/ssl/cert.pem, which is written back as it was, and for
# device_mac_selfupdate a tree under /private/var; for self_update_across_releases the daemon's own
# bootstrap unit where the deb installs it (/usr/lib/systemd/system/hostkeeper.service, with its wants link)
# and the package unit where a package links it (/etc/systemd/system/hostkeeper.service), or on the Mac its plist
# where the pkg puts it (/Library/LaunchDaemons/dev.hostkeeper.hostkeeper.plist), beside the fixed
# paths of the end-to-end tests; and in first-boot
# the daemon's fixed paths too: the pki directory /etc/updater, the self-update units under
# /etc/systemd/system, /var/lib/hostkeeper (with the packages directory the tests give the
# daemon), and for install_uninstall the fixture service's unit and its wants link and the
# package check's verifier directory /usr/lib/hostkeeper, each refused if the host already has it
# and removed when the test ends, and the release channel's CA appended to the host's CA bundle,
# which is written back as it was; each on a runner that is thrown away after the job). Each test
# names its units hostkeeper-ci-<test>-<pid>-<n> (the fixture service's unit is
# hostkeeper-ci-fixture, its steps updater-hostkeeper-ci-fixture-<step>-<n>), or its launchd jobs
# dev.hostkeeper.ci-<test>-<pid> (a step job by its unit, as the launcher names it; hello's slots
# hello.a and hello.b as its package names them), and stops them
# when it ends, failed or not; every coordinator and release channel is on the loopback address,
# so no test leaves the host (the jobs' downloads are steps of their own, before the test). The test targets are
# named, in both steps of each job, so that the run is the privileged tests and nothing else of the
# crate; the workflow lint holds each job's list to the files that are privileged for it (first
# line `#![cfg(feature = "privileged")]` for the job privileged, `#![cfg(all(target_os = "linux",
# feature = "privileged"))]` for first-boot, `#![cfg(all(target_os = "macos", feature =
# "privileged"))]` for the Mac, `#![cfg(all(target_os = "linux", target_env = "gnu", feature =
# "privileged"))]` for openrc-device, and `#![cfg(all(any(target_os = "linux", target_os =
# "macos"), feature = "privileged"))]` for a target of both the job privileged and the Mac).
#
# These tests are not counted by the 99% coverage gate (ci.yml judges the pull-request set). A red
# run on main is a defect, fixed forward in a new pull request.
name: privileged

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A group per commit, never cancelled: a run of one commit never replaces or cancels the run of
# another (a release needs a successful run on each commit), and a second run of the same commit
# (a re-run, a dispatch) waits for the first.
concurrency:
  group: privileged-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts only bloat a cached target directory.
  CARGO_INCREMENTAL: 0

jobs:
  privileged:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # A bound on the whole job, against a test that hangs; no test depends on it.
    timeout-minutes: 60
    env:
      GH_VERSION: 2.102.1
      GH_SHA256: 77b9e297e94c50336823d0f84de7ef1be60cba704601fa0d98f129f47a94987b
      PREVIOUS_RELEASE_URL: https://github.com/komira-ai/hostkeeper/releases/download/v0.1.194/hostkeeper-0.1.194-linux-x86_64.tar.gz
      PREVIOUS_RELEASE_SHA256: eefc00d78d22f49a019599885ab4295a462df9c519288028713a5fb08985862e
      NFPM_VERSION: 2.48.0
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The service manager the tests run against, for the log (evidence, not a gate).
      - name: systemctl version
        run: systemctl --version
      - name: systemd-analyze version
        run: systemd-analyze --version
      # A runner image without systemd as PID 1 is a setup failure, not a test to skip: this step
      # fails, and its name says why. (The tests' own check refuses such a host too, with the
      # same reason.)
      - name: Fail unless systemd is the service manager (/run/systemd/system is a directory)
        run: test -d /run/systemd/system
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # The gh a host checks every package's attestation with, the one the Linux packages install
      # as /usr/lib/hostkeeper/gh (artifacts.yml pins the same version and SHA-256): Ubuntu 24.04's
      # own gh has no `gh attestation`. tierstore_shaped.rs installs this file at that path and
      # checks its fixture's attestation with it, offline, against a test trust root.
      - name: Restore the pinned gh.tar.gz from the cache
        id: gh-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.tar.gz
          key: pinned-gh-${{ env.GH_VERSION }}-${{ env.GH_SHA256 }}
      - name: Download gh on a cache miss (HTTPS only, redirects included)
        id: gh-download
        if: ${{ steps.gh-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
      - name: Say why the job stops when gh.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.gh-download.outcome == 'failure' }}
        run: echo "::error::gh.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Install gh (pinned checksum)
        id: gh-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/gh.tar.gz" --sha256 "$GH_SHA256" --out target/privileged-tools/gh --extract tar.gz --member "gh_${GH_VERSION}_linux_amd64/bin/gh"
      - name: Save the checked gh.tar.gz to the cache
        if: ${{ !cancelled() && steps.gh-check.outcome == 'success' && steps.gh-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.tar.gz
          key: ${{ steps.gh-cache.outputs.cache-primary-key }}
      # The released daemon self_update_across_releases.rs updates from: the binary tarball of the
      # release crates/hostkeeper-privileged/previous-release.toml pins for this platform (the
      # workflow lint holds PREVIOUS_RELEASE_URL and PREVIOUS_RELEASE_SHA256 equal to it). The test
      # checks the file against the pin again and fetches nothing itself.
      - name: Restore the pinned previous-release.tar.gz from the cache
        id: previous-release-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/previous-release.tar.gz
          key: pinned-previous-release-${{ env.PREVIOUS_RELEASE_URL }}-${{ env.PREVIOUS_RELEASE_SHA256 }}
      - name: Download the previous release on a cache miss (HTTPS only, redirects included)
        id: previous-release-download
        if: ${{ steps.previous-release-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/previous-release.tar.gz" "$PREVIOUS_RELEASE_URL"
      - name: Say why the job stops when previous-release.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.previous-release-download.outcome == 'failure' }}
        run: echo "::error::previous-release.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Check the previous release (pinned checksum)
        id: previous-release-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/previous-release.tar.gz" --sha256 "$PREVIOUS_RELEASE_SHA256" --out target/previous-release/hostkeeper.tar.gz
      - name: Save the checked previous-release.tar.gz to the cache
        if: ${{ !cancelled() && steps.previous-release-check.outcome == 'success' && steps.previous-release-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/previous-release.tar.gz
          key: ${{ steps.previous-release-cache.outputs.cache-primary-key }}
      # The packages crates/hostkeeper-privileged/tests/linux_packages.rs installs in a container
      # of each release of crates/hostkeeper-privileged/linux-releases.toml: the static programs,
      # staged with the pinned gh and the trusted root, packed by nfpm as the deb and the rpm
      # (artifacts.yml's build, with the same pins), into target/linux-packages. The
      # images are pulled here, one step each (the workflow lint holds the steps to the list); the
      # test pulls nothing and its containers have no network.
      - name: Restore the pinned nfpm.tar.gz from the cache
        id: nfpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nfpm.tar.gz
          key: pinned-nfpm-${{ env.NFPM_VERSION }}-${{ env.NFPM_SHA256 }}
      - name: Download nfpm on a cache miss (HTTPS only, redirects included)
        id: nfpm-download
        if: ${{ steps.nfpm-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/nfpm.tar.gz" "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
      - name: Say why the job stops when nfpm.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.nfpm-download.outcome == 'failure' }}
        run: echo "::error::nfpm.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Install nfpm (pinned checksum)
        id: nfpm-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/nfpm.tar.gz" --sha256 "$NFPM_SHA256" --out target/privileged-tools/nfpm --extract tar.gz --member nfpm
      - name: Save the checked nfpm.tar.gz to the cache
        if: ${{ !cancelled() && steps.nfpm-check.outcome == 'success' && steps.nfpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nfpm.tar.gz
          key: ${{ steps.nfpm-cache.outputs.cache-primary-key }}
      - name: Add the static target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build the static programs
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p hostkeeper --bin hostkeeper -p hostkeeper-pxe --bin hostkeeper-pxe
      - name: Stage the programs, gh and the trusted root
        run: cargo xtask release nfpm-stage --arch amd64 --gh-version "$GH_VERSION" --gh-archive "$RUNNER_TEMP/gh.tar.gz" --gh-sha256 "$GH_SHA256" --trusted-root packaging/sigstore/trusted_root.json --binaries target/x86_64-unknown-linux-musl/release --out target/nfpm
      - name: Make the directory of the packages
        run: mkdir -p target/linux-packages
      - name: Build the deb
        env:
          VERSION: 0.1.0
          ARCH: amd64
        run: target/privileged-tools/nfpm package --config packaging/linux/nfpm.yaml --packager deb --target target/linux-packages
      - name: Build the rpm
        env:
          VERSION: 0.1.0
          ARCH: amd64
        run: target/privileged-tools/nfpm package --config packaging/linux/nfpm.yaml --packager rpm --target target/linux-packages
      - name: Pull debian:12
        run: docker pull debian@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8
      - name: Pull debian:13
        run: docker pull debian@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
      - name: Pull ubuntu:22.04
        run: docker pull ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
      - name: Pull ubuntu:26.04
        run: docker pull ubuntu@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
      - name: Pull almalinux:8
        run: docker pull almalinux@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
      - name: Pull almalinux:10
        run: docker pull almalinux@sha256:5a4b41a427c9717be8f4ac2a32aa22efbae5f9124fbcb79a6765394f312acfe8
      - name: Pull opensuse/leap:16.0
        run: docker pull opensuse/leap@sha256:a4115e2f5aea9712a7c73974fd94000a034fc3051ef29b5f7722fbf04070dd9d
      - name: Pull opensuse/tumbleweed
        run: docker pull opensuse/tumbleweed@sha256:871173bf717af0926bd92324ee6f73ba285e0721f0c8ac00ef2c77f1c88d979e
      - name: Build the privileged tests as the runner's user
        run: cargo test -p hostkeeper-privileged --features privileged --locked --no-run --test transient_unit --test observer --test unit_control --test self_update --test tierstore_shaped --test self_update_across_releases --test linux_packages --test mdm_cert_units
      - name: Run the privileged tests as root
        run: cargo test -p hostkeeper-privileged --features privileged --locked --config "target.'cfg(unix)'.runner = 'sudo'" --test transient_unit --test observer --test unit_control --test self_update --test tierstore_shaped --test self_update_across_releases --test linux_packages --test mdm_cert_units -- --test-threads=1
      - name: The journal of the test units
        if: failure()
        run: journalctl --unit 'hostkeeper-ci-*' --no-pager
      # The step units the daemon of tierstore_shaped.rs ran its fixture's hook in.
      - name: The journal of the step units
        if: failure()
        run: journalctl --unit 'updater-hostkeeper-ci-*' --no-pager
      # What a failed end-to-end test kept before its host root was removed: the hook record
      # directory, the step record and the journal of the daemon and of its units, per test.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: privileged-end-to-end
          path: target/privileged-artifacts
          if-no-files-found: ignore
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The first boot of a host with the real programs: the coordinator and the daemon started by
  # the tests as child processes on loopback (first_boot: enrollment, approval, the host
  # certificate, heartbeats, restarts of each; install_uninstall: an assigned package installed
  # from a release channel the test serves, kept across restarts, updated and uninstalled).
  # The daemon fixes its pki directory, its self-update units and its package check's CA bundle
  # and verifier on the host, with no flag. These tests claim the paths they make there (each refused if the host already
  # has it) and remove them when they end, and write the CA bundle back as it was, so they run in
  # a job of their own, on a runner thrown away after it.
  first-boot:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # A bound on the whole job, against a test that hangs; no test depends on it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The service manager the tests run against, for the log (evidence, not a gate).
      - name: systemctl version
        run: systemctl --version
      - name: Fail unless systemd is the service manager (/run/systemd/system is a directory)
        run: test -d /run/systemd/system
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Build the first-boot tests as the runner's user
        run: cargo test -p hostkeeper-privileged --features privileged --locked --no-run --test first_boot --test install_uninstall
      - name: Run the first-boot tests as root
        run: cargo test -p hostkeeper-privileged --features privileged --locked --config "target.'cfg(unix)'.runner = 'sudo'" --test first_boot --test install_uninstall -- --test-threads=1
      - name: The journal of the fixture service's units
        if: failure()
        run: journalctl --unit 'hostkeeper-ci-*' --unit 'updater-hostkeeper-ci-*' --no-pager
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The device run on a Mac (design section 5.9): the launchd adapters, the process probe and the
  # package check against a GitHub-hosted arm64 macOS runner (passwordless sudo, launchd), and, in
  # device_mac_e2e.rs, hello's macOS package installed, updated, rolled back on a failed verify
  # and uninstalled by the real daemon under launchd, ordered by the real coordinator in process
  # and fetched from a loopback release channel checked by the pinned gh against a test trust
  # root, and, in device_mac_selfupdate.rs, hostkeeper updating itself from one version to the
  # next as a launchd job by the hand-over, and falling back from a next binary that cannot
  # start. The tests print what they
  # find (the proc_pidpath table, the verdicts of codesign, the daemon's Status) to the log, and a
  # failing end-to-end test what the Mac held.
  macos-device:
    runs-on: macos-15
    permissions:
      contents: read
    # A bound on the whole job, against a test that hangs; no test depends on it.
    timeout-minutes: 45
    env:
      # The gh the installer pkg installs at /usr/local/lib/hostkeeper/gh, the same version and
      # SHA-256 as artifacts.yml's macOS build: device_mac_e2e.rs installs this file at that path
      # and checks its packages' attestations with it, offline, against a test trust root.
      GH_VERSION: 2.103.3
      GH_SHA256: d700207eae9ae98fe2b89535c2c087c07823d4628c56364695a5a07ef311c062
      PREVIOUS_RELEASE_URL: https://github.com/komira-ai/hostkeeper/releases/download/v0.1.194/hostkeeper-0.1.194-macos-arm64.tar.gz
      PREVIOUS_RELEASE_SHA256: aedad067db46af7ed065683ab6dd7c46b87fb4558db21b31082003394654ca6b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The system the tests run against, for the log (evidence, not a gate).
      - name: sw_vers
        run: sw_vers
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Restore the pinned gh.zip from the cache
        id: gh-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.zip
          key: pinned-gh-${{ env.GH_VERSION }}-${{ env.GH_SHA256 }}
      - name: Download gh on a cache miss (HTTPS only, redirects included)
        id: gh-download
        if: ${{ steps.gh-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/gh.zip" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_macOS_arm64.zip"
      - name: Say why the job stops when gh.zip is neither cached nor downloadable
        if: ${{ !cancelled() && steps.gh-download.outcome == 'failure' }}
        run: echo "::error::gh.zip is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Check gh (pinned checksum)
        id: gh-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/gh.zip" --sha256 "$GH_SHA256" --out "$RUNNER_TEMP/gh-checked.zip"
      - name: Save the checked gh.zip to the cache
        if: ${{ !cancelled() && steps.gh-check.outcome == 'success' && steps.gh-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.zip
          key: ${{ steps.gh-cache.outputs.cache-primary-key }}
      - name: Unpack gh where the tests find it
        run: unzip -o -j -q "$RUNNER_TEMP/gh-checked.zip" "gh_${GH_VERSION}_macOS_arm64/bin/gh" -d target/privileged-tools
      # The released daemon self_update_across_releases.rs updates from: the binary tarball of the
      # release crates/hostkeeper-privileged/previous-release.toml pins for this platform (the
      # workflow lint holds PREVIOUS_RELEASE_URL and PREVIOUS_RELEASE_SHA256 equal to it). The test
      # checks the file against the pin again and fetches nothing itself.
      - name: Restore the pinned previous-release.tar.gz from the cache
        id: previous-release-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/previous-release.tar.gz
          key: pinned-previous-release-${{ env.PREVIOUS_RELEASE_URL }}-${{ env.PREVIOUS_RELEASE_SHA256 }}
      - name: Download the previous release on a cache miss (HTTPS only, redirects included)
        id: previous-release-download
        if: ${{ steps.previous-release-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/previous-release.tar.gz" "$PREVIOUS_RELEASE_URL"
      - name: Say why the job stops when previous-release.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.previous-release-download.outcome == 'failure' }}
        run: echo "::error::previous-release.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Check the previous release (pinned checksum)
        id: previous-release-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/previous-release.tar.gz" --sha256 "$PREVIOUS_RELEASE_SHA256" --out target/previous-release/hostkeeper.tar.gz
      - name: Save the checked previous-release.tar.gz to the cache
        if: ${{ !cancelled() && steps.previous-release-check.outcome == 'success' && steps.previous-release-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/previous-release.tar.gz
          key: ${{ steps.previous-release-cache.outputs.cache-primary-key }}
      # device_mac_e2e and device_mac_selfupdate run after device_mac, in the one step that runs
      # as root.
      - name: Build the macOS device tests as the runner's user
        run: cargo test -p hostkeeper-privileged --features privileged --locked --no-run --test device_mac --test device_mac_e2e --test device_mac_selfupdate --test self_update_across_releases --test unpack_mac
      # unpack_mac runs twice: here as the runner's user, as the release check of a package
      # unpacks it on a hosted runner, and below as root, as the daemon unpacks it on a host.
      - name: Run the macOS unpack tests as the runner's user
        run: cargo test -p hostkeeper-privileged --features privileged --locked --test unpack_mac -- --nocapture
      - name: Run the macOS device tests as root
        run: cargo test -p hostkeeper-privileged --features privileged --locked --config "target.'cfg(unix)'.runner = 'sudo'" --test device_mac --test device_mac_e2e --test device_mac_selfupdate --test self_update_across_releases --test unpack_mac -- --test-threads=1 --nocapture
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The device run of the daemon under OpenRC (Alpine Linux): the tests start an Alpine container
  # (docker, built from crates/hostkeeper-privileged/openrc) with OpenRC as its init and run the
  # musl build of the daemon in it as the service of packaging/alpine/hostkeeper.initd, against
  # the container's real rc-service and supervise-daemon. The programs the container runs are
  # built here for x86_64-unknown-linux-musl, as the runner's user.
  openrc-device:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # A bound on the whole job, against a test that hangs; no test depends on it.
    timeout-minutes: 45
    env:
      # The nfpm the tests find at target/privileged-tools/nfpm and build their package with, the
      # same version and SHA-256 as artifacts.yml's Linux x86_64 build.
      NFPM_VERSION: 2.48.0
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The container engine the tests start the Alpine guest with, for the log (evidence, not a
      # gate).
      - name: docker version
        run: docker --version
      - run: rustup toolchain install
      # The programs the container runs are built for musl, the libc of Alpine.
      - name: Add the musl target
        run: rustup target add x86_64-unknown-linux-musl
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Restore the pinned nfpm.tar.gz from the cache
        id: nfpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nfpm.tar.gz
          key: pinned-nfpm-${{ env.NFPM_VERSION }}-${{ env.NFPM_SHA256 }}
      - name: Download nfpm on a cache miss (HTTPS only, redirects included)
        id: nfpm-download
        if: ${{ steps.nfpm-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/nfpm.tar.gz" "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
      - name: Say why the job stops when nfpm.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.nfpm-download.outcome == 'failure' }}
        run: echo "::error::nfpm.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Install nfpm (pinned checksum)
        id: nfpm-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/nfpm.tar.gz" --sha256 "$NFPM_SHA256" --out target/privileged-tools/nfpm --extract tar.gz --member nfpm
      - name: Save the checked nfpm.tar.gz to the cache
        if: ${{ !cancelled() && steps.nfpm-check.outcome == 'success' && steps.nfpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nfpm.tar.gz
          key: ${{ steps.nfpm-cache.outputs.cache-primary-key }}
      - name: Build the Alpine image the tests run in
        run: docker build --tag hostkeeper-openrc-device crates/hostkeeper-privileged/openrc
      # The programs the container runs, built for musl, the libc of Alpine. ring's C code is
      # compiled by the runner's gcc: the runner has no musl-gcc.
      - name: Build the programs the container runs
        env:
          CC_x86_64_unknown_linux_musl: gcc
        run: cargo build --locked --target x86_64-unknown-linux-musl -p hostkeeper --bin hostkeeper -p hostkeeper-privileged --features hostkeeper-privileged/privileged --bin hostkeeper-selfupdate-daemon --bin hostkeeper-fixture-hook
      - name: Build the OpenRC device tests as the runner's user
        run: cargo test -p hostkeeper-privileged --features privileged --locked --no-run --test openrc_device
      - name: Run the OpenRC device tests as root
        run: cargo test -p hostkeeper-privileged --features privileged --locked --config "target.'cfg(unix)'.runner = 'sudo'" --test openrc_device -- --test-threads=1 --nocapture
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
