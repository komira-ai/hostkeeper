# The pull-request gate: the checks `lint` and `test`. GitHub-hosted runners only; the workflow
# lint (crates/xtask/tests/workflows) holds every workflow of this repository to commit-SHA
# pinned actions with a version comment, to a top-level `permissions: {}`, to no
# `pull_request_target`, to GitHub-hosted runners, to write scopes that only the jobs named
# there may hold, to no privileged or macOS job in a workflow that runs on pull requests, and to
# no job as root (`sudo`, a privileged container) outside privileged.yml, which runs the tests of
# crates/hostkeeper-privileged as root after a merge to main and by hand only.
#
# `lint` is the format, cargo-deny (licences, bans and sources), clippy, the build of the hook
# SDK without its test feature, actionlint and the workflow lint. `test` runs every test under
# cargo-llvm-cov with branch coverage and applies the 99% gate: every crate of the workspace
# must reach 99.00% of its lines and 99.00% of its branches (crates/coverage-gate). Every crate
# is judged, the tooling included, with no exclusion. The privileged tests of
# crates/hostkeeper-privileged are behind its feature `privileged`, which this workflow never
# turns on: they are neither built nor run here, and count toward no gate.
#
# The pull request and the push to main run the same jobs. A push to main also saves the Cargo
# cache; a pull request only restores it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A pull request's newer run replaces its older one; a push to main always runs to its end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts only bloat a cached target directory.
  CARGO_INCREMENTAL: 0

jobs:
  # Format, cargo-deny, clippy, actionlint and the workflow lint, one after another on one Cargo
  # cache. Each step runs after a failed one, so a run reports every failure at once. cargo-deny
  # and actionlint are release binaries: `curl --proto =https --proto-redir =https` downloads
  # each one, and `cargo xtask install-tool` checks its SHA-256 before anything is unpacked or
  # installed. cargo-deny checks licences, bans and sources, as deny.toml configures them.
  # Advisories are not checked here: a new advisory against a crate we already use would fail
  # every open pull request for something none of them did.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo fmt --all --check
      - name: Download cargo-deny (HTTPS only, redirects included)
        if: ${{ !cancelled() }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --silent --show-error --location --output "$RUNNER_TEMP/cargo-deny.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
      - name: Install cargo-deny (pinned checksum)
        if: ${{ !cancelled() }}
        run: cargo xtask install-tool --download "$RUNNER_TEMP/cargo-deny.tar.gz" --sha256 "$DENY_SHA256" --out "$HOME/.cargo/bin/cargo-deny" --extract tar.gz --member "cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl/cargo-deny"
      - run: cargo deny --version
        if: ${{ !cancelled() }}
      # The arguments cargo-deny-action passes by default, without the advisories check.
      - run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check bans licenses sources
        if: ${{ !cancelled() }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: ${{ !cancelled() }}
      # hostkeeper-hook as a service depends on it: the library alone, without the feature
      # `conformance` that the crate's own tests turn on, so a harness item that slips out from
      # behind the feature fails here.
      - run: cargo check -p hostkeeper-hook --lib --locked
        if: ${{ !cancelled() }}
      - name: Download actionlint (HTTPS only, redirects included)
        if: ${{ !cancelled() }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
      - name: Install actionlint (pinned checksum)
        if: ${{ !cancelled() }}
        run: cargo xtask install-tool --download "$RUNNER_TEMP/actionlint.tar.gz" --sha256 "$ACTIONLINT_SHA256" --out "$HOME/.cargo/bin/actionlint" --extract tar.gz --member actionlint
      - run: actionlint -version
        if: ${{ !cancelled() }}
      - run: actionlint
        if: ${{ !cancelled() }}
      # The workflow lint is a test (crates/xtask/tests/workflows). The coverage run below runs
      # it too; running it alone here makes a bad workflow red in seconds, not after that run.
      - run: cargo test -p xtask --locked --test workflows
        if: ${{ !cancelled() }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Every test under cargo-llvm-cov and cargo-nextest (one process per test), and the gate.
  # Branch coverage (`--branch`, rustc's `-Zcoverage-options=branch`) is unstable, so this job
  # builds with a pinned nightly; every other job stays on the toolchain in rust-toolchain.toml.
  # The nightly may warn where stable does not, so `-D warnings` is off here (clippy, in the lint
  # job, enforces it). cargo-llvm-cov and cargo-nextest are release binaries, downloaded over
  # HTTPS and checked against their SHA-256 before use, as in the lint job. xtask builds with
  # the coverage nightly, the one toolchain this job installs.
  #
  # `-skip-functions` leaves the per-function records (FN, FNDA) out of the lcov export: with
  # branch coverage on, llvm-cov's lcov exporter can crash while writing them for async
  # methods. Lines and branches, all the gate reads, are unaffected.
  #
  # cargo-llvm-cov leaves out every `examples/` directory by default, and `examples/hello` is
  # a crate of the workspace that the gate judges. The report therefore turns the default
  # ignore pattern off and spells its parts again without `examples`: the sources of rustc,
  # `tests/` and `benches/` directories, `tests.rs` and `*_tests.rs` files, the crates of the
  # registry and of git, and the target directory (generated code). Over the same run, its
  # report lists the files the default's lists, plus those of `examples/hello/src`.
  #
  # The gate judges every crate of the workspace, the tooling (`xtask`, `coverage-gate`)
  # included: it has no way to exclude one.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTFLAGS: ""
      COVERAGE_TOOLCHAIN: nightly-2026-10-01
      LLVM_COV_VERSION: 0.9.1
      LLVM_COV_SHA256: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
      NEXTEST_VERSION: 0.9.146
      NEXTEST_SHA256: 682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      - name: Download cargo-llvm-cov (HTTPS only, redirects included)
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --silent --show-error --location --output "$RUNNER_TEMP/cargo-llvm-cov.tar.gz" "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v$LLVM_COV_VERSION/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
      - name: Install cargo-llvm-cov (pinned checksum)
        run: cargo "+$COVERAGE_TOOLCHAIN" xtask install-tool --download "$RUNNER_TEMP/cargo-llvm-cov.tar.gz" --sha256 "$LLVM_COV_SHA256" --out "$HOME/.cargo/bin/cargo-llvm-cov" --extract tar.gz --member cargo-llvm-cov
      - run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov --version
      - name: Download cargo-nextest (HTTPS only, redirects included)
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --silent --show-error --location --output "$RUNNER_TEMP/cargo-nextest.tar.gz" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
      - name: Install cargo-nextest (pinned checksum)
        run: cargo "+$COVERAGE_TOOLCHAIN" xtask install-tool --download "$RUNNER_TEMP/cargo-nextest.tar.gz" --sha256 "$NEXTEST_SHA256" --out "$HOME/.cargo/bin/cargo-nextest" --extract tar.gz --member cargo-nextest
      # This job's own cache key: no other job's cache is restored here (the lint job's holds a
      # build without coverage instrumentation).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-coverage-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-coverage-${{ runner.os }}-${{ runner.arch }}-
      # The cache holds target/, and a push run left the instrumented test binaries and
      # profiles in target/llvm-cov-target. `llvm-cov report` reads every instrumented binary
      # and profile there, so a run that restored them merged a binary built from older
      # sources. `llvm-cov clean --workspace` removes the workspace's own artifacts and keeps
      # the dependencies' builds, which are what the cache is for.
      - name: Drop the workspace's coverage artifacts the cache restored
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov clean --workspace
      - run: mkdir -p target/coverage
      - name: Run every test under coverage
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov nextest --workspace --locked --branch --no-report --no-fail-fast
      - name: Report
        env:
          LLVM_COV_FLAGS: -skip-functions
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov report --branch --lcov --disable-default-ignore-filename-regex --ignore-filename-regex '(^|/)(rustc/([0-9a-f]+|[0-9]+\.[0-9]+\.[0-9]+)|tests|benches)/|(^|/)(tests\.rs|[0-9a-zA-Z_-]+[_-]tests\.rs)$|/\.cargo/(registry|git)/|(^|/)target/' --output-path target/coverage/lcov.info
      # Fails when a crate is under 99.00% of its lines or of its branches.
      - name: Per-crate table and 99% gate
        run: cargo "+$COVERAGE_TOOLCHAIN" run -p coverage-gate --locked -- --lcov target/coverage/lcov.info --root "$GITHUB_WORKSPACE" --summary-file "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: target/coverage/lcov.info
          if-no-files-found: error
      # The instrumented build is cleaned before the cache is saved, so the cache holds none of
      # this run's workspace coverage artifacts.
      - if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov clean --workspace
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
