# The pull-request gate: the checks `lint` and `test`. GitHub-hosted runners only; the workflow
# lint (crates/xtask/tests/workflows) holds every workflow of this repository to commit-SHA
# pinned actions with a version comment, to a top-level `permissions: {}`, to no
# `pull_request_target`, to GitHub-hosted runners, to write scopes that only the jobs named
# there may hold, to no write scope and no secret in a workflow that runs on pull requests, to no
# privileged job in one but the jobs of pr-device.yml it lists, to no runner in one but Linux
# x86_64 (no macOS and no linux-arm64: those platforms are tested in the beta stage of
# release.yml), and to no job as root (`sudo`, a privileged container) outside privileged.yml,
# which runs the tests of crates/hostkeeper-privileged as root after a merge to main and by hand,
# net-install.yml, which runs the network-install tests as root on main, the copies of
# privileged.yml's jobs in pr-device.yml, which run them on a pull request, and release.yml's job
# macos-device. A service or job container image must be pinned by digest
# (`name:tag@sha256:<64 hex>`).
#
# `lint` is the format, cargo-deny (licences, bans and sources), clippy, the build of the hook
# SDK without its test feature, actionlint and the workflow lint. The tests run under
# cargo-llvm-cov with branch coverage in two shards (the jobs `test-shard`, each one half of
# them); the check `test` (the job `coverage`) merges what both measured and applies the 99%
# gate: every crate of the workspace must reach 99.00% of its lines and 99.00% of its branches
# (crates/coverage-gate). Every crate is judged, the tooling included, with no exclusion. The
# workflow lint holds the shards and the gate to their shape (crates/xtask/tests/workflows/ci.rs).
# The privileged tests of
# crates/hostkeeper-privileged are behind its feature `privileged`, which this workflow never
# turns on: they are neither built nor run here, and count toward no gate.
#
# The pull request and the push to main run the same jobs. A push to main also saves the Cargo
# cache; a pull request only restores it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A pull request's newer run replaces its older one; a push to main always runs to its end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts only bloat a cached target directory.
  CARGO_INCREMENTAL: 0
  # The coverage toolchain and cargo-llvm-cov of the test shards and of `coverage`, one pin for
  # the jobs that build the instrumented binaries and the one that reads them.
  COVERAGE_TOOLCHAIN: nightly-2026-10-01
  LLVM_COV_VERSION: 0.9.1
  LLVM_COV_SHA256: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a

jobs:
  # Format, cargo-deny, clippy, actionlint and the workflow lint, one after another on one Cargo
  # cache. Each step runs after a failed one, so a run reports every failure at once. cargo-deny
  # and actionlint are release binaries: each is restored from the actions cache under its
  # version and SHA-256, or else `curl --proto =https --proto-redir =https` downloads it, and
  # `cargo xtask install-tool` checks its SHA-256 before anything is unpacked or installed; only
  # a checked archive is saved to the cache. cargo-deny checks licences, bans and sources, as
  # deny.toml configures them.
  # Advisories are not checked here: a new advisory against a crate we already use would fail
  # every open pull request for something none of them did. advisories.yml checks them daily
  # and on every push to main, and keeps what it finds in one issue.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo fmt --all --check
      - name: Restore the pinned cargo-deny.tar.gz from the cache
        id: cargo-deny-cache
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-deny.tar.gz
          key: pinned-cargo-deny-${{ env.DENY_VERSION }}-${{ env.DENY_SHA256 }}
      - name: Download cargo-deny on a cache miss (HTTPS only, redirects included)
        id: cargo-deny-download
        if: ${{ !cancelled() && steps.cargo-deny-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/cargo-deny.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
      - name: Say why the job stops when cargo-deny.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.cargo-deny-download.outcome == 'failure' }}
        run: echo "::error::cargo-deny.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Install cargo-deny (pinned checksum)
        id: cargo-deny-check
        if: ${{ !cancelled() }}
        run: cargo xtask install-tool --download "$RUNNER_TEMP/cargo-deny.tar.gz" --sha256 "$DENY_SHA256" --out "$HOME/.cargo/bin/cargo-deny" --extract tar.gz --member "cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl/cargo-deny"
      - name: Save the checked cargo-deny.tar.gz to the cache
        if: ${{ !cancelled() && steps.cargo-deny-check.outcome == 'success' && steps.cargo-deny-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-deny.tar.gz
          key: ${{ steps.cargo-deny-cache.outputs.cache-primary-key }}
      - run: cargo deny --version
        if: ${{ !cancelled() }}
      # The arguments cargo-deny-action passes by default, without the advisories check.
      - run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check bans licenses sources
        if: ${{ !cancelled() }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: ${{ !cancelled() }}
      # hostkeeper-hook as a service depends on it: the library alone, without the feature
      # `conformance` that the crate's own tests turn on, so a harness item that slips out from
      # behind the feature fails here.
      - run: cargo check -p hostkeeper-hook --lib --locked
        if: ${{ !cancelled() }}
      - name: Restore the pinned actionlint.tar.gz from the cache
        id: actionlint-cache
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint.tar.gz
          key: pinned-actionlint-${{ env.ACTIONLINT_VERSION }}-${{ env.ACTIONLINT_SHA256 }}
      - name: Download actionlint on a cache miss (HTTPS only, redirects included)
        id: actionlint-download
        if: ${{ !cancelled() && steps.actionlint-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
      - name: Say why the job stops when actionlint.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.actionlint-download.outcome == 'failure' }}
        run: echo "::error::actionlint.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Install actionlint (pinned checksum)
        id: actionlint-check
        if: ${{ !cancelled() }}
        run: cargo xtask install-tool --download "$RUNNER_TEMP/actionlint.tar.gz" --sha256 "$ACTIONLINT_SHA256" --out "$HOME/.cargo/bin/actionlint" --extract tar.gz --member actionlint
      - name: Save the checked actionlint.tar.gz to the cache
        if: ${{ !cancelled() && steps.actionlint-check.outcome == 'success' && steps.actionlint-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint.tar.gz
          key: ${{ steps.actionlint-cache.outputs.cache-primary-key }}
      - run: actionlint -version
        if: ${{ !cancelled() }}
      - run: actionlint
        if: ${{ !cancelled() }}
      # The workflow lint is a test (crates/xtask/tests/workflows). The coverage run below runs
      # it too; running it alone here makes a bad workflow red in seconds, not after that run.
      - run: cargo test -p xtask --locked --test workflows
        if: ${{ !cancelled() }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Every test under cargo-llvm-cov and cargo-nextest (one process per test), in two shards.
  # Branch coverage (`--branch`, rustc's `-Zcoverage-options=branch`) is unstable, so the shards
  # and `coverage` build with a pinned nightly; every other job stays on the toolchain in
  # rust-toolchain.toml. The nightly may warn where stable does not, so `-D warnings` is off
  # there (clippy, in the lint job, enforces it). cargo-llvm-cov and cargo-nextest are release
  # binaries, restored from the actions cache or else downloaded over HTTPS, and checked against
  # their SHA-256 before use, as in the lint job. xtask builds with the coverage nightly, the one toolchain these jobs install.
  #
  # Each shard builds the whole workspace instrumented and runs one of the two halves
  # `--partition hash:<shard>/2` makes of the tests: nextest puts each test in exactly one half,
  # by a hash of its binary and name. Both shards and `coverage` run on the same runner image at
  # the same checkout path, so the shards build the same binaries, and `coverage` reads the
  # first shard's binaries with both shards' profiles. Each shard names its profiles after
  # itself (LLVM_PROFILE_FILE_NAME, which cargo-llvm-cov reads in place of its default name), so
  # the two sets never overwrite each other where `coverage` puts them together. One shard's
  # failing tests do not stop the other (`fail-fast: false`), so a run reports every failure.
  #
  # The binaries are linked without debug info (`strip = "debuginfo"` for the dev and test
  # profiles, cargo's own variables, as CARGO_INCREMENTAL is): llvm-cov reads their coverage
  # sections (`__llvm_covfun`, `__llvm_covmap`, `__llvm_prf_*`), not DWARF, and the debug info
  # is about six sevenths of each test binary. upload-artifact keeps no file mode and `llvm-cov
  # report` reads only executable files, so the first shard packs them in a tar: everything
  # under target/llvm-cov-target/debug whose name has no dot, which is every executable (test
  # binaries, programs) and leaves out the libraries (`.rlib`, `.rmeta`, `.so`), the `.d` files
  # and dotted directories.
  #
  # The cache holds target/, and a push run once left the instrumented test binaries and
  # profiles in target/llvm-cov-target. `llvm-cov report` reads every instrumented binary and
  # profile there, so a run that restored them merged a binary built from older sources. `llvm-cov
  # clean --workspace` removes the workspace's own artifacts and keeps the dependencies' builds,
  # which are what the cache is for. The first shard alone saves it, on a push to main.
  test-shard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      RUSTFLAGS: ""
      CARGO_PROFILE_DEV_STRIP: debuginfo
      CARGO_PROFILE_TEST_STRIP: debuginfo
      NEXTEST_VERSION: 0.9.146
      NEXTEST_SHA256: 682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428
      HOSTKEEPER_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/postgres
    # The coordinator's Postgres store tests need a server. It is a throwaway container that lives
    # for this one job, so it trusts every connection and holds no password. The tests read its
    # URL from the one variable above, and each makes its own database in it. Each shard has its
    # own.
    services:
      postgres:
        image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      - name: Restore the pinned cargo-llvm-cov.tar.gz from the cache
        id: cargo-llvm-cov-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-llvm-cov.tar.gz
          key: pinned-cargo-llvm-cov-${{ env.LLVM_COV_VERSION }}-${{ env.LLVM_COV_SHA256 }}
      - name: Download cargo-llvm-cov on a cache miss (HTTPS only, redirects included)
        id: cargo-llvm-cov-download
        if: ${{ steps.cargo-llvm-cov-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/cargo-llvm-cov.tar.gz" "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v$LLVM_COV_VERSION/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
      - name: Say why the job stops when cargo-llvm-cov.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.cargo-llvm-cov-download.outcome == 'failure' }}
        run: echo "::error::cargo-llvm-cov.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Install cargo-llvm-cov (pinned checksum)
        id: cargo-llvm-cov-check
        run: cargo "+$COVERAGE_TOOLCHAIN" xtask install-tool --download "$RUNNER_TEMP/cargo-llvm-cov.tar.gz" --sha256 "$LLVM_COV_SHA256" --out "$HOME/.cargo/bin/cargo-llvm-cov" --extract tar.gz --member cargo-llvm-cov
      - name: Save the checked cargo-llvm-cov.tar.gz to the cache
        if: ${{ !cancelled() && steps.cargo-llvm-cov-check.outcome == 'success' && steps.cargo-llvm-cov-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-llvm-cov.tar.gz
          key: ${{ steps.cargo-llvm-cov-cache.outputs.cache-primary-key }}
      - run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov --version
      - name: Restore the pinned cargo-nextest.tar.gz from the cache
        id: cargo-nextest-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-nextest.tar.gz
          key: pinned-cargo-nextest-${{ env.NEXTEST_VERSION }}-${{ env.NEXTEST_SHA256 }}
      - name: Download cargo-nextest on a cache miss (HTTPS only, redirects included)
        id: cargo-nextest-download
        if: ${{ steps.cargo-nextest-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/cargo-nextest.tar.gz" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
      - name: Say why the job stops when cargo-nextest.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.cargo-nextest-download.outcome == 'failure' }}
        run: echo "::error::cargo-nextest.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Install cargo-nextest (pinned checksum)
        id: cargo-nextest-check
        run: cargo "+$COVERAGE_TOOLCHAIN" xtask install-tool --download "$RUNNER_TEMP/cargo-nextest.tar.gz" --sha256 "$NEXTEST_SHA256" --out "$HOME/.cargo/bin/cargo-nextest" --extract tar.gz --member cargo-nextest
      - name: Save the checked cargo-nextest.tar.gz to the cache
        if: ${{ !cancelled() && steps.cargo-nextest-check.outcome == 'success' && steps.cargo-nextest-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-nextest.tar.gz
          key: ${{ steps.cargo-nextest-cache.outputs.cache-primary-key }}
      # The shards' own cache key: no other job's cache is restored here (the lint job's holds a
      # build without coverage instrumentation, and the key before the shards a build with debug
      # info).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-coverage-stripped-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-coverage-stripped-${{ runner.os }}-${{ runner.arch }}-
      - name: Drop the workspace's coverage artifacts the cache restored
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov clean --workspace
      - name: Run this shard's half of the tests under coverage
        env:
          LLVM_PROFILE_FILE_NAME: hostkeeper-shard-${{ matrix.shard }}-%p-%4m.profraw
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov nextest --workspace --locked --branch --no-report --no-fail-fast --partition hash:${{ matrix.shard }}/2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profiles-${{ matrix.shard }}
          path: target/llvm-cov-target/*.profraw
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
      - name: Pack the instrumented binaries
        if: ${{ matrix.shard == 1 }}
        run: tar --create --zstd --file "$RUNNER_TEMP/coverage-binaries.tar.zst" --no-wildcards-match-slash --exclude='*.*' target/llvm-cov-target/debug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.shard == 1 }}
        with:
          name: coverage-binaries
          path: ${{ runner.temp }}/coverage-binaries.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      # The instrumented build is cleaned before the cache is saved, so the cache holds none of
      # this run's workspace coverage artifacts.
      - if: ${{ github.event_name == 'push' && matrix.shard == 1 && steps.cargo-cache.outputs.cache-hit != 'true' }}
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov clean --workspace
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.event_name == 'push' && matrix.shard == 1 && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The check `test`: the shards' coverage merged, reported and gated, as one job did before the
  # shards. It runs after the shards whatever they did (`always()`), and its first step fails
  # unless every shard passed. A job left out because a shard failed or was cancelled would be
  # skipped, and a skipped required check passes; this one fails instead, in a cancelled run too.
  # The profiles of both shards go to target/llvm-cov-target, the first shard's binaries are
  # unpacked there, at the same checkout path, and `llvm-cov report` reads them as it read one
  # job's own.
  #
  # `-skip-functions` leaves the per-function records (FN, FNDA) out of the lcov export: with
  # branch coverage on, llvm-cov's lcov exporter can crash while writing them for async
  # methods. Lines and branches, all the gate reads, are unaffected.
  #
  # cargo-llvm-cov leaves out every `examples/` directory by default, and `examples/hello` is
  # a crate of the workspace that the gate judges. The report therefore turns the default
  # ignore pattern off and spells its parts again without `examples`: the sources of rustc,
  # `tests/` and `benches/` directories, `tests.rs` and `*_tests.rs` files, the crates of the
  # registry and of git, and the target directory (generated code). Over the same run, its
  # report lists the files the default's lists, plus those of `examples/hello/src`.
  #
  # The gate judges every crate of the workspace, the tooling (`xtask`, `coverage-gate`)
  # included: it has no way to exclude one.
  coverage:
    name: test
    needs: [test-shard]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RUSTFLAGS: ""
    steps:
      - name: A test shard did not pass
        if: ${{ always() && needs.test-shard.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      - name: Restore the pinned cargo-llvm-cov.tar.gz from the cache
        id: cargo-llvm-cov-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-llvm-cov.tar.gz
          key: pinned-cargo-llvm-cov-${{ env.LLVM_COV_VERSION }}-${{ env.LLVM_COV_SHA256 }}
      - name: Download cargo-llvm-cov on a cache miss (HTTPS only, redirects included)
        id: cargo-llvm-cov-download
        if: ${{ steps.cargo-llvm-cov-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/cargo-llvm-cov.tar.gz" "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v$LLVM_COV_VERSION/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
      - name: Say why the job stops when cargo-llvm-cov.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.cargo-llvm-cov-download.outcome == 'failure' }}
        run: echo "::error::cargo-llvm-cov.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Install cargo-llvm-cov (pinned checksum)
        id: cargo-llvm-cov-check
        run: cargo "+$COVERAGE_TOOLCHAIN" xtask install-tool --download "$RUNNER_TEMP/cargo-llvm-cov.tar.gz" --sha256 "$LLVM_COV_SHA256" --out "$HOME/.cargo/bin/cargo-llvm-cov" --extract tar.gz --member cargo-llvm-cov
      - name: Save the checked cargo-llvm-cov.tar.gz to the cache
        if: ${{ !cancelled() && steps.cargo-llvm-cov-check.outcome == 'success' && steps.cargo-llvm-cov-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-llvm-cov.tar.gz
          key: ${{ steps.cargo-llvm-cov-cache.outputs.cache-primary-key }}
      - run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-profiles-*
          merge-multiple: true
          path: target/llvm-cov-target
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-binaries
          path: ${{ runner.temp }}
      - name: Unpack the instrumented binaries
        run: tar --extract --zstd --file "$RUNNER_TEMP/coverage-binaries.tar.zst"
      - run: mkdir -p target/coverage
      - name: Report
        id: report
        env:
          LLVM_COV_FLAGS: -skip-functions
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov report --branch --lcov --disable-default-ignore-filename-regex --ignore-filename-regex '(^|/)(rustc/([0-9a-f]+|[0-9]+\.[0-9]+\.[0-9]+)|tests|benches)/|(^|/)(tests\.rs|[0-9a-zA-Z_-]+[_-]tests\.rs)$|/\.cargo/(registry|git)/|(^|/)target/' --output-path target/coverage/lcov.info
      # Fails when a crate is under 99.00% of its lines or of its branches.
      - name: Per-crate table and 99% gate
        run: cargo "+$COVERAGE_TOOLCHAIN" run -p coverage-gate --locked -- --lcov target/coverage/lcov.info --root "$GITHUB_WORKSPACE" --summary-file "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        with:
          name: coverage
          path: target/coverage/lcov.info
          if-no-files-found: error
