# The network-install run: in the jobs net-install and net-install-arm64 a QEMU guest is installed
# by network end to end (docs/design/network-install.md section 11), as root on a GitHub-hosted
# Ubuntu runner: the real pxe and the real coordinator's LAN listener, on a bridge with
# no route out, each box of the LAN in a network namespace of its own; x86-64 under KVM through
# enrollment, a service, router mode, a reinstall and a retired host, and arm64 under TCG until its
# seed fetch; net-install then makes the report of the measurement of the guest's first install
# (cargo xtask netinstall-report) and keeps it as the artifact net-install-report.
#
# It is no part of a release: release.yml waits for ci, privileged and artifacts only, and an
# emulated install takes hours (the arm64 job's bound is 330 minutes), so it runs on its own:
#
# - on a push to main that changes the network-install code: the boot server's crates
#   (crates/hostkeeper-pxe*), the boot sets' pins (packaging/netboot), the deb's packaging
#   (packaging/linux), the pxe package's unit (packaging/pxe), the network-install tests and their rig, the generators the jobs run
#   (cargo xtask release netboot and netinstall-report), the pinned packages of QEMU and the
#   firmware (.github/debs) and the verbs that fetch them and the ISO (cargo xtask debs and
#   netboot-iso), and this file;
# - nightly, on main, whatever changed, for the code these tests use that the paths above leave
#   out (the coordinator, the daemon);
# - by hand (workflow_dispatch), on main or on the branch of a pull request.
#
# It never runs for a pull request: no workflow that does runs a job as root but pr-device.yml's
# copies of privileged.yml's jobs, and a run of hours is no check of a pull request. The workflow
# lint (crates/xtask/tests/workflows) holds its triggers and its paths to exactly these, its
# concurrency to the group below, each job to its runner (ubuntu-24.04) and its test targets,
# each job's ISO to its platform's pin of packaging/netboot/pins.toml and a mirror outside
# Canonical's, and gives it no write scope.
#
# In each job the test binaries are built as the runner's own user; only their run is as root,
# through the cargo runner `sudo`, and QEMU and its firmware are installed by
# `sudo dpkg --install` of the job's pinned packages (.github/debs/<set>.toml, which the workflow
# lint names for each job): the job's only uses of sudo. No job runs apt-get: the packages come
# from the actions cache, or from the pinned mirrors in turn on a cache miss, each checked against
# its SHA-256 (cargo xtask debs), and the ISO from its pinned URL or a mirror run by another than
# Canonical (cargo xtask netboot-iso), so an outage of Canonical's names does not redden a run
# whose cache hit. So no file of the Cargo registry or of target/ is
# owned by root, and a test writes only its scratch directory under target/ and what it keeps for
# the job's artifact under target/privileged-artifacts/, and on the host the network namespaces,
# the bridge, the veth pairs and the tap of the test's LAN, named by its pid and deleted when it
# ends, on a runner that is thrown away after the job. Every coordinator and release channel is on
# the test's own bridge, which routes nowhere, so no test leaves the host (the jobs' downloads are
# steps of their own, before the test). The test targets are named, in both steps of each job, so
# that the run is the job's network-install test and nothing else of the crate; the workflow lint
# holds each job's list to the files of crates/hostkeeper-privileged/tests that start with the
# job's own first line.
#
# These tests are not counted by the 99% coverage gate (ci.yml judges the pull-request set). A red
# run on main is a defect, fixed forward in a new pull request.
name: net-install

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/net-install.yml
      - crates/hostkeeper-pxe*/**
      - packaging/netboot/**
      - packaging/linux/**
      - packaging/pxe/**
      - crates/hostkeeper-privileged/tests/net_install*.rs
      - crates/hostkeeper-privileged/tests/netinstall/**
      - crates/hostkeeper-privileged/tests/bin/pxe.rs
      - crates/xtask/src/release/netboot.rs
      - crates/xtask/src/release/netboot/**
      - crates/xtask/src/netinstall_report.rs
      - crates/xtask/src/netinstall_report/**
      - .github/debs/**
      - crates/xtask/src/debs.rs
      - crates/xtask/src/debs/**
      - crates/xtask/src/mirrored.rs
      - crates/xtask/src/mirrored/**
      - crates/xtask/src/netboot_iso.rs
      - crates/xtask/src/netboot_iso/**
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions: {}

# One group per branch, a newer run cancelling the older: on main, only the newest commit's run
# says whether network install works (a push, the nightly run and a dispatch share the group); by
# hand on a pull request's branch, a newer dispatch replaces the older.
concurrency:
  group: net-install-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts only bloat a cached target directory.
  CARGO_INCREMENTAL: 0

jobs:
  # Network install end to end, x86-64 (docs/design/network-install.md section 11): a QEMU guest
  # with OVMF UEFI firmware under KVM, on a Linux bridge with no route out, installed by the real
  # pxe from a boot set this job fetched by pinned URL (`pxe update-hook prepare` checks
  # its size and SHA-256 against the pins), with this commit's deb; it enrolls with the real
  # coordinator on its LAN listener, is approved, gets the fixture service, boots its disk in
  # router mode, is reinstalled, and once retired and the coordinator restarted is not installed
  # again in either mode. QEMU and the firmware are Ubuntu's packages, pinned by version and
  # SHA-256 in .github/debs/qemu-x86.toml: the dpkg step is the job's only other use of sudo,
  # which the workflow lint allows in the two network-install jobs only, for each job's own set.
  net-install:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # A bound on the whole job, against a guest that hangs; no test depends on it.
    timeout-minutes: 150
    env:
      GH_VERSION: 2.102.1
      GH_SHA256: 77b9e297e94c50336823d0f84de7ef1be60cba704601fa0d98f129f47a94987b
      NFPM_VERSION: 2.48.0
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
      # The version the job's deb and netboot.json carry: a name of this run's own build.
      NET_INSTALL_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The guest runs under KVM: a runner without it is a setup failure, not a test to skip.
      - name: Fail unless the runner has KVM (/dev/kvm is a character device)
        run: test -c /dev/kvm
      - name: The free disk space, for the log
        run: df -h
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # The pinned packages of qemu-x86 (.github/debs/qemu-x86.toml): restored from the actions
      # cache, or fetched from the pinned mirrors in turn when the cache missed, checked against
      # their SHA-256 either way (cargo xtask debs), saved on a miss, and installed with dpkg.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: qemu-debs
        with:
          path: ${{ runner.temp }}/debs/qemu-x86
          key: debs-qemu-x86-${{ runner.arch }}-${{ hashFiles('.github/debs/qemu-x86.toml') }}
      - name: Check the pinned packages of qemu-x86, fetching them from the mirrors on a cache miss
        run: cargo xtask debs --pins .github/debs/qemu-x86.toml --dir "$RUNNER_TEMP/debs/qemu-x86"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ steps.qemu-debs.outputs.cache-hit != 'true' }}
        with:
          path: ${{ runner.temp }}/debs/qemu-x86
          key: ${{ steps.qemu-debs.outputs.cache-primary-key }}
      - name: Install QEMU and the OVMF firmware
        run: sudo dpkg --install "$RUNNER_TEMP"/debs/qemu-x86/*.deb
      - run: qemu-system-x86_64 --version
      # The deb of this commit, built as artifacts.yml builds it: the static (musl) release
      # programs, the pinned gh and the Sigstore trusted root staged, then nfpm.
      - name: Restore the pinned nfpm.tar.gz from the cache
        id: nfpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nfpm.tar.gz
          key: pinned-nfpm-${{ env.NFPM_VERSION }}-${{ env.NFPM_SHA256 }}
      - name: Download nfpm on a cache miss (HTTPS only, redirects included)
        id: nfpm-download
        if: ${{ steps.nfpm-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/nfpm.tar.gz" "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
      - name: Say why the job stops when nfpm.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.nfpm-download.outcome == 'failure' }}
        run: echo "::error::nfpm.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Install nfpm (pinned checksum)
        id: nfpm-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/nfpm.tar.gz" --sha256 "$NFPM_SHA256" --out "$HOME/.cargo/bin/nfpm" --extract tar.gz --member nfpm
      - name: Save the checked nfpm.tar.gz to the cache
        if: ${{ !cancelled() && steps.nfpm-check.outcome == 'success' && steps.nfpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nfpm.tar.gz
          key: ${{ steps.nfpm-cache.outputs.cache-primary-key }}
      # The gh the test checks the boot set's attestations with (pxe update-hook prepare, through the daemon's verifier).
      - name: Restore the pinned gh.tar.gz from the cache
        id: gh-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.tar.gz
          key: pinned-gh-${{ env.GH_VERSION }}-${{ env.GH_SHA256 }}
      - name: Download gh on a cache miss (HTTPS only, redirects included)
        id: gh-download
        if: ${{ steps.gh-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
      - name: Say why the job stops when gh.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.gh-download.outcome == 'failure' }}
        run: echo "::error::gh.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Install gh (pinned checksum)
        id: gh-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/gh.tar.gz" --sha256 "$GH_SHA256" --out target/privileged-tools/gh --extract tar.gz --member "gh_${GH_VERSION}_linux_amd64/bin/gh"
      - name: Save the checked gh.tar.gz to the cache
        if: ${{ !cancelled() && steps.gh-check.outcome == 'success' && steps.gh-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.tar.gz
          key: ${{ steps.gh-cache.outputs.cache-primary-key }}
      - name: The Sigstore trusted root
        run: target/privileged-tools/gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.json"
      - name: Add the static target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build the static hostkeeper
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p hostkeeper --bin hostkeeper
      - name: Stage the static hostkeeper, gh and the trusted root for the deb
        run: cargo xtask release nfpm-stage --arch amd64 --gh-version "$GH_VERSION" --gh-archive "$RUNNER_TEMP/gh.tar.gz" --gh-sha256 "$GH_SHA256" --trusted-root "$RUNNER_TEMP/trusted_root.json" --binaries target/x86_64-unknown-linux-musl/release --out target/nfpm
      - run: mkdir -p target/net-install
      - name: The deb
        env:
          VERSION: ${{ env.NET_INSTALL_VERSION }}
          ARCH: amd64
        run: nfpm package --config packaging/linux/nfpm.yaml --packager deb --target target/net-install
      - name: The boot sets of network install (netboot.json)
        run: cargo xtask release netboot --pins packaging/netboot/pins.toml --version "$NET_INSTALL_VERSION" --dir target/net-install
      # The ISO of the linux-x86_64 boot set, by its pin: from releases.ubuntu.com, or one of
      # two mirrors of it run by others, checked against the pinned size and SHA-256 here and
      # again by pxe update-hook prepare in the test. It has no cache entry of its own (the two
      # ISOs are about 8 GB); target/, which main's cargo cache saves, may hold it from an earlier
      # run, and a file there of the pinned size and SHA-256 is kept.
      - name: Fetch the pinned ISO from its URL or a mirror, and check it
        run: cargo xtask netboot-iso --pins packaging/netboot/pins.toml --platform linux-x86_64 --dir target/net-install --mirror https://mirrors.edge.kernel.org/ubuntu-releases --mirror https://mirrors.mit.edu/ubuntu-releases
      - name: Build the network-install test as the runner's user
        run: cargo test -p hostkeeper-privileged --features privileged --locked --no-run --test net_install
      - name: Run the network-install test as root
        run: cargo test -p hostkeeper-privileged --features privileged --locked --config "target.'cfg(unix)'.runner = 'sudo'" --test net_install -- --test-threads=1 --nocapture
      # The measurement of network install (design section 11, item N11): the guest's first
      # install from power-on to serving, from pxe's log and the files the test kept
      # beside it. The MAC and host id are the test's (tests/net_install.rs); its first install is
      # in proxy mode. As the runner's user, into target/, which root does not own.
      - name: The report of the network install
        run: cargo xtask netinstall-report --mac 52:54:00:4e:10:01 --host-id net-1 --mode proxy --pxe-log target/privileged-artifacts/net_install/hostkeeper-pxe.log --pending target/privileged-artifacts/net_install/pending.json --host target/privileged-artifacts/net_install/host.json > target/netinstall-report.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: net-install-report
          path: target/netinstall-report.md
          if-no-files-found: error
      # The guest's serial console, the logs of pxe, the router's DHCP and the
      # coordinator, and the measurement's inputs, kept by the test whether it passed or failed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: net-install
          path: target/privileged-artifacts
          if-no-files-found: ignore
      # Saved by a run of main, the nightly run included, which is most of this job's runs.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Network install of an arm64 machine, the fallback of section 11: the hosted arm64 runner has
  # no /dev/kvm, so an arm64 guest with the AAVMF firmware runs under TCG on this x86-64 runner,
  # and boots until it fetches its seed: architecture 11 in its DISCOVER, the arm64 shim and
  # GRUB, the arm64 menu of its MAC and a seed naming the arm64 deb. Its boot set's deb is a
  # stand-in the test makes, which nothing fetches before the seed.
  net-install-arm64:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # A bound on the whole job, against a guest that hangs: TCG translates every instruction,
    # and the live system loads the whole ISO into memory before it fetches the seed.
    timeout-minutes: 330
    env:
      GH_VERSION: 2.102.1
      GH_SHA256: 77b9e297e94c50336823d0f84de7ef1be60cba704601fa0d98f129f47a94987b
      NET_INSTALL_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The free disk space, for the log
        run: df -h
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # The pinned packages of qemu-arm (.github/debs/qemu-arm.toml): restored from the actions
      # cache, or fetched from the pinned mirrors in turn when the cache missed, checked against
      # their SHA-256 either way (cargo xtask debs), saved on a miss, and installed with dpkg.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: qemu-debs
        with:
          path: ${{ runner.temp }}/debs/qemu-arm
          key: debs-qemu-arm-${{ runner.arch }}-${{ hashFiles('.github/debs/qemu-arm.toml') }}
      - name: Check the pinned packages of qemu-arm, fetching them from the mirrors on a cache miss
        run: cargo xtask debs --pins .github/debs/qemu-arm.toml --dir "$RUNNER_TEMP/debs/qemu-arm"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ steps.qemu-debs.outputs.cache-hit != 'true' }}
        with:
          path: ${{ runner.temp }}/debs/qemu-arm
          key: ${{ steps.qemu-debs.outputs.cache-primary-key }}
      - name: Install QEMU for arm64 and the AAVMF firmware
        run: sudo dpkg --install "$RUNNER_TEMP"/debs/qemu-arm/*.deb
      - run: qemu-system-aarch64 --version
      - name: Restore the pinned gh.tar.gz from the cache
        id: gh-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.tar.gz
          key: pinned-gh-${{ env.GH_VERSION }}-${{ env.GH_SHA256 }}
      - name: Download gh on a cache miss (HTTPS only, redirects included)
        id: gh-download
        if: ${{ steps.gh-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
      - name: Say why the job stops when gh.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.gh-download.outcome == 'failure' }}
        run: echo "::error::gh.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Install gh (pinned checksum)
        id: gh-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/gh.tar.gz" --sha256 "$GH_SHA256" --out target/privileged-tools/gh --extract tar.gz --member "gh_${GH_VERSION}_linux_amd64/bin/gh"
      - name: Save the checked gh.tar.gz to the cache
        if: ${{ !cancelled() && steps.gh-check.outcome == 'success' && steps.gh-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.tar.gz
          key: ${{ steps.gh-cache.outputs.cache-primary-key }}
      - run: mkdir -p target/net-install
      - name: The boot sets of network install (netboot.json)
        run: cargo xtask release netboot --pins packaging/netboot/pins.toml --version "$NET_INSTALL_VERSION" --dir target/net-install
      # The ISO of the linux-arm64 boot set, by its pin: from cdimage.ubuntu.com, or one of two
      # mirrors of it run by others, checked against the pinned size and SHA-256.
      - name: Fetch the pinned ISO from its URL or a mirror, and check it
        run: cargo xtask netboot-iso --pins packaging/netboot/pins.toml --platform linux-arm64 --dir target/net-install --mirror https://mirror.us.leaseweb.net/ubuntu-cdimage --mirror https://mirror.leaseweb.com/ubuntu-cdimage
      - name: Build the arm64 network-install test as the runner's user
        run: cargo test -p hostkeeper-privileged --features privileged --locked --no-run --test net_install_arm64
      - name: Run the arm64 network-install test as root
        run: cargo test -p hostkeeper-privileged --features privileged --locked --config "target.'cfg(unix)'.runner = 'sudo'" --test net_install_arm64 -- --test-threads=1 --nocapture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: net-install-arm64
          path: target/privileged-artifacts
          if-no-files-found: ignore
      # Saved by a run of main, the nightly run included, which is most of this job's runs.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
