# Temporary: captures the live Sigstore trusted root once, as `gh attestation trusted-root` prints
# it on a hosted runner, so that the next commit can check it in. The next commit removes this file.
name: trusted-root-capture

on:
  push:
    branches: [task/hk-gap-trusted-root-refresh]

permissions: {}

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - run: gh --version
      - run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sha256sum "$RUNNER_TEMP/trusted_root.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-root
          path: ${{ runner.temp }}/trusted_root.json
