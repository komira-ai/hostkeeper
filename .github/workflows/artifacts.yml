# The release files of one commit: for linux-x86_64, linux-arm64 and macos-arm64, the `hostkeeper`
# binary as a tarball with its CycloneDX SBOM and hostkeeper's own package (`.tar.zst` with its
# `.sha256`), and the package of `hello`, the example service of examples/hello, and of its failing
# build (the same package started with `--fail-ready`, which a host can be rolled back from), each
# with its `.sha256`; for each Linux platform the deb and the rpm, and the `hostkeeper-coordinator`
# binary as a tarball with its SBOM and its container image (`.image.tar`, an OCI image layout);
# for macos-arm64 the installer pkg of a Mac's first install; the release indexes `index.json`,
# `hello-index.json` and `hello-fail-ready-index.json` over the three packages each; one SHA256SUMS
# over them; and, on a push to main, the build-provenance and SBOM attestations of this repository
# with a bundle per signed file. A host trusts only packages this workflow attested, so hello's
# packages are signed like hostkeeper's. The names are the release contract
# (docs/deploy/verify-a-release.md, "Every name"):
#
#   hostkeeper-<version>-<platform>.tar.gz          hostkeeper-<version>-<platform>.cdx.json
#   hostkeeper-<version>-<platform>.tar.zst         hostkeeper-<version>-<platform>.tar.zst.sha256
#   hello-<version>-<platform>.tar.zst              hello-<version>-<platform>.tar.zst.sha256
#   hello-<version>-fail-ready-<platform>.tar.zst   hello-<version>-fail-ready-<platform>.tar.zst.sha256
#   hostkeeper_<version>_<deb-arch>.deb             hostkeeper-<version>-1.<rpm-arch>.rpm
#   hostkeeper-coordinator-<version>-<linux-platform>.tar.gz
#   hostkeeper-coordinator-<version>-<linux-platform>.cdx.json
#   hostkeeper-coordinator-<version>-<linux-platform>.image.tar
#   hostkeeper-<version>-macos-arm64.pkg
#   index.json   hello-index.json   hello-fail-ready-index.json   SHA256SUMS
#   <signed file>.sigstore.json
#
# `<version>` is X.Y.Z (`cargo xtask release version`: X.Y from the VERSION file, Z the number of
# first-parent commits of main since the commit that last changed it). Every build job writes it
# into the workspace (`release set-version`) and builds with RELEASE_COMMIT set to the commit, so
# `hostkeeper --version` prints `hostkeeper X.Y.Z+<12 hex>` and `hostkeeper-coordinator
# --version` prints `hostkeeper-coordinator X.Y.Z+<12 hex>`; `release check-binary` refuses a
# binary that prints anything else. `hello` is built from the same workspace, so it carries the
# release version (`hello --version` prints `hello X.Y.Z`); its failing build is named
# `<version>-fail-ready` in its manifest and index.
#
# The image job builds the coordinator's image twice, each time with a new BuildKit builder from
# a context that holds the released binary alone, with the commit time as SOURCE_DATE_EPOCH and
# every timestamp in the image rewritten to it; `release compare-images` refuses the two unless
# they are byte for byte equal, so the released image is one anyone can rebuild from the commit.
# The image is then loaded and run through its entrypoint with --version, which must print the
# coordinator's stamp.
#
# The attest job is in THIS file for one reason: the signer identity of an attestation is the
# workflow file that ran the signing step, and every consumer verifies exactly
# `komira-ai/hostkeeper/.github/workflows/artifacts.yml` on `refs/heads/main`. Do not move or
# rename it. Only `attest` holds `id-token: write` and `attestations: write`, and only under its
# exact `if:` (the workflow lint, crates/xtask/tests/workflows, holds both). While it holds them
# no repository code runs and nothing is built: it runs pinned actions, two `sha256sum --check`
# and a `cp` per bundle. The files reach it through the run's artifact store, where a job that ran
# repository code could have replaced them, so it first refuses sums other than the ones the sums
# job published (their digest is a job output) and then files that differ from the sums.
#
# No pull request runs this workflow (AGENTS.md B9: a pull request runs only build and unit tests
# with coverage, and never a macOS job). A push to main builds, sums, signs and checks what it signed (`verify`); a run
# by hand on a branch builds and sums and signs nothing. release.yml starts when a push run of
# this workflow on main completes, and publishes these files once `ci` and `privileged` have
# passed on the same commit.
name: artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A run per commit: two runs for one commit (a re-run) queue behind each other, and different
# commits do not wait for each other; a signing run is never cancelled. This workflow builds and
# attests and never tags or publishes, so it is outside the release group of release.yml (the
# workflow lint lists it as exempt and holds it to this group).
concurrency:
  group: artifacts-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # cargo-cyclonedx makes the SBOMs, nfpm the deb and the rpm: release binaries, checked
  # against their published SHA-256 by `cargo xtask install-tool` before use (the digest of
  # each platform's archive is in the build job's matrix).
  CYCLONEDX_VERSION: 0.5.9
  NFPM_VERSION: 2.48.0
  # The gh the deb and the rpm install as /usr/lib/hostkeeper/gh, the one a host checks every
  # package's attestation with (Ubuntu 24.04's own gh has no `gh attestation`). The SHA-256 of
  # each architecture's release archive is in the build job's matrix (`gh-sha256`), the one
  # cli/cli publishes in gh_<version>_checksums.txt; to bump it, change the version here and
  # both digests together (docs/deploy/verify-a-release.md, "What the deb and the rpm check
  # packages with").
  GH_VERSION: 2.102.1
  # The BuildKit the image job builds with, by the digest of its multi-platform index.
  BUILDKIT_IMAGE: moby/buildkit:v0.25.2@sha256:0f63d66f8d2de0bd16438284831a3e9ee6ca7cd57b6eb3ed6e38a7a456590fa7

defaults:
  run:
    shell: bash

jobs:
  # The one computation of the version every build gives the binary. It reads the first-parent
  # history, so the checkout is whole (a shallow one is refused, not counted).
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - name: The version of this commit
        id: version
        run: cargo xtask release version --commit "$GITHUB_SHA" --version-file VERSION --output "$GITHUB_OUTPUT"


  # One job per Linux platform, each on a GitHub-hosted runner of its own architecture, so each
  # binary runs where it is built. glibc: the binary needs the glibc of the runner image it was
  # built on (Ubuntu 24.04) or newer.
  build:
    name: ${{ matrix.platform }}
    needs: [version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
            deb-arch: amd64
            rpm-arch: x86_64
            cyclonedx-sha256: fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8
            nfpm-archive: Linux_x86_64
            nfpm-sha256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
            gh-sha256: 77b9e297e94c50336823d0f84de7ef1be60cba704601fa0d98f129f47a94987b
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            deb-arch: arm64
            rpm-arch: aarch64
            cyclonedx-sha256: 7bf131ca5389b07a4f10c182bcf8a5ad339d64408b6f0d8f6834a0bd6120a06a
            nfpm-archive: Linux_arm64
            nfpm-sha256: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4
            gh-sha256: 5019b3cc6e8a03bb4d88600f8dbda2add8e6407705c159b0c63151036e77a1af
    env:
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.rust-target }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - name: Download cargo-cyclonedx (HTTPS only, redirects included)
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --silent --show-error --location --output "$RUNNER_TEMP/cyclonedx.tar.xz" "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz"
      # install-tool unpacks gzip tars only: it checks the xz archive and copies it, and tar
      # unpacks the checked copy.
      - name: Check cargo-cyclonedx (pinned checksum)
        env:
          SHA256: ${{ matrix.cyclonedx-sha256 }}
        run: cargo xtask install-tool --download "$RUNNER_TEMP/cyclonedx.tar.xz" --sha256 "$SHA256" --out "$RUNNER_TEMP/cyclonedx-checked.tar.xz"
      - name: Install cargo-cyclonedx
        run: tar -xJf "$RUNNER_TEMP/cyclonedx-checked.tar.xz" -C "$HOME/.cargo/bin" --strip-components 1 "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
      - run: cargo cyclonedx --version
      - name: Download nfpm (HTTPS only, redirects included)
        env:
          ARCHIVE: ${{ matrix.nfpm-archive }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --silent --show-error --location --output "$RUNNER_TEMP/nfpm.tar.gz" "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_$ARCHIVE.tar.gz"
      - name: Install nfpm (pinned checksum)
        env:
          SHA256: ${{ matrix.nfpm-sha256 }}
        run: cargo xtask install-tool --download "$RUNNER_TEMP/nfpm.tar.gz" --sha256 "$SHA256" --out "$HOME/.cargo/bin/nfpm" --extract tar.gz --member nfpm
      - run: nfpm --version
      # The workspace's version is the release's; `Cargo.lock` gets it too, so the `--locked`
      # build accepts it. The SBOM step must leave the lock file exactly as written here.
      - name: The workspace takes the version of the release
        run: cargo xtask release set-version --version "$RELEASE_VERSION"
      - name: Keep the lock file as written
        run: cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
      # RELEASE_COMMIT is a build input of the binaries (crates/hostkeeper-daemon/src/stamp.rs,
      # crates/hostkeeper-coordinator/src/stamp.rs), not configuration they read when they run.
      - name: Build hostkeeper and hostkeeper-coordinator
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release -p hostkeeper --bin hostkeeper -p hostkeeper-coordinator --bin hostkeeper-coordinator
      # hello takes its version from the workspace, so it needs no RELEASE_COMMIT.
      - name: Build hello
        run: cargo build --locked --release -p hello --bin hello
      - name: hostkeeper says the version and the commit
        run: cargo xtask release check-binary target/release/hostkeeper "$RELEASE_VERSION" "$GITHUB_SHA"
      - name: hostkeeper-coordinator says the version and the commit
        run: cargo xtask release check-binary target/release/hostkeeper-coordinator "$RELEASE_VERSION" "$GITHUB_SHA"
      - name: SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$TARGET"
      - name: The SBOM step left Cargo.lock unchanged
        run: cmp Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
      - run: mkdir dist
      - name: Name the SBOM of hostkeeper
        run: cp crates/hostkeeper/hostkeeper_bin.cdx.json "dist/hostkeeper-$RELEASE_VERSION-$PLATFORM.cdx.json"
      - name: Name the SBOM of hostkeeper-coordinator
        run: cp crates/hostkeeper-coordinator/hostkeeper-coordinator_bin.cdx.json "dist/hostkeeper-coordinator-$RELEASE_VERSION-$PLATFORM.cdx.json"
      # The commit time is the one time the tarball holds, so its bytes depend on its inputs.
      - name: The commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Tarball of hostkeeper
        run: tar --sort=name --owner=0 --group=0 --numeric-owner --mode=0555 --mtime="@$SOURCE_DATE_EPOCH" -C target/release -cf - hostkeeper | gzip -n > "dist/hostkeeper-$RELEASE_VERSION-$PLATFORM.tar.gz"
      - name: Tarball of hostkeeper-coordinator
        run: tar --sort=name --owner=0 --group=0 --numeric-owner --mode=0555 --mtime="@$SOURCE_DATE_EPOCH" -C target/release -cf - hostkeeper-coordinator | gzip -n > "dist/hostkeeper-coordinator-$RELEASE_VERSION-$PLATFORM.tar.gz"
      # The pinned gh of this architecture, checked against its pin and installed for this job,
      # and the Sigstore trusted root as it prints it. `gh attestation trusted-root` fetches the
      # roots of the Sigstore public-good instance and of GitHub's instance through their TUF
      # repositories, verified from the TUF root gh embeds; it needs no token. The packages
      # carry the root of their build, so each release carries a fresh one.
      - name: Download gh (HTTPS only, redirects included)
        env:
          ARCH: ${{ matrix.deb-arch }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --silent --show-error --location --output "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_$ARCH.tar.gz"
      - name: Install gh (pinned checksum)
        env:
          ARCH: ${{ matrix.deb-arch }}
          SHA256: ${{ matrix.gh-sha256 }}
        run: cargo xtask install-tool --download "$RUNNER_TEMP/gh.tar.gz" --sha256 "$SHA256" --out "$RUNNER_TEMP/gh/gh" --extract tar.gz --member "gh_${GH_VERSION}_linux_$ARCH/bin/gh"
      - run: '"$RUNNER_TEMP/gh/gh" --version'
      - name: The Sigstore trusted root
        run: '"$RUNNER_TEMP/gh/gh" attestation trusted-root > "$RUNNER_TEMP/trusted_root.json"'
      # The packages' gh and trusted root, where nfpm.yaml takes them from: gh out of the same
      # archive, checked against the pin again, refused unless it is a program of this
      # architecture; the trusted root refused unless every line of it is one.
      - name: Stage gh and the trusted root for the deb and the rpm
        env:
          ARCH: ${{ matrix.deb-arch }}
          SHA256: ${{ matrix.gh-sha256 }}
        run: cargo xtask release nfpm-stage --arch "$ARCH" --gh-version "$GH_VERSION" --gh-archive "$RUNNER_TEMP/gh.tar.gz" --gh-sha256 "$SHA256" --trusted-root "$RUNNER_TEMP/trusted_root.json" --out target/nfpm
      # nfpm reads VERSION and ARCH into packaging/linux/nfpm.yaml and names the files
      # hostkeeper_<version>_<deb-arch>.deb and hostkeeper-<version>-1.<rpm-arch>.rpm.
      - name: The deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.deb-arch }}
        run: nfpm package --config packaging/linux/nfpm.yaml --packager deb --target dist
      - name: The rpm
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.deb-arch }}
        run: nfpm package --config packaging/linux/nfpm.yaml --packager rpm --target dist
      # Each package read back: it installs the staged gh and trusted root at the daemon's paths,
      # 0755 and 0644, root's, with the staged bytes.
      - name: The deb installs the staged gh and trusted root
        env:
          ARCH: ${{ matrix.deb-arch }}
        run: cargo xtask release check-linux-pkg "dist/hostkeeper_${RELEASE_VERSION}_$ARCH.deb" --staged target/nfpm
      - name: The rpm installs the staged gh and trusted root
        env:
          RPM_ARCH: ${{ matrix.rpm-arch }}
        run: cargo xtask release check-linux-pkg "dist/hostkeeper-$RELEASE_VERSION-1.$RPM_ARCH.rpm" --staged target/nfpm
      # The package's unit starts the package's own binary, through the `current` link of the
      # package layout (packaging/linux/package/hostkeeper.service).
      - name: hostkeeper's own package and its SHA-256
        run: cargo xtask release package --platform "$PLATFORM" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --binary target/release/hostkeeper --unit packaging/linux/package/hostkeeper.service --out dist
      - name: hello's package and its SHA-256
        run: cargo xtask release package --service hello --platform "$PLATFORM" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --binary target/release/hello --out dist
      # The same binary and units, started with --fail-ready: a build whose verify fails, so that
      # a host can be rolled back from it. It is released and attested like the others.
      - name: hello's failing build and its SHA-256
        run: cargo xtask release package --service hello --fail-ready --platform "$PLATFORM" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --binary target/release/hello --out dist
      # The tarballs as a host takes them: unpacked with this runner's tar, the binary in each says
      # the version and the commit, as the built one did.
      - run: mkdir "$RUNNER_TEMP/unpacked"
      - run: tar -xzf "dist/hostkeeper-$RELEASE_VERSION-$PLATFORM.tar.gz" -C "$RUNNER_TEMP/unpacked" hostkeeper
      - name: The packaged hostkeeper says the version and the commit
        run: cargo xtask release check-binary "$RUNNER_TEMP/unpacked/hostkeeper" "$RELEASE_VERSION" "$GITHUB_SHA"
      - run: tar -xzf "dist/hostkeeper-coordinator-$RELEASE_VERSION-$PLATFORM.tar.gz" -C "$RUNNER_TEMP/unpacked" hostkeeper-coordinator
      - name: The packaged hostkeeper-coordinator says the version and the commit
        run: cargo xtask release check-binary "$RUNNER_TEMP/unpacked/hostkeeper-coordinator" "$RELEASE_VERSION" "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-${{ matrix.platform }}
          path: dist/
          retention-days: 90
          if-no-files-found: error

  # macos-arm64 on a GitHub-hosted Apple silicon runner, so the binary runs where it is built: the
  # binary tarball, its SBOM and hostkeeper's own package as for Linux (the package has no unit:
  # the daemon's launchd job is the plist of the installer), hello's two packages (their units
  # are the plists of its two slots), and the installer pkg of a Mac's first
  # install, read back from the built pkg and checked here. No deb, rpm or coordinator on macOS.
  # The pkg is not signed (that needs an Apple Developer ID Installer identity); it is attested
  # with every other file. The runner's `gtar` is GNU tar, so the tarball is made as on Linux.
  build-macos:
    name: macos-arm64
    needs: [version]
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PLATFORM: macos-arm64
      TARGET: aarch64-apple-darwin
      CYCLONEDX_SHA256: 4c53dfa21e70b65bf7f8d2592aadde3bcb02c1a40b6ec63b877e5ca65a29e180
      # The gh the installer pkg installs at /usr/local/lib/hostkeeper/gh: the release archive
      # gh_<version>_macOS_arm64.zip of cli/cli and its SHA-256 (gh's own checksums file lists it).
      GH_VERSION: 2.103.3
      GH_SHA256: d700207eae9ae98fe2b89535c2c087c07823d4628c56364695a5a07ef311c062
      # The SHA-256 of what that gh's `gh attestation trusted-root` prints (the Sigstore public-good
      # and GitHub trusted roots, one compact JSON line each), which the pkg installs at
      # /usr/local/lib/hostkeeper/trusted_root.json. When either root changes, the check below
      # fails until this pin is moved by a pull request.
      TRUSTED_ROOT_SHA256: 65ca537f6ed8a47fd0e560c421baa1f6c1efb8b25fc200d8c5c02c0e92eb2b9c
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - name: Download cargo-cyclonedx (HTTPS only, redirects included)
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --silent --show-error --location --output "$RUNNER_TEMP/cyclonedx.tar.xz" "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz"
      - name: Check cargo-cyclonedx (pinned checksum)
        run: cargo xtask install-tool --download "$RUNNER_TEMP/cyclonedx.tar.xz" --sha256 "$CYCLONEDX_SHA256" --out "$RUNNER_TEMP/cyclonedx-checked.tar.xz"
      # The macOS image keeps cargo outside $HOME/.cargo/bin, so the tool goes into a directory of
      # its own on the PATH.
      - run: mkdir "$RUNNER_TEMP/bin"
      - name: Install cargo-cyclonedx
        run: tar -xJf "$RUNNER_TEMP/cyclonedx-checked.tar.xz" -C "$RUNNER_TEMP/bin" --strip-components 1 "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
      - name: Put the tool directory on the PATH
        run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: cargo cyclonedx --version
      - run: gtar --version
      - name: The workspace takes the version of the release
        run: cargo xtask release set-version --version "$RELEASE_VERSION"
      - name: Keep the lock file as written
        run: cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
      - name: Build hostkeeper
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release -p hostkeeper --bin hostkeeper
      # hello takes its version from the workspace, so it needs no RELEASE_COMMIT.
      - name: Build hello
        run: cargo build --locked --release -p hello --bin hello
      - name: hostkeeper says the version and the commit
        run: cargo xtask release check-binary target/release/hostkeeper "$RELEASE_VERSION" "$GITHUB_SHA"
      # The macOS unpack refuses a Mach-O without a valid code signature of its own bytes; the
      # linker signs the binary ad hoc, and this checks it as the unpack does.
      - name: hostkeeper has a valid code signature
        run: codesign --verify --strict --verbose=2 target/release/hostkeeper
      # hello is a Mach-O in a macOS package too, so it is held to the same signature.
      - name: hello has a valid code signature
        run: codesign --verify --strict --verbose=2 target/release/hello
      - name: SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$TARGET"
      - name: The SBOM step left Cargo.lock unchanged
        run: cmp Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
      - run: mkdir dist
      - name: Name the SBOM
        run: cp crates/hostkeeper/hostkeeper_bin.cdx.json "dist/hostkeeper-$RELEASE_VERSION-$PLATFORM.cdx.json"
      - name: The commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Tarball of the binary
        run: gtar --sort=name --owner=0 --group=0 --numeric-owner --mode=0555 --mtime="@$SOURCE_DATE_EPOCH" -C target/release -cf - hostkeeper | gzip -n > "dist/hostkeeper-$RELEASE_VERSION-$PLATFORM.tar.gz"
      - name: hostkeeper's own package and its SHA-256
        run: cargo xtask release package --platform "$PLATFORM" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --binary target/release/hostkeeper --out dist
      - name: hello's package and its SHA-256
        run: cargo xtask release package --service hello --platform "$PLATFORM" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --binary target/release/hello --out dist
      # The same binary and plists, started with --fail-ready (see the Linux build job).
      - name: hello's failing build and its SHA-256
        run: cargo xtask release package --service hello --fail-ready --platform "$PLATFORM" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --binary target/release/hello --out dist
      - name: Download gh (HTTPS only, redirects included)
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --silent --show-error --location --output "$RUNNER_TEMP/gh.zip" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_macOS_arm64.zip"
      - name: Check gh (pinned checksum)
        run: cargo xtask install-tool --download "$RUNNER_TEMP/gh.zip" --sha256 "$GH_SHA256" --out "$RUNNER_TEMP/gh-checked.zip"
      - name: Unpack gh
        run: unzip -j -q "$RUNNER_TEMP/gh-checked.zip" "gh_${GH_VERSION}_macOS_arm64/bin/gh" -d "$RUNNER_TEMP/gh-pinned"
      # gh fetches both roots through TUF and checks their signatures; no token is needed.
      - name: The Sigstore trusted root, as the pinned gh prints it
        run: '"$RUNNER_TEMP/gh-pinned/gh" attestation trusted-root > "$RUNNER_TEMP/trusted_root.download"'
      - name: Check the trusted root (pinned checksum)
        run: cargo xtask install-tool --download "$RUNNER_TEMP/trusted_root.download" --sha256 "$TRUSTED_ROOT_SHA256" --out "$RUNNER_TEMP/trusted_root.json"
      - name: The installer pkg
        run: cargo xtask release macos-pkg --version "$RELEASE_VERSION" --binary target/release/hostkeeper --gh "$RUNNER_TEMP/gh-pinned/gh" --trusted-root "$RUNNER_TEMP/trusted_root.json" --stage "$RUNNER_TEMP/pkg-root" --out dist
      # Read back from the built pkg: its payload holds exactly the binary, the daemon's plist,
      # the log directory and the newsyslog file, gh and the trusted root, with their paths, modes,
      # owners and bytes, the plist names the daemon's label and output files, the newsyslog file
      # rotates exactly those files, and the pkg has no scripts.
      - name: Expand the installer pkg
        run: pkgutil --expand "dist/hostkeeper-$RELEASE_VERSION-$PLATFORM.pkg" "$RUNNER_TEMP/pkg-expanded"
      - name: The installer pkg installs exactly the binary, the plist, the log directory and its newsyslog file, gh and the trusted root
        run: cargo xtask release check-macos-pkg "$RUNNER_TEMP/pkg-expanded" --version "$RELEASE_VERSION" --binary target/release/hostkeeper --gh "$RUNNER_TEMP/gh-pinned/gh" --trusted-root "$RUNNER_TEMP/trusted_root.json"
      - run: mkdir "$RUNNER_TEMP/unpacked"
      - run: tar -xzf "dist/hostkeeper-$RELEASE_VERSION-$PLATFORM.tar.gz" -C "$RUNNER_TEMP/unpacked" hostkeeper
      - name: The packaged hostkeeper says the version and the commit
        run: cargo xtask release check-binary "$RUNNER_TEMP/unpacked/hostkeeper" "$RELEASE_VERSION" "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-${{ env.PLATFORM }}
          path: dist/
          retention-days: 90
          if-no-files-found: error

  # The coordinator's image, per platform on a runner of that architecture, from the binary of
  # the coordinator tarball the build job released: built twice, each time by a new builder from
  # a context holding that binary alone, and released only when the two are byte for byte equal.
  # Each build has a docker-container builder of the pinned BuildKit image, whose `docker`
  # exporter writes a tarball that is an OCI image layout (`oci-layout`, `index.json`, `blobs/`,
  # what compare-images reads) and also holds the `manifest.json` that `docker load` reads, named
  # hostkeeper-coordinator:<version>. The image is the artifact `assets-image-<platform>`, which the
  # jobs after this one take with the build jobs' `assets-*`.
  image:
    name: image ${{ matrix.platform }}
    needs: [version, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            oci-platform: linux/amd64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            oci-platform: linux/arm64
    env:
      PLATFORM: ${{ matrix.platform }}
      OCI_PLATFORM: ${{ matrix.oci-platform }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assets-${{ matrix.platform }}
          path: built
      # The commit time is the one time the image holds: its layers, its config and the files of
      # the tarball are all stamped with it.
      - name: The commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - run: mkdir "$RUNNER_TEMP/context-a" "$RUNNER_TEMP/context-b" dist
      - name: The first context, the released coordinator alone
        run: tar -xzf "built/hostkeeper-coordinator-$RELEASE_VERSION-$PLATFORM.tar.gz" -C "$RUNNER_TEMP/context-a" hostkeeper-coordinator
      - name: The second context, the released coordinator alone
        run: tar -xzf "built/hostkeeper-coordinator-$RELEASE_VERSION-$PLATFORM.tar.gz" -C "$RUNNER_TEMP/context-b" hostkeeper-coordinator
      - name: The first builder
        run: docker buildx create --name image-a --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --bootstrap
      - name: The first build
        run: docker buildx build --builder image-a --no-cache --platform "$OCI_PLATFORM" --provenance=false --sbom=false --file packaging/container/Dockerfile --output "type=docker,name=hostkeeper-coordinator:$RELEASE_VERSION,dest=$RUNNER_TEMP/image-a.tar,rewrite-timestamp=true" "$RUNNER_TEMP/context-a"
      - name: The second builder
        run: docker buildx create --name image-b --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --bootstrap
      - name: The second build
        run: docker buildx build --builder image-b --no-cache --platform "$OCI_PLATFORM" --provenance=false --sbom=false --file packaging/container/Dockerfile --output "type=docker,name=hostkeeper-coordinator:$RELEASE_VERSION,dest=$RUNNER_TEMP/image-b.tar,rewrite-timestamp=true" "$RUNNER_TEMP/context-b"
      - name: The two builds are byte for byte equal
        run: cargo xtask release compare-images "$RUNNER_TEMP/image-a.tar" "$RUNNER_TEMP/image-b.tar"
      # The image as a deployment starts it: loaded into the runner's docker and run through its
      # own entrypoint, with --version as its only argument, it exits 0 and prints exactly the
      # coordinator's stamp of this version and commit.
      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/image-a.tar"
      - name: The image's entrypoint says the version and the commit
        run: test "$(docker run --rm "hostkeeper-coordinator:$RELEASE_VERSION" --version)" = "hostkeeper-coordinator $RELEASE_VERSION+${GITHUB_SHA:0:12}"
      - name: Name the image
        run: cp "$RUNNER_TEMP/image-a.tar" "dist/hostkeeper-coordinator-$RELEASE_VERSION-$PLATFORM.image.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-image-${{ matrix.platform }}
          path: dist/
          retention-days: 90
          if-no-files-found: error

  # index.json over the packages of both platforms, then SHA256SUMS over every file but itself
  # (the bundles come later, from attest). The attest job signs these sums, so they are the one
  # list of what a release holds.
  sums:
    needs: [version, build, build-macos, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # `assets-*` is the build jobs' artifacts and the image job's (`assets-image-*`), one each
      # per platform; the run's other artifacts are `sha256sums` and `bundles`.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
      - name: The release index
        run: cargo xtask release index --version "$RELEASE_VERSION" --dir dist
      - name: The release index of hello
        run: cargo xtask release index --service hello --version "$RELEASE_VERSION" --dir dist
      - name: The release index of hello's failing build
        run: cargo xtask release index --service hello --fail-ready --version "$RELEASE_VERSION" --dir dist
      # In the C locale, so the lines are in the byte order of the names; written outside dist,
      # so that SHA256SUMS does not list itself.
      - name: SHA256SUMS
        working-directory: dist
        env:
          LC_ALL: C
        run: sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
      - run: mv "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS
      - name: The digest of SHA256SUMS, for attest
        id: digest
        run: echo "sha256=$(sha256sum dist/SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256sums
          path: |
            dist/SHA256SUMS
            dist/index.json
            dist/hello-index.json
            dist/hello-fail-ready-index.json
          retention-days: 90
          if-no-files-found: error

  # Push to main only: build provenance for every summed file, an SBOM attestation for each
  # binary tarball, and a provenance attestation of each attested file alone (each binary
  # tarball, package, deb, rpm and image), whose bundle is copied beside it as
  # `<file>.sigstore.json` for a host that verifies without GitHub.
  attest:
    needs: [version, sums]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: dist
      - name: Refuse sums other than the build's
        env:
          SUMS_SHA256: ${{ needs.sums.outputs.sha256 }}
        run: /usr/bin/sha256sum --check --strict <<< "$SUMS_SHA256  dist/SHA256SUMS"
      - name: Refuse listed files that differ from the sums
        working-directory: dist
        run: /usr/bin/sha256sum --check --strict SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
          sbom-path: dist/hostkeeper-${{ needs.version.outputs.version }}-linux-x86_64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/hostkeeper-coordinator-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
          sbom-path: dist/hostkeeper-coordinator-${{ needs.version.outputs.version }}-linux-x86_64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-linux-arm64.tar.gz
          sbom-path: dist/hostkeeper-${{ needs.version.outputs.version }}-linux-arm64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/hostkeeper-coordinator-${{ needs.version.outputs.version }}-linux-arm64.tar.gz
          sbom-path: dist/hostkeeper-coordinator-${{ needs.version.outputs.version }}-linux-arm64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-macos-arm64.tar.gz
          sbom-path: dist/hostkeeper-${{ needs.version.outputs.version }}-macos-arm64.cdx.json
      - id: tarball-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
      - name: Name the bundle of the tarball of hostkeeper for linux-x86_64
        env:
          BUNDLE: ${{ steps.tarball-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-${V}-linux-x86_64.tar.gz.sigstore.json"
      - id: coordinator-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-coordinator-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
      - name: Name the bundle of the tarball of hostkeeper-coordinator for linux-x86_64
        env:
          BUNDLE: ${{ steps.coordinator-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-coordinator-${V}-linux-x86_64.tar.gz.sigstore.json"
      - id: package-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-linux-x86_64.tar.zst
      - name: Name the bundle of the package for linux-x86_64
        env:
          BUNDLE: ${{ steps.package-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-${V}-linux-x86_64.tar.zst.sigstore.json"
      - id: hello-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hello-${{ needs.version.outputs.version }}-linux-x86_64.tar.zst
      - name: Name the bundle of the hello package for linux-x86_64
        env:
          BUNDLE: ${{ steps.hello-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hello-${V}-linux-x86_64.tar.zst.sigstore.json"
      - id: hello-fail-ready-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hello-${{ needs.version.outputs.version }}-fail-ready-linux-x86_64.tar.zst
      - name: Name the bundle of the failing build of hello for linux-x86_64
        env:
          BUNDLE: ${{ steps.hello-fail-ready-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hello-${V}-fail-ready-linux-x86_64.tar.zst.sigstore.json"
      - id: deb-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper_${{ needs.version.outputs.version }}_amd64.deb
      - name: Name the bundle of the deb for linux-x86_64
        env:
          BUNDLE: ${{ steps.deb-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper_${V}_amd64.deb.sigstore.json"
      - id: rpm-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-1.x86_64.rpm
      - name: Name the bundle of the rpm for linux-x86_64
        env:
          BUNDLE: ${{ steps.rpm-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-${V}-1.x86_64.rpm.sigstore.json"
      - id: image-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-coordinator-${{ needs.version.outputs.version }}-linux-x86_64.image.tar
      - name: Name the bundle of the image for linux-x86_64
        env:
          BUNDLE: ${{ steps.image-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-coordinator-${V}-linux-x86_64.image.tar.sigstore.json"
      - id: tarball-linux-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-linux-arm64.tar.gz
      - name: Name the bundle of the tarball of hostkeeper for linux-arm64
        env:
          BUNDLE: ${{ steps.tarball-linux-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-${V}-linux-arm64.tar.gz.sigstore.json"
      - id: coordinator-linux-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-coordinator-${{ needs.version.outputs.version }}-linux-arm64.tar.gz
      - name: Name the bundle of the tarball of hostkeeper-coordinator for linux-arm64
        env:
          BUNDLE: ${{ steps.coordinator-linux-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-coordinator-${V}-linux-arm64.tar.gz.sigstore.json"
      - id: package-linux-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-linux-arm64.tar.zst
      - name: Name the bundle of the package for linux-arm64
        env:
          BUNDLE: ${{ steps.package-linux-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-${V}-linux-arm64.tar.zst.sigstore.json"
      - id: hello-linux-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hello-${{ needs.version.outputs.version }}-linux-arm64.tar.zst
      - name: Name the bundle of the hello package for linux-arm64
        env:
          BUNDLE: ${{ steps.hello-linux-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hello-${V}-linux-arm64.tar.zst.sigstore.json"
      - id: hello-fail-ready-linux-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hello-${{ needs.version.outputs.version }}-fail-ready-linux-arm64.tar.zst
      - name: Name the bundle of the failing build of hello for linux-arm64
        env:
          BUNDLE: ${{ steps.hello-fail-ready-linux-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hello-${V}-fail-ready-linux-arm64.tar.zst.sigstore.json"
      - id: deb-linux-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper_${{ needs.version.outputs.version }}_arm64.deb
      - name: Name the bundle of the deb for linux-arm64
        env:
          BUNDLE: ${{ steps.deb-linux-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper_${V}_arm64.deb.sigstore.json"
      - id: rpm-linux-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-1.aarch64.rpm
      - name: Name the bundle of the rpm for linux-arm64
        env:
          BUNDLE: ${{ steps.rpm-linux-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-${V}-1.aarch64.rpm.sigstore.json"
      - id: image-linux-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-coordinator-${{ needs.version.outputs.version }}-linux-arm64.image.tar
      - name: Name the bundle of the image for linux-arm64
        env:
          BUNDLE: ${{ steps.image-linux-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-coordinator-${V}-linux-arm64.image.tar.sigstore.json"
      - id: tarball-macos-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-macos-arm64.tar.gz
      - name: Name the bundle of the tarball for macos-arm64
        env:
          BUNDLE: ${{ steps.tarball-macos-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-${V}-macos-arm64.tar.gz.sigstore.json"
      - id: package-macos-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-macos-arm64.tar.zst
      - name: Name the bundle of the package for macos-arm64
        env:
          BUNDLE: ${{ steps.package-macos-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-${V}-macos-arm64.tar.zst.sigstore.json"
      - id: hello-macos-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hello-${{ needs.version.outputs.version }}-macos-arm64.tar.zst
      - name: Name the bundle of the hello package for macos-arm64
        env:
          BUNDLE: ${{ steps.hello-macos-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hello-${V}-macos-arm64.tar.zst.sigstore.json"
      - id: hello-fail-ready-macos-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hello-${{ needs.version.outputs.version }}-fail-ready-macos-arm64.tar.zst
      - name: Name the bundle of the failing build of hello for macos-arm64
        env:
          BUNDLE: ${{ steps.hello-fail-ready-macos-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hello-${V}-fail-ready-macos-arm64.tar.zst.sigstore.json"
      - id: pkg-macos-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-macos-arm64.pkg
      - name: Name the bundle of the installer pkg for macos-arm64
        env:
          BUNDLE: ${{ steps.pkg-macos-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-${V}-macos-arm64.pkg.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles
          path: dist/*.sigstore.json
          retention-days: 90
          if-no-files-found: error

  # Push to main only, after attest, with read-only scopes: the checks a consumer makes
  # (docs/deploy/verify-a-release.md). `release check` holds the files to the release's asset
  # names and to SHA256SUMS, and verifies each attestation online and from its bundle against
  # the signer workflow, the ref refs/heads/main and this commit.
  verify:
    needs: [version, attest]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # xtask is compiled before any step holds the token.
      - name: Compile xtask
        run: cargo xtask --help
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles
          path: dist
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Verify every file and attestation as a consumer does
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release check dist --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
