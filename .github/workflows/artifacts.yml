# The release files of one commit: for linux-x86_64, linux-arm64 and macos-arm64, the `hostkeeper`
# binary as a tarball with its CycloneDX SBOM and hostkeeper's own package (`.tar.zst` with its
# `.sha256`), and the package of `hello`, the example service of examples/hello, and of its failing
# build (the same package started with `--fail-ready`, which a host can be rolled back from), each
# with its `.sha256`; for each Linux platform the deb and the rpm, the `hostkeeper-coordinator`
# binary as a tarball with its SBOM, its container image (`.image.tar`, an OCI image layout) and
# its deb and rpm (packaging/coordinator/nfpm.yaml, the static build with a systemd unit),
# and the `hostkeeper-mdm` binary (the MDM kit's, Linux-only) as a tarball with its SBOM;
# for linux-x86_64 the package of `mdm`, the MDM server stack as a service package
# (docs/design/two-programs.md section 6.2), whose pinned tools are fetched and checked against
# crates/hostkeeper-mdm-core/pins.txt here (`cargo xtask release mdm-fetch`), with its `.sha256`;
# for macos-arm64 the installer pkg of a Mac's first install and hello's .pkg, each signed on a
# push to main with the Developer ID Installer identity (sign-pkg, then check-pkg); the release
# indexes `index.json`, `hello-index.json` and `hello-fail-ready-index.json` over the three
# packages each, and
# `mdm-index.json` over the one mdm package; the coordinator's image index over its two images
# (`cargo xtask release image-index`), whose SHA-256 is the digest release.yml pushes the
# multi-platform image under;
# `netboot.json`, the boot sets of network install for both Linux platforms, rendered from
# packaging/netboot/pins.toml; `hkctl-<version>`, the command line of the coordinator, one bash
# script for every platform generated from the protos (`cargo xtask release hkctl`); one
# SHA256SUMS over them; and, on a push to main, the
# build-provenance and SBOM attestations of this repository with a bundle per signed file. A
# host trusts only packages this workflow attested, so hello's packages are signed like
# hostkeeper's. The names are the release contract
# (docs/deploy/verify-a-release.md, "Every name"):
#
#   hostkeeper-<version>-<platform>.tar.gz          hostkeeper-<version>-<platform>.cdx.json
#   hostkeeper-<version>-<platform>.tar.zst         hostkeeper-<version>-<platform>.tar.zst.sha256
#   hello-<version>-<platform>.tar.zst              hello-<version>-<platform>.tar.zst.sha256
#   hello-<version>-fail-ready-<platform>.tar.zst   hello-<version>-fail-ready-<platform>.tar.zst.sha256
#   hostkeeper_<version>_<deb-arch>.deb             hostkeeper-<version>-1.<rpm-arch>.rpm
#   hostkeeper-coordinator-<version>-<linux-platform>.tar.gz
#   hostkeeper-coordinator-<version>-<linux-platform>.cdx.json
#   hostkeeper-coordinator-<version>-<linux-platform>.image.tar
#   hostkeeper-coordinator_<version>_<deb-arch>.deb  hostkeeper-coordinator-<version>-1.<rpm-arch>.rpm
#   hostkeeper-coordinator-<version>.image.json
#   hostkeeper-mdm-<version>-<linux-platform>.tar.gz
#   hostkeeper-mdm-<version>-<linux-platform>.cdx.json
#   mdm-<version>-linux-x86_64.tar.zst              mdm-<version>-linux-x86_64.tar.zst.sha256
#   hostkeeper-<version>-macos-arm64.pkg
#   hello_<version>_<deb-arch>.deb   hello-<version>-macos-arm64.pkg   mdm_<version>_amd64.deb
#   hello_<version>-fail-ready_<deb-arch>.deb       (the failing build's deb; its pkg is no asset)
#   index.json   hello-index.json   hello-fail-ready-index.json   mdm-index.json   netboot.json
#   SHA256SUMS
#   hkctl-<version>
#   <signed file>.sigstore.json
#
# `<version>` is X.Y.Z (`cargo xtask release version`: X.Y from the VERSION file, Z the number of
# first-parent commits of main since the commit that last changed it). Every build job writes it
# into the workspace (`release set-version`) and builds with RELEASE_COMMIT set to the commit, so
# `hostkeeper --version` prints `hostkeeper X.Y.Z+<12 hex>`, `hostkeeper-coordinator --version`
# prints `hostkeeper-coordinator X.Y.Z+<12 hex>` and `hostkeeper-mdm --version` prints
# `hostkeeper-mdm X.Y.Z+<12 hex>`, and `mdm --version`, the mdm package's program, prints
# `mdm X.Y.Z+<12 hex>`; `release check-binary` refuses a binary that prints anything else. `hello` is built from the same workspace, so it carries the
# release version (`hello --version` prints `hello X.Y.Z`); its failing build is named
# `<version>-fail-ready` in its manifest and index, and its server, started with `--fail-ready`,
# answers `/version` with that name.
#
# The image job builds the coordinator's image twice, each time with a new BuildKit builder from
# a context that holds the released binary and the operator web app (`ui/` of the commit, files
# 0644 and directories 0755), with the commit time as SOURCE_DATE_EPOCH and every timestamp in
# the image rewritten to it; `release compare-images` refuses the two unless they are byte for
# byte equal, so the released image is one anyone can rebuild from the commit. `release
# check-image-ui` then refuses the image unless it holds the web app where the coordinator serves
# it when given no --ui-dir, file for file, owned by root. The image is then loaded and run
# through its entrypoint with --version, which must print the coordinator's stamp.
#
# The attest job is in THIS file for one reason: the signer identity of an attestation is the
# workflow file that ran the signing step, and every consumer verifies exactly
# `komira-ai/hostkeeper/.github/workflows/artifacts.yml` on `refs/heads/main`. Do not move or
# rename it. Only `attest` holds `id-token: write` and `attestations: write`, and only under its
# exact `if:` (the workflow lint, crates/xtask/tests/workflows, holds both). While it holds them
# no repository code runs and nothing is built: it runs pinned actions, two `sha256sum --check`
# and a `cp` per bundle. The files reach it through the run's artifact store, where a job that ran
# repository code could have replaced them, so it first refuses sums other than the ones the sums
# job published (their digest is a job output) and then files that differ from the sums.
#
# No pull request runs this workflow (AGENTS.md B9: a pull request runs only build and unit tests
# with coverage, and never a macOS job). A push to main builds, sums, signs and checks what it signed (`verify`); a run
# by hand on a branch builds and sums and signs nothing. release.yml starts when a push run of
# this workflow on main completes, and publishes these files once `ci` and `privileged` have
# passed on the same commit.
name: artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A run per commit: two runs for one commit (a re-run) queue behind each other, and different
# commits do not wait for each other; a signing run is never cancelled. This workflow builds and
# attests and never tags or publishes, so it is outside the release group of release.yml (the
# workflow lint lists it as exempt and holds it to this group).
concurrency:
  group: artifacts-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # cargo-cyclonedx makes the SBOMs, nfpm the deb and the rpm: release
  # binaries, checked against their published SHA-256 by `cargo xtask install-tool` before use
  # (the digest of each platform's archive is in the build job's matrix).
  CYCLONEDX_VERSION: 0.5.9
  NFPM_VERSION: 2.48.0
  # The gh the deb and the rpm install as /usr/lib/hostkeeper/gh, the one a
  # host checks every package's attestation with (Ubuntu 24.04's own gh has no `gh attestation`). The SHA-256 of
  # each architecture's release archive is in the build job's matrix (`gh-sha256`), the one
  # cli/cli publishes in gh_<version>_checksums.txt; to bump it, change the version here and
  # both digests together (docs/deploy/verify-a-release.md, "What the Linux packages check
  # packages with").
  GH_VERSION: 2.102.1
  # The BuildKit the image job builds with, by the digest of its multi-platform index.
  BUILDKIT_IMAGE: moby/buildkit:v0.25.2@sha256:0f63d66f8d2de0bd16438284831a3e9ee6ca7cd57b6eb3ed6e38a7a456590fa7

defaults:
  run:
    shell: bash

jobs:
  # The one computation of the version every build gives the binary. It reads the first-parent
  # history, so the checkout is whole (a shallow one is refused, not counted).
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - name: The version of this commit
        id: version
        run: cargo xtask release version --commit "$GITHUB_SHA" --version-file VERSION --output "$GITHUB_OUTPUT"


  # One job per Linux platform, each on a GitHub-hosted runner of its own architecture, so each
  # binary runs where it is built. hostkeeper and hostkeeper-pxe, the programs of the Linux
  # packages and of hostkeeper's binary tarball and package, are built for the platform's musl
  # target (static-pie: no interpreter and no shared library, so they run on any Linux; the C
  # compiler is named in .cargo/config.toml). hostkeeper-coordinator and hostkeeper-mdm stay
  # builds for the gnu target: they need the glibc of the runner image they were built on
  # (Ubuntu 24.04) or newer.
  build:
    name: ${{ matrix.platform }}
    needs: [version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
            musl-target: x86_64-unknown-linux-musl
            deb-arch: amd64
            rpm-arch: x86_64
            cyclonedx-sha256: fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8
            nfpm-archive: Linux_x86_64
            nfpm-sha256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
            gh-sha256: 77b9e297e94c50336823d0f84de7ef1be60cba704601fa0d98f129f47a94987b
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            musl-target: aarch64-unknown-linux-musl
            deb-arch: arm64
            rpm-arch: aarch64
            cyclonedx-sha256: 7bf131ca5389b07a4f10c182bcf8a5ad339d64408b6f0d8f6834a0bd6120a06a
            nfpm-archive: Linux_arm64
            nfpm-sha256: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4
            gh-sha256: 5019b3cc6e8a03bb4d88600f8dbda2add8e6407705c159b0c63151036e77a1af
    env:
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.rust-target }}
      MUSL_TARGET: ${{ matrix.musl-target }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - name: The static target
        run: rustup target add "$MUSL_TARGET"
      # install-tool unpacks gzip tars only: it checks the xz archive and copies it, and tar
      # unpacks the checked copy.
      - name: Restore the pinned cyclonedx.tar.xz from the cache
        id: cyclonedx-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cyclonedx.tar.xz
          key: pinned-cyclonedx-${{ env.CYCLONEDX_VERSION }}-${{ matrix.cyclonedx-sha256 }}
      - name: Download cargo-cyclonedx on a cache miss (HTTPS only, redirects included)
        id: cyclonedx-download
        if: ${{ steps.cyclonedx-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/cyclonedx.tar.xz" "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz"
      - name: Say why the job stops when cyclonedx.tar.xz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.cyclonedx-download.outcome == 'failure' }}
        run: echo "::error::cyclonedx.tar.xz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Check cargo-cyclonedx (pinned checksum)
        id: cyclonedx-check
        env:
          SHA256: ${{ matrix.cyclonedx-sha256 }}
        run: cargo xtask install-tool --download "$RUNNER_TEMP/cyclonedx.tar.xz" --sha256 "$SHA256" --out "$RUNNER_TEMP/cyclonedx-checked.tar.xz"
      - name: Save the checked cyclonedx.tar.xz to the cache
        if: ${{ !cancelled() && steps.cyclonedx-check.outcome == 'success' && steps.cyclonedx-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cyclonedx.tar.xz
          key: ${{ steps.cyclonedx-cache.outputs.cache-primary-key }}
      - name: Install cargo-cyclonedx
        run: tar -xJf "$RUNNER_TEMP/cyclonedx-checked.tar.xz" -C "$HOME/.cargo/bin" --strip-components 1 "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
      - run: cargo cyclonedx --version
      - name: Restore the pinned nfpm.tar.gz from the cache
        id: nfpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nfpm.tar.gz
          key: pinned-nfpm-${{ env.NFPM_VERSION }}-${{ matrix.nfpm-sha256 }}
      - name: Download nfpm on a cache miss (HTTPS only, redirects included)
        id: nfpm-download
        if: ${{ steps.nfpm-cache.outputs.cache-hit != 'true' }}
        env:
          ARCHIVE: ${{ matrix.nfpm-archive }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/nfpm.tar.gz" "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_$ARCHIVE.tar.gz"
      - name: Say why the job stops when nfpm.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.nfpm-download.outcome == 'failure' }}
        run: echo "::error::nfpm.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Install nfpm (pinned checksum)
        id: nfpm-check
        env:
          SHA256: ${{ matrix.nfpm-sha256 }}
        run: cargo xtask install-tool --download "$RUNNER_TEMP/nfpm.tar.gz" --sha256 "$SHA256" --out "$HOME/.cargo/bin/nfpm" --extract tar.gz --member nfpm
      - name: Save the checked nfpm.tar.gz to the cache
        if: ${{ !cancelled() && steps.nfpm-check.outcome == 'success' && steps.nfpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nfpm.tar.gz
          key: ${{ steps.nfpm-cache.outputs.cache-primary-key }}
      - run: nfpm --version
      # The workspace's version is the release's; `Cargo.lock` gets it too, so the `--locked`
      # build accepts it. The SBOM step must leave the lock file exactly as written here.
      - name: The workspace takes the version of the release
        run: cargo xtask release set-version --version "$RELEASE_VERSION"
      - name: Keep the lock file as written
        run: cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
      # RELEASE_COMMIT is a build input of the binaries (crates/hostkeeper-daemon/src/stamp.rs,
      # crates/hostkeeper-coordinator/src/stamp.rs, crates/hostkeeper-mdm/src/stamp.rs), not
      # configuration they read when they run. hostkeeper-pxe, which the Linux packages carry,
      # has no stamp: its --version is the workspace's version alone. The coordinator and the MDM
      # kit's binary are built for the runner's gnu target into target/release; hostkeeper and
      # hostkeeper-pxe for the musl target into target/$MUSL_TARGET/release.
      - name: Build hostkeeper-coordinator and hostkeeper-mdm
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release -p hostkeeper-coordinator --bin hostkeeper-coordinator -p hostkeeper-mdm --bin hostkeeper-mdm
      - name: Build hostkeeper and hostkeeper-pxe (static)
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release --target "$MUSL_TARGET" -p hostkeeper --bin hostkeeper -p hostkeeper-pxe --bin hostkeeper-pxe
      # The coordinator's deb and rpm carry its static build, so one package runs on every
      # release of its family; the tarball and the image keep the gnu build above.
      - name: Build hostkeeper-coordinator (static, for its Linux packages)
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release --target "$MUSL_TARGET" -p hostkeeper-coordinator --bin hostkeeper-coordinator
      # hello takes its version from the workspace, so it needs no RELEASE_COMMIT.
      - name: Build hello
        run: cargo build --locked --release -p hello --bin hello
      - name: hostkeeper says the version and the commit
        run: cargo xtask release check-binary "target/$MUSL_TARGET/release/hostkeeper" "$RELEASE_VERSION" "$GITHUB_SHA"
      - name: hostkeeper-coordinator says the version and the commit
        run: cargo xtask release check-binary target/release/hostkeeper-coordinator "$RELEASE_VERSION" "$GITHUB_SHA"
      - name: The static hostkeeper-coordinator says the version and the commit
        run: cargo xtask release check-binary "target/$MUSL_TARGET/release/hostkeeper-coordinator" "$RELEASE_VERSION" "$GITHUB_SHA"
      - name: hostkeeper-mdm says the version and the commit
        run: cargo xtask release check-binary target/release/hostkeeper-mdm "$RELEASE_VERSION" "$GITHUB_SHA"
      - name: SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$TARGET"
      - name: The SBOM step left Cargo.lock unchanged
        run: cmp Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
      - run: mkdir dist
      - name: Name the SBOM of hostkeeper
        run: cp crates/hostkeeper/hostkeeper_bin.cdx.json "dist/hostkeeper-$RELEASE_VERSION-$PLATFORM.cdx.json"
      - name: Name the SBOM of hostkeeper-coordinator
        run: cp crates/hostkeeper-coordinator/hostkeeper-coordinator_bin.cdx.json "dist/hostkeeper-coordinator-$RELEASE_VERSION-$PLATFORM.cdx.json"
      - name: Name the SBOM of hostkeeper-mdm
        run: cp crates/hostkeeper-mdm/hostkeeper-mdm_bin.cdx.json "dist/hostkeeper-mdm-$RELEASE_VERSION-$PLATFORM.cdx.json"
      # The commit time is the one time the tarball holds, so its bytes depend on its inputs.
      - name: The commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Tarball of hostkeeper
        run: tar --sort=name --owner=0 --group=0 --numeric-owner --mode=0555 --mtime="@$SOURCE_DATE_EPOCH" -C "target/$MUSL_TARGET/release" -cf - hostkeeper | gzip -n > "dist/hostkeeper-$RELEASE_VERSION-$PLATFORM.tar.gz"
      - name: Tarball of hostkeeper-coordinator
        run: tar --sort=name --owner=0 --group=0 --numeric-owner --mode=0555 --mtime="@$SOURCE_DATE_EPOCH" -C target/release -cf - hostkeeper-coordinator | gzip -n > "dist/hostkeeper-coordinator-$RELEASE_VERSION-$PLATFORM.tar.gz"
      - name: Tarball of hostkeeper-mdm
        run: tar --sort=name --owner=0 --group=0 --numeric-owner --mode=0555 --mtime="@$SOURCE_DATE_EPOCH" -C target/release -cf - hostkeeper-mdm | gzip -n > "dist/hostkeeper-mdm-$RELEASE_VERSION-$PLATFORM.tar.gz"
      # The pinned gh of this architecture, checked against its pin and installed for this job,
      # and the Sigstore trusted root as it prints it. `gh attestation trusted-root` fetches the
      # roots of the Sigstore public-good instance and of GitHub's instance through their TUF
      # repositories, verified from the TUF root gh embeds; it needs no token. The packages
      # carry the root of their build, so each release carries a fresh one.
      - name: Restore the pinned gh.tar.gz from the cache
        id: gh-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.tar.gz
          key: pinned-gh-${{ env.GH_VERSION }}-${{ matrix.gh-sha256 }}
      - name: Download gh on a cache miss (HTTPS only, redirects included)
        id: gh-download
        if: ${{ steps.gh-cache.outputs.cache-hit != 'true' }}
        env:
          ARCH: ${{ matrix.deb-arch }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_$ARCH.tar.gz"
      - name: Say why the job stops when gh.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.gh-download.outcome == 'failure' }}
        run: echo "::error::gh.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Install gh (pinned checksum)
        id: gh-check
        env:
          ARCH: ${{ matrix.deb-arch }}
          SHA256: ${{ matrix.gh-sha256 }}
        run: cargo xtask install-tool --download "$RUNNER_TEMP/gh.tar.gz" --sha256 "$SHA256" --out "$RUNNER_TEMP/gh/gh" --extract tar.gz --member "gh_${GH_VERSION}_linux_$ARCH/bin/gh"
      - name: Save the checked gh.tar.gz to the cache
        if: ${{ !cancelled() && steps.gh-check.outcome == 'success' && steps.gh-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.tar.gz
          key: ${{ steps.gh-cache.outputs.cache-primary-key }}
      - run: '"$RUNNER_TEMP/gh/gh" --version'
      - name: The Sigstore trusted root
        run: '"$RUNNER_TEMP/gh/gh" attestation trusted-root > "$RUNNER_TEMP/trusted_root.json"'
      # The packages' gh and trusted root, where nfpm.yaml takes them from: gh out of the same
      # archive, checked against the pin again, refused unless it is a program of this
      # architecture; the trusted root refused unless every line of it is one; hostkeeper and
      # hostkeeper-pxe out of the static build, refused unless each is a static ELF of this
      # architecture.
      - name: Stage gh, the trusted root and the static programs for the Linux packages
        env:
          ARCH: ${{ matrix.deb-arch }}
          SHA256: ${{ matrix.gh-sha256 }}
        run: cargo xtask release nfpm-stage --arch "$ARCH" --gh-version "$GH_VERSION" --gh-archive "$RUNNER_TEMP/gh.tar.gz" --gh-sha256 "$SHA256" --trusted-root "$RUNNER_TEMP/trusted_root.json" --binaries "target/$MUSL_TARGET/release" --out target/nfpm
      # nfpm reads VERSION and ARCH into packaging/linux/nfpm.yaml and names the files
      # hostkeeper_<version>_<deb-arch>.deb and hostkeeper-<version>-1.<rpm-arch>.rpm.
      - name: The deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.deb-arch }}
        run: nfpm package --config packaging/linux/nfpm.yaml --packager deb --target dist
      - name: The rpm
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.deb-arch }}
        run: nfpm package --config packaging/linux/nfpm.yaml --packager rpm --target dist
      # Each package read back: it installs the staged gh and trusted root at the daemon's paths,
      # 0755 and 0644, root's, with the staged bytes, hostkeeper and hostkeeper-pxe in
      # /usr/bin, 0755, root's, with the staged bytes, and the console's issue link
      # /etc/issue.d/hostkeeper.issue pointing at /run/hostkeeper/enrollment.issue; and it holds
      # no ELF file with an interpreter or a needed library and declares no dependency.
      - name: The deb installs the staged files
        env:
          ARCH: ${{ matrix.deb-arch }}
        run: cargo xtask release check-linux-pkg "dist/hostkeeper_${RELEASE_VERSION}_$ARCH.deb" --staged target/nfpm
      - name: The rpm installs the staged files
        env:
          RPM_ARCH: ${{ matrix.rpm-arch }}
        run: cargo xtask release check-linux-pkg "dist/hostkeeper-$RELEASE_VERSION-1.$RPM_ARCH.rpm" --staged target/nfpm
      - name: The binary tarball holds no dynamically linked program
        run: cargo xtask release check-linux-pkg "dist/hostkeeper-$RELEASE_VERSION-$PLATFORM.tar.gz"
      # The coordinator's deb and rpm (packaging/coordinator/nfpm.yaml) take the static program
      # and the operator web app from target/nfpm-coordinator/: ui/ with every directory 0755
      # and every file 0644, as the image holds it.
      - run: mkdir target/nfpm-coordinator
      - name: Stage the static hostkeeper-coordinator
        run: cp "target/$MUSL_TARGET/release/hostkeeper-coordinator" target/nfpm-coordinator/hostkeeper-coordinator
      - name: Stage the operator web app
        run: cp -R ui target/nfpm-coordinator/ui
      - name: The web app's modes
        run: chmod -R u=rwX,go=rX target/nfpm-coordinator/ui
      # nfpm names the files hostkeeper-coordinator_<version>_<deb-arch>.deb and
      # hostkeeper-coordinator-<version>-1.<rpm-arch>.rpm.
      - name: The coordinator's deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.deb-arch }}
        run: nfpm package --config packaging/coordinator/nfpm.yaml --packager deb --target dist
      - name: The coordinator's rpm
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.deb-arch }}
        run: nfpm package --config packaging/coordinator/nfpm.yaml --packager rpm --target dist
      # Each read back: the staged program at /usr/bin/hostkeeper-coordinator, 0755, root's, a
      # static ELF; the web app file for file, 0644, root's; the unit, the sysusers.d entry, the
      # tmpfiles rules and the template, 0644, root's; no dependency but systemd.
      - name: The coordinator's deb installs the staged files
        env:
          ARCH: ${{ matrix.deb-arch }}
        run: cargo xtask release check-linux-pkg "dist/hostkeeper-coordinator_${RELEASE_VERSION}_$ARCH.deb" --coordinator-staged target/nfpm-coordinator
      - name: The coordinator's rpm installs the staged files
        env:
          RPM_ARCH: ${{ matrix.rpm-arch }}
        run: cargo xtask release check-linux-pkg "dist/hostkeeper-coordinator-$RELEASE_VERSION-1.$RPM_ARCH.rpm" --coordinator-staged target/nfpm-coordinator
      # The package carries its own unit (packaging/linux/units/hostkeeper.service), not the
      # bootstrap unit the Linux packages install (packaging/linux/hostkeeper.service): it seeds
      # the binary directory and starts the binary the self-update switches. It also
      # carries the committed Sigstore trusted root, which the daemon checks every package against,
      # so each update of hostkeeper brings the root of its release (trusted-root.yml says when the
      # committed root is no longer the live one).
      - name: hostkeeper's own package and its SHA-256
        run: cargo xtask release package --platform "$PLATFORM" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --binary "target/$MUSL_TARGET/release/hostkeeper" --unit packaging/linux/units/hostkeeper.service --trusted-root packaging/sigstore/trusted_root.json --out dist
      - name: hostkeeper's package holds no dynamically linked program
        run: cargo xtask release check-linux-pkg "dist/hostkeeper-$RELEASE_VERSION-$PLATFORM.tar.zst"
      - name: hello's package and its SHA-256
        run: cargo xtask release package --service hello --platform "$PLATFORM" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --binary target/release/hello --out dist
      # The same binary and units, started with --fail-ready: a build whose verify fails, so that
      # a host can be rolled back from it. It is released and attested like the others.
      - name: hello's failing build and its SHA-256
        run: cargo xtask release package --service hello --fail-ready --platform "$PLATFORM" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --binary target/release/hello --out dist
      # The mdm package, for linux-x86_64 only (its pinned tools are linux-amd64 builds): its
      # program bin/mdm, stamped like the binaries, and the pinned servers and lego, each archive
      # downloaded over HTTPS and checked against its pin in crates/hostkeeper-mdm-core/pins.txt
      # by mdm-fetch, then checked again by the package verb, which takes the binaries out.
      # Nothing downloaded is run here.
      - name: Build mdm, the program of the mdm package
        if: matrix.platform == 'linux-x86_64'
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release -p hostkeeper-mdm --bin mdm
      - name: mdm says the version and the commit
        if: matrix.platform == 'linux-x86_64'
        run: cargo xtask release check-binary target/release/mdm "$RELEASE_VERSION" "$GITHUB_SHA"
      - name: The pinned archives of the mdm package
        if: matrix.platform == 'linux-x86_64'
        run: cargo xtask release mdm-fetch --dir "$RUNNER_TEMP/mdm-archives"
      - name: The mdm package and its SHA-256
        if: matrix.platform == 'linux-x86_64'
        run: cargo xtask release package --service mdm --platform "$PLATFORM" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --binary target/release/mdm --archives "$RUNNER_TEMP/mdm-archives" --out dist
      # The tarballs as a host takes them: unpacked with this runner's tar, the binary in each says
      # the version and the commit, as the built one did.
      - run: mkdir "$RUNNER_TEMP/unpacked"
      - run: tar -xzf "dist/hostkeeper-$RELEASE_VERSION-$PLATFORM.tar.gz" -C "$RUNNER_TEMP/unpacked" hostkeeper
      - name: The packaged hostkeeper says the version and the commit
        run: cargo xtask release check-binary "$RUNNER_TEMP/unpacked/hostkeeper" "$RELEASE_VERSION" "$GITHUB_SHA"
      - run: tar -xzf "dist/hostkeeper-coordinator-$RELEASE_VERSION-$PLATFORM.tar.gz" -C "$RUNNER_TEMP/unpacked" hostkeeper-coordinator
      - name: The packaged hostkeeper-coordinator says the version and the commit
        run: cargo xtask release check-binary "$RUNNER_TEMP/unpacked/hostkeeper-coordinator" "$RELEASE_VERSION" "$GITHUB_SHA"
      - run: tar -xzf "dist/hostkeeper-mdm-$RELEASE_VERSION-$PLATFORM.tar.gz" -C "$RUNNER_TEMP/unpacked" hostkeeper-mdm
      - name: The packaged hostkeeper-mdm says the version and the commit
        run: cargo xtask release check-binary "$RUNNER_TEMP/unpacked/hostkeeper-mdm" "$RELEASE_VERSION" "$GITHUB_SHA"
      # The native packages of the services (docs/design/packages-native.md, items A20 and A21):
      # hello's .deb and its failing build's, and on linux-x86_64 mdm's, read back by
      # check-linux-pkg --service: the package named for the service, every entry root's and not
      # writable by others, each unit starting a file of the package, no dependency. The release
      # manifest names each one's hook command. All go to dist/: release assets, summed and
      # attested. The release publishes hello's and mdm's to the repository's testing suite, and
      # the failing build's, whose Debian version is <version>~fail.ready (the file keeps the
      # service version, <version>-fail-ready, in its name), to its testing-fail suite.
      - name: hello's .deb
        run: cargo xtask release deb --service hello --platform "$PLATFORM" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --binary target/release/hello --out dist
      - name: hello's failing build's .deb
        run: cargo xtask release deb --service hello --fail-ready --platform "$PLATFORM" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --binary target/release/hello --out dist
      - name: hello's .deb is named for hello, root's, and its units start its own files
        env:
          ARCH: ${{ matrix.deb-arch }}
        run: cargo xtask release check-linux-pkg "dist/hello_${RELEASE_VERSION}_$ARCH.deb" --service hello
      - name: hello's failing build's .deb is named for hello, root's, and its units start its own files
        env:
          ARCH: ${{ matrix.deb-arch }}
        run: cargo xtask release check-linux-pkg "dist/hello_${RELEASE_VERSION}-fail-ready_$ARCH.deb" --service hello
      - name: mdm's .deb
        if: matrix.platform == 'linux-x86_64'
        run: cargo xtask release deb --service mdm --platform "$PLATFORM" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --binary target/release/mdm --archives "$RUNNER_TEMP/mdm-archives" --out dist
      - name: mdm's .deb is named for mdm, root's, and its units start its own files
        if: matrix.platform == 'linux-x86_64'
        run: cargo xtask release check-linux-pkg "dist/mdm_${RELEASE_VERSION}_amd64.deb" --service mdm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-${{ matrix.platform }}
          path: dist/
          retention-days: 90
          if-no-files-found: error

  # macos-arm64 on a GitHub-hosted Apple silicon runner, so the binary runs where it is built: the
  # binary tarball, its SBOM and hostkeeper's own package as for Linux (the package has no unit:
  # the daemon's launchd job is the plist of the installer), hello's two packages (their units
  # are the plists of its two slots), and the installer pkg of a Mac's first
  # install (a distribution pkg: productbuild around the component pkgbuild makes), read back from
  # the built pkg and checked here. No deb, rpm, coordinator or hostkeeper-mdm on macOS.
  # The pkgs built here, the installer and hello's .pkg, are unsigned and are not release files:
  # they go to their own artifact, `pkg-unsigned-macos-arm64`, which sign-pkg signs and check-pkg
  # checks and publishes, so each pkg SHA256SUMS lists and attest attests is the signed one. The runner's `gtar` is GNU tar, so
  # the tarball is made as on Linux.
  build-macos:
    name: macos-arm64
    needs: [version]
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PLATFORM: macos-arm64
      TARGET: aarch64-apple-darwin
      CYCLONEDX_SHA256: 4c53dfa21e70b65bf7f8d2592aadde3bcb02c1a40b6ec63b877e5ca65a29e180
      # The gh the installer pkg installs at /usr/local/lib/hostkeeper/gh: the release archive
      # gh_<version>_macOS_arm64.zip of cli/cli and its SHA-256 (gh's own checksums file lists it).
      GH_VERSION: 2.103.3
      GH_SHA256: d700207eae9ae98fe2b89535c2c087c07823d4628c56364695a5a07ef311c062
      # The SHA-256 of what that gh's `gh attestation trusted-root` prints (the Sigstore public-good
      # and GitHub trusted roots, one compact JSON line each), which the pkg installs at
      # /usr/local/lib/hostkeeper/trusted_root.json. When either root changes, the check below
      # fails until this pin is moved by a pull request.
      TRUSTED_ROOT_SHA256: 65ca537f6ed8a47fd0e560c421baa1f6c1efb8b25fc200d8c5c02c0e92eb2b9c
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - name: Restore the pinned cyclonedx.tar.xz from the cache
        id: cyclonedx-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cyclonedx.tar.xz
          key: pinned-cyclonedx-${{ env.CYCLONEDX_VERSION }}-${{ env.CYCLONEDX_SHA256 }}
      - name: Download cargo-cyclonedx on a cache miss (HTTPS only, redirects included)
        id: cyclonedx-download
        if: ${{ steps.cyclonedx-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/cyclonedx.tar.xz" "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz"
      - name: Say why the job stops when cyclonedx.tar.xz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.cyclonedx-download.outcome == 'failure' }}
        run: echo "::error::cyclonedx.tar.xz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Check cargo-cyclonedx (pinned checksum)
        id: cyclonedx-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/cyclonedx.tar.xz" --sha256 "$CYCLONEDX_SHA256" --out "$RUNNER_TEMP/cyclonedx-checked.tar.xz"
      - name: Save the checked cyclonedx.tar.xz to the cache
        if: ${{ !cancelled() && steps.cyclonedx-check.outcome == 'success' && steps.cyclonedx-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cyclonedx.tar.xz
          key: ${{ steps.cyclonedx-cache.outputs.cache-primary-key }}
      # The macOS image keeps cargo outside $HOME/.cargo/bin, so the tool goes into a directory of
      # its own on the PATH.
      - run: mkdir "$RUNNER_TEMP/bin"
      - name: Install cargo-cyclonedx
        run: tar -xJf "$RUNNER_TEMP/cyclonedx-checked.tar.xz" -C "$RUNNER_TEMP/bin" --strip-components 1 "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
      - name: Put the tool directory on the PATH
        run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: cargo cyclonedx --version
      - run: gtar --version
      - name: The workspace takes the version of the release
        run: cargo xtask release set-version --version "$RELEASE_VERSION"
      - name: Keep the lock file as written
        run: cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
      - name: Build hostkeeper
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release -p hostkeeper --bin hostkeeper
      # hello takes its version from the workspace, so it needs no RELEASE_COMMIT.
      - name: Build hello
        run: cargo build --locked --release -p hello --bin hello
      - name: hostkeeper says the version and the commit
        run: cargo xtask release check-binary target/release/hostkeeper "$RELEASE_VERSION" "$GITHUB_SHA"
      # The macOS unpack refuses a Mach-O without a valid code signature of its own bytes; the
      # linker signs the binary ad hoc, and this checks it as the unpack does.
      - name: hostkeeper has a valid code signature
        run: codesign --verify --strict --verbose=2 target/release/hostkeeper
      # hello is a Mach-O in a macOS package too, so it is held to the same signature.
      - name: hello has a valid code signature
        run: codesign --verify --strict --verbose=2 target/release/hello
      - name: SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$TARGET"
      - name: The SBOM step left Cargo.lock unchanged
        run: cmp Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
      - run: mkdir dist
      - name: Name the SBOM
        run: cp crates/hostkeeper/hostkeeper_bin.cdx.json "dist/hostkeeper-$RELEASE_VERSION-$PLATFORM.cdx.json"
      - name: The commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Tarball of the binary
        run: gtar --sort=name --owner=0 --group=0 --numeric-owner --mode=0555 --mtime="@$SOURCE_DATE_EPOCH" -C target/release -cf - hostkeeper | gzip -n > "dist/hostkeeper-$RELEASE_VERSION-$PLATFORM.tar.gz"
      # The package carries the committed trusted root (see the Linux build job).
      - name: hostkeeper's own package and its SHA-256
        run: cargo xtask release package --platform "$PLATFORM" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --binary target/release/hostkeeper --trusted-root packaging/sigstore/trusted_root.json --out dist
      - name: hello's package and its SHA-256
        run: cargo xtask release package --service hello --platform "$PLATFORM" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --binary target/release/hello --out dist
      # The same binary and plists, started with --fail-ready (see the Linux build job).
      - name: hello's failing build and its SHA-256
        run: cargo xtask release package --service hello --fail-ready --platform "$PLATFORM" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --binary target/release/hello --out dist
      - name: Restore the pinned gh.zip from the cache
        id: gh-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.zip
          key: pinned-gh-${{ env.GH_VERSION }}-${{ env.GH_SHA256 }}
      - name: Download gh on a cache miss (HTTPS only, redirects included)
        id: gh-download
        if: ${{ steps.gh-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/gh.zip" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_macOS_arm64.zip"
      - name: Say why the job stops when gh.zip is neither cached nor downloadable
        if: ${{ !cancelled() && steps.gh-download.outcome == 'failure' }}
        run: echo "::error::gh.zip is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Check gh (pinned checksum)
        id: gh-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/gh.zip" --sha256 "$GH_SHA256" --out "$RUNNER_TEMP/gh-checked.zip"
      - name: Save the checked gh.zip to the cache
        if: ${{ !cancelled() && steps.gh-check.outcome == 'success' && steps.gh-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.zip
          key: ${{ steps.gh-cache.outputs.cache-primary-key }}
      - name: Unpack gh
        run: unzip -j -q "$RUNNER_TEMP/gh-checked.zip" "gh_${GH_VERSION}_macOS_arm64/bin/gh" -d "$RUNNER_TEMP/gh-pinned"
      # gh fetches both roots through TUF and checks their signatures; no token is needed.
      - name: The Sigstore trusted root, as the pinned gh prints it
        run: '"$RUNNER_TEMP/gh-pinned/gh" attestation trusted-root > "$RUNNER_TEMP/trusted_root.download"'
      - name: Check the trusted root (pinned checksum)
        run: cargo xtask install-tool --download "$RUNNER_TEMP/trusted_root.download" --sha256 "$TRUSTED_ROOT_SHA256" --out "$RUNNER_TEMP/trusted_root.json"
      # Into pkg/, not dist/: the unsigned pkg is never a release file.
      - run: mkdir pkg
      - name: The installer pkg (component by pkgbuild, distribution by productbuild)
        run: cargo xtask release macos-pkg --version "$RELEASE_VERSION" --binary target/release/hostkeeper --gh "$RUNNER_TEMP/gh-pinned/gh" --trusted-root "$RUNNER_TEMP/trusted_root.json" --stage "$RUNNER_TEMP/pkg-root" --out pkg
      # Read back from the built pkg, expanded into its Distribution and its component: the
      # Distribution names the one component under the pkg's identifier and version and runs no
      # installer script, and the component's payload holds exactly the binary, the daemon's plist,
      # the log directory and the newsyslog file, gh and the trusted root, with their paths, modes,
      # owners and bytes, the plist names the daemon's label, the installed binary
      # /usr/local/bin/hostkeeper as its program and its output files, the newsyslog file rotates
      # exactly those files, and the pkg's one script is the postinstall that boots out and loads
      # the job, byte for byte.
      - name: Expand the distribution pkg
        run: pkgutil --expand "pkg/hostkeeper-$RELEASE_VERSION-$PLATFORM.pkg" "$RUNNER_TEMP/pkg-expanded"
      - name: The distribution pkg holds one component that installs exactly the binary, the plist, the log directory and its newsyslog file, gh and the trusted root
        run: cargo xtask release check-macos-pkg "$RUNNER_TEMP/pkg-expanded" --version "$RELEASE_VERSION" --binary target/release/hostkeeper --gh "$RUNNER_TEMP/gh-pinned/gh" --trusted-root "$RUNNER_TEMP/trusted_root.json"
      - run: mkdir "$RUNNER_TEMP/unpacked"
      - run: tar -xzf "dist/hostkeeper-$RELEASE_VERSION-$PLATFORM.tar.gz" -C "$RUNNER_TEMP/unpacked" hostkeeper
      - name: The packaged hostkeeper says the version and the commit
        run: cargo xtask release check-binary "$RUNNER_TEMP/unpacked/hostkeeper" "$RELEASE_VERSION" "$GITHUB_SHA"
      # hello's .pkg and its failing build's (docs/design/packages-native.md, items A20 and A21):
      # one component with no script, the program under /Library/Application Support/hello/ and
      # the two slots' plists, Disabled, in /Library/LaunchDaemons/, read back from the expanded
      # product: what hello's builder writes, not a rule of the daemon's. hello's goes to pkg/, unsigned,
      # beside the installer: sign-pkg signs it and check-pkg publishes it, a release asset the
      # release puts in the testing directory of the installers. The failing build's goes to
      # native/, an artifact of its own, and is never signed or released.
      - name: hello's .pkg (component by pkgbuild with no scripts, distribution by productbuild)
        run: cargo xtask release macos-pkg --service hello --version "$RELEASE_VERSION" --binary target/release/hello --stage "$RUNNER_TEMP/hello-pkg-root" --out pkg
      - name: hello's failing build's .pkg
        run: cargo xtask release macos-pkg --service hello --fail-ready --version "$RELEASE_VERSION" --binary target/release/hello --stage "$RUNNER_TEMP/hello-fail-ready-pkg-root" --out native
      - name: Expand hello's .pkg
        run: pkgutil --expand "pkg/hello-$RELEASE_VERSION-$PLATFORM.pkg" "$RUNNER_TEMP/hello-pkg-expanded"
      - name: Expand hello's failing build's .pkg
        run: pkgutil --expand "native/hello-$RELEASE_VERSION-fail-ready-$PLATFORM.pkg" "$RUNNER_TEMP/hello-fail-ready-pkg-expanded"
      - name: hello's .pkg is exactly what its builder writes
        run: cargo xtask release check-macos-pkg "$RUNNER_TEMP/hello-pkg-expanded" --service hello --version "$RELEASE_VERSION" --binary target/release/hello
      - name: hello's failing build's .pkg is exactly what its builder writes
        run: cargo xtask release check-macos-pkg "$RUNNER_TEMP/hello-fail-ready-pkg-expanded" --service hello --fail-ready --version "$RELEASE_VERSION" --binary target/release/hello
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-${{ env.PLATFORM }}
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ env.PLATFORM }}
          path: native/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-unsigned-${{ env.PLATFORM }}
          path: pkg/
          retention-days: 90
          if-no-files-found: error

  # Push to main only: the installer pkg signed with the Developer ID Installer identity, for the
  # MDM's InstallEnterpriseApplication, which installs only a signed pkg, and hello's .pkg with
  # the same identity, for a host's macos-pkg installer, which stages only a signed pkg. Not
  # notarized: a pkg an MDM or a host's installer installs needs no notarization. This job runs no repository code (no checkout, no
  # cargo), so no build script or dependency runs on the machine that holds the key: the
  # workflow lint holds it to the exact steps of SIGN_PKG_STEPS (crates/xtask/tests/workflows).
  # The identity (the PKCS#12 with its key and Apple's Developer ID G2 intermediate) goes into
  # a keychain of this job in $RUNNER_TEMP, never the login keychain, which is the user's only
  # keychain while productsign runs; the keychain and the PKCS#12 file are deleted whether or
  # not the signing worked. The keychain's password is the PKCS#12's, a secret the log masks.
  # The signed pkgs go to `pkg-signed-macos-arm64`, which check-pkg checks.
  sign-pkg:
    needs: [version, build-macos]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 15
    environment: pkg-signing
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      IDENTITY: "Developer ID Installer: Komira AI, Inc. (U7RTX4XD3X)"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-unsigned-macos-arm64
          path: unsigned
      - name: The identity, from its secret into a file of the job
        env:
          P12: ${{ secrets.MACOS_INSTALLER_P12 }}
        run: base64 --decode -o "$RUNNER_TEMP/installer.p12" <<< "$P12"
      - name: A keychain of the job
        env:
          PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
        run: security create-keychain -p "$PASSWORD" "$RUNNER_TEMP/pkg-signing.keychain-db"
      - name: The keychain stays unlocked for the job
        run: security set-keychain-settings -lut 21600 "$RUNNER_TEMP/pkg-signing.keychain-db"
      - name: Unlock the keychain
        env:
          PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
        run: security unlock-keychain -p "$PASSWORD" "$RUNNER_TEMP/pkg-signing.keychain-db"
      - name: Import the identity, its key usable by productsign only
        env:
          PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
        run: security import "$RUNNER_TEMP/installer.p12" -k "$RUNNER_TEMP/pkg-signing.keychain-db" -f pkcs12 -P "$PASSWORD" -T /usr/bin/productsign
      - name: Let Apple's tools use the key without a prompt
        env:
          PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
        run: security set-key-partition-list -S "apple-tool:,apple:" -s -k "$PASSWORD" "$RUNNER_TEMP/pkg-signing.keychain-db"
      - name: The job's keychain is the user's only keychain
        run: security list-keychains -d user -s "$RUNNER_TEMP/pkg-signing.keychain-db"
      - run: mkdir dist
      - name: Sign the pkg, with a trusted timestamp
        run: productsign --sign "$IDENTITY" --keychain "$RUNNER_TEMP/pkg-signing.keychain-db" --timestamp "unsigned/hostkeeper-$RELEASE_VERSION-macos-arm64.pkg" "dist/hostkeeper-$RELEASE_VERSION-macos-arm64.pkg"
      - name: Sign hello's pkg, with a trusted timestamp
        run: productsign --sign "$IDENTITY" --keychain "$RUNNER_TEMP/pkg-signing.keychain-db" --timestamp "unsigned/hello-$RELEASE_VERSION-macos-arm64.pkg" "dist/hello-$RELEASE_VERSION-macos-arm64.pkg"
      - name: Delete the keychain, whether the signing worked or not
        if: ${{ always() }}
        run: security delete-keychain "$RUNNER_TEMP/pkg-signing.keychain-db"
      - name: Delete the identity's file, whether the signing worked or not
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/installer.p12"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-signed-macos-arm64
          path: dist/
          retention-days: 90
          if-no-files-found: error

  # Push to main only, with no secret: each signed pkg, the installer and hello's, is checked and
  # only then becomes a release file. `release check-pkg-signature` refuses it unless pkgutil
  # says the Mac trusts its signature, signed with a trusted timestamp by exactly the identity
  # under Apple's Developer ID intermediate and root; each signed and unsigned pkg must expand to
  # the same files, so signing changed nothing that check-macos-pkg checked in build-macos. The
  # pkgs are uploaded as `assets-pkg-macos-arm64`, the one `assets-*` artifact that holds them,
  # so SHA256SUMS, the attestation and the release name the signed bytes.
  check-pkg:
    needs: [version, sign-pkg]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      IDENTITY: "Developer ID Installer: Komira AI, Inc. (U7RTX4XD3X)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-unsigned-macos-arm64
          path: unsigned
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-signed-macos-arm64
          path: dist
      - name: The signature is the identity's, under Apple's chain, with a trusted timestamp
        run: cargo xtask release check-pkg-signature "dist/hostkeeper-$RELEASE_VERSION-macos-arm64.pkg" --identity "$IDENTITY"
      - name: Expand the unsigned pkg
        run: pkgutil --expand "unsigned/hostkeeper-$RELEASE_VERSION-macos-arm64.pkg" "$RUNNER_TEMP/unsigned-expanded"
      - name: Expand the signed pkg
        run: pkgutil --expand "dist/hostkeeper-$RELEASE_VERSION-macos-arm64.pkg" "$RUNNER_TEMP/signed-expanded"
      - name: Signing changed no file of the pkg
        run: diff -r "$RUNNER_TEMP/unsigned-expanded" "$RUNNER_TEMP/signed-expanded"
      - name: hello's signature is the identity's, under Apple's chain, with a trusted timestamp
        run: cargo xtask release check-pkg-signature "dist/hello-$RELEASE_VERSION-macos-arm64.pkg" --identity "$IDENTITY"
      - name: Expand hello's unsigned pkg
        run: pkgutil --expand "unsigned/hello-$RELEASE_VERSION-macos-arm64.pkg" "$RUNNER_TEMP/hello-unsigned-expanded"
      - name: Expand hello's signed pkg
        run: pkgutil --expand "dist/hello-$RELEASE_VERSION-macos-arm64.pkg" "$RUNNER_TEMP/hello-signed-expanded"
      - name: Signing changed no file of hello's pkg
        run: diff -r "$RUNNER_TEMP/hello-unsigned-expanded" "$RUNNER_TEMP/hello-signed-expanded"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-pkg-macos-arm64
          path: dist/
          retention-days: 90
          if-no-files-found: error

  # The coordinator's image, per platform on a runner of that architecture, from the binary of
  # the coordinator tarball the build job released and the web app of the commit: built twice,
  # each time by a new builder from a context holding that binary and `ui/` (its modes set, so
  # the image does not take the runner's umask), and released only when the two are byte for
  # byte equal and the image holds the web app.
  # Each build has a docker-container builder of the pinned BuildKit image, whose `docker`
  # exporter writes a tarball that is an OCI image layout (`oci-layout`, `index.json`, `blobs/`,
  # what compare-images reads) and also holds the `manifest.json` that `docker load` reads, named
  # hostkeeper-coordinator:<version>. The image is the artifact `assets-image-<platform>`, which the
  # jobs after this one take with the build jobs' `assets-*`.
  image:
    name: image ${{ matrix.platform }}
    needs: [version, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            oci-platform: linux/amd64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            oci-platform: linux/arm64
    env:
      PLATFORM: ${{ matrix.platform }}
      OCI_PLATFORM: ${{ matrix.oci-platform }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assets-${{ matrix.platform }}
          path: built
      # The commit time is the one time the image holds: its layers, its config and the files of
      # the tarball are all stamped with it.
      - name: The commit time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - run: mkdir "$RUNNER_TEMP/context-a" "$RUNNER_TEMP/context-b" dist
      - name: The first context, the released coordinator
        run: tar -xzf "built/hostkeeper-coordinator-$RELEASE_VERSION-$PLATFORM.tar.gz" -C "$RUNNER_TEMP/context-a" hostkeeper-coordinator
      - name: The first context, the web app
        run: cp -R ui "$RUNNER_TEMP/context-a/ui"
      - name: The first context, the web app's modes
        run: chmod -R u=rwX,go=rX "$RUNNER_TEMP/context-a/ui"
      - name: The second context, the released coordinator
        run: tar -xzf "built/hostkeeper-coordinator-$RELEASE_VERSION-$PLATFORM.tar.gz" -C "$RUNNER_TEMP/context-b" hostkeeper-coordinator
      - name: The second context, the web app
        run: cp -R ui "$RUNNER_TEMP/context-b/ui"
      - name: The second context, the web app's modes
        run: chmod -R u=rwX,go=rX "$RUNNER_TEMP/context-b/ui"
      - name: The first builder
        run: docker buildx create --name image-a --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --bootstrap
      - name: The first build
        run: docker buildx build --builder image-a --no-cache --platform "$OCI_PLATFORM" --provenance=false --sbom=false --file packaging/container/Dockerfile --output "type=docker,name=hostkeeper-coordinator:$RELEASE_VERSION,dest=$RUNNER_TEMP/image-a.tar,rewrite-timestamp=true" "$RUNNER_TEMP/context-a"
      - name: The second builder
        run: docker buildx create --name image-b --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --bootstrap
      - name: The second build
        run: docker buildx build --builder image-b --no-cache --platform "$OCI_PLATFORM" --provenance=false --sbom=false --file packaging/container/Dockerfile --output "type=docker,name=hostkeeper-coordinator:$RELEASE_VERSION,dest=$RUNNER_TEMP/image-b.tar,rewrite-timestamp=true" "$RUNNER_TEMP/context-b"
      - name: The two builds are byte for byte equal
        run: cargo xtask release compare-images "$RUNNER_TEMP/image-a.tar" "$RUNNER_TEMP/image-b.tar"
      - name: The image holds the web app
        run: cargo xtask release check-image-ui "$RUNNER_TEMP/image-a.tar" ui
      # The image as a deployment starts it: loaded into the runner's docker and run through its
      # own entrypoint, with --version as its only argument, it exits 0 and prints exactly the
      # coordinator's stamp of this version and commit.
      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/image-a.tar"
      - name: The image's entrypoint says the version and the commit
        run: test "$(docker run --rm "hostkeeper-coordinator:$RELEASE_VERSION" --version)" = "hostkeeper-coordinator $RELEASE_VERSION+${GITHUB_SHA:0:12}"
      - name: Name the image
        run: cp "$RUNNER_TEMP/image-a.tar" "dist/hostkeeper-coordinator-$RELEASE_VERSION-$PLATFORM.image.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-image-${{ matrix.platform }}
          path: dist/
          retention-days: 90
          if-no-files-found: error

  # index.json over the packages of both platforms, netboot.json from the committed pins of the
  # boot sets of network install (it reads no network), then SHA256SUMS over every file but itself
  # (the bundles come later, from attest). The attest job signs these sums, so they are the one
  # list of what a release holds.
  # On a push to main it waits for check-pkg, which publishes the signed pkgs (the installer and
  # hello's); on a run by hand, which signs nothing, check-pkg is skipped and the sums are made
  # without them.
  sums:
    needs: [version, build, build-macos, image, check-pkg]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # `assets-*` is the build jobs' artifacts and the image job's (`assets-image-*`), one each
      # per platform; the run's other artifacts are `sha256sums` and `bundles`.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
      - name: The release index
        run: cargo xtask release index --version "$RELEASE_VERSION" --dir dist
      - name: The release index of hello
        run: cargo xtask release index --service hello --version "$RELEASE_VERSION" --dir dist
      - name: The release index of hello's failing build
        run: cargo xtask release index --service hello --fail-ready --version "$RELEASE_VERSION" --dir dist
      - name: The release index of mdm
        run: cargo xtask release index --service mdm --version "$RELEASE_VERSION" --dir dist
      - name: The boot sets of network install
        run: cargo xtask release netboot --pins packaging/netboot/pins.toml --version "$RELEASE_VERSION" --dir dist
      - name: The command line, hkctl
        run: cargo xtask release hkctl --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --out dist
      # The OCI image index of the two image tarballs: its SHA-256 is the digest of the
      # multi-platform image release.yml pushes to the registry.
      - name: The coordinator's image index
        run: cargo xtask release image-index dist --version "$RELEASE_VERSION"
      # In the C locale, so the lines are in the byte order of the names; written outside dist,
      # so that SHA256SUMS does not list itself.
      - name: SHA256SUMS
        working-directory: dist
        env:
          LC_ALL: C
        run: sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
      - run: mv "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS
      - name: The digest of SHA256SUMS, for attest
        id: digest
        run: echo "sha256=$(sha256sum dist/SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256sums
          path: |
            dist/SHA256SUMS
            dist/index.json
            dist/hello-index.json
            dist/hello-fail-ready-index.json
            dist/mdm-index.json
            dist/netboot.json
            dist/hkctl-${{ needs.version.outputs.version }}
            dist/hostkeeper-coordinator-${{ needs.version.outputs.version }}.image.json
          retention-days: 90
          if-no-files-found: error

  # Push to main only: build provenance for every summed file, an SBOM attestation for each
  # binary tarball (hostkeeper's, the coordinator's and hostkeeper-mdm's), and a provenance
  # attestation of each attested file alone (each binary tarball, package, deb, rpm, image and pkg, netboot.json and hkctl), whose bundle is copied beside
  # it as `<file>.sigstore.json` for a host that verifies without GitHub.
  attest:
    needs: [version, sums]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: dist
      - name: Refuse sums other than the build's
        env:
          SUMS_SHA256: ${{ needs.sums.outputs.sha256 }}
        run: /usr/bin/sha256sum --check --strict <<< "$SUMS_SHA256  dist/SHA256SUMS"
      - name: Refuse listed files that differ from the sums
        working-directory: dist
        run: /usr/bin/sha256sum --check --strict SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
          sbom-path: dist/hostkeeper-${{ needs.version.outputs.version }}-linux-x86_64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/hostkeeper-coordinator-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
          sbom-path: dist/hostkeeper-coordinator-${{ needs.version.outputs.version }}-linux-x86_64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/hostkeeper-mdm-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
          sbom-path: dist/hostkeeper-mdm-${{ needs.version.outputs.version }}-linux-x86_64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-linux-arm64.tar.gz
          sbom-path: dist/hostkeeper-${{ needs.version.outputs.version }}-linux-arm64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/hostkeeper-coordinator-${{ needs.version.outputs.version }}-linux-arm64.tar.gz
          sbom-path: dist/hostkeeper-coordinator-${{ needs.version.outputs.version }}-linux-arm64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/hostkeeper-mdm-${{ needs.version.outputs.version }}-linux-arm64.tar.gz
          sbom-path: dist/hostkeeper-mdm-${{ needs.version.outputs.version }}-linux-arm64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-macos-arm64.tar.gz
          sbom-path: dist/hostkeeper-${{ needs.version.outputs.version }}-macos-arm64.cdx.json
      - id: tarball-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
      - name: Name the bundle of the tarball of hostkeeper for linux-x86_64
        env:
          BUNDLE: ${{ steps.tarball-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-${V}-linux-x86_64.tar.gz.sigstore.json"
      - id: coordinator-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-coordinator-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
      - name: Name the bundle of the tarball of hostkeeper-coordinator for linux-x86_64
        env:
          BUNDLE: ${{ steps.coordinator-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-coordinator-${V}-linux-x86_64.tar.gz.sigstore.json"
      - id: mdm-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-mdm-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
      - name: Name the bundle of the tarball of hostkeeper-mdm for linux-x86_64
        env:
          BUNDLE: ${{ steps.mdm-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-mdm-${V}-linux-x86_64.tar.gz.sigstore.json"
      - id: package-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-linux-x86_64.tar.zst
      - name: Name the bundle of the package for linux-x86_64
        env:
          BUNDLE: ${{ steps.package-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-${V}-linux-x86_64.tar.zst.sigstore.json"
      - id: hello-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hello-${{ needs.version.outputs.version }}-linux-x86_64.tar.zst
      - name: Name the bundle of the hello package for linux-x86_64
        env:
          BUNDLE: ${{ steps.hello-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hello-${V}-linux-x86_64.tar.zst.sigstore.json"
      - id: hello-fail-ready-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hello-${{ needs.version.outputs.version }}-fail-ready-linux-x86_64.tar.zst
      - name: Name the bundle of the failing build of hello for linux-x86_64
        env:
          BUNDLE: ${{ steps.hello-fail-ready-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hello-${V}-fail-ready-linux-x86_64.tar.zst.sigstore.json"
      - id: mdm-package-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mdm-${{ needs.version.outputs.version }}-linux-x86_64.tar.zst
      - name: Name the bundle of the mdm package for linux-x86_64
        env:
          BUNDLE: ${{ steps.mdm-package-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/mdm-${V}-linux-x86_64.tar.zst.sigstore.json"
      - id: hello-deb-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hello_${{ needs.version.outputs.version }}_amd64.deb
      - name: Name the bundle of hello's .deb for linux-x86_64
        env:
          BUNDLE: ${{ steps.hello-deb-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hello_${V}_amd64.deb.sigstore.json"
      - id: hello-fail-ready-deb-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hello_${{ needs.version.outputs.version }}-fail-ready_amd64.deb
      - name: Name the bundle of the failing build of hello's .deb for linux-x86_64
        env:
          BUNDLE: ${{ steps.hello-fail-ready-deb-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hello_${V}-fail-ready_amd64.deb.sigstore.json"
      - id: mdm-deb-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mdm_${{ needs.version.outputs.version }}_amd64.deb
      - name: Name the bundle of mdm's .deb for linux-x86_64
        env:
          BUNDLE: ${{ steps.mdm-deb-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/mdm_${V}_amd64.deb.sigstore.json"
      - id: deb-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper_${{ needs.version.outputs.version }}_amd64.deb
      - name: Name the bundle of the deb for linux-x86_64
        env:
          BUNDLE: ${{ steps.deb-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper_${V}_amd64.deb.sigstore.json"
      - id: rpm-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hostkeeper-${{ needs.version.outputs.version }}-1.x86_64.rpm
      - name: Name the bundle of the rpm for linux-x86_64
        env:
          BUNDLE: ${{ steps.rpm-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/hostkeeper-${V}-1.x86_64.rpm.sigstore.json"
