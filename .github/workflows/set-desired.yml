# The CI client of hostkeeper (docs/design/two-programs.md, section 5): the one job of a
# service's release that sets the desired version of the service on the coordinator and waits
# for the fleet to converge. A service calls it from its own release job
# (docs/deploy/ci-client.md):
#
#   set-desired:
#     permissions:
#       contents: read
#       id-token: write
#     uses: komira-ai/hostkeeper/.github/workflows/set-desired.yml@<commit> # v<release>
#     with: ...
#
# The order of the steps is the point of this file, and the workflow lint
# (crates/xtask/tests/workflows, `set_desired.rs`) holds it. The command line `hk` of the
# pinned hostkeeper release, a tarball of the one file `hk`, is downloaded and proven first, by the commands of
# docs/deploy/verify-a-release.md, which the workflow lint (`verify_doc.rs`) keeps equal to the
# steps here: its SHA256SUMS, the tarball's attestation by `artifacts.yml` of komira-ai/hostkeeper on
# refs/heads/main for the pinned `hostkeeper_commit`, the attested commit compared with the pin,
# and, once unpacked, its `--version`. Nothing of ours runs before the attestation is verified, so those steps
# are `gh`, `jq` and coreutils. Every step in the job can read the token request variables once
# the job holds `id-token: write`, so no step before the verification uses an action, reads
# those variables or runs hk. A verification that fails stops the job before any token
# exists: the version is not set.
#
# A GitHub-hosted runner is not on the private network the coordinator's private listener is
# bound to. With `join_tailnet` true, one step after the verification joins the runner to the
# tailnet as an ephemeral node tagged `tailnet_tag`, `tag:hk-ci` unless the caller names the tag
# its tailnet's trust credential issues (docs/deploy/ci-client.md, "Reaching the coordinator").
# It is the one action of the job, pinned to a commit, and authenticates with a GitHub OIDC token
# exchanged by the tailnet's federated identity: no secret is stored. No step before it uses an
# action. The first step of the job checks `tailnet_tag`, whether or not the job joins: no other
# step but the join reads it. The join does not ping: one ping that went unanswered failed the
# whole job while the coordinator was up. Instead, once the CA is written, the step `reach` runs
# the verified hk's `tailnet-wait`, which asks the coordinator's `GET /v1/version` at
# `coordinator_url`, the address the calls talk to, in a bounded number of attempts; when none
# answers it leaves the tailnet and joins it again (`tailscale down`, `tailscale up`, which the
# join lets the runner's user run as the node's operator, without root) and asks as many times
# again. The job fails there only after both rounds, the step's log saying how each attempt
# ended (crates/hostkeeper-hk/src/tailnet_wait).
#
# Then the verified hk makes two calls, each one hk command that asks the runner for its
# own OIDC token (`--github-oidc-audience`; the set's diagnostics also go to its log): `releases set-desired`, with the request the `request`
# step wrote (the version and the targets; the coordinator checks them); and, when
# `wait` is true and the set succeeded,
# `releases wait`, which waits until the fleet converges, the service halts, another version is
# set or `max_polls` times 10 seconds pass, in held calls of `Releases.WaitConverged` of at most
# 60 seconds each, each with a token of its own: no wait rides on one connection for longer, so
# a path that drops a connection it has seen no byte on for minutes cuts one call at most, which
# hk asks again. Each answer that is not yet says each host not at the version, its state and
# since when, and why the plan waits; hk prints that table on stderr when it changes, and at the
# end. Both pass
# `--host-group` only when the `host_group` input is not empty: hk writes every flag it is
# given into the request, and a coordinator older than its client refuses a field it does not
# know, so an empty input sends the bytes it sent before the input existed. hk keeps the
# token in memory and sends it in the request's header: no file holds it, no argument
# list and no other step's environment. Each call runs with `continue-on-error`, its answer in
# a file (`--response-file`) and its diagnostics in another, so that the last step, which runs
# whatever happened before it, reads them with one jq program and writes the job's outputs.
#
# The names of the release's asset and tag are written once, in the job's `env`.
name: set-desired

on:
  workflow_call:
    inputs:
      service:
        description: The service whose desired version is set, as the coordinator names it.
        type: string
        required: true
      version:
        description: The version of the service to set.
        type: string
        required: true
      targets:
        description: "The targets of the version, one JSON object keyed by platform (linux-x86_64, linux-arm64, macos-arm64), each value {\"entries\": [...]} in the order the service prefers, as `cargo xtask release targets` writes them; under 128 KiB, the most the runner passes in one environment value or argument. Each host is ordered the entry of the installer it runs, else the first its daemon can install (docs/design/packages.md, section 3). Needs a coordinator that takes SetDesired with targets."
        type: string
        required: false
      host_group:
        description: "The host group the version is set in and waited on, as the coordinator names it. Empty: each group that lists the service (for a token whose allow-list entry names host_groups, each of those that lists it), the call sending no group, as before this input. A non-empty value needs a coordinator that holds host groups and the hk of a hostkeeper release that has --host-group. The coordinator has no built-in group: a name it does not hold, `all` included, is refused unknown_host_group."
        type: string
        required: false
        default: ""
      hostkeeper_version:
        description: "The hostkeeper release whose command line, hk, makes the calls, X.Y.Z, pinned by the caller. With `join_tailnet`, its hk must have `tailnet-wait`: the release built from the commit of this workflow that the caller pins, as every caller pins the two together."
        type: string
        required: true
      hostkeeper_commit:
        description: The commit of komira-ai/hostkeeper that release was built from, 40 lower-case hex digits, pinned by the caller.
        type: string
        required: true
      coordinator_url:
        description: The coordinator's private listener, https://<host>[:<port>].
        type: string
        required: true
      coordinator_ca:
        description: The PEM certificates of the CA the coordinator's certificate chains to.
        type: string
        required: true
      audience:
        description: The audience of the OIDC token, as the coordinator's allow-list entry for this repository names it.
        type: string
        required: true
      wait:
        description: Whether to wait for the fleet to converge on the version.
        type: boolean
        required: false
        default: true
      max_polls:
        description: How long to wait for the fleet to converge, in tens of seconds, from 1 to 180 (the wait is `hk releases wait` for this many times 10 seconds, in held calls of at most 60 seconds); a value above 180 ends the job with the reason `invalid_wait`, which hk gives it as the coordinator did.
        type: number
        required: false
        default: 180
      join_tailnet:
        description: Whether to join the tailnet, after the verification, to reach a coordinator_url on it.
        type: boolean
        required: false
        default: false
      tailnet_client_id:
        description: The client ID of the tailnet's federated identity for this repository; not a secret.
        type: string
        required: false
        default: ""
      tailnet_audience:
        description: The audience of that federated identity; not a secret.
        type: string
        required: false
        default: ""
      tailnet_coordinator:
        description: "Not read: the join no longer pings; a later step waits for the coordinator at `coordinator_url`. Kept so that a caller that passes it is not refused."
        type: string
        required: false
        default: ""
      tailnet_tag:
        description: "The tag the join gives the runner's node, the one the tailnet's federated identity for this repository issues: `tag:` and a Tailscale tag name, a lower-case letter, then lower-case letters, digits and `-`. Checked by the job's first step, which ends the job on any other value."
        type: string
        required: false
        default: tag:hk-ci
    outputs:
      desired_version:
        description: The desired version the coordinator stored; empty when it stored none.
        value: ${{ jobs.set-desired.outputs.desired_version }}
      converged:
        description: "`true` when the fleet converged on the version, `false` otherwise."
        value: ${{ jobs.set-desired.outputs.converged }}
      reason:
        description: "Why the job ended where it did, one token (a refusal token of the coordinator among them, such as `target_invalid`)."
        value: ${{ jobs.set-desired.outputs.reason }}

permissions: {}

defaults:
  run:
    shell: bash


jobs:
  set-desired:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      desired_version: ${{ steps.outputs.outputs.desired_version }}
      converged: ${{ steps.outputs.outputs.converged || 'false' }}
      reason: ${{ steps.outputs.outputs.reason }}
    env:
      # The hostkeeper release (docs/deploy/verify-a-release.md): its tag and the tarball of its
      # command line for this runner, linux-x86_64.
      HOSTKEEPER_TAG: v${{ inputs.hostkeeper_version }}
      HK_ASSET: hk-${{ inputs.hostkeeper_version }}-linux-x86_64.tar.gz
    steps:
      # `tailnet_tag` is `tag:` and a Tailscale tag name, or the job ends here, before anything is
      # downloaded and before the join, the one other step that reads it. jq exits 5 with the
      # error; the value comes from the step's environment, never written into the script.
      - name: Check the tailnet tag
        id: tailnet-tag
        env:
          TAILNET_TAG: ${{ inputs.tailnet_tag }}
        run: |
          jq --null-input --arg tag "$TAILNET_TAG" 'if $tag | test("^tag:[a-z][a-z0-9-]*\\z") then empty else error("tailnet_tag is not tag: followed by a Tailscale tag name (a lower-case letter, then lower-case letters, digits and -)") end'

      # The download proves nothing: the download is not trusted, the next three steps
      # decide (docs/deploy/verify-a-release.md, step 1).
      - name: Download hk of the hostkeeper release
        id: download
        run: |
          curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location \
            --create-dirs --output-dir "$RUNNER_TEMP/hk-release" \
            --remote-name "https://github.com/komira-ai/hostkeeper/releases/download/$HOSTKEEPER_TAG/$HK_ASSET" \
            --remote-name "https://github.com/komira-ai/hostkeeper/releases/download/$HOSTKEEPER_TAG/SHA256SUMS"

      # Verification 1 of 3: the downloaded files have the bytes SHA256SUMS lists.
      - name: Check hk against SHA256SUMS
        id: checksum
        working-directory: ${{ runner.temp }}/hk-release
        run: sha256sum --check --strict --ignore-missing SHA256SUMS

      # Verification 2 of 3: the attestation of the tarball of hk, signed by `artifacts.yml` of
      # komira-ai/hostkeeper on a GitHub-hosted runner, for a build of refs/heads/main at the
      # pinned commit.
      - name: Verify the attestation of hk
        id: attestation
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTKEEPER_COMMIT: ${{ inputs.hostkeeper_commit }}
        run: |
          gh attestation verify "$RUNNER_TEMP/hk-release/$HK_ASSET" \
            --repo komira-ai/hostkeeper \
            --signer-workflow komira-ai/hostkeeper/.github/workflows/artifacts.yml \
            --source-ref refs/heads/main \
            --source-digest "$HOSTKEEPER_COMMIT" \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/hk-release/attestation.json"

      # Verification 3 of 3: every verified attestation names the pinned commit as its source,
      # and no other (jq exits non-zero when the comparison is false).
      - name: Compare the attested source commit with hostkeeper_commit
        id: commit
        env:
          HOSTKEEPER_COMMIT: ${{ inputs.hostkeeper_commit }}
        run: jq --exit-status '[.[].verificationResult.signature.certificate.sourceRepositoryDigest] | unique == [env.HOSTKEEPER_COMMIT]' "$RUNNER_TEMP/hk-release/attestation.json"

      - name: Unpack the verified hk
        id: install
        run: tar -xzf "$RUNNER_TEMP/hk-release/$HK_ASSET" -C "$RUNNER_TEMP/hk-release" hk

      # hk says the release's version and the pinned commit, exactly.
      - name: Check the version of the verified hk
        id: version
        env:
          HOSTKEEPER_VERSION: ${{ inputs.hostkeeper_version }}
          HOSTKEEPER_COMMIT: ${{ inputs.hostkeeper_commit }}
        run: test "$("$RUNNER_TEMP/hk-release/hk" --version)" = "hk $HOSTKEEPER_VERSION+${HOSTKEEPER_COMMIT:0:12}"

      # Only with `join_tailnet`: the runner joins the tailnet, so that it can reach the private
      # listener. The first action of the job, after every verification step. The node is
      # ephemeral and tagged `tailnet_tag`, which the first step checked; it authenticates with a
      # GitHub OIDC token for the federated identity's audience, and the tailnet's ACL lets that
      # tag reach the coordinator's private listener. The Tailscale tarball is pinned by version and SHA-256.
      # `--operator=runner` lets the runner's user (`runner` on GitHub's Ubuntu runners) run
      # `tailscale down` and `tailscale up` for the rejoin of the step `reach`. No `ping`: the
      # step `reach` waits for the coordinator instead.
      - name: Join the tailnet
        id: tailnet
        if: ${{ inputs.join_tailnet }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ inputs.tailnet_client_id }}
          audience: ${{ inputs.tailnet_audience }}
          tags: ${{ inputs.tailnet_tag }}
          version: 1.94.2
          sha256sum: c6f99a5d774c7783b56902188d69e9756fc3dddfb08ac6be4cb2585f3fecdc32
          use-cache: false
          args: --operator=runner

      - name: Write the coordinator's CA
        id: ca
        env:
          COORDINATOR_CA: ${{ inputs.coordinator_ca }}
        run: printf '%s\n' "$COORDINATOR_CA" > "$RUNNER_TEMP/hk-coordinator-ca.pem"

      # Only with `join_tailnet`: the verified hk waits until the coordinator answers
      # `GET /v1/version` at `coordinator_url`, over the CA just written, with no token: 6
      # attempts 10 seconds apart; with none, `tailscale down`, `tailscale up` and 6 attempts
      # again (`hk tailnet-wait --help`). It fails the job only when neither round had an answer,
      # or the rejoin failed, saying how each ended; the set is then not made.
      - name: Wait for the coordinator on the tailnet
        id: reach
        if: ${{ inputs.join_tailnet }}
        env:
          COORDINATOR_URL: ${{ inputs.coordinator_url }}
        run: |
          "$RUNNER_TEMP/hk-release/hk" \
            --endpoint "$COORDINATOR_URL" \
            --ca-file "$RUNNER_TEMP/hk-coordinator-ca.pem" \
            tailnet-wait

      # The request of the set, in the request's canonical JSON names: the version and the
      # targets (the JSON object of the input, as an object). Every value comes from the step's
      # environment, never written into the script. A job whose targets are empty or are not one
      # JSON object stops here, before any token exists.
      - name: Write the request of the set
        id: request
        env:
          VERSION: ${{ inputs.version }}
          TARGETS: ${{ inputs.targets }}
        run: |
          jq --null-input --compact-output \
            --arg version "$VERSION" \
            --arg targets "$TARGETS" \
            '(if $targets == "" then error("give targets") else [$targets | try fromjson catch null] | if length == 1 and (.[0] | type) == "object" then .[0] else error("targets is not one JSON object") end end) as $parsed | {desired: {version: $version}, targets: $parsed}' \
            > "$RUNNER_TEMP/hk-request.json"

      # The first step that requests an OIDC token for the coordinator. Its outcome, its answer
      # and its diagnostics are read by the outputs step, so a failure goes on to it. The
      # diagnostics also go to the step's own log (`tee`), so a failed set names its cause there
      # (the coordinator's code and its `refused: <token>` line); the step ends with hk's exit
      # code. `--host-group` is passed as the one word `${HOST_GROUP:+"--host-group=$HOST_GROUP"}`,
      # which bash expands to nothing when the input is empty and to one argument otherwise.
      - name: Set the desired version
        id: set-desired
        continue-on-error: true
        env:
          SERVICE: ${{ inputs.service }}
          HOST_GROUP: ${{ inputs.host_group }}
          COORDINATOR_URL: ${{ inputs.coordinator_url }}
          AUDIENCE: ${{ inputs.audience }}
        run: |
          "$RUNNER_TEMP/hk-release/hk" \
            --endpoint "$COORDINATOR_URL" \
            --ca-file "$RUNNER_TEMP/hk-coordinator-ca.pem" \
            --github-oidc-audience "$AUDIENCE" \
            --response-file "$RUNNER_TEMP/hk-set.json" \
            releases set-desired \
            --service "$SERVICE" \
            --request "$RUNNER_TEMP/hk-request.json" \
            ${HOST_GROUP:+"--host-group=$HOST_GROUP"} \
            2> >(tee "$RUNNER_TEMP/hk-set.err" >&2)

      # One hk command, whose held calls of at most 60 seconds each take a token of their own.
      # `--wait-secs` is `max_polls` with a 0 appended, ten times it, as text: no arithmetic is
      # done on an input; hk refuses a bound above 1800 seconds (`invalid_wait`, the coordinator's
      # bound of one held call). `--host-group` is passed as in
      # the set. Its diagnostics, the table of what it waits on among them, go to its file and,
      # through `tee`, to this step's log as they come.
      - name: Wait for the fleet to converge
        id: wait
        if: ${{ inputs.wait && steps.set-desired.outcome == 'success' }}
        continue-on-error: true
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
          HOST_GROUP: ${{ inputs.host_group }}
          COORDINATOR_URL: ${{ inputs.coordinator_url }}
          AUDIENCE: ${{ inputs.audience }}
          MAX_POLLS: ${{ inputs.max_polls }}
        run: |
          "$RUNNER_TEMP/hk-release/hk" \
            --endpoint "$COORDINATOR_URL" \
            --ca-file "$RUNNER_TEMP/hk-coordinator-ca.pem" \
            --github-oidc-audience "$AUDIENCE" \
            --response-file "$RUNNER_TEMP/hk-wait.json" \
            releases wait \
            --service "$SERVICE" \
            --version "$VERSION" \
            --wait-secs "${MAX_POLLS}0" \
            ${HOST_GROUP:+"--host-group=$HOST_GROUP"} \
            2> >(tee "$RUNNER_TEMP/hk-wait.err" >&2)

      # Runs whatever happened before it. The program below (OUTPUTS_PROGRAM) reads the outcomes
      # of the two calls, their answers and their diagnostics (a file a call did not leave is
      # read as /dev/null), and prints the three outputs; it ends with exit 1 unless the reason is
      # `converged` or `not_waited`, its message the wait's diagnostics when the wait ran: what
      # it still waited on when it ended. Its table is docs/deploy/ci-client.md's "Outputs"; the
      # workflow lint's tests run it with jaq on one fixture per row. The files hold no token:
      # hk prints none.
      - name: Write the job's outputs
        id: outputs
        if: ${{ always() }}
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
          WAIT: ${{ inputs.wait }}
          SET_OUTCOME: ${{ steps.set-desired.outcome }}
          WAIT_OUTCOME: ${{ steps.wait.outcome }}
          SET_BODY: ${{ steps.set-desired.outcome == 'success' && format('{0}/hk-set.json', runner.temp) || '/dev/null' }}
          SET_ERR: ${{ steps.set-desired.outcome == 'failure' && format('{0}/hk-set.err', runner.temp) || '/dev/null' }}
          WAIT_BODY: ${{ steps.wait.outcome == 'success' && format('{0}/hk-wait.json', runner.temp) || '/dev/null' }}
          WAIT_ERR: ${{ (steps.wait.outcome == 'success' || steps.wait.outcome == 'failure') && format('{0}/hk-wait.err', runner.temp) || '/dev/null' }}
          OUTPUTS_PROGRAM: |
            # A token of the coordinator's refusals, and a version, as the coordinator spells them.
            # Each pattern ends with \z, the end of the text: jq's `$` also matches before a last
            # newline.
            def token: test("^[a-z0-9_]{1,64}\\z");
            def version_or_empty: if type == "string" and test("^[A-Za-z0-9_+][A-Za-z0-9._+-]{0,254}\\z") then . else "" end;
            # The refusal token of a call's diagnostics: its `refused: <token>` line, else no_answer.
            def refusal: [split("\n")[] | select(startswith("refused: ")) | ltrimstr("refused: ") | select(token)] | .[0] // "no_answer";
            # The one JSON value of a text; null for none (an empty file), several or not JSON.
            def json: [try fromjson catch null] | if length == 1 then .[0] else null end;
            def field($key): if type == "object" then .[$key] else null end;
            def ended($desired; $reason; $why; $log): {desired_version: $desired, converged: ($reason == "converged"), reason: $reason, why: $why, log: $log};
            ($version | version_or_empty) as $asked
            | ($set_body | json | field("desired") | field("version")) as $stored
            | ($wait_body | json | field("outcome")) as $outcome
            | {"WAIT_OUTCOME_CONVERGED": "converged", "WAIT_OUTCOME_HALTED": "halted", "WAIT_OUTCOME_SUPERSEDED": "superseded", "WAIT_OUTCOME_DEADLINE": "not_converged"} as $reasons
            | if $set_outcome == "skipped" or $set_outcome == "" then
                ended(""; ""; "a step before the set failed, so it did not run; the version of \($service) is not set"; "")
              elif $set_outcome != "success" then
                ($set_err | refusal) as $reason
                | if $reason == "no_answer" then
                    ended(""; $reason; "no answer to the set of \($service) \($asked); whether it is set is not known: read releases status before you retry"; $set_err)
                  else
                    ended(""; $reason; "the coordinator refused the set of \($service) \($asked): \($reason); it is not set"; $set_err)
                  end
              elif $stored != $version then
                ended($stored | version_or_empty; "not_stored"; "the coordinator did not store the version \($asked) of \($service)"; "")
              elif $wait != "true" then
                ended($asked; "not_waited"; ""; "")
              elif $wait_outcome == "failure" then
                ($wait_err | refusal) as $reason
                | ended($asked; $reason; "the version \($asked) of \($service) is set, but the wait ended with \($reason)"; $wait_err)
              elif $wait_outcome != "success" then
                ended($asked; "no_answer"; "the version \($asked) of \($service) is set, but the wait did not end"; "")
              else
                ($reasons[if ($outcome | type) == "string" then $outcome else "" end] // "no_answer") as $reason
                | ended($asked; $reason; "the version \($asked) of \($service) is set; the wait ended with \($reason)"; $wait_err)
              end
            | "desired_version=\(.desired_version)", "converged=\(.converged)", "reason=\(.reason)",
              if .reason == "converged" or .reason == "not_waited" then empty else "::error::\(.why)\n\(.log)" | halt_error(1) end
        run: |
          jq --null-input --raw-output \
            --arg service "$SERVICE" \
            --arg version "$VERSION" \
            --arg wait "$WAIT" \
            --arg set_outcome "$SET_OUTCOME" \
            --arg wait_outcome "$WAIT_OUTCOME" \
            --rawfile set_body "$SET_BODY" \
            --rawfile set_err "$SET_ERR" \
            --rawfile wait_body "$WAIT_BODY" \
            --rawfile wait_err "$WAIT_ERR" \
            "$OUTPUTS_PROGRAM" >> "$GITHUB_OUTPUT"
