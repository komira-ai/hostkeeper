# The CI client of hostkeeper (design, section 4.5): the one step of a service's release job
# that sets the desired version of the service on the coordinator and waits for the fleet to
# converge. A service calls it from its own release job (docs/deploy/ci-client.md):
#
#   set-desired:
#     permissions:
#       contents: read
#       id-token: write
#     uses: komira-ai/hostkeeper/.github/workflows/set-desired.yml@<commit> # v<release>
#     with: ...
#
# The order of the steps is the point of this file, and the workflow lint
# (crates/xtask/tests/workflows, `set_desired.rs`) holds it. The hostkeeper release is
# downloaded and proven first, by the commands of docs/deploy/verify-a-release.md, which the
# workflow lint (`verify_doc.rs`) keeps equal to the steps here: its
# SHA256SUMS, its attestation by `artifacts.yml` of komira-ai/hostkeeper on refs/heads/main for
# the pinned `hostkeeper_commit`, the attested commit compared with the pin, and the binary's
# `--version`. Nothing of ours runs before the attestation is verified, so those steps are `gh`,
# `jq` and coreutils. Every step in the job can read the token request variables once the job
# holds `id-token: write`, so no step before the verification uses an action, reads those
# variables or runs the hostkeeper program. A verification that fails stops the job before any
# token exists: the version is not set.
#
# A GitHub-hosted runner is not on the private network the coordinator's private listener is
# bound to. With `join_tailnet` true, one step after the verification joins the runner to the
# tailnet as an ephemeral node tagged `tag:hk-ci` (docs/deploy/ci-client.md, "Reaching the
# coordinator"). It is the one action of the job, pinned to a commit, and authenticates with a
# GitHub OIDC token exchanged by the tailnet's federated identity: no secret is stored. No step
# before it uses an action.
#
# Only then does the verified program run, as one command: `hostkeeper ci set-desired`
# (crates/hostkeeper-ci). It requests one OIDC token per call to the coordinator (each is good
# once), keeps it in a file only the runner user can read and removes it after the call, calls
# `releases set-desired` (with the one package digest, or with the release index and its digest,
# which the coordinator checks), reads `releases converge` at most `max_polls` times, and writes the
# job's outputs.
#
# Call it only once the release of the service is in the release channel: a host fetches the
# version from the channel, and `cargo xtask release channel-sync` stages a published release
# there (docs/deploy/release-channel.md, "Sync new releases into the channel"). The order is:
# the release is published, channel-sync stages it, then this workflow sets the desired version.
# A version set before the channel holds it leaves every host failing its fetch (`fetch_failed`)
# and retrying until it arrives.
#
# The names of the release's assets are written once, in the job's `env`.
name: set-desired

on:
  workflow_call:
    inputs:
      service:
        description: The service whose desired version is set, as the coordinator names it.
        type: string
        required: true
      version:
        description: The version of the service to set.
        type: string
        required: true
      package_digest:
        description: The SHA-256 of the one package of this version that every host is ordered, 64 lower-case hex digits. For a fleet of one platform. Give this, or release_index with release_index_digest.
        type: string
        required: false
      release_index:
        description: The text of the version's release index (index.json), byte for byte, at most 3 KiB (the coordinator takes a request of at most 4 KiB). Each host is ordered the package its platform has in it. Comes with release_index_digest; not with package_digest.
        type: string
        required: false
      release_index_digest:
        description: The SHA-256 of release_index, 64 lower-case hex digits, as the release job that published the index wrote it down.
        type: string
        required: false
      hostkeeper_version:
        description: The hostkeeper release whose program makes the calls, X.Y.Z, pinned by the caller.
        type: string
        required: true
      hostkeeper_commit:
        description: The commit of komira-ai/hostkeeper that release was built from, 40 lower-case hex digits, pinned by the caller.
        type: string
        required: true
      coordinator_url:
        description: The coordinator's private listener, https://<host>[:<port>].
        type: string
        required: true
      coordinator_ca:
        description: The PEM certificates of the CA the coordinator's certificate chains to.
        type: string
        required: true
      audience:
        description: The audience of the OIDC token, as the coordinator's allow-list entry for this repository names it.
        type: string
        required: true
      wait:
        description: Whether to wait for the fleet to converge on the version.
        type: boolean
        required: false
        default: true
      max_polls:
        description: The most convergence reads before the job fails, from 1 to 1000; one read every 10 seconds.
        type: number
        required: false
        default: 180
      join_tailnet:
        description: Whether to join the tailnet, after the verification, to reach a coordinator_url on it.
        type: boolean
        required: false
        default: false
      tailnet_client_id:
        description: The client ID of the tailnet's federated identity for this repository; not a secret.
        type: string
        required: false
        default: ""
      tailnet_audience:
        description: The audience of that federated identity; not a secret.
        type: string
        required: false
        default: ""
      tailnet_coordinator:
        description: The coordinator's name or address on the tailnet, which the join pings until it answers.
        type: string
        required: false
        default: ""
    outputs:
      desired_version:
        description: The desired version the coordinator stored; empty when it stored none.
        value: ${{ jobs.set-desired.outputs.desired_version }}
      converged:
        description: "`true` when the fleet converged on the version, `false` otherwise."
        value: ${{ jobs.set-desired.outputs.converged }}
      reason:
        description: "Why the job ended where it did, one token (a refusal token of the coordinator among them, such as `not_in_channel`, which is retryable once the release channel holds the version, or `channel_digest_mismatch`)."
        value: ${{ jobs.set-desired.outputs.reason }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  set-desired:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      desired_version: ${{ steps.set-desired.outputs.desired_version }}
      converged: ${{ steps.set-desired.outputs.converged || 'false' }}
      reason: ${{ steps.set-desired.outputs.reason }}
    env:
      # The hostkeeper release (docs/deploy/verify-a-release.md): its tag and the binary tarball
      # of this runner's platform, which holds the one file `hostkeeper`.
      HOSTKEEPER_TAG: v${{ inputs.hostkeeper_version }}
      HOSTKEEPER_ASSET: hostkeeper-${{ inputs.hostkeeper_version }}-linux-x86_64.tar.gz
    steps:
      # The download proves nothing: the release channel is not trusted, the next three steps
      # decide (docs/deploy/verify-a-release.md, step 1).
      - name: Download the hostkeeper release
        id: download
        run: |
          curl --proto =https --proto-redir =https --tlsv1.2 --fail --silent --show-error --location \
            --create-dirs --output-dir "$RUNNER_TEMP/hostkeeper-release" \
            --remote-name "https://github.com/komira-ai/hostkeeper/releases/download/$HOSTKEEPER_TAG/$HOSTKEEPER_ASSET" \
            --remote-name "https://github.com/komira-ai/hostkeeper/releases/download/$HOSTKEEPER_TAG/SHA256SUMS"

      # Verification 1 of 3: the downloaded files have the bytes SHA256SUMS lists.
      - name: Check the release against SHA256SUMS
        id: checksum
        working-directory: ${{ runner.temp }}/hostkeeper-release
        run: sha256sum --check --strict --ignore-missing SHA256SUMS

      # Verification 2 of 3: the tarball's attestation, signed by `artifacts.yml` of
      # komira-ai/hostkeeper on a GitHub-hosted runner, for a build of refs/heads/main at the
      # pinned commit.
      - name: Verify the attestation of the tarball
        id: attestation
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTKEEPER_COMMIT: ${{ inputs.hostkeeper_commit }}
        run: |
          gh attestation verify "$RUNNER_TEMP/hostkeeper-release/$HOSTKEEPER_ASSET" \
            --repo komira-ai/hostkeeper \
            --signer-workflow komira-ai/hostkeeper/.github/workflows/artifacts.yml \
            --source-ref refs/heads/main \
            --source-digest "$HOSTKEEPER_COMMIT" \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/hostkeeper-release/attestation.json"

      # Verification 3 of 3: every verified attestation names the pinned commit as its source,
      # and no other (jq exits non-zero when the comparison is false).
      - name: Compare the attested source commit with hostkeeper_commit
        id: commit
        env:
          HOSTKEEPER_COMMIT: ${{ inputs.hostkeeper_commit }}
        run: jq --exit-status '[.[].verificationResult.signature.certificate.sourceRepositoryDigest] | unique == [env.HOSTKEEPER_COMMIT]' "$RUNNER_TEMP/hostkeeper-release/attestation.json"

      - name: Unpack the verified hostkeeper
        id: unpack
        run: tar --extract --gzip --no-same-owner --file "$RUNNER_TEMP/hostkeeper-release/$HOSTKEEPER_ASSET" --one-top-level="$RUNNER_TEMP/hostkeeper-bin" hostkeeper

      # The binary says the release's version and the pinned commit, exactly.
      - name: Check the version of the verified hostkeeper
        id: version
        env:
          HOSTKEEPER_VERSION: ${{ inputs.hostkeeper_version }}
          HOSTKEEPER_COMMIT: ${{ inputs.hostkeeper_commit }}
        run: test "$("$RUNNER_TEMP/hostkeeper-bin/hostkeeper" --version)" = "hostkeeper $HOSTKEEPER_VERSION+${HOSTKEEPER_COMMIT:0:12}"

      # Only with `join_tailnet`: the runner joins the tailnet, so that it can reach the private
      # listener. The first action of the job, after every verification step. The node is
      # ephemeral and tagged `tag:hk-ci`; it authenticates with a GitHub OIDC token for the
      # federated identity's audience, and the tailnet's ACL lets that tag reach the coordinator's
      # private listener and nothing else. The Tailscale tarball is pinned by version and SHA-256.
      - name: Join the tailnet
        id: tailnet
        if: ${{ inputs.join_tailnet }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ inputs.tailnet_client_id }}
          audience: ${{ inputs.tailnet_audience }}
          tags: tag:hk-ci
          version: 1.94.2
          sha256sum: c6f99a5d774c7783b56902188d69e9756fc3dddfb08ac6be4cb2585f3fecdc32
          use-cache: false
          ping: ${{ inputs.tailnet_coordinator }}

      - name: Write the coordinator's CA
        id: ca
        env:
          COORDINATOR_CA: ${{ inputs.coordinator_ca }}
        run: printf '%s\n' "$COORDINATOR_CA" > "$RUNNER_TEMP/hostkeeper-coordinator-ca.pem"

      # The index is written exactly as given (printf, no newline added, the text in the
      # environment and never in the script). A job that gave none writes an empty file, which
      # the next step does not pass.
      - name: Write the release index
        id: index
        env:
          RELEASE_INDEX: ${{ inputs.release_index }}
        run: printf '%s' "$RELEASE_INDEX" > "$RUNNER_TEMP/hostkeeper-release-index.json"

      # The first step that requests an OIDC token for the coordinator: the verified program, as
      # one command.
      - name: Set the desired version and wait for the fleet
        id: set-desired
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
          PACKAGE_DIGEST: ${{ inputs.package_digest }}
          # The index file only when an index was given; an empty value is a flag left out.
          RELEASE_INDEX_FILE: ${{ inputs.release_index != '' && format('{0}/hostkeeper-release-index.json', runner.temp) || '' }}
          RELEASE_INDEX_DIGEST: ${{ inputs.release_index_digest }}
          COORDINATOR_URL: ${{ inputs.coordinator_url }}
          AUDIENCE: ${{ inputs.audience }}
          WAIT: ${{ inputs.wait }}
          MAX_POLLS: ${{ inputs.max_polls }}
        run: |
          "$RUNNER_TEMP/hostkeeper-bin/hostkeeper" ci set-desired \
            --service "$SERVICE" \
            --version "$VERSION" \
            --package-digest "$PACKAGE_DIGEST" \
            --release-index-file "$RELEASE_INDEX_FILE" \
            --release-index-digest "$RELEASE_INDEX_DIGEST" \
            --endpoint "$COORDINATOR_URL" \
            --ca-file "$RUNNER_TEMP/hostkeeper-coordinator-ca.pem" \
            --audience "$AUDIENCE" \
            --wait "$WAIT" \
            --max-polls "$MAX_POLLS" \
            --work-dir "$RUNNER_TEMP" \
            --web-roots /etc/ssl/certs/ca-certificates.crt \
            --github-output "$GITHUB_OUTPUT"

      - name: Remove the token file
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/hostkeeper-oidc-token"
