# The hello proof run of docs/hello.md, from CI: sets the desired version of the example service
# `hello` on the coordinator through the CI client (set-desired.yml, docs/deploy/ci-client.md),
# with the OIDC token GitHub issues to this workflow. It is the same path a service's release job
# takes, run by hand, so that path is proven on hello before a real service depends on it.
#
# Run by hand only (`workflow_dispatch`), from main. Two inputs:
#
# - `version`: a release of this repository, X.Y.Z, whose assets carry the hello packages;
# - `variant`: `hello` sets `<version>`; `fail-ready` sets `<version>-fail-ready`, the build whose
#   `/readyz` answers 503, which the hosts fail and the coordinator rolls back.
#
# The failing build's entries name the repository entry `komira-testing-fail` (its suite,
# `testing-fail`) with the Debian version `<version>~fail.ready`, which sorts below the release's
# (`~`): a host takes it only with that entry placed (docs/hello.md, "Before you start"), and
# apt never takes it for the release.
#
# `release` reads the variant's .deb for each Linux architecture with its bundle, and for `hello`
# its signed .pkg with the .pkg's bundle (`MACOS`; the failing build has no .pkg), from the
# release, and `cargo xtask release targets` writes the targets: per platform, the variant's
# native entry alone (docs/design/packages-native.md section 10.5, A24), its manifest the one
# compiled into xtask. A Linux host installs the package of the repository's testing suite
# (`hello`) or of its testing-fail suite (`fail-ready`); for `hello`, the macOS list holds the
# .pkg's `macos-pkg` entry alone, which a Mac whose daemon announces `macos-pkg` (its signers
# file loaded, `/usr/sbin/installer` and `/usr/sbin/pkgutil` present) takes, and a Mac that does
# not announce it is ordered nothing. It holds no token right but `contents: read`, and runs
# nothing of the release. `set-desired` calls the CI client with the targets alone, so each host is ordered its
# own platform's native package. It is pinned
# like any caller's: the `uses:` commit with its release as the comment, and `hostkeeper_version`
# and `hostkeeper_commit` of that same release. The pin is the CI client's revision the workflow
# lint names (`callers.rs`, `CLIENT_COMMIT`), the one release.yml pins too: the client that takes
# targets and the tailnet tag, one set and one held wait. The coordinator, its CA, the audience
# and the tailnet tag (`HOSTKEEPER_TAILNET_TAG`, `tag:ci`, which the client checks at its first
# step, with or without the join) are repository variables; the coordinator's allow-list entry
# for this workflow names `hello` (docs/deploy/ci-client.md, "The allow-list entry"). As
# release.yml's call does, the client joins the tailnet when `HOSTKEEPER_TAILNET_CLIENT_ID` is
# set (with `HOSTKEEPER_TAILNET_AUDIENCE` and `HOSTKEEPER_TAILNET_COORDINATOR`), so a coordinator
# served only on the tailnet is reachable; empty, no join.
#
# The workflow lint (crates/xtask/tests/workflows, `callers.rs`) holds this file to that shape.
name: hello-desired

on:
  workflow_dispatch:
    inputs:
      version:
        description: The hostkeeper release whose hello package is set, X.Y.Z.
        type: string
        required: true
      variant:
        description: "`hello` sets the version; `fail-ready` sets its failing build, <version>-fail-ready."
        type: choice
        required: true
        default: hello
        options:
          - hello
          - fail-ready

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      targets: ${{ steps.targets.outputs.targets }}
    env:
      RELEASE: ${{ inputs.version }}
      VERSION: ${{ inputs.variant == 'fail-ready' && format('{0}-fail-ready', inputs.version) || inputs.version }}
      FAIL_READY: ${{ inputs.variant == 'fail-ready' && 'true' || '' }}
      MACOS: ${{ inputs.variant == 'hello' && 'true' || '' }}
    steps:
      # A release is X.Y.Z: nothing else reaches the download or the job's outputs.
      - name: Refuse a version that is not X.Y.Z
        run: '[[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      # For each Linux architecture the variant's .deb with the .deb's bundle, and for `hello` the
      # macOS .pkg with its bundle (`MACOS`, unset for the failing build), from the release's
      # assets. One curl, its URL globs expanded by curl itself (the text is quoted). A transient
      # failure of a transfer is retried, as every download of a workflow is (`downloads.rs` of
      # the workflow lint); one that still fails ends it at once (`--fail-early`), so nothing is
      # set.
      - name: Download the variant's .debs and their bundles
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --fail-early --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --create-dirs --output-dir "$RUNNER_TEMP/release" --remote-name-all "https://github.com/$GITHUB_REPOSITORY/releases/download/v$RELEASE/hello_${VERSION}_{amd64,arm64}.deb{,.sigstore.json}" ${MACOS:+"https://github.com/$GITHUB_REPOSITORY/releases/download/v$RELEASE/hello-$RELEASE-macos-arm64.pkg{,.sigstore.json}"}
      # Refused, every problem named, unless each native package is there and its bundle lists
      # it, and a .deb's control is hello's at the Debian version for its architecture.
      - name: The targets of the variant's package
        id: targets
        run: cargo xtask release targets --service hello ${FAIL_READY:+--fail-ready} --version "$RELEASE" --dir "$RUNNER_TEMP/release" --repo "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"
      - name: The version
        id: version
        run: printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

  set-desired:
    needs: [release]
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write
    uses: komira-ai/hostkeeper/.github/workflows/set-desired.yml@2c767d1842a88edb7120073d2dff3b4bfccc834c # v0.1.184
    with:
      service: hello
      version: ${{ needs.release.outputs.version }}
      targets: ${{ needs.release.outputs.targets }}
      hostkeeper_version: 0.1.184
      hostkeeper_commit: 2c767d1842a88edb7120073d2dff3b4bfccc834c
      coordinator_url: ${{ vars.HOSTKEEPER_COORDINATOR_URL }}
      coordinator_ca: ${{ vars.HOSTKEEPER_COORDINATOR_CA }}
      audience: ${{ vars.HOSTKEEPER_CI_AUDIENCE }}
      join_tailnet: ${{ vars.HOSTKEEPER_TAILNET_CLIENT_ID != '' }}
      tailnet_client_id: ${{ vars.HOSTKEEPER_TAILNET_CLIENT_ID }}
      tailnet_audience: ${{ vars.HOSTKEEPER_TAILNET_AUDIENCE }}
      tailnet_coordinator: ${{ vars.HOSTKEEPER_TAILNET_COORDINATOR }}
      tailnet_tag: ${{ vars.HOSTKEEPER_TAILNET_TAG }}
