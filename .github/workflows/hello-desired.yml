# The hello proof run of docs/hello.md, from CI: sets the desired version of the example service
# `hello` on the coordinator through the CI client (set-desired.yml, docs/deploy/ci-client.md),
# with the OIDC token GitHub issues to this workflow. It is the same path a service's release job
# takes, run by hand, so that path is proven on hello before a real service depends on it.
#
# Run by hand only (`workflow_dispatch`), from main. Two inputs:
#
# - `version`: a release of this repository, X.Y.Z, whose assets carry the hello packages;
# - `variant`: `hello` sets `<version>`; `fail-ready` sets `<version>-fail-ready`, the build whose
#   `/readyz` answers 503, which the hosts fail and the coordinator rolls back.
#
# `release` reads the variant's release index (`hello-index.json` or
# `hello-fail-ready-index.json`), its archives and their bundles from the release, and
# `cargo xtask release targets` writes the targets: one hostkeeper-archive entry per platform the
# index lists (docs/design/packages.md, section 3.7). It holds no token right but
# `contents: read`, and runs nothing of the release. `set-desired` calls the CI client with the
# targets, the index and the index's SHA-256, so each host, of any platform, is ordered its own
# platform's package (a daemon before targets through the index). It is pinned
# like any caller's: the `uses:` commit with its release as the comment, and `hostkeeper_version`
# and `hostkeeper_commit` of that same release. The pin is the CI client's revision the workflow
# lint names (`callers.rs`, `CLIENT_COMMIT`), the one release.yml pins too: the client that takes
# targets and the tailnet tag, one set and one held wait. The coordinator, its CA, the audience
# and the tailnet tag (`HOSTKEEPER_TAILNET_TAG`, `tag:ci`, which the client checks at its first
# step even though this job does not join the tailnet) are repository variables; the
# coordinator's allow-list entry for this workflow names `hello` (docs/deploy/ci-client.md, "The
# allow-list entry").
#
# The workflow lint (crates/xtask/tests/workflows, `callers.rs`) holds this file to that shape.
name: hello-desired

on:
  workflow_dispatch:
    inputs:
      version:
        description: The hostkeeper release whose hello package is set, X.Y.Z.
        type: string
        required: true
      variant:
        description: "`hello` sets the version; `fail-ready` sets its failing build, <version>-fail-ready."
        type: choice
        required: true
        default: hello
        options:
          - hello
          - fail-ready

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      version: ${{ steps.index.outputs.version }}
      release_index: ${{ steps.index.outputs.release_index }}
      release_index_digest: ${{ steps.index.outputs.release_index_digest }}
      targets: ${{ steps.targets.outputs.targets }}
    env:
      RELEASE: ${{ inputs.version }}
      VERSION: ${{ inputs.variant == 'fail-ready' && format('{0}-fail-ready', inputs.version) || inputs.version }}
      INDEX: ${{ inputs.variant == 'fail-ready' && 'hello-fail-ready-index.json' || 'hello-index.json' }}
      FAIL_READY: ${{ inputs.variant == 'fail-ready' && 'true' || '' }}
    steps:
      # A release is X.Y.Z: nothing else reaches the download or the job's outputs.
      - name: Refuse a version that is not X.Y.Z
        run: '[[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      # The variant's index, and for each platform its archive and the archive's bundle, from
      # the release's assets. One curl, its URL globs expanded by curl itself (the text is
      # quoted). A transient failure of a transfer is retried, as every download of a workflow is
      # (`downloads.rs` of the workflow lint); one that still fails ends it at once
      # (`--fail-early`), so nothing is set.
      - name: Download the variant's index, archives and bundles
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --fail-early --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --create-dirs --output-dir "$RUNNER_TEMP/release" --remote-name-all "https://github.com/$GITHUB_REPOSITORY/releases/download/v$RELEASE/$INDEX" "https://github.com/$GITHUB_REPOSITORY/releases/download/v$RELEASE/hello-$VERSION-{linux-arm64,linux-x86_64,macos-arm64}.tar.zst{,.sigstore.json}"
      # Refused, every problem named, unless the index is hello's at the version, lists every
      # platform, and each archive, bundle and manifest checks out against it.
      - name: The targets of the variant's package
        id: targets
        run: cargo xtask release targets --service hello ${FAIL_READY:+--fail-ready} --version "$RELEASE" --dir "$RUNNER_TEMP/release" --repo "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"
      # The index is canonical (one line, no final line break: `release targets` refused
      # anything else), so the output carries its exact bytes.
      - name: The version, the release index and its SHA-256
        id: index
        run: printf 'version=%s\nrelease_index=%s\nrelease_index_digest=%s\n' "$VERSION" "$(< "$RUNNER_TEMP/release/$INDEX")" "$(sha256sum "$RUNNER_TEMP/release/$INDEX" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  set-desired:
    needs: [release]
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write
    uses: komira-ai/hostkeeper/.github/workflows/set-desired.yml@2c767d1842a88edb7120073d2dff3b4bfccc834c # v0.1.184
    with:
      service: hello
      version: ${{ needs.release.outputs.version }}
      targets: ${{ needs.release.outputs.targets }}
      release_index: ${{ needs.release.outputs.release_index }}
      release_index_digest: ${{ needs.release.outputs.release_index_digest }}
      hostkeeper_version: 0.1.184
      hostkeeper_commit: 2c767d1842a88edb7120073d2dff3b4bfccc834c
      coordinator_url: ${{ vars.HOSTKEEPER_COORDINATOR_URL }}
      coordinator_ca: ${{ vars.HOSTKEEPER_COORDINATOR_CA }}
      audience: ${{ vars.HOSTKEEPER_CI_AUDIENCE }}
      tailnet_tag: ${{ vars.HOSTKEEPER_TAILNET_TAG }}
