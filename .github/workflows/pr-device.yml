# The macOS and privileged jobs of every pull request. ci.yml runs the Linux checks (lint, test
# and coverage) as before; this workflow adds what before ran only after a merge to main
# (privileged.yml), so that a change that breaks the Mac or the service managers is red before it
# merges. Its jobs:
#
# - changes: on Linux, whether the pull request changes a path the macOS jobs build, test or read.
#   It lists the paths changed between the merge base of the pull request's base and its head
#   (the event's base and head SHAs) and answers `needed=false` only when every one is on the skip
#   list of its step; any other path, a diff that cannot be computed, or an event that is not a
#   pull request answers `needed=true`.
# - macos-test: the tests of the crates the `hostkeeper` and `hello` binaries are built from (the
#   code a Mac runs), on a GitHub-hosted macOS runner (macos-15), as the runner's user, with no
#   fail-fast so that a run reports every failure. The rest of the workspace (the coordinator's
#   MDM and network-install servers, the release tooling) runs on Linux only and does not build
#   for macOS; the workflow lint holds the crate list to the binaries' path dependencies.
# - macos-device: the device tests under launchd as root, privileged.yml's job of that name, step
#   for step.
# - privileged: the privileged tests against systemd as root, privileged.yml's job of that name,
#   step for step. It runs on every pull request, whatever changes says.
# - openrc-device: the daemon under OpenRC in an Alpine Linux container, as root, privileged.yml's
#   job of that name, step for step. It runs on every pull request, whatever changes says.
#
# macos-test and macos-device run unless changes passed and answered `needed=false`; a changes
# job that failed or gave no answer runs them. Their checks are named `macos-test on macos-15`
# and `macos-device on macos-15`. The checks named `macos-test` and `macos-device`, required of
# every pull request as before, are the jobs macos-test-check and macos-device-check: on Linux,
# after the macOS job whatever it did, each passes when its macOS job passed, or states that the
# path rule skipped it when it was skipped on `needed=false`, and fails otherwise. So each
# required name is the check of exactly one job, which always runs. `privileged` and
# `openrc-device` are checks of their own.
#
# A pull request's newer run cancels its older one. No job of it holds a write scope or names a
# secret or the token, and no cache is saved from a pull request (each copied job's save step
# runs only on a push, which never starts this workflow): the jobs restore the caches
# privileged.yml's runs on main saved, and macos-test the one of macos-device. The workflow lint
# (crates/xtask/tests/workflows, pr_device.rs and pr_paths.rs) holds this file to its trigger, its
# concurrency, its top-level keys, its jobs, their runners and conditions, the copied jobs to
# privileged.yml's (but the name, needs and condition of macos-device), the skip list to entries
# no macOS job builds or reads, and to no secret; it refuses a macOS job or a job as root in any
# other workflow that runs for a pull request.
#
# privileged.yml still runs every job, macos-device included, after every merge to main, and a
# release still waits for that run on its commit (release.yml); this workflow is no part of a
# release.
name: pr-device

on:
  pull_request:

permissions: {}

# A pull request's newer run cancels its older one, so a burst of pushes holds at most one macOS
# runner per job.
concurrency:
  group: pr-device-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts only bloat a cached target directory.
  CARGO_INCREMENTAL: 0

jobs:
  # Whether the pull request changes a path the macOS jobs build, test or read: `needed` is
  # `false` only on a pull request whose diff step exited 0, that is, when git found no changed
  # path outside the skip list. git exits 1 when it finds one and 128 when it cannot compute the
  # diff (a SHA missing or empty); either fails the step (continue-on-error keeps this job green)
  # and answers `true`. The checkout holds the whole history, so the merge base of the two SHAs is
  # in it; `--merge-base` diffs that merge base against the head, so what the base branch gained
  # since (a merge from main into the pull request) is not counted, and `--no-renames` lists a
  # rename as its old and its new path.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      needed: ${{ github.event_name != 'pull_request' || steps.diff.outcome != 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The skip list: the paths no macOS job compiles, runs or reads (the workflow lint checks
      # that no source a macOS job compiles, and no file of a crate whose tests run on macOS,
      # names one). A path not on it, a new file included, runs the macOS jobs.
      # - docs/*/** (agents, deploy, design, operations, report) and the files of docs/ but
      #   macos.md and conformance.md (read by the tests of hostkeeper-launchd and
      #   hostkeeper-hook, which run on macOS): prose for readers.
      # - AGENTS.md, CLAUDE.md, CONTRIBUTING.md, SECURITY.md: the rules and guides for
      #   contributors. README.md and MIGRATION.md are not on the list: the tests of
      #   hostkeeper-daemon, hostkeeper-hook and hostkeeper-steps read them.
      # - The workflows with no macOS job that no macOS job copies: advisories, ci, hello-desired,
      #   net-install, set-desired and trusted-root. pr-device.yml, privileged.yml (whose jobs this
      #   file copies), artifacts.yml and release.yml are not on the list.
      # - The test targets of crates/hostkeeper-privileged that macos-device does not name with
      #   `--test` and that no other file of the crate includes as a module: the Linux device,
      #   package and network-install tests and their rigs. cargo builds only the targets a
      #   `--test` names, so none of them is compiled on macOS. The modules the targets share
      #   (support/, e2e/, shared/, across/, netinstall/) are not on the list.
      - name: Changed paths outside the skip list (exit 1), or no diff (exit 128)
        id: diff
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          git diff --quiet --no-renames --merge-base "$BASE_SHA" "$HEAD_SHA" -- .
          ':(exclude,glob)docs/*/**'
          ':(exclude,glob)docs/admin.md'
          ':(exclude,glob)docs/cli.md'
          ':(exclude,glob)docs/enrollment-coordinator.md'
          ':(exclude,glob)docs/gateway.md'
          ':(exclude,glob)docs/hello.md'
          ':(exclude,glob)docs/package-format.md'
          ':(exclude,glob)docs/service-observation.md'
          ':(exclude,glob)docs/ui-serving.md'
          ':(exclude,glob)AGENTS.md'
          ':(exclude,glob)CLAUDE.md'
          ':(exclude,glob)CONTRIBUTING.md'
          ':(exclude,glob)SECURITY.md'
          ':(exclude,glob).github/workflows/advisories.yml'
          ':(exclude,glob).github/workflows/ci.yml'
          ':(exclude,glob).github/workflows/hello-desired.yml'
          ':(exclude,glob).github/workflows/net-install.yml'
          ':(exclude,glob).github/workflows/set-desired.yml'
          ':(exclude,glob).github/workflows/trusted-root.yml'
          ':(exclude,glob)crates/hostkeeper-privileged/tests/first_boot.rs'
          ':(exclude,glob)crates/hostkeeper-privileged/tests/fixture_hook.rs'
          ':(exclude,glob)crates/hostkeeper-privileged/tests/install_apt.rs'
          ':(exclude,glob)crates/hostkeeper-privileged/tests/install_uninstall.rs'
          ':(exclude,glob)crates/hostkeeper-privileged/tests/linux_packages.rs'
          ':(exclude,glob)crates/hostkeeper-privileged/tests/mdm_cert_units.rs'
          ':(exclude,glob)crates/hostkeeper-privileged/tests/net_install.rs'
          ':(exclude,glob)crates/hostkeeper-privileged/tests/net_install_arm64.rs'
          ':(exclude,glob)crates/hostkeeper-privileged/tests/net_install_rig.rs'
          ':(exclude,glob)crates/hostkeeper-privileged/tests/observer.rs'
          ':(exclude,glob)crates/hostkeeper-privileged/tests/self_update.rs'
          ':(exclude,glob)crates/hostkeeper-privileged/tests/selfupdate_daemon.rs'
          ':(exclude,glob)crates/hostkeeper-privileged/tests/tierstore_rig.rs'
          ':(exclude,glob)crates/hostkeeper-privileged/tests/tierstore_shaped.rs'
          ':(exclude,glob)crates/hostkeeper-privileged/tests/transient_unit.rs'
          ':(exclude,glob)crates/hostkeeper-privileged/tests/unit_control.rs'

  # The tests of the Mac's crates, as the runner's user. The build restores the cache of
  # privileged.yml's macos-device job (this job saves none), whose dependencies it shares. Its
  # check is `macos-test on macos-15`; the required check `macos-test` is macos-test-check.
  macos-test:
    name: macos-test on macos-15
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.needed == 'false') }}
    runs-on: macos-15
    permissions:
      contents: read
    # A bound on the whole job, against a test that hangs; no test depends on it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The system the tests run on, for the log (evidence, not a gate).
      - name: sw_vers
        run: sw_vers
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-macos-device-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-macos-device-
      - name: Build the tests of the Mac's crates
        run: cargo test --locked --no-run -p hello -p hostkeeper -p hostkeeper-config -p hostkeeper-daemon -p hostkeeper-enroll -p hostkeeper-hook -p hostkeeper-install -p hostkeeper-launchd -p hostkeeper-link -p hostkeeper-observe -p hostkeeper-openrc -p hostkeeper-package -p hostkeeper-placed -p hostkeeper-proto -p hostkeeper-release -p hostkeeper-steps -p hostkeeper-unpack -p hostkeeper-wire
      - name: Run the tests of the Mac's crates
        run: cargo test --locked --no-fail-fast -p hello -p hostkeeper -p hostkeeper-config -p hostkeeper-daemon -p hostkeeper-enroll -p hostkeeper-hook -p hostkeeper-install -p hostkeeper-launchd -p hostkeeper-link -p hostkeeper-observe -p hostkeeper-openrc -p hostkeeper-package -p hostkeeper-placed -p hostkeeper-proto -p hostkeeper-release -p hostkeeper-steps -p hostkeeper-unpack -p hostkeeper-wire

  # The required check `macos-test`: it runs after macos-test whatever it did, cancelled included, and
  # passes when macos-test passed, or when changes passed and answered `needed=false` and macos-test was
  # skipped (the first step says so); it fails otherwise.
  macos-test-check:
    name: macos-test
    needs: [changes, macos-test]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Skipped by the path rule
        if: ${{ needs.macos-test.result == 'skipped' && needs.changes.result == 'success' && needs.changes.outputs.needed == 'false' }}
        run: echo "macos-test was skipped by the path rule of pr-device.yml; every changed path is on the skip list of its job changes"
      - name: macos-test on macos-15 did not pass
        if: ${{ always() && !(needs.macos-test.result == 'success' || (needs.macos-test.result == 'skipped' && needs.changes.result == 'success' && needs.changes.outputs.needed == 'false')) }}
        run: exit 1

  # privileged.yml's job macos-device; the workflow lint holds it, key for key, to that job, but
  # its name, needs and condition, which are macos-test's. Its check is `macos-device on
  # macos-15`; the required check `macos-device` is macos-device-check.
  macos-device:
    name: macos-device on macos-15
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.needed == 'false') }}
    runs-on: macos-15
    permissions:
      contents: read
    # A bound on the whole job, against a test that hangs; no test depends on it.
    timeout-minutes: 45
    env:
      # The gh the installer pkg installs at /usr/local/lib/hostkeeper/gh, the same version and
      # SHA-256 as artifacts.yml's macOS build: device_mac_e2e.rs installs this file at that path
      # and checks its packages' attestations with it, offline, against a test trust root.
      GH_VERSION: 2.103.3
      GH_SHA256: d700207eae9ae98fe2b89535c2c087c07823d4628c56364695a5a07ef311c062
      PREVIOUS_RELEASE_URL: https://github.com/komira-ai/hostkeeper/releases/download/v0.1.218/hostkeeper-0.1.218-macos-arm64.tar.gz
      PREVIOUS_RELEASE_SHA256: 5f2a333b3c180f94538ed3fee80e7941f6c33c0e2d42684cf3d367554cebcce7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The system the tests run against, for the log (evidence, not a gate).
      - name: sw_vers
        run: sw_vers
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Restore the pinned gh.zip from the cache
        id: gh-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.zip
          key: pinned-gh-${{ env.GH_VERSION }}-${{ env.GH_SHA256 }}
      - name: Download gh on a cache miss (HTTPS only, redirects included)
        id: gh-download
        if: ${{ steps.gh-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/gh.zip" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_macOS_arm64.zip"
      - name: Say why the job stops when gh.zip is neither cached nor downloadable
        if: ${{ !cancelled() && steps.gh-download.outcome == 'failure' }}
        run: echo "::error::gh.zip is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Check gh (pinned checksum)
        id: gh-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/gh.zip" --sha256 "$GH_SHA256" --out "$RUNNER_TEMP/gh-checked.zip"
      - name: Save the checked gh.zip to the cache
        if: ${{ !cancelled() && steps.gh-check.outcome == 'success' && steps.gh-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.zip
          key: ${{ steps.gh-cache.outputs.cache-primary-key }}
      - name: Unpack gh where the tests find it
        run: unzip -o -j -q "$RUNNER_TEMP/gh-checked.zip" "gh_${GH_VERSION}_macOS_arm64/bin/gh" -d target/privileged-tools
      # The released daemon self_update_across_releases.rs updates from: the binary tarball of the
      # release crates/hostkeeper-privileged/previous-release.toml pins for this platform (the
      # workflow lint holds PREVIOUS_RELEASE_URL and PREVIOUS_RELEASE_SHA256 equal to it). The test
      # checks the file against the pin again and fetches nothing itself.
      - name: Restore the pinned previous-release.tar.gz from the cache
        id: previous-release-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/previous-release.tar.gz
          key: pinned-previous-release-${{ env.PREVIOUS_RELEASE_URL }}-${{ env.PREVIOUS_RELEASE_SHA256 }}
      - name: Download the previous release on a cache miss (HTTPS only, redirects included)
        id: previous-release-download
        if: ${{ steps.previous-release-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/previous-release.tar.gz" "$PREVIOUS_RELEASE_URL"
      - name: Say why the job stops when previous-release.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.previous-release-download.outcome == 'failure' }}
        run: echo "::error::previous-release.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Check the previous release (pinned checksum)
        id: previous-release-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/previous-release.tar.gz" --sha256 "$PREVIOUS_RELEASE_SHA256" --out target/previous-release/hostkeeper.tar.gz
      - name: Save the checked previous-release.tar.gz to the cache
        if: ${{ !cancelled() && steps.previous-release-check.outcome == 'success' && steps.previous-release-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/previous-release.tar.gz
          key: ${{ steps.previous-release-cache.outputs.cache-primary-key }}
      - name: Build the macOS device tests as the runner's user
        run: cargo test -p hostkeeper-privileged --features privileged --locked --no-run --test device_mac --test install_macos_pkg
      - name: Run the macOS device tests as root
        run: cargo test -p hostkeeper-privileged --features privileged --locked --config "target.'cfg(unix)'.runner = 'sudo'" --test device_mac --test install_macos_pkg -- --test-threads=1 --nocapture
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The required check `macos-device`: it runs after macos-device whatever it did, cancelled included, and
  # passes when macos-device passed, or when changes passed and answered `needed=false` and macos-device was
  # skipped (the first step says so); it fails otherwise.
  macos-device-check:
    name: macos-device
    needs: [changes, macos-device]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Skipped by the path rule
        if: ${{ needs.macos-device.result == 'skipped' && needs.changes.result == 'success' && needs.changes.outputs.needed == 'false' }}
        run: echo "macos-device was skipped by the path rule of pr-device.yml; every changed path is on the skip list of its job changes"
      - name: macos-device on macos-15 did not pass
        if: ${{ always() && !(needs.macos-device.result == 'success' || (needs.macos-device.result == 'skipped' && needs.changes.result == 'success' && needs.changes.outputs.needed == 'false')) }}
        run: exit 1

  # privileged.yml's job privileged; the workflow lint holds it, key for key, to that job.
  privileged:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # A bound on the whole job, against a test that hangs; no test depends on it.
    timeout-minutes: 60
    env:
      GH_VERSION: 2.102.1
      GH_SHA256: 77b9e297e94c50336823d0f84de7ef1be60cba704601fa0d98f129f47a94987b
      PREVIOUS_RELEASE_URL: https://github.com/komira-ai/hostkeeper/releases/download/v0.1.218/hostkeeper-0.1.218-linux-x86_64.tar.gz
      PREVIOUS_RELEASE_SHA256: f6a483efffc178273d22a49d3412aae4596162a476608c89cf7d2d380ae6e7ea
      NFPM_VERSION: 2.48.0
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The service manager the tests run against, for the log (evidence, not a gate).
      - name: systemctl version
        run: systemctl --version
      - name: systemd-analyze version
        run: systemd-analyze --version
      # A runner image without systemd as PID 1 is a setup failure, not a test to skip: this step
      # fails, and its name says why. (The tests' own check refuses such a host too, with the
      # same reason.)
      - name: Fail unless systemd is the service manager (/run/systemd/system is a directory)
        run: test -d /run/systemd/system
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # The gh a host checks every package's attestation with, the one the Linux packages install
      # as /usr/lib/hostkeeper/gh (artifacts.yml pins the same version and SHA-256): Ubuntu 24.04's
      # own gh has no `gh attestation`. tierstore_shaped.rs installs this file at that path and
      # checks its fixture's attestation with it, offline, against a test trust root.
      - name: Restore the pinned gh.tar.gz from the cache
        id: gh-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.tar.gz
          key: pinned-gh-${{ env.GH_VERSION }}-${{ env.GH_SHA256 }}
      - name: Download gh on a cache miss (HTTPS only, redirects included)
        id: gh-download
        if: ${{ steps.gh-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
      - name: Say why the job stops when gh.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.gh-download.outcome == 'failure' }}
        run: echo "::error::gh.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Install gh (pinned checksum)
        id: gh-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/gh.tar.gz" --sha256 "$GH_SHA256" --out target/privileged-tools/gh --extract tar.gz --member "gh_${GH_VERSION}_linux_amd64/bin/gh"
      - name: Save the checked gh.tar.gz to the cache
        if: ${{ !cancelled() && steps.gh-check.outcome == 'success' && steps.gh-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gh.tar.gz
          key: ${{ steps.gh-cache.outputs.cache-primary-key }}
      # The released daemon self_update_across_releases.rs updates from: the binary tarball of the
      # release crates/hostkeeper-privileged/previous-release.toml pins for this platform (the
      # workflow lint holds PREVIOUS_RELEASE_URL and PREVIOUS_RELEASE_SHA256 equal to it). The test
      # checks the file against the pin again and fetches nothing itself.
      - name: Restore the pinned previous-release.tar.gz from the cache
        id: previous-release-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/previous-release.tar.gz
          key: pinned-previous-release-${{ env.PREVIOUS_RELEASE_URL }}-${{ env.PREVIOUS_RELEASE_SHA256 }}
      - name: Download the previous release on a cache miss (HTTPS only, redirects included)
        id: previous-release-download
        if: ${{ steps.previous-release-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/previous-release.tar.gz" "$PREVIOUS_RELEASE_URL"
      - name: Say why the job stops when previous-release.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.previous-release-download.outcome == 'failure' }}
        run: echo "::error::previous-release.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Check the previous release (pinned checksum)
        id: previous-release-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/previous-release.tar.gz" --sha256 "$PREVIOUS_RELEASE_SHA256" --out target/previous-release/hostkeeper.tar.gz
      - name: Save the checked previous-release.tar.gz to the cache
        if: ${{ !cancelled() && steps.previous-release-check.outcome == 'success' && steps.previous-release-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/previous-release.tar.gz
          key: ${{ steps.previous-release-cache.outputs.cache-primary-key }}
      # The packages crates/hostkeeper-privileged/tests/linux_packages.rs installs in a container
      # of each release of crates/hostkeeper-privileged/linux-releases.toml: the static programs,
      # staged with the pinned gh and the trusted root, packed by nfpm as the deb and the rpm
      # (artifacts.yml's build, with the same pins), into target/linux-packages. The
      # images are pulled here, one step each (the workflow lint holds the steps to the list); the
      # test pulls nothing and its containers have no network.
      - name: Restore the pinned nfpm.tar.gz from the cache
        id: nfpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nfpm.tar.gz
          key: pinned-nfpm-${{ env.NFPM_VERSION }}-${{ env.NFPM_SHA256 }}
      - name: Download nfpm on a cache miss (HTTPS only, redirects included)
        id: nfpm-download
        if: ${{ steps.nfpm-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/nfpm.tar.gz" "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
      - name: Say why the job stops when nfpm.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.nfpm-download.outcome == 'failure' }}
        run: echo "::error::nfpm.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Install nfpm (pinned checksum)
        id: nfpm-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/nfpm.tar.gz" --sha256 "$NFPM_SHA256" --out target/privileged-tools/nfpm --extract tar.gz --member nfpm
      - name: Save the checked nfpm.tar.gz to the cache
        if: ${{ !cancelled() && steps.nfpm-check.outcome == 'success' && steps.nfpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nfpm.tar.gz
          key: ${{ steps.nfpm-cache.outputs.cache-primary-key }}
      - name: Add the static target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build the static programs
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p hostkeeper --bin hostkeeper -p hostkeeper-pxe --bin hostkeeper-pxe
      - name: Stage the programs, gh and the trusted root
        run: cargo xtask release nfpm-stage --arch amd64 --gh-version "$GH_VERSION" --gh-archive "$RUNNER_TEMP/gh.tar.gz" --gh-sha256 "$GH_SHA256" --trusted-root packaging/sigstore/trusted_root.json --binaries target/x86_64-unknown-linux-musl/release --out target/nfpm
      - name: Make the directory of the packages
        run: mkdir -p target/linux-packages
      - name: Build the deb
        env:
          VERSION: 0.1.0
          ARCH: amd64
        run: target/privileged-tools/nfpm package --config packaging/linux/nfpm.yaml --packager deb --target target/linux-packages
      - name: Build the rpm
        env:
          VERSION: 0.1.0
          ARCH: amd64
        run: target/privileged-tools/nfpm package --config packaging/linux/nfpm.yaml --packager rpm --target target/linux-packages
      - name: Pull debian:12
        run: docker pull debian@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8
      - name: Pull debian:13
        run: docker pull debian@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
      - name: Pull ubuntu:22.04
        run: docker pull ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
      - name: Pull ubuntu:26.04
        run: docker pull ubuntu@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
      - name: Pull almalinux:8
        run: docker pull almalinux@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
      - name: Pull almalinux:10
        run: docker pull almalinux@sha256:5a4b41a427c9717be8f4ac2a32aa22efbae5f9124fbcb79a6765394f312acfe8
      - name: Pull opensuse/leap:16.0
        run: docker pull opensuse/leap@sha256:a4115e2f5aea9712a7c73974fd94000a034fc3051ef29b5f7722fbf04070dd9d
      - name: Pull opensuse/tumbleweed
        run: docker pull opensuse/tumbleweed@sha256:871173bf717af0926bd92324ee6f73ba285e0721f0c8ac00ef2c77f1c88d979e
      - name: Build the privileged tests as the runner's user
        run: cargo test -p hostkeeper-privileged --features privileged --locked --no-run --test transient_unit --test observer --test unit_control --test self_update --test tierstore_shaped --test self_update_across_releases --test linux_packages --test mdm_cert_units --test install_apt
      - name: Run the privileged tests as root
        run: cargo test -p hostkeeper-privileged --features privileged --locked --config "target.'cfg(unix)'.runner = 'sudo'" --test transient_unit --test observer --test unit_control --test self_update --test tierstore_shaped --test self_update_across_releases --test linux_packages --test mdm_cert_units --test install_apt -- --test-threads=1
      - name: The journal of the test units
        if: failure()
        run: journalctl --unit 'hostkeeper-ci-*' --no-pager
      # The step units the daemon of tierstore_shaped.rs ran its fixture's hook in.
      - name: The journal of the step units
        if: failure()
        run: journalctl --unit 'updater-hostkeeper-ci-*' --no-pager
      # What a failed end-to-end test kept before its host root was removed: the hook record
      # directory, the step record and the journal of the daemon and of its units, per test.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: privileged-end-to-end
          path: target/privileged-artifacts
          if-no-files-found: ignore
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # privileged.yml's job openrc-device; the workflow lint holds it, key for key, to that job.
  openrc-device:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # A bound on the whole job, against a test that hangs; no test depends on it.
    timeout-minutes: 45
    env:
      # The nfpm the tests find at target/privileged-tools/nfpm and build their package with, the
      # same version and SHA-256 as artifacts.yml's Linux x86_64 build.
      NFPM_VERSION: 2.48.0
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The container engine the tests start the Alpine guest with, for the log (evidence, not a
      # gate).
      - name: docker version
        run: docker --version
      - run: rustup toolchain install
      # The programs the container runs are built for musl, the libc of Alpine.
      - name: Add the musl target
        run: rustup target add x86_64-unknown-linux-musl
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Restore the pinned nfpm.tar.gz from the cache
        id: nfpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nfpm.tar.gz
          key: pinned-nfpm-${{ env.NFPM_VERSION }}-${{ env.NFPM_SHA256 }}
      - name: Download nfpm on a cache miss (HTTPS only, redirects included)
        id: nfpm-download
        if: ${{ steps.nfpm-cache.outputs.cache-hit != 'true' }}
        run: curl --proto =https --proto-redir =https --tlsv1.2 --fail --retry 60 --retry-delay 10 --retry-max-time 600 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/nfpm.tar.gz" "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
      - name: Say why the job stops when nfpm.tar.gz is neither cached nor downloadable
        if: ${{ !cancelled() && steps.nfpm-download.outcome == 'failure' }}
        run: echo "::error::nfpm.tar.gz is not in the actions cache and its download from GitHub failed, so this job cannot go on until GitHub serves it again"
      - name: Install nfpm (pinned checksum)
        id: nfpm-check
        run: cargo xtask install-tool --download "$RUNNER_TEMP/nfpm.tar.gz" --sha256 "$NFPM_SHA256" --out target/privileged-tools/nfpm --extract tar.gz --member nfpm
      - name: Save the checked nfpm.tar.gz to the cache
        if: ${{ !cancelled() && steps.nfpm-check.outcome == 'success' && steps.nfpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nfpm.tar.gz
          key: ${{ steps.nfpm-cache.outputs.cache-primary-key }}
      - name: Build the Alpine image the tests run in
        run: docker build --tag hostkeeper-openrc-device crates/hostkeeper-privileged/openrc
      # The programs the container runs, built for musl, the libc of Alpine. ring's C code is
      # compiled by the runner's gcc: the runner has no musl-gcc.
      - name: Build the programs the container runs
        env:
          CC_x86_64_unknown_linux_musl: gcc
        run: cargo build --locked --target x86_64-unknown-linux-musl -p hostkeeper --bin hostkeeper
      - name: Build the OpenRC device tests as the runner's user
        run: cargo test -p hostkeeper-privileged --features privileged --locked --no-run --test openrc_device
      - name: Run the OpenRC device tests as root
        run: cargo test -p hostkeeper-privileged --features privileged --locked --config "target.'cfg(unix)'.runner = 'sudo'" --test openrc_device -- --test-threads=1 --nocapture
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
