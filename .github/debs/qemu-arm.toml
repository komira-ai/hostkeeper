# The packages of qemu-system-arm and qemu-efi-aarch64 (QEMU for arm64 and its AAVMF UEFI
# firmware), for the job `net-install-arm64` of net-install.yml: the packages
# `apt-get install --no-install-recommends` added to the ubuntu-24.04 runner image, the
# packages the image already has left out. `cargo xtask debs` (crates/xtask/src/debs.rs) reads
# this file; the job restores the packages from the actions cache under a key made of this
# set's name, the runner's architecture and this file's hash (which covers every SHA-256 below),
# fetches them from the mirrors below in order only when the cache missed, checks every file
# against its SHA-256 either way, and installs them with `dpkg --install`. A run needs neither
# `apt-get update` nor, when its cache hit, any package archive.
#
# Each entry is a package of Ubuntu 24.04's release pocket (`noble`), not the `noble-updates`
# version apt took (QEMU 1:8.2.2+ds-0ubuntu1.18, the firmware 2024.02-2ubuntu0.10): a release
# pocket's files stay in the archive's pool for as long as the release is supported, while an
# update's go when the next one supersedes it. The two have the same dependencies. Each was taken
# from that pocket's `Packages` index (main, `binary-amd64`), the index's own SHA-256 checked
# against `InRelease`, whose signature is the Ubuntu archive's key. The packages the runner image
# already has (glib, libslirp, libibverbs and the other libraries QEMU links) are not pinned: dpkg
# refuses the install, naming the missing one, if the image ever lacks one. Both network-install
# jobs run on an x86-64 runner, so the set has an `amd64` table only.
#
# `mirrors` are tried in order: Canonical's archive, then two mirrors run by others, so that
# an outage of Canonical's names leaves a job whose cache missed a way to its packages.
#
# To move a pin, take the version, path and SHA-256 from the signed `Packages` index, never
# from a file you downloaded yourself; the cache key changes with this file.

[amd64]
mirrors = [
  "https://archive.ubuntu.com/ubuntu",
  "https://mirrors.edge.kernel.org/ubuntu",
  "https://mirrors.mit.edu/ubuntu",
]
