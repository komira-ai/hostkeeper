[package]
name = "hostkeeper-mdm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The MDM kit's binary (fetch, install, tls, verify, push-cert, dep and migrate the MDM server stack on its Linux host, dry-run by default) and mdm, the program of the mdm service package: its update hook and its push-cert and dep verbs."

# docs/design/hostkeeper-mdm.md, task M4: the port of komira-ai/kbf's `mdm-host`. The pure
# rendering is hostkeeper-mdm-core; the steps that touch the host are hostkeeper-mdm-step; the
# hook contract `mdm update-hook` keeps is hostkeeper-hook. It depends on no other crate of the
# workspace (crates/xtask/tests/layering keeps it so).
[[bin]]
name = "hostkeeper-mdm"
path = "src/main.rs"

# The program of the `mdm` service package (docs/design/two-programs.md section 6.2), `bin/mdm`
# in the package: its update hook and the operator's `push-cert` and `dep` verbs, over the same
# library.
[[bin]]
name = "mdm"
path = "src/bin/mdm.rs"

[dependencies]
# The Basic authentication of the calls to NanoHUB's and NanoDEP's APIs on loopback.
base64.workspace = true
clap.workspace = true
# The gzip of the tar archives of the pinned tools.
flate2.workspace = true
# The kernel's random bytes the secrets are made of.
getrandom = { workspace = true, features = ["std"] }
hex.workspace = true
# The hook contract of the `mdm` package's `update-hook`: its command line, params file and
# last line.
hostkeeper-hook = { path = "../hostkeeper-hook" }
hostkeeper-mdm-core = { path = "../hostkeeper-mdm-core" }
hostkeeper-mdm-step = { path = "../hostkeeper-mdm-step" }
# The owner of `--bin-dir`, which `install` trusts for the paths below it.
rustix = { workspace = true, features = ["fs"] }
# The TLS of the downloads: the ring provider ureq is built with.
rustls.workspace = true
# The roots the downloads trust: the host's. Every download is checked against its sha256 pin
# after it arrives, so the roots guard the transfer, not what is installed.
rustls-native-certs.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
ureq.workspace = true
# The APNs push certificate `push-cert` checks (its topic, expiry and key) and the
# certificates `dep get-cert` keeps or writes.
x509-parser.workspace = true

[dev-dependencies]
# The test certificates and keys of `push-cert` and `dep get-cert`.
rcgen.workspace = true
time.workspace = true
hostkeeper-testkit = { path = "../hostkeeper-testkit" }

[lints]
workspace = true
