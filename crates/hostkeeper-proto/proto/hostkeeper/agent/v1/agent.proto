// hostkeeper.agent.v1: the heartbeat a host's daemon sends the coordinator, and the reply,
// which carries at most one order; and how a host gets and keeps its certificate: `Enroll`,
// `Poll` and `Renew`.
//
// Served by: the coordinator, on its heartbeat listener (gRPC over TCP with TLS). The JSON
// route `POST /v1/heartbeat` that kbf's agents speak is an adapter onto the same handler: its
// top-level `version`, `health`, `last_update`, `updating`, `step`, `commit`, `step_secs`,
// `promotion_pending`, `deferred` and `pinned` are the entry of `services` named by the
// coordinator's legacy service (`kbf` on a kbf farm), its `services` are the other entries, and
// its `agent_features` is `features`.
//
// Authentication: the daemon checks the coordinator's certificate against the SHA-256 of the CA
// certificate pinned in its config, on every RPC. `Heartbeat` and `Renew` need mutual TLS: the
// caller is the host its client certificate names, with the role the certificate gives it
// (`agent`); no field of a heartbeat or a renewal says who the host is, so neither can speak for
// another host. `Enroll` and `Poll` must not require a client certificate, because the host has
// none yet: the caller is authenticated by the key it proves, the CSR's own signature and then the
// signed challenge of `Poll`.
//
// Refusals: a gRPC status whose message is exactly one token of `CoordinatorRefusal`, written
// as the value's name without the `COORDINATOR_REFUSAL_` prefix, in lower case (for example
// `forbidden`, `pending_full`, `bad_signature`); the status code is the one each value names.
// Nothing else is ever in the message. A bad optional fact (a step, a deferral, a pin, a feature
// list) is dropped and the rest of the heartbeat is read, so a host never loses its updates to a
// field the coordinator could do without. A signed `Poll` before approval is not refused: it
// is answered PENDING; an unsigned one is answered as the Enrollment paragraph says.
//
// Units: times are unix seconds and durations whole seconds (fields end in `_unix` and `_secs`). A
// service name is 1 to 255 bytes of the POSIX portable filename characters (`A-Za-z0-9._-`), not
// beginning with `-` or `.`; a version the same with `+` added. A token (a reason, a check, a step
// name) is 1 to 64 bytes of `[a-z0-9_]`; a step name at most 16. A commit is 40 lower-case hex
// digits; a package digest is SHA-256 as 64 lower-case hex characters. A heartbeat lists at most
// 16 services. A host id is 1 to 63 bytes of `[a-z0-9-]`, not starting or ending with `-`. A CSR
// is DER, at most 4096 bytes; a certificate is DER, at most 8192 bytes; a CA bundle is PEM. A
// request id is the SHA-256 of the DER SubjectPublicKeyInfo of the CSR's key, as 64 lower-case hex
// characters.
//
// Orders: an order is one verb with typed arguments (`Order`): a service name, a version, a
// package digest, a halt generation, and, for a version set with targets, the picked entry
// (Targets below); never a command, a URL or a script of its own. The daemon finds
// everything else (the release channel, the package of its own platform with its size and digest
// in the version's release index, the hook, the units) in its own configuration, in the index and
// in the manifest of the package that verified (design section 5.5). The coordinator fills
// `package_digest` with the digest the version's release index lists for the host's own platform,
// and `index_digest` with the SHA-256 of that index. The daemon refuses an index whose SHA-256 is
// not `index_digest` (`index_digest_mismatch`), and a package whose SHA-256 is not
// `package_digest` (`digest_mismatch`). An empty `index_digest` (an order of a coordinator before
// it, or of a version set with one package digest) skips the index check.
//
// Targets: for a version set with targets (`hostkeeper.release.v1`), an `update`, `install`,
// `force_rollback` or `force` sent over gRPC to a daemon that announced `target-v1` also carries
// `target`: the one entry of the version's list for the host's platform that the coordinator
// picked for the host, field for field as CI set it, with `package_digest` equal to its digest.
// The coordinator picks the entry of the installer the host runs the service with
// (`ServiceBeat.installer`), else the first entry whose installer the daemon lists
// (`HeartbeatRequest.installers`), and sends no order when none fits. An entry names bytes by
// digest and where to look for them, never an absolute URL, a credential or a script; its
// manifest names a program inside the attested bytes to run as root, its arguments and paths of
// the host, under the daemon's checks, and whoever sets the release chooses them. An order of a
// version set with a digest or an index, an order to a daemon that did not announce `target-v1`,
// and every order on the JSON route carry no target.
//
// Enrollment: a host with no certificate generates a P-256 key, keeps it, and sends `Enroll`
// with a CSR for it and its claims. Its request is pending until an operator approves it
// (`hostkeeper.operator.v1.Enrollment`), naming the SHA-256 of the key. Claims help an operator
// recognise a machine and authorise nothing. The daemon then polls for its certificate with a
// challenge, so the host needs no clock. A first `Poll` with an empty `nonce` and `signature` is
// answered with the state UNSPECIFIED and a coordinator-chosen `nonce`, and nothing else; the
// daemon then sends a `Poll` carrying that nonce and its signature by the request's key. Every
// answer to a signed `Poll` carries a fresh `nonce` for the next one, and the daemon may always
// start again with an unsigned `Poll`, after an answer it lost.
//
// The signature is ECDSA P-256 with SHA-256, DER encoded, by the private key of the CSR, over
// exactly these bytes: the 25 ASCII bytes "hostkeeper-enroll-poll-v1", one 0x00 byte, the 64
// ASCII characters of `request_id`, one 0x00 byte, and the `nonce`. The coordinator checks it
// against the public key it stored for the request. A nonce is 16 to 64 bytes, chosen by the
// coordinator, good for one `Poll`, and refused once the coordinator has answered a `Poll` with
// it. The certificate fields of `PollResponse` are set only on ISSUED. Before the certificate's
// half life the daemon sends `Renew` with a CSR for the key it holds.
//
// Extending: add fields, messages, enum values and RPCs; never renumber, rename, retype or
// remove one, and never reuse a number (the compatibility test in this crate refuses each).
// A reader treats an enum value it does not know as UNSPECIFIED; none of the enums here is
// closed. Re-key is added to `Coordinator` by its own change.
syntax = "proto3";

package hostkeeper.agent.v1;

import "hostkeeper/options.proto";
import "hostkeeper/release/v1/release.proto";

service Coordinator {
  // What the host runs and how it is, and the coordinator's answer: at most one order.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Ask for a certificate: a CSR, the host's claims and its image. No client certificate. The
  // request is pending until an operator approves it; nothing is installed meanwhile.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Ask whether a request was approved, and take its certificate, by the challenge the header
  // describes. No client certificate.
  rpc Poll(PollRequest) returns (PollResponse);
  // Get a new certificate for the key the host holds, over mutual TLS with its current one.
  rpc Renew(RenewRequest) returns (RenewResponse);
}

// Why the coordinator refused a heartbeat, an enrollment, a poll or a renewal. The token is the
// value's name without the prefix, in lower case.
enum CoordinatorRefusal {
  COORDINATOR_REFUSAL_UNSPECIFIED = 0;
  // PERMISSION_DENIED: a `Heartbeat` or a `Renew` with no client certificate, or with one that
  // names no host with the role `agent`. Refused before the request is read.
  COORDINATOR_REFUSAL_FORBIDDEN = 1;
  // INVALID_ARGUMENT: a field every heartbeat needs is missing or broken: no platform, a service
  // entry with no name, version or health, a last update with no target or outcome, a name that
  // is no service name, or a name listed twice.
  COORDINATOR_REFUSAL_INVALID_HEARTBEAT = 2;
  // RESOURCE_EXHAUSTED: an `Enroll` of a new request while the pending queue is full; the
  // requests already pending are kept.
  COORDINATOR_REFUSAL_PENDING_FULL = 3;
  // INVALID_ARGUMENT: the key of the CSR is not an ECDSA P-256 key.
  COORDINATOR_REFUSAL_KEY_NOT_P256 = 4;
  // INVALID_ARGUMENT: the CSR is over 4096 bytes, does not parse, or is not signed by its own key.
  COORDINATOR_REFUSAL_BAD_CSR = 5;
  // PERMISSION_DENIED: a `Heartbeat` or a `Renew` by a host an operator revoked, with a
  // certificate that has not yet expired.
  COORDINATOR_REFUSAL_DENIED = 6;
  // NOT_FOUND: a `Poll` for a request id the coordinator holds no request for.
  COORDINATOR_REFUSAL_UNKNOWN_REQUEST = 7;
  // UNAUTHENTICATED: a signed `Poll` whose signature does not verify by the request's key, or
  // whose nonce is not one the coordinator gave for the request and has not yet answered.
  COORDINATOR_REFUSAL_BAD_SIGNATURE = 8;
  // FAILED_PRECONDITION: a `Renew` whose CSR is not for the key of the client certificate, or an
  // `Enroll` whose `renewal_of` names a host that is unknown, revoked, or certified for another
  // key.
  COORDINATOR_REFUSAL_RENEWAL_NOT_ALLOWED = 9;
}

message HeartbeatRequest {
  // The platform the host's releases are built for.
  Platform platform = 1;
  // The agent that sends the heartbeat. Absent from kbf's `kbf-updater` agent, which predates it
  // and is counted as `kbf-updater`.
  AgentInfo agent = 2;
  // What this agent can use of the coordinator's side, by feature name (`deferred-v1`,
  // `halt-v1`, `forced-v1`, which announces that the daemon takes the `Force` verb,
  // `install-v1`, which announces that it takes the `Install` and `Uninstall` verbs, `abort-v1`,
  // which announces that it takes the `Abort` verb, `clear-record-v1`, which announces that it
  // takes the `ClearRecord` verb, `verdict-acks-v1`, which asks for `HeartbeatResponse.acks`,
  // and `target-v1`, which announces that it takes `target` in orders and lists `installers`):
  // at most 16, each 1 to 32 bytes of `[a-z0-9-]`, none twice. An agent
  // that lists every service it runs in `services` announces `heartbeat-v2`; without it the
  // coordinator counts the host as unmanaged for every service but the legacy one, rather than
  // as missing them.
  repeated string features = 3;
  // Every service installed on the host, one entry each, at most 16, none named twice.
  repeated ServiceBeat services = 4;
  // The host's clock when it made the heartbeat, in seconds since the epoch: what the coordinator
  // holds against its own clock to count the heartbeats of a host whose clock is off. Absent from
  // an agent that predates it.
  optional uint64 sent_unix = 5;
  // The last second the host's current certificate is valid, in seconds since the epoch. Absent
  // from an agent that predates it and from a host that holds no certificate.
  optional uint64 cert_not_after_unix = 6;
  // Why the host's last step of enrollment or renewal failed, as the host words it, at most 256
  // bytes (a reader cuts a longer one at a character boundary); absent once a step succeeds, and
  // from an agent that predates it.
  optional string last_renew_error = 7;
  // The seconds since the Sigstore trusted root the daemon checks packages with was last written
  // on the host, as the daemon's report of it says (the root's file has no field for when it was
  // made). Absent when no file of the root is present, and from an agent that predates it.
  optional uint64 trusted_root_age_secs = 8;
  // Why that trusted root needs attention: `TRUSTED_ROOT_REASON_NONE` when it needs none.
  // UNSPECIFIED: not reported, by an agent that predates the field or one that keeps no root;
  // the coordinator reads that as unknown, never as a root that needs no attention.
  TrustedRootReason trusted_root_reason = 9;
  // The installers the daemon can run (`hostkeeper-archive`, `tarball`, `apt`, ...), decided once
  // at its start: the coordinator orders an entry of a release only to a host whose daemon lists
  // its installer. At most 16, each 1 to 32 bytes of `[a-z0-9-]`, none twice; a list that breaks
  // a rule is dropped and the coordinator keeps the last one it read. Read only over gRPC, and
  // only from a daemon that announced `target-v1`; one that did not counts as listing
  // `hostkeeper-archive` alone.
  repeated string installers = 10;
}

// Why the Sigstore trusted root a host checks packages with needs attention, as its daemon
// reports it. The reason is a signal for people: the daemon checks packages with the root it has
// whatever the reason.
enum TrustedRootReason {
  // Not reported.
  TRUSTED_ROOT_REASON_UNSPECIFIED = 0;
  // The root needs no attention.
  TRUSTED_ROOT_REASON_NONE = 1;
  // The root is older than the daemon's `--trusted-root-max-age-days`: the host has not taken an
  // update of hostkeeper, or a root copied by hand, in that time.
  TRUSTED_ROOT_REASON_STALE = 2;
  // Neither file of the root is present on the host.
  TRUSTED_ROOT_REASON_MISSING = 3;
  // The file of the root cannot be read, or is not one or more JSON trusted roots; this wins over
  // `TRUSTED_ROOT_REASON_STALE`.
  TRUSTED_ROOT_REASON_UNPARSEABLE = 4;
}

// The platforms releases are built for.
enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_LINUX_X86_64 = 1;
  PLATFORM_LINUX_ARM64 = 2;
  PLATFORM_DARWIN_ARM64 = 3;
}

// The agent program that speaks for the host.
message AgentInfo {
  // Its name: `hostkeeper`, or `kbf-updater` for kbf's agent.
  string name = 1;
  // Its version.
  string version = 2;
}

// What the host says of one service.
message ServiceBeat {
  // The service's name.
  string name = 1;
  // The version of it the host runs now.
  string version = 2;
  // Its health now.
  Health health = 3;
  // The last update of it the host ran, if it has run one since the agent started.
  UpdateResult last_update = 4;
  // The target of the update of it that is running now: set from the start of the update to its
  // end, absent when none runs.
  optional string updating = 5;
  // The step the running update is in, and the try.
  StepRun step = 6;
  // Whether the running update is past the hook's commit point. UNSPECIFIED: not reported.
  CommitState commit = 7;
  // How many seconds each step of the last update took, by step name; at most 8 steps.
  map<string, uint64> step_secs = 8;
  // Serving, but not yet fully its own: the coordinator holds the host's slot.
  bool promotion_pending = 9;
  // An update the host declined for a reason about its moment, not about the release.
  DeferredReport deferred = 10;
  // Legacy: sent only by kbf's agent, never by a hostkeeper daemon, and kept so that its
  // heartbeats read as they always did. The service is pinned on that host: root holds it on a
  // release, and kbf's agent acts on no order for it until root lifts the pin.
  PinReport pinned = 11;
  // The try the service's step record holds (`order_try` of `StepRecord` in
  // `hostkeeper/local/v1/admin.proto`): the try of the last order the host took for the service,
  // whatever its verb, sent in every heartbeat whether or not its verdict is. The coordinator
  // numbers its next order of the service past it (design 8.3), so a coordinator that never heard
  // the verdict (a restart, an order the host ran across its own restart) does not order a try
  // the record already holds. Absent when the service has no step record, the record names no
  // try, or the agent predates the field.
  optional uint64 record_try = 12;
  // The installer the host installed the service with, by the name it lists in
  // `HeartbeatRequest.installers`: the coordinator orders the host that installer's entry of a
  // release, wherever it stands in the list. Absent for `hostkeeper-archive`, and from an agent
  // that predates it. 1 to 32 bytes of `[a-z0-9-]`; read only over gRPC.
  optional string installer = 13;
}

// Whether a service serves what it should.
enum Health {
  HEALTH_UNSPECIFIED = 0;
  // It passes its health check.
  HEALTH_HEALTHY = 1;
  // It does not, or the agent cannot tell.
  HEALTH_UNHEALTHY = 2;
  // It is installed on the host and has never run.
  HEALTH_ABSENT = 3;
}

// How an update ended.
enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  // The host runs the target and confirmed it healthy.
  OUTCOME_SUCCEEDED = 1;
  // The update did not end with the target running confirmed healthy. Where the service is now
  // is in its `version`: an ordinary update is reverted to the version it ran before (or never
  // left it); a forced one is not rolled back, and stays where it got to: on the version it ran
  // before when it failed before the switch, on its target when it failed after.
  OUTCOME_FAILED = 2;
}

// Where in an update a failure happened.
enum FailurePhase {
  FAILURE_PHASE_UNSPECIFIED = 0;
  // Before the hook's commit point: nothing irreversible happened.
  FAILURE_PHASE_BEFORE_COMMIT = 1;
  // `verify` failed before the commit point, and the hook blames the release.
  FAILURE_PHASE_GATE_RELEASE = 2;
  // `verify` failed before the commit point, and the hook blames the environment.
  FAILURE_PHASE_GATE_ENVIRONMENT = 3;
  // After the commit point, any other failure.
  FAILURE_PHASE_AFTER_COMMIT = 4;
  // A check whose failure no version can repair. The coordinator halts the service: no host of
  // it is ordered until an operator clears the halt (`Releases.ClearHalt`).
  FAILURE_PHASE_HALT = 5;
}

// Whom a failure is blamed on; it decides whether the fleet rolls back.
enum FailureClass {
  FAILURE_CLASS_UNSPECIFIED = 0;
  // The new version is wrong.
  FAILURE_CLASS_RELEASE = 1;
  // Something remote or shared failed; the release may be fine.
  FAILURE_CLASS_ENVIRONMENT = 2;
}

// The last update of a service the host ran.
message UpdateResult {
  // The version it was told to run.
  string target = 1;
  // How it ended.
  Outcome outcome = 2;
  // Where a failure happened. UNSPECIFIED: not reported.
  FailurePhase phase = 3;
  // Whom a failure is blamed on. UNSPECIFIED: not reported.
  FailureClass class = 4;
  // The check or cause of a failure, as a token; empty when none is reported. For a failure in
  // the halt phase it is the check that halted.
  string reason = 5;
  // When the update started, by the host's clock. Absent when the agent does not report it.
  optional uint64 started_unix = 6;
  // Which try of the order this was: the coordinator numbers each try (`Order.try`) and the
  // daemon's step record keeps it (`order_try` of `StepRecord` in `hostkeeper/local/v1/admin.proto`),
  // so two tries at one target that end the same way differ in it, even within one second or
  // after the clock moved back. Absent when the daemon does not report it.
  optional uint64 order_try = 7;
  // The order this is the verdict of (`Order.order_id`). The coordinator counts a verdict once per
  // host, order id and try, however often the daemon resends it. Absent from kbf's agent.
  optional string order_id = 8;
  // The verdict of a `Force` order, which runs no hook: SUCCEEDED; FAILED before anything changed
  // on the host (`package_digest_mismatch`, `path_conflict` and the like); or FAILED after the switch, with
  // the reason `link_failed`, `daemon_reload_failed` or `start_failed`.
  bool forced = 9;
  // What the hook or the daemon said of the outcome, at most 512 bytes.
  optional string detail = 10;
  // The last lines of the step's output, at most 20, each at most 200 bytes. When a heartbeat
  // would exceed 16 KiB, these and the other optional facts are the first dropped.
  repeated string log_tail = 11;
}

// Whether an update in flight is past the hook's commit point.
enum CommitState {
  COMMIT_STATE_UNSPECIFIED = 0;
  // It can still be undone.
  COMMIT_STATE_UNCOMMITTED = 1;
  // It cannot.
  COMMIT_STATE_COMMITTED = 2;
}

// The step an update is in.
message StepRun {
  // The step's name (`prepare`, `cutover`, `verify`).
  string name = 1;
  // The try, from 1.
  uint32 attempt = 2;
}

// An update the host declined for a reason about its moment.
message DeferredReport {
  // The version it did not take.
  string target = 1;
  // Why, as a token (`drain_bound`).
  string reason = 2;
  // How long the coordinator waits before it orders the target again.
  uint64 retry_after_secs = 3;
}

// A pin root holds on the host.
message PinReport {
  // The commit of the release the pin names. Absent when root's pin could not be read, which
  // pins the service all the same.
  optional string commit = 1;
}

message HeartbeatResponse {
  // What to do now. Absent: nothing.
  Order order = 1;
  // The features the coordinator supports of those the heartbeat announced, in the
  // coordinator's order. Empty when it supports none of them, or none was announced.
  repeated string features = 2;
  // How many times an operator has cleared a halt of each service, by service name; a service
  // never cleared is not listed. An agent that holds a service on a halt lifts the hold when the
  // number is greater than the one it saw when it halted, so a lost reply or a coordinator restart
  // cannot make it miss a clear. Only for an agent that announced `halt-v1`.
  map<string, uint64> halt_generations = 3;
  // The verdicts of this heartbeat (`ServiceBeat.last_update`) that the coordinator has written
  // to its state before this reply: the agent sends none of them again, and the
  // coordinator reads a service entry with no `last_update` as still reporting the last verdict
  // it acknowledged for the host, across its own restarts. A verdict with no order id or no try
  // is never acknowledged. Only for an agent that announced `verdict-acks-v1`; an agent that did
  // not resends each verdict until it reports another, as before. At most one per service
  // listed.
  repeated VerdictAck acks = 4;
}

// A verdict the coordinator acknowledges, by the service it is about and the order id and try it
// ends (`UpdateResult.order_id`, `UpdateResult.order_try`). The service is named because an
// order id is the coordinator's per service: two services may each have a `force-1`.
message VerdictAck {
  // The service the verdict is about.
  string service = 1;
  // The order the verdict ends.
  string order_id = 2;
  // The try of the order, from 1.
  uint64 order_try = 3;
}

// One order: one verb with its typed arguments, and the coordinator's identity for it. No field
// of an order, at any depth, can carry a command, a path, a URL or a script.
message Order {
  // The coordinator's id for the order, kept by the daemon in its step record and sent back with
  // the verdict (`UpdateResult.order_id`).
  string order_id = 1;
  // The coordinator's number for this try of the order, from 1: a resend of the order keeps it,
  // and a new try raises it.
  uint64 try = 2;
  oneof verb {
    // Fetch, verify and unpack the package, read its manifest and run its hook's steps; refused
    // below the running version.
    Update update = 3;
    // Add a service the coordinator assigned to the host, by the update path with no previous
    // version. Only for a daemon that announced `install-v1` and lists every service it runs
    // (`heartbeat-v2`).
    Install install = 4;
    // A hooked update to a lower version, which automatic rollback sends.
    ForceRollback force_rollback = 5;
    // Hookless: stop the service's units, switch to the version, link, start the units, report.
    // Refused for the service `hostkeeper`. Only for a daemon that announced `forced-v1`.
    Force force = 6;
    // Stop the service's units, run its `uninstall` hook and remove its package and placed paths.
    // Only for a daemon that announced `install-v1`.
    Uninstall uninstall = 7;
    // Stop the service's running step and end its order in the halt phase.
    Abort abort = 8;
    // Lift the service's halt.
    ClearHalt clear_halt = 9;
    // Set aside the service's step record when it does not read: rename `step-record.json` to
    // `step-record.json.corrupt`, under the service's lock, never waited for. A record that reads,
    // an absent one and one of a newer schema are refused `record_reads` and not touched. Only for
    // a daemon that announced `clear-record-v1`.
    ClearRecord clear_record = 10;
  }
}

// The arguments of an `update`.
message Update {
  string service = 1;
  string version = 2;
  // The SHA-256 of the package of the host's platform (see Orders above).
  string package_digest = 3;
  // The SHA-256 of the version's release index; empty: not checked (see Orders above).
  string index_digest = 4;
  // The entry of the version's release picked for the host; absent but for a version set with
  // targets and a daemon that announced `target-v1` (see Targets above).
  hostkeeper.release.v1.Target target = 5;
}

// The arguments of an `install`.
message Install {
  string service = 1;
  string version = 2;
  string package_digest = 3;
  // The SHA-256 of the version's release index; empty: not checked (see Orders above).
  string index_digest = 4;
  // The entry of the version's release picked for the host; absent but for a version set with
  // targets and a daemon that announced `target-v1` (see Targets above).
  hostkeeper.release.v1.Target target = 5;
}

// The arguments of a `force_rollback`.
message ForceRollback {
  string service = 1;
  string version = 2;
  string package_digest = 3;
  // The SHA-256 of the version's release index; empty: not checked (see Orders above).
  string index_digest = 4;
  // The entry of the version's release picked for the host; absent but for a version set with
  // targets and a daemon that announced `target-v1` (see Targets above).
  hostkeeper.release.v1.Target target = 5;
}

// The arguments of a `force`.
message Force {
  string service = 1;
  string version = 2;
  // The SHA-256 of the package of the host's platform (see Orders above).
  string package_digest = 3;
  // Greater than the generation the service is held under: a force lifts a standing halt.
  uint64 halt_generation = 4;
  // The SHA-256 of the version's release index; empty: not checked (see Orders above).
  string index_digest = 5;
  // The entry of the version's release picked for the host; absent but for a version set with
  // targets and a daemon that announced `target-v1` (see Targets above).
  hostkeeper.release.v1.Target target = 6;
}

// The arguments of an `uninstall`.
message Uninstall {
  string service = 1;
}

// The arguments of an `abort`.
message Abort {
  string service = 1;
}

// The arguments of a `clear_record`.
message ClearRecord {
  string service = 1;
}

// The arguments of a `clear_halt`.
message ClearHalt {
  string service = 1;
  // The clear generation; the daemon lifts its hold only on one greater than the one it halted
  // under.
  uint64 halt_generation = 2;
}

// A request for a host's first certificate, or for one after its certificate expired.
message EnrollRequest {
  // A PKCS#10 CSR for the host's P-256 key, DER, at most 4096 bytes.
  bytes csr_der = 1;
  // What the host says it is.
  Claims claims = 2;
  // The boot image or installer the daemon came from, as the image names itself.
  string image = 3;
  // The host id of a host whose certificate expired while it was offline, posting again with the
  // same key; empty for a first enrollment.
  string renewal_of = 4;
  // The one-time nonce MDM gave a Mac (one hour, one use); empty on any other host.
  bytes mac_nonce = 5 [(hostkeeper.secret) = true];
}

// What a host says it is. Every claim is optional, by being empty. Claims help an operator
// recognise a machine and authorise nothing.
message Claims {
  // `/etc/machine-id`.
  string machine_id = 1;
  // The DMI system serial number.
  string dmi_serial = 2;
  // The DMI product UUID.
  string product_uuid = 3;
  // The host's network addresses, as text.
  repeated string addresses = 4;
  // A Mac's serial number.
  string mac_serial = 5;
  // A Mac's platform UUID.
  string platform_uuid = 6;
  // The MAC address of the host's BMC, as the BMC reports it for its LAN channel (IPMI LAN
  // configuration parameter 5); empty when the daemon could not read one, and on a Mac.
  string bmc_mac = 7;
}

message EnrollResponse {
  // The request's id: the SHA-256 of the CSR's key, 64 lower-case hex characters. Posting the
  // same key again is the same request.
  string request_id = 1;
  EnrollState state = 2;
}

// Where an enrollment request stands once posted.
enum EnrollState {
  ENROLL_STATE_UNSPECIFIED = 0;
  // Waiting for an operator.
  ENROLL_STATE_PENDING = 1;
  // Waiting for an operator, and another host presents the same machine id or key: the operator
  // is alerted.
  ENROLL_STATE_DUPLICATE_CLAIM = 2;
}

// One poll for a request's certificate; see the header for the challenge.
message PollRequest {
  // The request's id, as `EnrollResponse` gave it.
  string request_id = 1;
  // The nonce the coordinator gave; empty in an unsigned `Poll`.
  bytes nonce = 2;
  // The signature over the message the header fixes, by the request's key; empty in an unsigned
  // `Poll`.
  bytes signature = 3;
}

message PollResponse {
  PollState state = 1;
  // The host's certificate, DER, at most 8192 bytes. Only on ISSUED.
  bytes certificate_der = 2;
  // The host id the operator approved. Only on ISSUED.
  string host_id = 3;
  // The CA certificates the host trusts the coordinator by, PEM. Only on ISSUED.
  string ca_bundle_pem = 4;
  // A nonce for the next signed `Poll`, 16 to 64 bytes.
  bytes nonce = 5;
}

// Where a polled request stands.
enum PollState {
  // The answer to an unsigned `Poll`: only its `nonce` is set.
  POLL_STATE_UNSPECIFIED = 0;
  // Not yet approved.
  POLL_STATE_PENDING = 1;
  // Approved: the certificate is in the answer.
  POLL_STATE_ISSUED = 2;
  // An operator denied the request or its key.
  POLL_STATE_DENIED = 3;
}

// A renewal, over mutual TLS with the host's current certificate.
message RenewRequest {
  // A CSR for the key of the current certificate, DER, at most 4096 bytes.
  bytes csr_der = 1;
}

message RenewResponse {
  // The new certificate, DER, at most 8192 bytes.
  bytes certificate_der = 1;
  // The CA certificates, PEM.
  string ca_bundle_pem = 2;
}
