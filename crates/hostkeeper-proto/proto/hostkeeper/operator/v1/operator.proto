// hostkeeper.operator.v1: what an operator, and CI, ask of the coordinator: the hosts it knows,
// the releases it rolls, the services each host runs, the hosts waiting to enroll, and the audit
// log of every change.
//
// Served by: the coordinator, on its control listener (gRPC over TCP with TLS, on loopback or
// behind a tunnel). It replaces the JSON routes `/v1/desired`, `/v1/convergence`, `/v1/status`
// and `/v1/operator`, which stay, frozen, as adapters onto the same handlers.
//
// Authentication: TLS authenticates the server only. The caller sends a bearer token in the
// `authorization` metadata (`Bearer <token>`). `Releases.SetDesired` takes CI's OIDC token,
// checked against the coordinator's allow-list as `/v1/desired` checks it (issuer, audience,
// repository, workflow, ref or environment, event, runner; each token is good once), or the
// operator token. `SetDesired` with CI's token sets only the services the admitting allow-list
// entry names; with the operator token it sets any service the coordinator manages, audited as
// `set_desired` under the token's name. `Releases.Converge`, which changes nothing, takes CI's
// OIDC token or the operator token, and answers either for any service. Every other RPC takes the
// operator token only. The token is checked
// before the request is read.
//
// Refusals: a gRPC status whose message is exactly one token of the service's refusal enum
// (`HostsRefusal`, `ReleasesRefusal`, `ServicesRefusal`, `EnrollmentRefusal`, `AuditRefusal`),
// written as the value's name without the prefix, in lower case (for example
// `below_min_version`); the status code is the one each value names. Nothing
// else is ever in the message: no claim value, no path, no text of an internal error. A refused
// request changes nothing.
//
// Units: times are unix seconds and durations whole seconds (fields end in `_unix` and `_secs`). A
// service name is 1 to 255 bytes of the POSIX portable filename characters (`A-Za-z0-9._-`), not
// beginning with `-` or `.`; a version the same with `+` added. A node id is 1 to 63 bytes of
// `[a-z0-9-]`, not starting or ending with `-`; a role name 1 to 32 bytes of `[a-z0-9-]`, a letter
// first. A reason is 1 to 256 bytes once trimmed, with no control character. A count of hosts per
// role is 0 to 10000. A host id is a node id. A request id and a key hash are SHA-256
// as 64 lower-case hex characters. A `limit` is capped at 256, and 0 means the cap.
//
// Enrollment: the hosts that asked for a certificate (`Enroll` of `hostkeeper.agent.v1`) and
// wait for an operator. The `Enrollment` service, `EnrollmentRefusal` and their messages are in
// enrollment.proto, in this package. `Enrollment` takes the operator token only; no CI token reaches it. An
// approval names the SHA-256 of the pending request's key, so it cannot admit another key. Its
// answers carry no CSR bytes and no nonce value; the certificate goes to the host at its next
// `Poll`, never through this API. Its ids, names and `limit` follow the units above.
// `Enrollment` also keeps the host inventory: one record per server, which the operator adds
// when building it (host id, optional role, data MACs, BMC MAC, optional serial and notes).
// `List` shows each pending request matched against the records; a match fills in a host id
// and a role and approves nothing. A MAC is six octets of two hex digits, separated all by `:`
// or all by `-`, or twelve hex digits, in either case, and is answered as lower-case
// `aa:bb:cc:dd:ee:ff`.
//
// Audit: the changes the coordinator made, as `AuditEntry` rows numbered by `seq`, read with
// `Audit.List` and paged by `since_seq`, newest last. `Audit` takes the operator token only; no
// CI token reaches it. Its `limit` follows the units above. Reading changes nothing.
//
// Extending: add fields, messages, enum values, RPCs and services; never renumber, rename,
// retype or remove one, and never reuse a number (the compatibility test in this crate refuses
// each). A reader treats an enum value it does not know as UNSPECIFIED; none of the enums here is
// closed. A token in an open string field (`AuditEntry.action`, `SkippedHost.reason`) is added,
// never respelled. `Enrollment` and `Audit` grow by the same rule.
syntax = "proto3";

package hostkeeper.operator.v1;

import "hostkeeper/agent/v1/agent.proto";

// The hosts the coordinator has heard from, and what an operator decides about them.
service Hosts {
  // Every host heard from since the coordinator started.
  rpc List(ListHostsRequest) returns (ListHostsResponse);
  // One host.
  rpc Get(GetHostRequest) returns (GetHostResponse);
  // Take a host out of a service: its heartbeats do not count for the service and it is not
  // ordered. A second exclusion of the same host and service replaces the first.
  rpc Exclude(ExcludeRequest) returns (ExcludeResponse);
  // Put an excluded host back. Including a host that is not excluded changes nothing and is not
  // an error.
  rpc Include(IncludeRequest) returns (IncludeResponse);
  // Replace a host's labels, which service selectors match. An empty set removes them.
  rpc SetLabels(SetLabelsRequest) returns (SetLabelsResponse);
  // Queue an `abort` order of a service for the host's next heartbeat; it takes no slot. An
  // abort of a host that runs nothing of the service is accepted and changes nothing.
  rpc Abort(AbortRequest) returns (AbortResponse);
}

// The desired version of each service, how far the hosts are, and the operator's overrides.
service Releases {
  // Set a service's desired state. The coordinator moves its hosts there a role at a time. Takes
  // CI's OIDC token (the services its allow-list entry names) or the operator token (any service
  // the coordinator manages, audited as `set_desired` under the token's name).
  rpc SetDesired(SetDesiredRequest) returns (SetDesiredResponse);
  // How far a service's hosts are from its desired version. Changes nothing. Takes CI's OIDC
  // token or the operator token.
  rpc Converge(ConvergeRequest) returns (ConvergeResponse);
  // Switch a service to a version on the targeted hosts at once, with no hook (see
  // `ForceRequest`).
  rpc Force(ForceRequest) returns (ForceResponse);
  // Lift a bad mark from a version, so that it may be ordered and CI may set it again.
  rpc UnmarkBad(UnmarkBadRequest) returns (UnmarkBadResponse);
  // Lift a service's standing halt.
  rpc ClearHalt(ClearHaltRequest) returns (ClearHaltResponse);
  // Everything the coordinator holds about each service. Changes nothing.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Mark a version bad by hand: it is never ordered again until it is unmarked. A held pair is
  // not reached.
  rpc MarkBad(MarkBadRequest) returns (MarkBadResponse);
  // Halt a service by hand, as a host's halt report does: no host of it is ordered until the halt
  // is cleared.
  rpc Halt(HaltRequest) returns (HaltResponse);
}

// The services the coordinator manages, which hosts run them, and the operator's holds.
service Services {
  // Every service, with its desired version, the roles and hosts it is assigned to, the
  // operator's assignments, its minimum versions, the hosts ordered to uninstall it and its holds.
  rpc List(ListServicesRequest) returns (ListServicesResponse);
  // Assign a service to a host or a role: a host that does not run it is ordered to install it
  // at its next heartbeat, unless a hold stands. Assigning a service already assigned changes
  // nothing.
  rpc Assign(AssignRequest) returns (AssignResponse);
  // Take a service off a host or a role. With `uninstall`, each host that no longer has any
  // assignment of it is ordered to uninstall it; without, the coordinator stops managing it
  // there and the host keeps running it.
  rpc Unassign(UnassignRequest) returns (UnassignResponse);
  // Set the version below which the rollout gate orders the service to no host of a role, or to
  // one host: no update, install or automatic rollback. A host's own minimum stands before its
  // role's, and neither goes below the rollout file's.
  rpc SetMinVersion(SetMinVersionRequest) returns (SetMinVersionResponse);
  // Hold a service on a host, a role or the whole fleet where it is: the coordinator orders the
  // held pairs nothing (no update, install, rollback, uninstall or force) until the hold is
  // released. A hold carries no version, takes no slot, survives a coordinator restart, covers
  // hosts that later join a held role, and the host never learns of it. An update already
  // running finishes. Holding a pair already held under the same scope replaces the reason.
  rpc Hold(HoldRequest) returns (HoldResponse);
  // Release a hold: the pairs it held are ordered to the then-desired version at their next
  // heartbeat.
  rpc Unhold(UnholdRequest) returns (UnholdResponse);
}

// The coordinator's audit log.
service Audit {
  // The entries after `since_seq` that match every filter set, newest last. Changes nothing.
  rpc List(ListAuditRequest) returns (ListAuditResponse);
}

// Why `Hosts` refused a request. The token is the value's name without the prefix, in lower
// case.
enum HostsRefusal {
  HOSTS_REFUSAL_UNSPECIFIED = 0;
  // UNAUTHENTICATED: no bearer, or not the operator token.
  HOSTS_REFUSAL_UNAUTHORIZED = 1;
  // PERMISSION_DENIED: the bearer is a valid CI token, which `Hosts` does not take.
  HOSTS_REFUSAL_FORBIDDEN = 2;
  // INVALID_ARGUMENT: a field breaks its rule (a node id, a reason, a label).
  HOSTS_REFUSAL_INVALID_REQUEST = 3;
  // NOT_FOUND: the service is not one the coordinator manages.
  HOSTS_REFUSAL_UNKNOWN_SERVICE = 4;
  // NOT_FOUND: the coordinator has not heard from the host since it started.
  HOSTS_REFUSAL_UNKNOWN_HOST = 5;
  // RESOURCE_EXHAUSTED: the change would hold more than 4096 exclusions, or labels for more than
  // 4096 hosts.
  HOSTS_REFUSAL_CAPACITY = 6;
  // INTERNAL: the change could not be written; nothing changed, and asking again is safe.
  HOSTS_REFUSAL_STORE_FAILED = 7;
  // UNAVAILABLE: the change's line could not be appended to the audit file (a full disk); nothing
  // changed, and asking again is safe once the file takes lines again.
  HOSTS_REFUSAL_AUDIT_UNAVAILABLE = 8;
}

// Why `Releases` refused a request. The token is the value's name without the prefix, in lower
// case.
enum ReleasesRefusal {
  RELEASES_REFUSAL_UNSPECIFIED = 0;
  // UNAUTHENTICATED: no bearer, or one the RPC does not take.
  RELEASES_REFUSAL_UNAUTHORIZED = 1;
  // PERMISSION_DENIED: a valid CI token on an operator-only RPC, or on `SetDesired` for a service
  // its allow-list entry does not name.
  RELEASES_REFUSAL_FORBIDDEN = 2;
  // UNAVAILABLE: the keys CI's tokens are checked against cannot be fetched now; retry.
  RELEASES_REFUSAL_KEYS_UNAVAILABLE = 3;
  // INVALID_ARGUMENT: a field breaks its rule (a version, a role, a count, a reason, a write id).
  RELEASES_REFUSAL_INVALID_REQUEST = 4;
  // NOT_FOUND: the service is not one the coordinator manages.
  RELEASES_REFUSAL_UNKNOWN_SERVICE = 5;
  // ABORTED: `if_generation` is not the service's generation now.
  RELEASES_REFUSAL_GENERATION_CONFLICT = 6;
  // FAILED_PRECONDITION: the version was left by a force and is marked bad; `UnmarkBad` lifts it.
  RELEASES_REFUSAL_HELD_BAD = 7;
  // FAILED_PRECONDITION: a force to a version older than the service's `min_version`, the first
  // release that has its update hook. Such a release is installed on each host by hand.
  RELEASES_REFUSAL_BELOW_MIN_VERSION = 8;
  // FAILED_PRECONDITION: `ClearHalt` of a service that is not halted.
  RELEASES_REFUSAL_NOT_HALTED = 9;
  // FAILED_PRECONDITION: `UnmarkBad` of a version that is not marked bad.
  RELEASES_REFUSAL_NOT_MARKED_BAD = 10;
  // INTERNAL: the change could not be written; nothing changed, and asking again is safe.
  RELEASES_REFUSAL_STORE_FAILED = 11;
  // FAILED_PRECONDITION: a force to a version CI registered no package digest for.
  RELEASES_REFUSAL_NO_DIGEST = 12;
  // FAILED_PRECONDITION: a force of the service `hostkeeper`, which updates itself by its own path.
  RELEASES_REFUSAL_SELF_SERVICE = 13;
  // INVALID_ARGUMENT: a fleet-wide force whose `confirm_service` is not its `service`.
  RELEASES_REFUSAL_CONFIRM_MISMATCH = 14;
  // FAILED_PRECONDITION: `MarkBad` of a version that is marked bad already.
  RELEASES_REFUSAL_ALREADY_BAD = 15;
  // FAILED_PRECONDITION: `Halt` of a service that is halted already.
  RELEASES_REFUSAL_ALREADY_HALTED = 16;
  // INVALID_ARGUMENT: a force target role or host the coordinator does not know.
  RELEASES_REFUSAL_UNKNOWN_TARGET = 17;
  // UNAVAILABLE: the change's line could not be appended to the audit file (a full disk); nothing
  // changed, and asking again is safe once the file takes lines again.
  RELEASES_REFUSAL_AUDIT_UNAVAILABLE = 18;
  // FAILED_PRECONDITION: `SetDesired` of a version the coordinator's release channel does not
  // hold yet, or whose index could not be read. Nothing changed; retry once the channel holds it.
  RELEASES_REFUSAL_NOT_IN_CHANNEL = 19;
  // FAILED_PRECONDITION: `SetDesired` of a version whose index in the coordinator's release
  // channel names another service or version, or no package with the digest the set names, or,
  // for a set over a release index, is not that index (its SHA-256 is not `release_index_digest`).
  // Nothing changed; the channel holds another artifact, so the same set is refused again.
  RELEASES_REFUSAL_CHANNEL_DIGEST_MISMATCH = 20;
  // INVALID_ARGUMENT: `SetDesired`'s `release_index` does not have the SHA-256
  // `release_index_digest` names: the index was changed or cut on its way.
  RELEASES_REFUSAL_INDEX_DIGEST_MISMATCH = 21;
  // INVALID_ARGUMENT: `SetDesired`'s `release_index` is not a release index of the service at the
  // desired version (design section 5.5), or comes without `release_index_digest`, or with
  // `package_digest`.
  RELEASES_REFUSAL_INDEX_INVALID = 22;
}

// Why `Services` refused a request. The token is the value's name without the prefix, in lower
// case.
enum ServicesRefusal {
  SERVICES_REFUSAL_UNSPECIFIED = 0;
  // UNAUTHENTICATED: no bearer, or not the operator token.
  SERVICES_REFUSAL_UNAUTHORIZED = 1;
  // PERMISSION_DENIED: the bearer is a valid CI token, which `Services` does not take.
  SERVICES_REFUSAL_FORBIDDEN = 2;
  // INVALID_ARGUMENT: a field breaks its rule (a node id, a role, a version, a reason), or a scope
  // is missing.
  SERVICES_REFUSAL_INVALID_REQUEST = 3;
  // NOT_FOUND: the service is not one the coordinator manages.
  SERVICES_REFUSAL_UNKNOWN_SERVICE = 4;
  // NOT_FOUND: the coordinator knows no such host.
  SERVICES_REFUSAL_UNKNOWN_HOST = 5;
  // FAILED_PRECONDITION: `Unassign` of a service the host or the role is not assigned.
  SERVICES_REFUSAL_NOT_ASSIGNED = 6;
  // FAILED_PRECONDITION: `Unhold` of a pair no hold of that scope holds.
  SERVICES_REFUSAL_NOT_HELD = 7;
  // INTERNAL: the change could not be written; nothing changed, and asking again is safe.
  SERVICES_REFUSAL_STORE_FAILED = 8;
  // NOT_FOUND: no service of the rollout file runs on the role, no host heard from has it, and
  // no assignment names it.
  SERVICES_REFUSAL_UNKNOWN_ROLE = 9;
  // FAILED_PRECONDITION: `SetMinVersion` above the service's desired version, which would hold
  // every host of the scope below its minimum.
  SERVICES_REFUSAL_BELOW_MIN_VERSION = 10;
  // UNAVAILABLE: the change's line could not be appended to the audit file (a full disk); nothing
  // changed, and asking again is safe once the file takes lines again.
  SERVICES_REFUSAL_AUDIT_UNAVAILABLE = 11;
}

// Why `Audit` refused a request. The token is the value's name without the prefix, in lower case.
enum AuditRefusal {
  AUDIT_REFUSAL_UNSPECIFIED = 0;
  // UNAUTHENTICATED: no bearer, or not the operator token.
  AUDIT_REFUSAL_UNAUTHORIZED = 1;
  // PERMISSION_DENIED: the bearer is a valid CI token, which `Audit` does not take.
  AUDIT_REFUSAL_FORBIDDEN = 2;
  // INVALID_ARGUMENT: a filter breaks its rule (an actor, an action, a service, a node id).
  AUDIT_REFUSAL_INVALID_REQUEST = 3;
  // INTERNAL: the log could not be read; nothing changed, and asking again is safe.
  AUDIT_REFUSAL_STORE_FAILED = 4;
}

// One change the coordinator made, as its audit ring keeps it (the last 64).
message AuditEntry {
  // Its number: one more than the entry before it, for the life of the coordinator's store.
  uint64 seq = 1;
  // Who made it.
  Actor by = 2;
  // What it was, as a token (`exclude`, `include`, `set_labels`, `clear_halt`, `force`,
  // `force_ended`, `mark_bad`, `unmark_bad`, `halt`, `last_good`, `assign`, `unassign`,
  // `set_min_version`, `uninstalled`, `uninstall_cancelled`, `hold`, `unhold`, `abort`,
  // `exclude_abandon`, `enroll_approve`, `enroll_replace`, `enroll_approve_refused`,
  // `mac_auto_approve_declined`, `record_add`, `record_remove`, `enroll_requested`,
  // `enroll_issued`, `cert_renewed`, `request_expired`). Open: a later coordinator adds actions.
  string action = 3;
  // The service, when the change is about one.
  optional string service = 4;
  // The host, when the change is about one.
  optional string node_id = 5;
  // Why, when the change has a reason.
  optional string reason = 6;
  // When it was made, by the coordinator's clock. `Audit.List` sets it from the audit file; it
  // is unset in the answer of the call that made the change, and for a coordinator that keeps
  // no audit file (it lists its ring, which holds no time).
  optional uint64 at_unix = 7;
  // Who made it, by name: the name of the operator's token, or `coordinator`, `ci` or
  // `mdm-nonce` for a change that is not an operator's. `by` says which kind of actor that is.
  optional string by_name = 8;
}

// Who made a change.
enum Actor {
  ACTOR_UNSPECIFIED = 0;
  // An operator, with the operator token.
  ACTOR_OPERATOR = 1;
  // CI, with its OIDC token.
  ACTOR_CI = 2;
  // The coordinator itself: a halt, a rollback, a mark.
  ACTOR_COORDINATOR = 3;
}

message ListHostsRequest {}

message ListHostsResponse {
  repeated Host hosts = 1;
}

message GetHostRequest {
  string node_id = 1;
}

message GetHostResponse {
  Host host = 1;
}

// A host, as the coordinator knows it.
message Host {
  // From the host's certificate.
  string node_id = 1;
  // From the host's certificate.
  string role = 2;
  // It heartbeated within the last 45 seconds.
  bool live = 3;
  // When its last heartbeat arrived.
  uint64 last_heartbeat_unix = 4;
  // Its last heartbeat, as it sent it.
  hostkeeper.agent.v1.HeartbeatRequest heartbeat = 5;
  // The labels an operator set on it.
  map<string, string> labels = 6;
  // The services it is excluded from.
  repeated Exclusion exclusions = 7;
  // How each service the coordinator manages sees it.
  repeated HostService services = 8;
}

// A host taken out of a service.
message Exclusion {
  string service = 1;
  string reason = 2;
}

// One host as one service sees it.
message HostService {
  string service = 1;
  // Live, healthy, and not updating this service.
  bool up = 2;
  // It holds the one live update slot of the farm for this service.
  bool holds_slot = 3;
  // Why the host would not be ordered at its next heartbeat: the rollout gate's reason.
  GateReason gate_reason = 4;
  // Whether the service counts the host.
  Membership membership = 5;
  // The operator's holds that hold the pair: of the host, of its role, of the fleet.
  repeated HoldMark holds = 6;
  // The version of the service installed on the host, as it last reported; absent when it is not
  // installed.
  optional string installed_version = 7;
  // Its health, as the host last reported it.
  hostkeeper.agent.v1.Health health = 8;
  // The last update of the service on the host, with its verdict, phase, class, reason, detail,
  // try and log lines; absent before the first.
  hostkeeper.agent.v1.UpdateResult last_update = 9;
  // The operator's reason, when the host is excluded from the service.
  optional string excluded_reason = 10;
}

// Why the rollout gate does not order a host now (not to be confused with an operator's hold,
// `HoldMark`). These spellings are public. A value is never removed: one the coordinator no
// longer produces says so.
enum GateReason {
  GATE_REASON_UNSPECIFIED = 0;
  // Nothing holds it: it is ordered at its next heartbeat.
  GATE_REASON_NONE = 1;
  // The service is halted.
  GATE_REASON_HALTED = 2;
  // No longer produced: a service assigned to the host and not installed is ordered `install`.
  GATE_REASON_NO_DEFINITION = 3;
  // The service has no desired version.
  GATE_REASON_NO_DESIRED = 4;
  // The service does not count the host.
  GATE_REASON_NOT_A_MEMBER = 5;
  // The coordinator is within its quiet start after a restart.
  GATE_REASON_QUIET = 6;
  // No longer produced: only kbf's agent reports a pin.
  GATE_REASON_PINNED = 7;
  // No longer produced: a service assigned to the host and not installed is ordered `install`.
  GATE_REASON_ABSENT = 8;
  // The host is updating the service.
  GATE_REASON_UPDATING = 9;
  // Another host or service holds the one live update.
  GATE_REASON_BUSY_ELSEWHERE = 10;
  // The host runs the desired version.
  GATE_REASON_UP_TO_DATE = 11;
  // The host failed the desired version, and is not told it again.
  GATE_REASON_FAILED_HERE = 12;
  // The host declined the desired version for now.
  GATE_REASON_DEFERRED = 13;
  // The one live update slot is held.
  GATE_REASON_NO_SLOT = 14;
  // No longer produced: the one live update orders roles already.
  GATE_REASON_WAITING_FOR_ROLE = 15;
  // No longer produced: the one live update orders services already.
  GATE_REASON_WAITING_FOR_SERVICE = 16;
  // No longer produced: the one live update keeps all but one host serving.
  GATE_REASON_MIN_UP = 17;
  // The hosts that updated are still baking.
  GATE_REASON_BAKING = 18;
  // The canaries have not finished.
  GATE_REASON_CANARY_WAIT = 19;
  // The desired version is marked bad.
  GATE_REASON_BAD = 20;
  // An operator holds the pair (`Services.Hold`).
  GATE_REASON_HELD = 21;
  // The host is waiting for an operator to approve its enrollment.
  GATE_REASON_WAITING_FOR_OPERATOR = 22;
  // The host's identity is also another host's: a cloned disk.
  GATE_REASON_DUPLICATE = 23;
  // The release index of the desired version lists no package for the host's platform: the host
  // is not ordered the version, and this is no failed update.
  GATE_REASON_NO_PACKAGE_FOR_PLATFORM = 24;
}

// Whether a service counts a host.
enum Membership {
  MEMBERSHIP_UNSPECIFIED = 0;
  // The host runs the service and is counted.
  MEMBERSHIP_PRESENT = 1;
  // An operator excluded it.
  MEMBERSHIP_EXCLUDED = 2;
  // The service's selector does not select it.
  MEMBERSHIP_NOT_SELECTED = 3;
  // It has not heartbeated for 45 seconds.
  MEMBERSHIP_DOWN = 4;
  // The service is declared on it and never ran.
  MEMBERSHIP_ABSENT = 5;
  // It is selected and does not list the service.
  MEMBERSHIP_MISSING = 6;
  // It is selected and its agent cannot list services.
  MEMBERSHIP_UNMANAGED = 7;
}

message ExcludeRequest {
  string service = 1;
  string node_id = 2;
  string reason = 3;
  // Also free the one live update slot the host holds for the service mid-update, for a host
  // that is gone and will not report its update final. False (the default) keeps the slot.
  bool abandon = 4;
}

message ExcludeResponse {
  // The change, as the audit ring numbered it.
  AuditEntry entry = 1;
}

message IncludeRequest {
  string service = 1;
  string node_id = 2;
}

message IncludeResponse {
  AuditEntry entry = 1;
}

message SetLabelsRequest {
  string node_id = 1;
  // At most 8; each key and value 1 to 32 bytes of `[a-z0-9-]`.
  map<string, string> labels = 2;
}

message SetLabelsResponse {
  AuditEntry entry = 1;
}

message AbortRequest {
  string node_id = 1;
  string service = 2;
  string reason = 3;
}

message AbortResponse {
  // The `abort` order waits for the host's next heartbeat.
  bool queued = 1;
  AuditEntry entry = 2;
}

// What a service's hosts should run, and how fast they get there.
message DesiredState {
  string version = 1;
  // Per role, 0 holds the role: none of its hosts is ordered. Any other number lets the role
  // update one host at a time, because one update is live in the farm at a time. A role not named
  // takes its default (1; 2 for `daemon` and `mac-daemon`).
  map<string, uint32> max_updating = 2;
  // The fewest hosts of each role that must stay up while others update. A role not named needs
  // none. A service's definition may require roles here (`kbf` requires `storage` and
  // `frontend`).
  map<string, uint32> min_up = 3;
  // The digest of the one package CI registered for this version (64 lower-case hex characters),
  // which every order of this version names, whatever the host's platform. Absent when the
  // version was set with a release index.
  optional string package_digest = 4;
  // The SHA-256 of the release index CI registered for this version (64 lower-case hex
  // characters): each host is ordered the package the index lists for its platform, and a host
  // whose platform it does not list is ordered nothing (`GATE_REASON_NO_PACKAGE_FOR_PLATFORM`).
  // Absent when the version was set with one `package_digest`, or with neither.
  optional string release_index_digest = 5;
}

message SetDesiredRequest {
  string service = 1;
  DesiredState desired = 2;
  // Write only if the service's generation is this one now; otherwise refused with
  // `generation_conflict`, and nothing changes. Absent: write whatever the generation is.
  optional uint64 if_generation = 3;
  // The writer's own id for this write, kept with it and returned by `Converge`, so a writer
  // that lost the answer can tell whether its write landed: 1 to 128 visible ASCII characters.
  // Absent: none.
  optional string write_id = 4;
  // The digest of the package CI registers for `desired.version` (64 lower-case hex characters),
  // the one package every host is ordered whatever its platform: for a fleet of one platform.
  // Refused with `release_index` (`index_invalid`).
  optional string package_digest = 5;
  // The release index of `desired.version` (`index.json`, design section 5.5), byte for byte:
  // per platform, the package file, its size and its SHA-256. The coordinator checks that its
  // SHA-256 is `release_index_digest` (else `index_digest_mismatch`) and that it is the index of
  // `service` at `desired.version` (else `index_invalid`), keeps the digest of each platform's
  // package, and orders each host the package of its own platform. Comes with
  // `release_index_digest`.
  optional string release_index = 6;
  // The SHA-256 of `release_index` (64 lower-case hex characters), as CI's release job wrote
  // it down when it published the index: the release this desired state names.
  optional string release_index_digest = 7;
}

message SetDesiredResponse {
  // The state as stored.
  DesiredState desired = 1;
  // How the store records the service's writes now.
  WriteRecord record = 2;
  // The roles whose limits were dropped because the service does not run on them, sorted.
  repeated string dropped_roles = 3;
}

// How the store records a service's writes.
message WriteRecord {
  // One more for every accepted write, a write of the same version included; 0 before the first.
  uint64 generation = 1;
  // The version and minimums the last change of version replaced. Absent until a second version
  // is set.
  Replaced replaced = 2;
  // The write id of the last write; absent when it had none.
  optional string write_id = 3;
}

message Replaced {
  string version = 1;
  map<string, uint32> min_up = 2;
}

message ConvergeRequest {
  string service = 1;
}

message ConvergeResponse {
  Convergence convergence = 1;
}

// How far a service's hosts are from its desired version.
message Convergence {
  // The desired version; absent when none was ever set.
  optional string desired = 1;
  // The coordinator is within its quiet start after a restart, and orders nothing.
  bool quiet = 2;
  ConvergenceState state = 3;
  // The hosts of each role, in the service's role order; a role with no host is left out.
  repeated RoleCounts roles = 4;
  // The standing halt, when the state is HALTED.
  HaltRecord halt = 5;
  // Hosts the service does not count, by why. Absent when the service has no selector and every
  // count is 0.
  HostCounts hosts = 6;
  // The build of the coordinator that answers: 12 hex digits, or `unknown`.
  string coordinator_commit = 7;
  // How the store records the service's writes.
  WriteRecord record = 8;
  // The force that stands, if one does.
  ForceRecord force = 9;
}

enum ConvergenceState {
  CONVERGENCE_STATE_UNSPECIFIED = 0;
  // Every live host runs the desired version, is settled, and every role has its minimum up.
  CONVERGENCE_STATE_CONVERGED = 1;
  // A host failed the desired version.
  CONVERGENCE_STATE_BLOCKED = 2;
  // A host reported a failure no version can repair; nothing is ordered until an operator clears
  // it. A new desired version does not lift it.
  CONVERGENCE_STATE_HALTED = 3;
  // Anything else, and every state before a desired version is set.
  CONVERGENCE_STATE_IN_PROGRESS = 4;
}

// The live hosts of one role, and the silent ones.
message RoleCounts {
  string role = 1;
  // Live and running the desired version.
  uint32 at_desired = 2;
  // Live and updating.
  uint32 updating = 3;
  // Live, behind, not updating, and failed the desired version.
  uint32 failed = 4;
  // Silent for 45 seconds or more.
  uint32 down = 5;
  // Live and pinned. A pinned host on the desired version is in `at_desired` too.
  uint32 pinned = 6;
}

// Hosts a service does not count, by why.
message HostCounts {
  // Selected, live, able to list services, and not listing this one.
  uint32 missing = 1;
  // Declared on the host and never ran.
  uint32 absent = 2;
  // Taken out by an operator.
  uint32 excluded = 3;
  // Selected, with an agent that cannot list services.
  uint32 unmanaged = 4;
  // Live, and declined the desired version for now. Also counted in `roles`.
  uint32 deferred = 5;
}

// Fix a service on every targeted host at once, with no hook, because a broken hook is often
// the thing that is broken: each targeted host stops the service's units, switches to `version`,
// links, starts the units and reports (the `force` verb of `hostkeeper.agent.v1.Order`). A force
// may cut running work: the units stop without a drain.
//
// The coordinator fills the order's package digest from the one CI registered for this service
// and version, and refuses the call if CI registered none (`no_digest`). It refuses the service
// `hostkeeper`, which updates itself by its own path (`self_service`), and a version below the
// service's `min_version` (`below_min_version`); lowering that is a separate change. A fleet-wide
// force needs `confirm_service` equal to `service` (`confirm_mismatch`).
//
// It records the force, lifts the bad mark of the version, clears a standing halt by sending a
// halt generation greater than the held one, sets the desired version to `version`, and on a
// downgrade marks bad each version it leaves (from the installed versions the targeted hosts last
// reported). Each is an audit entry.
//
// It orders the `force` on each targeted host at its next heartbeat, passing the one live update,
// the canary, the bake, a deferral, bad marks, a standing halt and a host's failure of the
// version, so one call may reach every host in the same heartbeat round. It skips a pair an
// operator holds and lists the host in `held`, unless `include_held` is set: then it orders the
// held pairs it targets, for this call only, and removes no hold.
//
// The force stands until CI sets a newer desired version or an operator clears it; the automatic
// rollback of the service is suspended meanwhile. A second force replaces the first.
message ForceRequest {
  string service = 1;
  string version = 2;
  string reason = 3;
  // Which hosts: the whole fleet, the hosts of a role, or a list of hosts.
  oneof targets {
    FleetTarget fleet = 4;
    string role = 5;
    HostList hosts = 6;
  }
  // Order the held pairs among the targets too, for this call only.
  bool include_held = 7;
}

// Every host that runs the service.
message FleetTarget {
  // The service's name again, which must equal `ForceRequest.service`: a fleet-wide force is
  // confirmed by naming the service twice.
  string confirm_service = 1;
}

// Hosts by node id.
message HostList {
  repeated string node_ids = 1;
}

message ForceResponse {
  // The entries the force wrote, in order: `force`, then `unmark_bad`, `mark_bad` and
  // `clear_halt` as they apply.
  repeated AuditEntry entries = 1;
  // The targeted hosts skipped because an operator holds the pair; empty with `include_held`.
  repeated string held = 2;
  // How many hosts the force orders.
  uint32 targeted = 3;
  // The targeted hosts the force does not order, other than `held`, each with why.
  repeated SkippedHost skipped = 4;
}

// A targeted host a force does not order.
message SkippedHost {
  string node_id = 1;
  // Why, as a token: `daemon_too_old` (its daemon did not announce `forced-v1`), `held`,
  // `unknown_target`. Open: a later coordinator adds reasons.
  string reason = 2;
}

// A force, as the coordinator records it.
message ForceRecord {
  string version = 1;
  // One more for every force of the service.
  uint64 generation = 2;
  string reason = 3;
}

message UnmarkBadRequest {
  string service = 1;
  string version = 2;
  string reason = 3;
}

message UnmarkBadResponse {
  AuditEntry entry = 1;
}

// Lifts the halt, acknowledges the report that raised it and every other halt report received
// while it stood, and raises the service's clear generation by one, which agents are told in
// every heartbeat reply (`halt_generations`). An acknowledged report does not halt the service
// again while its host keeps reporting it.
message ClearHaltRequest {
  string service = 1;
  string reason = 2;
}

message ClearHaltResponse {
  AuditEntry entry = 1;
}

message StatusRequest {
  // One service; empty for every service the coordinator manages.
  string service = 1;
}

message StatusResponse {
  // In name order.
  repeated ServiceStatus services = 1;
  // The coordinator is within its quiet start after a restart.
  bool quiet = 2;
  // Heartbeats since the coordinator started whose service list was dropped as bad.
  uint64 services_dropped = 3;
  // Heartbeats since the coordinator started that had an optional fact dropped as bad, by the
  // fact's name.
  map<string, uint64> facts_dropped = 4;
  // The last 64 changes, oldest first.
  repeated AuditEntry audit = 5;
}

// One service, as the coordinator holds it.
message ServiceStatus {
  string service = 1;
  // Absent when none was ever set.
  DesiredState desired = 2;
  Convergence convergence = 3;
  // The hosts of the service, each as the service sees it.
  repeated ServiceHost hosts = 4;
  // Hosts the service is up on.
  uint32 up = 5;
  // The update slots held now.
  uint32 slots_held = 6;
  // What the coordinator and its operators marked on the service.
  ServiceMarks marks = 7;
}

// One host as one service sees it, with the host's own report of the service.
message ServiceHost {
  string node_id = 1;
  string role = 2;
  bool live = 3;
  HostService view = 4;
  // What the host's last heartbeat said of the service; absent when it did not list it.
  hostkeeper.agent.v1.ServiceBeat beat = 5;
  // The operator's reason, when the host is excluded from the service.
  optional string excluded_reason = 6;
}

// What the coordinator and its operators marked on a service.
message ServiceMarks {
  // The standing halt.
  HaltRecord halt = 1;
  // The halt reports an operator cleared: one per host, the latest.
  repeated HaltRecord halt_acked = 2;
  // The other halt reports received while the standing halt stood: one per host, the latest.
  repeated HaltRecord halt_seen = 3;
  // How many times an operator has cleared a halt of the service.
  uint64 halt_generation = 4;
  // The newest version that converged and baked; where an automatic rollback goes back to.
  optional string last_good = 5;
  // The versions never ordered again until they are unmarked.
  repeated string bad = 6;
  // Of `bad`, the versions a force left, which CI may not set until an operator unmarks them.
  repeated string bad_by_force = 7;
  // The failure reports acknowledged when a version was set by hand or forced: one per host.
  repeated FailureAck failure_acked = 8;
  // How many times the service was forced; the force that stands is in the convergence.
  uint64 force_generation = 9;
}

// A halt report, or its acknowledgement.
message HaltRecord {
  string node_id = 1;
  // The check that failed, as a token; `unspecified` when the host named none.
  string check = 2;
  string target = 3;
  // The whole report the host made.
  hostkeeper.agent.v1.UpdateResult report = 4;
}

// A failure report an override acknowledged: the host, and the whole report it made, so that a
// different report of the same host is not hidden by it.
message FailureAck {
  string node_id = 1;
  hostkeeper.agent.v1.UpdateResult report = 2;
}

message MarkBadRequest {
  string service = 1;
  string version = 2;
  string reason = 3;
}

message MarkBadResponse {
  AuditEntry entry = 1;
}

message HaltRequest {
  string service = 1;
  string reason = 2;
}

message HaltResponse {
  AuditEntry entry = 1;
}

// Where a hold applies.
message HoldScope {
  oneof scope {
    // One host, by node id.
    string host = 1;
    // Every host of a role, those that join it later included.
    string role = 2;
    // Every host.
    WholeFleet fleet = 3;
  }
}

// The whole fleet, as a scope.
message WholeFleet {}

// An operator's hold: the pairs of `service` in `scope` are ordered nothing until it is released.
message HoldMark {
  HoldScope scope = 1;
  string service = 2;
  string reason = 3;
  // The name of the token that set it.
  string set_by = 4;
  uint64 set_unix = 5;
}

message ListServicesRequest {}

message ListServicesResponse {
  // In name order.
  repeated ServiceEntry services = 1;
  // Every hold that stands.
  repeated HoldMark holds = 2;
}

// One service the coordinator manages.
message ServiceEntry {
  string service = 1;
  // The hosts heard from since the coordinator started that it is assigned to, by node id.
  repeated string hosts = 2;
  // The version below which no order takes it, by role or host, as an operator set it.
  repeated MinVersion min_versions = 3;
  // The holds of the service.
  repeated HoldMark holds = 4;
  // The desired version; absent when CI has set none.
  optional string desired_version = 5;
  // The roles it is assigned to: the rollout file's, with the operator's role assignments on top.
  repeated string roles = 6;
  // The operator's assignments of the service, by role and by host.
  repeated Assignment assignments = 7;
  // Each host of `hosts`, with what it last reported, the minimum version that applies to it and
  // the holds that hold it.
  repeated AssignedHost assigned = 8;
  // The hosts ordered to uninstall the service, until each reports it gone.
  repeated string uninstalling = 9;
}

// An operator's assignment of a service, to a role or a host, or its removal from one.
message Assignment {
  oneof scope {
    string role = 1;
    string host = 2;
  }
  // The service is taken off the scope (that the rollout file or a role assigns it) rather than
  // assigned to it.
  bool removed = 3;
}

// A host a service is assigned to.
message AssignedHost {
  string node_id = 1;
  string role = 2;
  // The version installed, as the host last reported it; absent when it does not run the service.
  optional string installed_version = 3;
  // The minimum version that applies to the host: its own, else its role's, and never below the
  // rollout file's; absent when there is none.
  optional string min_version = 4;
  // The operator's holds that hold the pair.
  repeated HoldMark holds = 5;
}

// A minimum version, for a role or a host.
message MinVersion {
  oneof scope {
    string role = 1;
    string host = 2;
  }
  // The version; empty in `SetMinVersion` removes the minimum an operator set for the scope.
  string version = 3;
}

message AssignRequest {
  string node_id = 1;
  string service = 2;
  // A role to assign the service to instead of one host: every host of the role, those that join
  // it later included. Exactly one of `node_id` and `role` is set.
  string role = 3;
}

message AssignResponse {
  AuditEntry entry = 1;
}

message UnassignRequest {
  string node_id = 1;
  string service = 2;
  // Order the host to uninstall the service; false (the default) leaves it running there,
  // unmanaged.
  bool uninstall = 3;
  // A role to take the service off instead of one host. Exactly one of `node_id` and `role` is
  // set.
  string role = 4;
}

message UnassignResponse {
  AuditEntry entry = 1;
}

message SetMinVersionRequest {
  string service = 1;
  MinVersion min_version = 2;
}

message SetMinVersionResponse {
  AuditEntry entry = 1;
}

message HoldRequest {
  HoldScope scope = 1;
  string service = 2;
  string reason = 3;
}

message HoldResponse {
  // The hold as it now stands.
  HoldMark hold = 1;
  AuditEntry entry = 2;
}

message UnholdRequest {
  HoldScope scope = 1;
  string service = 2;
  string reason = 3;
}

message UnholdResponse {
  AuditEntry entry = 1;
}

message ListAuditRequest {
  // Only entries with a greater `seq`; 0 for the oldest the log keeps.
  uint64 since_seq = 1;
  // The most entries to return; capped at 256, and 0 means the cap.
  uint32 limit = 2;
  // Only entries by this actor, by the token of `Actor` (`operator`, `ci`, `coordinator`).
  optional string actor = 3;
  // Only entries of this action (`AuditEntry.action`).
  optional string action = 4;
  optional string service = 5;
  optional string node_id = 6;
  // Only entries made under this name (`AuditEntry.by_name`), as a token is named: 1 to 32
  // bytes of `[a-z0-9-]`. A name no entry has lists none.
  optional string by_name = 7;
  // The newest `limit` matching entries after `since_seq`, oldest first, in place of the
  // oldest; `next_seq` goes on from the newest of them.
  bool newest = 8;
}

message ListAuditResponse {
  // Newest last.
  repeated AuditEntry entries = 1;
  // The `since_seq` of the next page: the `seq` of the last entry returned, or the request's
  // `since_seq` when none was.
  uint64 next_seq = 2;
}
