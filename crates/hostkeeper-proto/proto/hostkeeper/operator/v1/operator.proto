// hostkeeper.operator.v1: what an operator, and CI, ask of the coordinator: the hosts it knows,
// the releases it rolls, the services each host runs, the hosts waiting to enroll, the audit
// log of every change, and the conditions that need a person.
//
// Served by: the coordinator, on its control listener (gRPC over TCP with TLS, on loopback or
// behind a tunnel). It replaces the JSON routes `/v1/desired`, `/v1/convergence`, `/v1/status`
// and `/v1/operator`, which stay, frozen, as adapters onto the same handlers.
//
// Authentication: TLS authenticates the server only. The caller sends a bearer token in the
// `authorization` metadata (`Bearer <token>`). `Releases.SetDesired` takes CI's OIDC token,
// checked against the coordinator's allow-list as `/v1/desired` checks it (issuer, audience,
// repository, workflow, ref or environment, event, runner; each token is good once), or the
// operator token. `SetDesired` with CI's token sets only the services the admitting allow-list
// entry names; with the operator token it sets any service the coordinator manages, audited as
// `set_desired` under the token's name. A set with `targets` is audited as `set_desired` whoever
// made it, CI's under `ci`. `Releases.Converge`, `Releases.WaitConverged` and
// `Releases.GetRelease`, which change nothing, take CI's OIDC token or the operator token, and
// answer either for any service.
// Every other RPC takes the operator token only. The token is checked
// before the request is read.
//
// Refusals: a gRPC status whose message is exactly one token of the service's refusal enum
// (`HostsRefusal`, `ReleasesRefusal`, `ServicesRefusal`, `EnrollmentRefusal`, `AuditRefusal`,
// `AlertsRefusal`, `RolloutsRefusal` in rollouts.proto, `MdmRefusal` in mdm.proto, and
// `RepositoriesRefusal` in repositories.proto, and `HostGroupsRefusal` in hostgroups.proto),
// written as the value's name without the prefix, in lower case (for example
// `below_min_version`); the status code is the one each value names. Nothing
// else is ever in the message: no claim value, no path, no text of an internal error. A refused
// request changes nothing.
//
// Units: times are unix seconds and durations whole seconds (fields end in `_unix` and `_secs`). A
// service name is 1 to 255 bytes of the POSIX portable filename characters (`A-Za-z0-9._-`), not
// beginning with `-` or `.`; a version the same with `+` added. A node id is 1 to 63 bytes of
// `[a-z0-9-]`, not starting or ending with `-`; a role name 1 to 32 bytes of `[a-z0-9-]`, a letter
// first. A reason is 1 to 256 bytes once trimmed, with no control character. A count of hosts per
// role is 0 to 10000. A host id is a node id. A request id and a key hash are SHA-256
// as 64 lower-case hex characters. A `limit` is capped at 256, and 0 means the cap.
//
// Enrollment: the hosts that asked for a certificate (`Enroll` of `hostkeeper.agent.v1`) and
// wait for an operator. The `Enrollment` service, `EnrollmentRefusal` and their messages are in
// enrollment.proto, in this package. `Enrollment` takes the operator token only; no CI token reaches it. An
// approval names the SHA-256 of the pending request's key, so it cannot admit another key. Its
// answers carry no CSR bytes and no nonce value; the certificate goes to the host at its next
// `Poll`, never through this API. Its ids, names and `limit` follow the units above.
// `Enrollment` also keeps the host inventory: one record per server, which the operator adds
// when building it (host id, optional role, data MACs, BMC MAC, optional serial and notes).
// `List` shows each pending request matched against the records; a match fills in a host id
// and a role, and the coordinator approves it only for an open, unused record that names a role, an exact
// and uncontested match, within the record's window. A MAC is six octets of two hex digits, separated all by `:`
// or all by `-`, or twelve hex digits, in either case, and is answered as lower-case
// `aa:bb:cc:dd:ee:ff`.
//
// Audit: the changes the coordinator made, as `AuditEntry` rows numbered by `seq`, read with
// `Audit.List` and paged by `since_seq`, newest last. `Audit` takes the operator token only; no
// CI token reaches it. Its `limit` follows the units above. Reading changes nothing.
//
// Alerts: the conditions that need a person, as `Alert` rows the coordinator derives from what
// it holds when asked (`Alerts.List`); the same derivation writes the coordinator's error log
// lines with an `alert=` field, each once when its condition appears. `Alerts` takes the
// operator token only; no CI token reaches it. Reading changes nothing.
//
// Host groups: every enrolled host is in one host group, which lists the packages it runs and
// holds the rollout policy and the desired versions of its packages (`HostGroups`, in
// hostgroups.proto, in this package). A field named `host_group` names one by its name, which is
// a role name. The field docs say what a coordinator that holds host groups does with each. A
// coordinator that does not hold them answers each such field empty; refuses a request that names
// a group, since no group has the name (`not_in_host_group` of `Releases` and `Rollouts`,
// `unknown_host_group` of `Enrollment`), rather than read it as naming none; lists no audit entry
// for a `host_group` filter; and gives no other refusal that names a host group.
//
// Extending: add fields, messages, enum values, RPCs and services; never renumber, rename,
// retype or remove one, and never reuse a number (the compatibility test in this crate refuses
// each). A reader treats an enum value it does not know as UNSPECIFIED; none of the enums here is
// closed. A token in an open string field (`AuditEntry.action`, `SkippedHost.reason`) is added,
// never respelled. `Enrollment`, `Audit` and `Alerts` grow by the same rule.
syntax = "proto3";

package hostkeeper.operator.v1;

import "hostkeeper/agent/v1/agent.proto";
// The release a set with targets names, per platform (`SetDesiredRequest.targets`).
import "hostkeeper/release/v1/release.proto";
// `AuditEntry` and `Actor`, which every service of the package answers.
import public "hostkeeper/operator/v1/entry.proto";
// The `Rollouts` service and the update plan (`RolloutPlan`) that `ServiceStatus` carries.
import public "hostkeeper/operator/v1/rollouts.proto";
// `HostRepositories`, which `Host` carries.
import "hostkeeper/operator/v1/repositories.proto";

// The hosts the coordinator has heard from or enrolled, and what an operator decides about them.
service Hosts {
  // Every host heard from since the coordinator started and, when the coordinator has an
  // enrollment, every host it enrolled that is not denied, by node id, a page at a time. A host
  // enrolled and not heard since the coordinator started is listed as not live, with what its
  // enrollment kept of what it runs (`Host.running`). Changes nothing.
  rpc List(ListHostsRequest) returns (ListHostsResponse);
  // One host heard from since the coordinator started; `unknown_host` for any other, an enrolled
  // host not heard since included. Changes nothing.
  rpc Get(GetHostRequest) returns (GetHostResponse);
  // Take a host out of a service: its heartbeats do not count for the service and it is not
  // ordered. A second exclusion of the same host and service replaces the first.
  rpc Exclude(ExcludeRequest) returns (ExcludeResponse);
  // Put an excluded host back. Including a host that is not excluded changes nothing and is not
  // an error.
  rpc Include(IncludeRequest) returns (IncludeResponse);
  // Replace a host's labels, which service selectors match. An empty set removes them.
  rpc SetLabels(SetLabelsRequest) returns (SetLabelsResponse);
  // Queue an `abort` order of a service for the host's next heartbeat; it takes no slot. An
  // abort of a host that runs nothing of the service is accepted and changes nothing.
  rpc Abort(AbortRequest) returns (AbortResponse);
  // Retire an enrolled host: a deny row is written, so its heartbeats and its `Renew` are
  // refused `denied` at once, and every entry of the host's own in the services' assignments is
  // dropped: an assignment or exclusion of the host, its minimum version, and an uninstall it was
  // ordered (which is cancelled); a role's entries stay. An update in flight on it keeps its
  // slot until the host reports the update's record final; a host with none frees it now. The
  // host is sent no `uninstall`. Retiring a host already retired is answered as retired and
  // audited once.
  rpc Retire(RetireRequest) returns (RetireResponse);
  // Order the host to set aside its step record of the service when the record does not read
  // (the `clear_record` verb of `hostkeeper.agent.v1`), at the host's next heartbeat; it takes no
  // slot and is sent once. Only for a host whose daemon announced `clear-record-v1` in its last
  // heartbeat; to any other it is refused `daemon_too_old` and nothing is ordered. The daemon's
  // verdict comes back in a heartbeat like any order's. Audited `record_cleared`.
  rpc ClearRecord(ClearRecordRequest) returns (ClearRecordResponse);
}

// The desired version of each service, how far the hosts are, and the operator's overrides.
service Releases {
  // Set a service's desired state. The coordinator moves its hosts there by the service's update
  // plan, stage by stage (`Rollouts`), a role's `max_updating` at a time. Takes
  // CI's OIDC token (the services its allow-list entry names) or the operator token (any service
  // the coordinator manages, audited as `set_desired` under the token's name; a set with
  // `targets` is audited by CI too). Its request is at most 256 KiB; every other method's 4 KiB.
  rpc SetDesired(SetDesiredRequest) returns (SetDesiredResponse);
  // How far a service's hosts are from its desired version. Changes nothing. Takes CI's OIDC
  // token or the operator token.
  rpc Converge(ConvergeRequest) returns (ConvergeResponse);
  // Switch a service to a version on the targeted hosts at once, with no hook (see
  // `ForceRequest`).
  rpc Force(ForceRequest) returns (ForceResponse);
  // Lift a bad mark from a version, so that it may be ordered and CI may set it again.
  rpc UnmarkBad(UnmarkBadRequest) returns (UnmarkBadResponse);
  // Lift a service's standing halt.
  rpc ClearHalt(ClearHaltRequest) returns (ClearHaltResponse);
  // Everything the coordinator holds about each service. Changes nothing.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Mark a version bad by hand: it is never ordered again until it is unmarked. A held pair is
  // not reached.
  rpc MarkBad(MarkBadRequest) returns (MarkBadResponse);
  // Halt a service by hand, as a host's halt report does: no host of it is ordered until the halt
  // is cleared.
  rpc Halt(HaltRequest) returns (HaltResponse);
  // Hold the call until a service's hosts have converged on a version, or the wait ends another
  // way (see `WaitOutcome`), for at most `wait_secs`. The coordinator answers at once when the
  // wait is over already, and otherwise after the change that ends it. Changes nothing. Takes
  // CI's OIDC token or the operator token, checked once, when the call is admitted.
  rpc WaitConverged(WaitConvergedRequest) returns (WaitConvergedResponse);
  // The release a version of a service was set with: its targets, as set, and the digest of the
  // release index that came with them. Changes nothing. Takes CI's OIDC token or the operator
  // token, and answers either for any service.
  rpc GetRelease(GetReleaseRequest) returns (GetReleaseResponse);
}

// The services the coordinator manages, which hosts run them, and the operator's holds.
service Services {
  // Every service, with its desired version, the roles and hosts it is assigned to, the
  // operator's assignments, its minimum versions, the hosts ordered to uninstall it and its holds.
  rpc List(ListServicesRequest) returns (ListServicesResponse);
  // Assign a service to a host or a role: a host that does not run it is ordered to install it
  // at its next heartbeat, unless a hold stands. Assigning a service already assigned changes
  // nothing. Deprecated: a coordinator that holds host groups refuses it `placed_by_host_group`,
  // since `HostGroups.Put` and `HostGroups.Move` place every package.
  rpc Assign(AssignRequest) returns (AssignResponse);
  // Take a service off a host or a role. With `uninstall`, each host that no longer has any
  // assignment of it is ordered to uninstall it; without, the coordinator stops managing it
  // there and the host keeps running it. Deprecated: refused `placed_by_host_group` as `Assign`
  // is.
  rpc Unassign(UnassignRequest) returns (UnassignResponse);
  // Set the version below which the rollout gate orders the service to no host of a role, or to
  // one host: no update, install or automatic rollback. A host's own minimum stands before its
  // role's, and neither goes below the rollout file's.
  rpc SetMinVersion(SetMinVersionRequest) returns (SetMinVersionResponse);
  // Hold a service on a host, a role or the whole fleet where it is: the coordinator orders the
  // held pairs nothing (no update, install, rollback, uninstall or force) until the hold is
  // released. A hold carries no version, takes no slot, survives a coordinator restart, covers
  // hosts that later join a held role, and the host never learns of it. An update already
  // running finishes. Holding a pair already held under the same scope replaces the reason.
  rpc Hold(HoldRequest) returns (HoldResponse);
  // Release a hold: the pairs it held are ordered to the then-desired version at their next
  // heartbeat.
  rpc Unhold(UnholdRequest) returns (UnholdResponse);
}

// The coordinator's audit log.
service Audit {
  // The entries after `since_seq` that match every filter set, newest last. Changes nothing.
  rpc List(ListAuditRequest) returns (ListAuditResponse);
}

// The conditions that need a person.
service Alerts {
  // Every condition that needs a person now, by kind, then service, host and version. Changes
  // nothing.
  rpc List(ListAlertsRequest) returns (ListAlertsResponse);
}

// Why `Hosts` refused a request. The token is the value's name without the prefix, in lower
// case.
enum HostsRefusal {
  HOSTS_REFUSAL_UNSPECIFIED = 0;
  // UNAUTHENTICATED: no bearer, or not the operator token.
  HOSTS_REFUSAL_UNAUTHORIZED = 1;
  // PERMISSION_DENIED: the bearer is a valid CI token, which `Hosts` does not take.
  HOSTS_REFUSAL_FORBIDDEN = 2;
  // INVALID_ARGUMENT: a field breaks its rule (a node id, a reason, a label).
  HOSTS_REFUSAL_INVALID_REQUEST = 3;
  // NOT_FOUND: the service is not one the coordinator manages.
  HOSTS_REFUSAL_UNKNOWN_SERVICE = 4;
  // NOT_FOUND: the coordinator has not heard from the host since it started (`Retire`: the
  // coordinator enrolled no host with the id).
  HOSTS_REFUSAL_UNKNOWN_HOST = 5;
  // RESOURCE_EXHAUSTED: the change would hold more than 4096 exclusions, or labels for more than
  // 4096 hosts.
  HOSTS_REFUSAL_CAPACITY = 6;
  // INTERNAL: the change could not be written; nothing changed, and asking again is safe.
  HOSTS_REFUSAL_STORE_FAILED = 7;
  // UNAVAILABLE: the change's line could not be appended to the audit file (a full disk); nothing
  // changed, and asking again is safe once the file takes lines again.
  HOSTS_REFUSAL_AUDIT_UNAVAILABLE = 8;
  // FAILED_PRECONDITION: the host's daemon did not announce, in its last heartbeat, the feature
  // the order needs (`ClearRecord`: `clear-record-v1`); nothing is ordered.
  HOSTS_REFUSAL_DAEMON_TOO_OLD = 9;
}

// Why `Releases` refused a request. The token is the value's name without the prefix, in lower
// case.
enum ReleasesRefusal {
  RELEASES_REFUSAL_UNSPECIFIED = 0;
  // UNAUTHENTICATED: no bearer, or one the RPC does not take.
  RELEASES_REFUSAL_UNAUTHORIZED = 1;
  // PERMISSION_DENIED: a valid CI token on an operator-only RPC, or on `SetDesired` for a service
  // its allow-list entry does not name.
  RELEASES_REFUSAL_FORBIDDEN = 2;
  // UNAVAILABLE: the keys CI's tokens are checked against cannot be fetched now; retry.
  RELEASES_REFUSAL_KEYS_UNAVAILABLE = 3;
  // INVALID_ARGUMENT: a field breaks its rule (a version, a role, a count, a reason, a write id).
  RELEASES_REFUSAL_INVALID_REQUEST = 4;
  // NOT_FOUND: the service is not one the coordinator manages.
  RELEASES_REFUSAL_UNKNOWN_SERVICE = 5;
  // ABORTED: `if_generation` is not the service's generation now.
  RELEASES_REFUSAL_GENERATION_CONFLICT = 6;
  // FAILED_PRECONDITION: the version was left by a force and is marked bad; `UnmarkBad` lifts it.
  RELEASES_REFUSAL_HELD_BAD = 7;
  // FAILED_PRECONDITION: a force to a version older than the service's `min_version`, the first
  // release that has its update hook. Such a release is installed on each host by hand.
  RELEASES_REFUSAL_BELOW_MIN_VERSION = 8;
  // FAILED_PRECONDITION: `ClearHalt` of a service that is not halted.
  RELEASES_REFUSAL_NOT_HALTED = 9;
  // FAILED_PRECONDITION: `UnmarkBad` of a version that is not marked bad.
  RELEASES_REFUSAL_NOT_MARKED_BAD = 10;
  // INTERNAL: the change could not be written; nothing changed, and asking again is safe.
  RELEASES_REFUSAL_STORE_FAILED = 11;
  // FAILED_PRECONDITION: a force to a version CI registered no package digest for.
  RELEASES_REFUSAL_NO_DIGEST = 12;
  // FAILED_PRECONDITION: a force of the service `hostkeeper`, which updates itself by its own path.
  RELEASES_REFUSAL_SELF_SERVICE = 13;
  // INVALID_ARGUMENT: a fleet-wide force whose `confirm_service` is not its `service`.
  RELEASES_REFUSAL_CONFIRM_MISMATCH = 14;
  // FAILED_PRECONDITION: `MarkBad` of a version that is marked bad already.
  RELEASES_REFUSAL_ALREADY_BAD = 15;
  // FAILED_PRECONDITION: `Halt` of a service that is halted already.
  RELEASES_REFUSAL_ALREADY_HALTED = 16;
  // INVALID_ARGUMENT: a force target role or host the coordinator does not know.
  RELEASES_REFUSAL_UNKNOWN_TARGET = 17;
  // UNAVAILABLE: the change's line could not be appended to the audit file (a full disk); nothing
  // changed, and asking again is safe once the file takes lines again.
  RELEASES_REFUSAL_AUDIT_UNAVAILABLE = 18;
  // FAILED_PRECONDITION: `SetDesired` of a version the coordinator's release channel does not
  // hold yet, or whose index could not be read. Nothing changed; retry once the channel holds it.
  RELEASES_REFUSAL_NOT_IN_CHANNEL = 19;
  // FAILED_PRECONDITION: `SetDesired` of a version whose index in the coordinator's release
  // channel names another service or version, or no package with the digest the set names, or,
  // for a set over a release index, is not that index (its SHA-256 is not `release_index_digest`).
  // Nothing changed; the channel holds another artifact, so the same set is refused again.
  RELEASES_REFUSAL_CHANNEL_DIGEST_MISMATCH = 20;
  // INVALID_ARGUMENT: `SetDesired`'s `release_index` does not have the SHA-256
  // `release_index_digest` names: the index was changed or cut on its way.
  RELEASES_REFUSAL_INDEX_DIGEST_MISMATCH = 21;
  // INVALID_ARGUMENT: `SetDesired`'s `release_index` is not a release index of the service at the
  // desired version (design section 5.5), or comes without `release_index_digest`, or with
  // `package_digest`.
  RELEASES_REFUSAL_INDEX_INVALID = 22;
  // INVALID_ARGUMENT: `WaitConverged`'s `wait_secs` is 0 or above 1800.
  RELEASES_REFUSAL_INVALID_WAIT = 23;
  // FAILED_PRECONDITION: `WaitConverged` while 16 waits are held already; retry once one ends.
  RELEASES_REFUSAL_TOO_MANY_WAITS = 24;
  // INVALID_ARGUMENT: `SetDesired`'s `targets` break a rule of the release (no platform, a key
  // that is not a platform, a list of no entry or more than 8, an installer twice in a list, an
  // entry or its manifest that breaks its rule, or for the service `hostkeeper` a list but one
  // `hostkeeper-archive` entry). Nothing changed.
  RELEASES_REFUSAL_TARGET_INVALID = 25;
  // FAILED_PRECONDITION: `SetDesired` of a version set before as another release: with other
  // targets or another release index, with a package digest or an index where this set has
  // targets, or with targets where this set names a package digest or an index. A release is
  // immutable; a changed artifact, manifest or order of entries is a new version. Not retried.
  RELEASES_REFUSAL_RELEASE_EXISTS = 26;
  // NOT_FOUND: `GetRelease` of a version the service was never set with targets, or whose release
  // was dropped with it from the registry.
  RELEASES_REFUSAL_RELEASE_UNKNOWN = 27;
  // FAILED_PRECONDITION: `SetDesired` with a repository entry while the registry
  // (`Repositories`) does not hold the repository the service names (`repository` of its
  // `ServiceEntry`), or of an entry whose `repository` is not `<name>-<suite>` of that
  // repository's name and one of its suites. Nothing changed.
  RELEASES_REFUSAL_REPOSITORY_UNKNOWN = 28;
  // FAILED_PRECONDITION: a call that names a host group that does not list the service, or that
  // no group has the name of; or a call that names no group, for a service no group lists.
  RELEASES_REFUSAL_NOT_IN_HOST_GROUP = 29;
  // FAILED_PRECONDITION: `SetDesired` with `if_generation` and no `host_group`, for a service
  // more than one group lists: there is no one generation to compare.
  RELEASES_REFUSAL_AMBIGUOUS_HOST_GROUP = 30;
  // INVALID_ARGUMENT: `SetDesired` whose `desired` sets `max_updating` or `min_up`, which a
  // group's rollout policy holds.
  RELEASES_REFUSAL_LIMITS_IN_HOST_GROUP = 31;
}

// Why `Services` refused a request. The token is the value's name without the prefix, in lower
// case.
enum ServicesRefusal {
  SERVICES_REFUSAL_UNSPECIFIED = 0;
  // UNAUTHENTICATED: no bearer, or not the operator token.
  SERVICES_REFUSAL_UNAUTHORIZED = 1;
  // PERMISSION_DENIED: the bearer is a valid CI token, which `Services` does not take.
  SERVICES_REFUSAL_FORBIDDEN = 2;
  // INVALID_ARGUMENT: a field breaks its rule (a node id, a role, a version, a reason), or a scope
  // is missing.
  SERVICES_REFUSAL_INVALID_REQUEST = 3;
  // NOT_FOUND: the service is not one the coordinator manages.
  SERVICES_REFUSAL_UNKNOWN_SERVICE = 4;
  // NOT_FOUND: the coordinator knows no such host.
  SERVICES_REFUSAL_UNKNOWN_HOST = 5;
  // FAILED_PRECONDITION: `Unassign` of a service the host or the role is not assigned.
  SERVICES_REFUSAL_NOT_ASSIGNED = 6;
  // FAILED_PRECONDITION: `Unhold` of a pair no hold of that scope holds.
  SERVICES_REFUSAL_NOT_HELD = 7;
  // INTERNAL: the change could not be written; nothing changed, and asking again is safe.
  SERVICES_REFUSAL_STORE_FAILED = 8;
  // NOT_FOUND: no service of the rollout file runs on the role, no host heard from has it, and
  // no assignment names it.
  SERVICES_REFUSAL_UNKNOWN_ROLE = 9;
  // FAILED_PRECONDITION: `SetMinVersion` above the service's desired version, which would hold
  // every host of the scope below its minimum.
  SERVICES_REFUSAL_BELOW_MIN_VERSION = 10;
  // UNAVAILABLE: the change's line could not be appended to the audit file (a full disk); nothing
  // changed, and asking again is safe once the file takes lines again.
  SERVICES_REFUSAL_AUDIT_UNAVAILABLE = 11;
  // FAILED_PRECONDITION: `Assign` or `Unassign`: host groups place every package
  // (`HostGroups.Put`, `HostGroups.Move`).
  SERVICES_REFUSAL_PLACED_BY_HOST_GROUP = 12;
  // NOT_FOUND: `SetMinVersion` or `Hold` of a role scope that no host group has the name of.
  SERVICES_REFUSAL_UNKNOWN_HOST_GROUP = 13;
  // FAILED_PRECONDITION: `SetMinVersion` of a role scope whose host group does not list the
  // service.
  SERVICES_REFUSAL_NOT_IN_HOST_GROUP = 14;
}

// Why `Audit` refused a request. The token is the value's name without the prefix, in lower case.
enum AuditRefusal {
  AUDIT_REFUSAL_UNSPECIFIED = 0;
  // UNAUTHENTICATED: no bearer, or not the operator token.
  AUDIT_REFUSAL_UNAUTHORIZED = 1;
  // PERMISSION_DENIED: the bearer is a valid CI token, which `Audit` does not take.
  AUDIT_REFUSAL_FORBIDDEN = 2;
  // INVALID_ARGUMENT: a filter breaks its rule (an actor, an action, a service, a node id).
  AUDIT_REFUSAL_INVALID_REQUEST = 3;
  // INTERNAL: the log could not be read; nothing changed, and asking again is safe.
  AUDIT_REFUSAL_STORE_FAILED = 4;
}

// Why `Alerts` refused a request. The token is the value's name without the prefix, in lower
// case.
enum AlertsRefusal {
  ALERTS_REFUSAL_UNSPECIFIED = 0;
  // UNAUTHENTICATED: no bearer, or not the operator token.
  ALERTS_REFUSAL_UNAUTHORIZED = 1;
  // PERMISSION_DENIED: the bearer is a valid CI token, which `Alerts` does not take.
  ALERTS_REFUSAL_FORBIDDEN = 2;
  // INTERNAL: the enrollment store could not be read, so the alerts it holds (hosts waiting for
  // an operator, duplicate identities and claims) are not known; asking again is safe.
  ALERTS_REFUSAL_STORE_FAILED = 3;
}

message ListHostsRequest {
  // The most hosts to return; capped at 256, and 0 means the cap.
  uint32 limit = 1;
  // Where to go on, as `next_page_token` gave it; empty for the first page.
  string page_token = 2;
}

message ListHostsResponse {
  // By node id.
  repeated Host hosts = 1;
  // The token of the next page; empty on the last.
  string next_page_token = 2;
}

message GetHostRequest {
  string node_id = 1;
}

message GetHostResponse {
  Host host = 1;
}

// A host, as the coordinator knows it.
message Host {
  // From the host's certificate.
  string node_id = 1;
  // From the host's certificate; from a coordinator that holds host groups, the name of the
  // host's group (the same name as `host_group`), for readers that predate it.
  string role = 2;
  // It heartbeated within the last 45 seconds; false for a host not heard since the coordinator
  // started.
  bool live = 3;
  // When its last heartbeat arrived; 0 for a host not heard since the coordinator started.
  uint64 last_heartbeat_unix = 4;
  // Its last heartbeat, as it sent it. For a host not heard since the coordinator started, only
  // `agent` is set, from what the host's enrollment kept of its daemon (`running`).
  hostkeeper.agent.v1.HeartbeatRequest heartbeat = 5;
  // The labels an operator set on it.
  map<string, string> labels = 6;
  // The services it is excluded from.
  repeated Exclusion exclusions = 7;
  // How each service the coordinator manages sees it.
  repeated HostService services = 8;
  // The host id of the inventory record the host's enrollment matches: the claims of the request
  // its certificate's key was approved from, matched as `Enrollment.List` matches a pending
  // request (`InventoryMatch`). Empty when the host is not enrolled (no approval of its key is
  // held, or its host id is denied), when the coordinator has no enrollment, or when no record or
  // more than one matches.
  string inventory_record_id = 9;
  // The data MACs of that record, lower-case, colon-separated, sorted; empty without a record.
  repeated string data_macs = 10;
  // The BMC MAC of that record; empty without a record or when it names none.
  string bmc_mac = 11;
  // The serial of that record; empty without a record or when it names none.
  string serial = 12;
  // When the request of the host's key was approved, in unix seconds; 0 when the host is not
  // enrolled. A renewal approved by an operator moves it to that approval.
  uint64 enrolled_unix = 13;
  // The last second the host's current certificate is valid, as its last heartbeat said; absent
  // when it said none (no certificate, or an agent that predates the field).
  optional uint64 cert_not_after_unix = 14;
  // Why the host's last step of enrollment or renewal failed, as its last heartbeat said; absent
  // when that step succeeded.
  optional string last_renew_error = 15;
  // How many of its heartbeats since the coordinator started said a time further from the
  // coordinator's clock than `--clock-skew-secs`, either way.
  uint64 clock_skew_beats = 16;
  // When the coordinator accepted the host's first heartbeat since the approval `enrolled_unix`
  // names, in unix seconds by the same clock; absent when the host is not enrolled or has not
  // heartbeated since that approval. It is kept with the host's enrollment, so a restart of the
  // coordinator keeps it; the next approval of the host (a new key or a renewal) clears it.
  optional uint64 first_heartbeat_unix = 17;
  // When the coordinator accepted the host's first heartbeat since that approval that reported a
  // service the coordinator manages for the host (one that counts the host, not the agent
  // itself) installed and healthy, with no update of it under way, in unix seconds by the same
  // clock; absent until then, and when the host is not enrolled. Kept with the host's enrollment
  // as `first_heartbeat_unix` is, and cleared by the next approval of the host.
  optional uint64 first_serving_unix = 18;
  // The age of the host's Sigstore trusted root, in seconds, as its last heartbeat said
  // (`HeartbeatRequest.trusted_root_age_secs`); absent when it said none (no file of the root,
  // or an agent that predates the field).
  optional uint64 trusted_root_age_secs = 19;
  // Why the host's trusted root needs attention, as its last heartbeat said
  // (`HeartbeatRequest.trusted_root_reason`). UNSPECIFIED: unknown, the host's agent predates the
  // field or keeps no root, or its last heartbeat came by the JSON route, which carries no
  // trusted root.
  hostkeeper.agent.v1.TrustedRootReason trusted_root_reason = 20;
  // The installers the host's daemon listed in its last heartbeat over gRPC
  // (`HeartbeatRequest.installers`), which the coordinator picks the host's entry of a release
  // by. Empty when the coordinator has read none since it started: the daemon predates the field
  // or has beaten only over the JSON route.
  repeated string installers = 21;
  // Each service the host's daemon said it runs (a service it reported `absent` is left out),
  // by service name, from the last heartbeat the coordinator took it from. For a host not heard
  // since the coordinator started, what the host's enrollment kept of it; empty when it kept
  // nothing. The daemon's own version is `heartbeat.agent.version`.
  repeated RunningService running = 22;
  // When the coordinator accepted the heartbeat `running` was taken from, in unix seconds by the
  // same clock as `last_heartbeat_unix`; absent when nothing is known of what the host runs. For
  // a host not heard since the coordinator started, the time of the heartbeat that last changed
  // what its enrollment kept (a heartbeat that says the same writes nothing).
  optional uint64 running_unix = 23;
  // The package repositories the coordinator sends the host, and what its daemon reported of
  // them. Absent for a host whose daemon has not announced `repositories-v1` since the
  // coordinator started (a Mac's never does).
  optional HostRepositories repositories = 24;
  // The host group the host is in, kept with its enrollment; empty from a coordinator that does
  // not hold host groups.
  string host_group = 25;
}

// One service a host runs, as its daemon said in a heartbeat (packages-native.md section 10.6).
message RunningService {
  string service = 1;
  // The version it reported.
  string version = 2;
  // The installer it runs it with: the name the daemon gave (`ServiceBeat.installer`);
  // `hostkeeper-archive` when it gave none or its daemon does not announce `target-v1`. Empty
  // when not known: a `target-v1` daemon whose installers the coordinator has not read over
  // gRPC since it started, and nothing kept of the host.
  string installer = 3;
}

// A host taken out of a service.
message Exclusion {
  string service = 1;
  string reason = 2;
}

// One host as one service sees it.
message HostService {
  string service = 1;
  // Live, healthy, and not updating this service.
  bool up = 2;
  // It holds an update slot of this service: updating, its promotion pending, failed until it
  // beats healthy, or ordered until it reports.
  bool holds_slot = 3;
  // Why the host would not be ordered at its next heartbeat: the rollout gate's reason.
  GateReason gate_reason = 4;
  // Whether the service counts the host.
  Membership membership = 5;
  // The operator's holds that hold the pair: of the host, of its role, of the fleet.
  repeated HoldMark holds = 6;
  // The version of the service installed on the host, as it last reported; absent when it is not
  // installed.
  optional string installed_version = 7;
  // Its health, as the host last reported it.
  hostkeeper.agent.v1.Health health = 8;
  // The last update of the service on the host, with its verdict, phase, class, reason, detail,
  // try and log lines; absent before the first.
  hostkeeper.agent.v1.UpdateResult last_update = 9;
  // The operator's reason, when the host is excluded from the service.
  optional string excluded_reason = 10;
  // The stage of the service's update plan the host is in or waits for, from 1; absent when the
  // plan does not count the host (it is not eligible).
  optional uint32 stage = 11;
}

// Why the rollout gate does not order a host now (not to be confused with an operator's hold,
// `HoldMark`). These spellings are public. A value is never removed: one the coordinator no
// longer produces says so.
enum GateReason {
  GATE_REASON_UNSPECIFIED = 0;
  // Nothing holds it: it is ordered at its next heartbeat.
  GATE_REASON_NONE = 1;
  // The service is halted.
  GATE_REASON_HALTED = 2;
  // No longer produced: a service assigned to the host and not installed is ordered `install`.
  GATE_REASON_NO_DEFINITION = 3;
  // The service has no desired version.
  GATE_REASON_NO_DESIRED = 4;
  // The service does not count the host.
  GATE_REASON_NOT_A_MEMBER = 5;
  // The coordinator is within its quiet start after a restart.
  GATE_REASON_QUIET = 6;
  // No longer produced: only kbf's agent reports a pin.
  GATE_REASON_PINNED = 7;
  // No longer produced: a service assigned to the host and not installed is ordered `install`.
  GATE_REASON_ABSENT = 8;
  // The host is updating the service.
  GATE_REASON_UPDATING = 9;
  // The host is updating another service or has an order outstanding for one: a host does one
  // update at a time.
  GATE_REASON_BUSY_ELSEWHERE = 10;
  // The host runs the desired version.
  GATE_REASON_UP_TO_DATE = 11;
  // The host failed the desired version, and is not told it again.
  GATE_REASON_FAILED_HERE = 12;
  // The host declined the desired version for now.
  GATE_REASON_DEFERRED = 13;
  // As many hosts of the host's role hold an update slot of the service as the desired state's
  // `max_updating` of the role lets.
  GATE_REASON_NO_SLOT = 14;
  // No longer produced: `no_slot` counts the hosts of each role.
  GATE_REASON_WAITING_FOR_ROLE = 15;
  // No longer produced: `rollout_elsewhere` says a service waits for others.
  GATE_REASON_WAITING_FOR_SERVICE = 16;
  // No longer produced: `below_min_up` says it.
  GATE_REASON_MIN_UP = 17;
  // The hosts of the current stage of the update plan are still baking.
  GATE_REASON_BAKING = 18;
  // No longer produced: a canary is the first stage of the update plan.
  GATE_REASON_CANARY_WAIT = 19;
  // The desired version is marked bad.
  GATE_REASON_BAD = 20;
  // An operator holds the pair (`Services.Hold`).
  GATE_REASON_HELD = 21;
  // The host is waiting for an operator to approve its enrollment.
  GATE_REASON_WAITING_FOR_OPERATOR = 22;
  // The host's identity is also another host's: a cloned disk.
  GATE_REASON_DUPLICATE = 23;
  // The release index of the desired version lists no package for the host's platform: the host
  // is not ordered the version, and this is no failed update.
  GATE_REASON_NO_PACKAGE_FOR_PLATFORM = 24;
  // An operator paused the service's update plan (`Rollouts.Pause`).
  GATE_REASON_PAUSED = 25;
  // The host waits for a stage the plan enters only by an operator's `Rollouts.Advance`.
  GATE_REASON_ADVANCE_WAIT = 26;
  // A host of the plan's current stage failed the desired version; the next stage waits.
  GATE_REASON_STAGE_FAILED = 27;
  // The host waits for a later stage while the current one fills and updates.
  GATE_REASON_STAGE_WAIT = 28;
  // Ordering the host would leave fewer hosts of its role up than the desired state's `min_up`.
  GATE_REASON_BELOW_MIN_UP = 29;
  // Other services' rollouts are live, as many as the coordinator's `--live-rollouts` lets be.
  GATE_REASON_ROLLOUT_ELSEWHERE = 30;
  // The desired version was set with targets and none for the host's platform: the host is not
  // ordered the version, keeps what it runs, and this is no failed update and no missing host.
  GATE_REASON_NO_TARGET = 31;
  // The desired version's list for the host's platform has no entry whose installer the host's
  // daemon lists (`Host.installers`), and the host does not run the service: no build for this
  // host. Not ordered, not failed, not missing, and it does not hold the convergence.
  GATE_REASON_NO_BUILD_FOR_HOST = 32;
  // The host runs the service with an installer the desired version's list has no entry of, or
  // that its daemon no longer lists: it is not ordered the version, since a service changes its
  // installer on a host only by an uninstall, or by the move to native packages
  // (docs/design/packages-native.md section 10.6: from `hostkeeper-archive` to a native entry its
  // daemon lists, and back to the archive entry of a lower version whose list has no native
  // entry). Not failed, and `Convergence.installer_dropped` names it.
  GATE_REASON_INSTALLER_DROPPED = 33;
}

// Whether a service counts a host.
enum Membership {
  MEMBERSHIP_UNSPECIFIED = 0;
  // The host runs the service and is counted.
  MEMBERSHIP_PRESENT = 1;
  // An operator excluded it.
  MEMBERSHIP_EXCLUDED = 2;
  // The service's selector does not select it.
  MEMBERSHIP_NOT_SELECTED = 3;
  // It has not heartbeated for 45 seconds.
  MEMBERSHIP_DOWN = 4;
  // The service is declared on it and never ran.
  MEMBERSHIP_ABSENT = 5;
  // It is selected and does not list the service.
  MEMBERSHIP_MISSING = 6;
  // It is selected and its agent cannot list services.
  MEMBERSHIP_UNMANAGED = 7;
}

message ExcludeRequest {
  string service = 1;
  string node_id = 2;
  string reason = 3;
  // Also free the update slot the host holds for the service mid-update, for a host
  // that is gone and will not report its update final. False (the default) keeps the slot.
  bool abandon = 4;
}

message ExcludeResponse {
  // The change, as the audit ring numbered it.
  AuditEntry entry = 1;
}

message IncludeRequest {
  string service = 1;
  string node_id = 2;
}

message IncludeResponse {
  AuditEntry entry = 1;
}

message SetLabelsRequest {
  string node_id = 1;
  // At most 8; each key and value 1 to 32 bytes of `[a-z0-9-]`.
  map<string, string> labels = 2;
}

message SetLabelsResponse {
  AuditEntry entry = 1;
}

message AbortRequest {
  string node_id = 1;
  string service = 2;
  string reason = 3;
}

message AbortResponse {
  // The `abort` order waits for the host's next heartbeat.
  bool queued = 1;
  AuditEntry entry = 2;
}

message ClearRecordRequest {
  // The host, heard from since the coordinator started.
  string node_id = 1;
  // The service whose step record the host sets aside; one the coordinator manages.
  string service = 2;
}

message ClearRecordResponse {
  // The id of the `clear_record` order (`clear-record-<n>`, the number of its `record_cleared`
  // audit entry), which the host's verdict names (`UpdateResult.order_id`).
  string order_id = 1;
}

message RetireRequest {
  // The host id the host was enrolled as.
  string node_id = 1;
  // Why, for the audit log: 1 to 256 bytes with no control character, or empty for none.
  string reason = 2;
}

message RetireResponse {
  // The `host_retire` entry; absent when the host was already retired (nothing is audited
  // twice).
  AuditEntry entry = 1;
  // An update is in flight on the host: its slot is freed when the host reports the update's
  // record final, or by `Exclude` with `abandon` if the host is gone.
  bool update_in_flight = 2;
}

// What a service's hosts should run, and how fast they get there.
message DesiredState {
  string version = 1;
  // Per role, how many hosts of the role may hold an update slot of the service at once, within
  // a stage of its update plan; 0 holds the role: none of its hosts is ordered. A role not named
  // takes its default (1; 2 for `daemon` and `mac-daemon`). Deprecated: a coordinator that holds
  // host groups refuses a set with it (`limits_in_host_group`); the group's policy holds it.
  map<string, uint32> max_updating = 2;
  // The fewest live hosts of each role that must stay up while others update: a host is not
  // ordered when that would leave fewer. A role not named needs none. A service's definition may
  // require roles here (`kbf` requires `storage` and `frontend`). Deprecated: refused as
  // `max_updating` is.
  map<string, uint32> min_up = 3;
  // The digest of the one package CI registered for this version (64 lower-case hex characters),
  // which every order of this version names, whatever the host's platform. Absent when the
  // version was set with a release index.
  optional string package_digest = 4;
  // The SHA-256 of the release index CI registered for this version (64 lower-case hex
  // characters): each host is ordered the package the index lists for its platform, and a host
  // whose platform it does not list is ordered nothing (`GATE_REASON_NO_PACKAGE_FOR_PLATFORM`).
  // Absent when the version was set with one `package_digest`, or with neither.
  optional string release_index_digest = 5;
}

message SetDesiredRequest {
  string service = 1;
  DesiredState desired = 2;
  // Write only if the service's generation is this one now; otherwise refused with
  // `generation_conflict`, and nothing changes. Absent: write whatever the generation is.
  optional uint64 if_generation = 3;
  // The writer's own id for this write, kept with it and returned by `Converge`, so a writer
  // that lost the answer can tell whether its write landed: 1 to 128 visible ASCII characters.
  // Absent: none.
  optional string write_id = 4;
  // The digest of the package CI registers for `desired.version` (64 lower-case hex characters),
  // the one package every host is ordered whatever its platform: for a fleet of one platform.
  // Refused with `release_index` or with `targets` (`index_invalid`).
  optional string package_digest = 5;
  // The release index of `desired.version` (`index.json`, design section 5.5), byte for byte:
  // per platform, the package file, its size and its SHA-256. The coordinator checks that its
  // SHA-256 is `release_index_digest` (else `index_digest_mismatch`) and that it is the index of
  // `service` at `desired.version` (else `index_invalid`), keeps the digest of each platform's
  // package, and orders each host the package of its own platform. Comes with
  // `release_index_digest`.
  optional string release_index = 6;
  // The SHA-256 of `release_index` (64 lower-case hex characters), as CI's release job wrote
  // it down when it published the index: the release this desired state names.
  optional string release_index_digest = 7;
  // The release of `desired.version`, by platform (`linux-x86_64`, `linux-arm64`,
  // `macos-arm64`, and no other key): for each, the artifacts in CI's order of preference, one
  // per installer (docs/design/packages.md section 3). A platform with no list is left out; on
  // the JSON gateway a key whose value is `null` is dropped first. Checked by the rules of the
  // release (`target_invalid`). With `release_index`, the index lists exactly the platforms whose
  // list holds a `hostkeeper-archive` entry, each with that entry's size and digest
  // (`index_invalid`). The version is kept as this release, and set again only with the same
  // targets and index (`release_exists`); the desired state is stored with neither a package
  // digest nor an index digest. Every set with targets is audited, CI's as `ci`.
  map<string, hostkeeper.release.v1.TargetList> targets = 8;
  // The host group to set the version in. From a coordinator that holds host groups: the group
  // must list the service (`not_in_host_group`); empty: in each group that lists the service (each group a token
  // limited to groups may deploy to), one deployment and one audit entry per group, in one
  // change; `if_generation` is then taken only when one group lists it (`ambiguous_host_group`).
  string host_group = 9;
}

message SetDesiredResponse {
  // The state as stored.
  DesiredState desired = 1;
  // How the store records the service's writes now.
  WriteRecord record = 2;
  // The roles whose limits were dropped because the service does not run on them, sorted.
  // Always empty from a coordinator that holds host groups.
  repeated string dropped_roles = 3;
}

// How the store records a service's writes.
message WriteRecord {
  // One more for every accepted write, a write of the same version included; 0 before the first.
  uint64 generation = 1;
  // The version and minimums the last change of version replaced. Absent until a second version
  // is set.
  Replaced replaced = 2;
  // The write id of the last write; absent when it had none.
  optional string write_id = 3;
}

message Replaced {
  string version = 1;
  map<string, uint32> min_up = 2;
}

message ConvergeRequest {
  string service = 1;
  // The host group. From a coordinator that holds host groups: empty for every group that lists
  // the service and has a desired version of it, converged when all are.
  string host_group = 2;
}

message GetReleaseRequest {
  // The service; empty names the legacy service, as for `Converge`.
  string service = 1;
  // The version, as it was set.
  string version = 2;
  // The host group. From a coordinator that holds host groups: a named group must list the
  // service (`not_in_host_group`); empty for none.
  string host_group = 3;
}

message GetReleaseResponse {
  // The targets the version was set with, each platform's entries in the order set.
  map<string, hostkeeper.release.v1.TargetList> targets = 1;
  // The SHA-256 of the release index set with them; absent when the set carried none.
  optional string release_index_digest = 2;
}

message ConvergeResponse {
  Convergence convergence = 1;
}

message WaitConvergedRequest {
  // The service; empty names the legacy service, as for `Converge`.
  string service = 1;
  // The version the caller set; any other desired version ends the wait as SUPERSEDED.
  string version = 2;
  // How long to hold the call, 1 to 1800 seconds.
  uint32 wait_secs = 3;
  // The host group. From a coordinator that holds host groups: empty for every group that lists
  // the service and has a desired version of it, converged when all are (a group with no hosts
  // is converged).
  string host_group = 4;
}

message WaitConvergedResponse {
  WaitOutcome outcome = 1;
  // As `Converge` answers it at the end of the wait.
  Convergence convergence = 2;
}

// What ended a `WaitConverged` call. A state of BLOCKED or IN_PROGRESS keeps the call waiting.
enum WaitOutcome {
  WAIT_OUTCOME_UNSPECIFIED = 0;
  // The service's state is CONVERGED on the version.
  WAIT_OUTCOME_CONVERGED = 1;
  // The service is halted.
  WAIT_OUTCOME_HALTED = 2;
  // The service's desired version is not the version.
  WAIT_OUTCOME_SUPERSEDED = 3;
  // `wait_secs` passed first.
  WAIT_OUTCOME_DEADLINE = 4;
  // From a coordinator that holds host groups: no group the call reaches has a desired version
  // of the service, answered at once.
  WAIT_OUTCOME_NO_DESIRED = 5;
}

// How far a service's hosts are from its desired version.
message Convergence {
  // The desired version; absent when none was ever set.
  optional string desired = 1;
  // The coordinator is within its quiet start after a restart, and orders nothing.
  bool quiet = 2;
  ConvergenceState state = 3;
  // The hosts of each role, in the service's role order; a role with no host is left out.
  repeated RoleCounts roles = 4;
  // The standing halt, when the state is HALTED.
  HaltRecord halt = 5;
  // Hosts the service does not count, by why. Absent when the service has no selector and every
  // count is 0.
  HostCounts hosts = 6;
  // The build of the coordinator that answers: 12 hex digits, or `unknown`.
  string coordinator_commit = 7;
  // How the store records the service's writes.
  WriteRecord record = 8;
  // The force that stands, if one does.
  ForceRecord force = 9;
  // The hosts that run the service with an installer the desired version's list has no entry
  // of, or that their daemon no longer lists (`GATE_REASON_INSTALLER_DROPPED`), by node id.
  repeated string installer_dropped = 10;
}

enum ConvergenceState {
  CONVERGENCE_STATE_UNSPECIFIED = 0;
  // Every live host runs the desired version, is settled, and every role has its minimum up.
  CONVERGENCE_STATE_CONVERGED = 1;
  // A host failed the desired version.
  CONVERGENCE_STATE_BLOCKED = 2;
  // A host reported a failure no version can repair; nothing is ordered until an operator clears
  // it. A new desired version does not lift it.
  CONVERGENCE_STATE_HALTED = 3;
  // Anything else, and every state before a desired version is set.
  CONVERGENCE_STATE_IN_PROGRESS = 4;
}

// The live hosts of one role, and the silent ones.
message RoleCounts {
  // The role; from a coordinator that holds host groups, the name of the hosts' group.
  string role = 1;
  // Live and running the desired version.
  uint32 at_desired = 2;
  // Live and updating.
  uint32 updating = 3;
  // Live, behind, not updating, and failed the desired version.
  uint32 failed = 4;
  // Silent for 45 seconds or more.
  uint32 down = 5;
  // Live and pinned. A pinned host on the desired version is in `at_desired` too.
  uint32 pinned = 6;
}

// Hosts a service does not count, by why.
message HostCounts {
  // Selected, live, able to list services, and not listing this one.
  uint32 missing = 1;
  // Declared on the host and never ran.
  uint32 absent = 2;
  // Taken out by an operator.
  uint32 excluded = 3;
  // Selected, with an agent that cannot list services.
  uint32 unmanaged = 4;
  // Live, and declined the desired version for now. Also counted in `roles`.
  uint32 deferred = 5;
  // For a desired version set with targets: the hosts of the service picked an entry of it, and
  // those picked none, by why (`GateReason` 31 to 33). Hosts picked none are not counted in
  // `roles`; a version no host is picked for is not converged.
  uint32 picked = 6;
  uint32 no_target = 7;
  uint32 no_build_for_host = 8;
  uint32 installer_dropped = 9;
}

// Fix a service on every targeted host at once, with no hook, because a broken hook is often
// the thing that is broken: each targeted host stops the service's units, switches to `version`,
// links, starts the units and reports (the `force` verb of `hostkeeper.agent.v1.Order`). A force
// may cut running work: the units stop without a drain.
//
// The coordinator fills the order's package digest from the one CI registered for this service
// and version, and refuses the call if CI registered none (`no_digest`). It refuses the service
// `hostkeeper`, which updates itself by its own path (`self_service`), and a version below the
// service's `min_version` (`below_min_version`); lowering that is a separate change. A fleet-wide
// force needs `confirm_service` equal to `service` (`confirm_mismatch`).
//
// It records the force, lifts the bad mark of the version, clears a standing halt by sending a
// halt generation greater than the held one, sets the desired version to `version`, and on a
// downgrade marks bad each version it leaves (from the installed versions the targeted hosts last
// reported). Each is an audit entry.
//
// It orders the `force` on each targeted host at its next heartbeat, passing the update plan (its
// stages, limits, pause and the other services' rollouts), the canary, the bake, a deferral, bad
// marks, a standing halt and a host's failure of the version, so one call may reach every host in the same heartbeat round. It skips a pair an
// operator holds and lists the host in `held`, unless `include_held` is set: then it orders the
// held pairs it targets, for this call only, and removes no hold.
//
// The force stands until CI sets a newer desired version or an operator clears it; the automatic
// rollback of the service is suspended meanwhile. A second force replaces the first.
message ForceRequest {
  string service = 1;
  string version = 2;
  string reason = 3;
  // Which hosts: the whole fleet, the hosts of a role, or a list of hosts.
  oneof targets {
    FleetTarget fleet = 4;
    string role = 5;
    HostList hosts = 6;
  }
  // Order the held pairs among the targets too, for this call only.
  bool include_held = 7;
  // The host group whose desired version the force sets. From a coordinator that holds host
  // groups: `hosts` must be in it (`unknown_target`), `fleet` is the whole group, and a `role`
  // must name it; empty: one force per group, in one change (the groups of the `hosts`, or each
  // group that lists the service, or the `role`'s).
  string host_group = 8;
}

// Every host that runs the service.
message FleetTarget {
  // The service's name again, which must equal `ForceRequest.service`: a fleet-wide force is
  // confirmed by naming the service twice.
  string confirm_service = 1;
}

// Hosts by node id.
message HostList {
  repeated string node_ids = 1;
}

message ForceResponse {
  // The entries the force wrote, in order: `force`, then `unmark_bad`, `mark_bad` and
  // `clear_halt` as they apply.
  repeated AuditEntry entries = 1;
  // The targeted hosts skipped because an operator holds the pair; empty with `include_held`.
  repeated string held = 2;
  // How many hosts the force orders.
  uint32 targeted = 3;
  // The targeted hosts the force does not order, other than `held`, each with why.
  repeated SkippedHost skipped = 4;
}

// A targeted host a force does not order.
message SkippedHost {
  string node_id = 1;
  // Why, as a token: `daemon_too_old` (its daemon did not announce `forced-v1`), `held`,
  // `unknown_target`, `no_package_for_platform`, and for a version set with targets `no_target`,
  // `no_build_for_host` and `installer_dropped` (as `GateReason` says them). Open: a later
  // coordinator adds reasons.
  string reason = 2;
}

// A force, as the coordinator records it.
message ForceRecord {
  string version = 1;
  // One more for every force of the service.
  uint64 generation = 2;
  string reason = 3;
}

message UnmarkBadRequest {
  string service = 1;
  string version = 2;
  string reason = 3;
}

message UnmarkBadResponse {
  AuditEntry entry = 1;
}

// Lifts the halt, acknowledges the report that raised it and every other halt report received
// while it stood, and raises the service's clear generation by one, which agents are told in
// every heartbeat reply (`halt_generations`). An acknowledged report does not halt the service
// again while its host keeps reporting it.
message ClearHaltRequest {
  string service = 1;
  string reason = 2;
}

message ClearHaltResponse {
  AuditEntry entry = 1;
}

message StatusRequest {
  // One service; empty for every service the coordinator manages.
  string service = 1;
}

message StatusResponse {
  // In name order.
  repeated ServiceStatus services = 1;
  // The coordinator is within its quiet start after a restart.
  bool quiet = 2;
  // Heartbeats since the coordinator started whose service list was dropped as bad.
  uint64 services_dropped = 3;
  // Heartbeats since the coordinator started that had an optional fact dropped as bad, by the
  // fact's name.
  map<string, uint64> facts_dropped = 4;
  // The last 64 changes, oldest first.
  repeated AuditEntry audit = 5;
}

// One service, as the coordinator holds it.
message ServiceStatus {
  string service = 1;
  // Absent when none was ever set.
  DesiredState desired = 2;
  Convergence convergence = 3;
  // The hosts of the service, each as the service sees it.
  repeated ServiceHost hosts = 4;
  // Hosts the service is up on.
  uint32 up = 5;
  // The update slots held now.
  uint32 slots_held = 6;
  // What the coordinator and its operators marked on the service.
  ServiceMarks marks = 7;
  // The update plan for the desired version; absent when none was ever set.
  RolloutPlan plan = 8;
  // The host group: one entry per (group, service) from a coordinator that holds host groups;
  // empty from one that does not.
  string host_group = 9;
}

// One host as one service sees it, with the host's own report of the service.
message ServiceHost {
  string node_id = 1;
  string role = 2;
  bool live = 3;
  HostService view = 4;
  // What the host's last heartbeat said of the service; absent when it did not list it.
  hostkeeper.agent.v1.ServiceBeat beat = 5;
  // The operator's reason, when the host is excluded from the service.
  optional string excluded_reason = 6;
}

// What the coordinator and its operators marked on a service.
message ServiceMarks {
  // The standing halt.
  HaltRecord halt = 1;
  // The halt reports an operator cleared: one per host, the latest.
  repeated HaltRecord halt_acked = 2;
  // The other halt reports received while the standing halt stood: one per host, the latest.
  repeated HaltRecord halt_seen = 3;
  // How many times an operator has cleared a halt of the service.
  uint64 halt_generation = 4;
  // The newest version that converged and baked; where an automatic rollback goes back to.
  optional string last_good = 5;
  // The versions never ordered again until they are unmarked.
  repeated string bad = 6;
  // Of `bad`, the versions a force left, which CI may not set until an operator unmarks them.
  repeated string bad_by_force = 7;
  // The failure reports acknowledged when a version was set by hand or forced: one per host.
  repeated FailureAck failure_acked = 8;
  // How many times the service was forced; the force that stands is in the convergence.
  uint64 force_generation = 9;
}

// A halt report, or its acknowledgement.
message HaltRecord {
  string node_id = 1;
  // The check that failed, as a token; `unspecified` when the host named none.
  string check = 2;
  string target = 3;
  // The whole report the host made.
  hostkeeper.agent.v1.UpdateResult report = 4;
}

// A failure report an override acknowledged: the host, and the whole report it made, so that a
// different report of the same host is not hidden by it.
message FailureAck {
  string node_id = 1;
  hostkeeper.agent.v1.UpdateResult report = 2;
}

message MarkBadRequest {
  string service = 1;
  string version = 2;
  string reason = 3;
}

message MarkBadResponse {
  AuditEntry entry = 1;
}

message HaltRequest {
  string service = 1;
  string reason = 2;
}

message HaltResponse {
  AuditEntry entry = 1;
}

// Where a hold applies.
message HoldScope {
  oneof scope {
    // One host, by node id.
    string host = 1;
    // Every host of a role, those that join it later included; from a coordinator that holds
    // host groups, the hosts of the group of that name.
    string role = 2;
    // Every host.
    WholeFleet fleet = 3;
  }
}

// The whole fleet, as a scope.
message WholeFleet {}

// An operator's hold: the pairs of `service` in `scope` are ordered nothing until it is released.
message HoldMark {
  HoldScope scope = 1;
  string service = 2;
  string reason = 3;
  // The name of the token that set it.
  string set_by = 4;
  uint64 set_unix = 5;
}

message ListServicesRequest {}

message ListServicesResponse {
  // In name order.
  repeated ServiceEntry services = 1;
  // Every hold that stands.
  repeated HoldMark holds = 2;
}

// One service the coordinator manages.
message ServiceEntry {
  string service = 1;
  // The hosts heard from since the coordinator started that it is assigned to, by node id.
  repeated string hosts = 2;
  // The version below which no order takes it, by role or host, as an operator set it.
  repeated MinVersion min_versions = 3;
  // The holds of the service.
  repeated HoldMark holds = 4;
  // The desired version; absent when CI has set none.
  optional string desired_version = 5;
  // The roles it is assigned to: the rollout file's, with the operator's role assignments on top.
  // Deprecated: empty from a coordinator that holds host groups (see `host_groups`).
  repeated string roles = 6;
  // The operator's assignments of the service, by role and by host. Deprecated: empty from a
  // coordinator that holds host groups.
  repeated Assignment assignments = 7;
  // Each host of `hosts`, with what it last reported, the minimum version that applies to it and
  // the holds that hold it.
  repeated AssignedHost assigned = 8;
  // The hosts ordered to uninstall the service, until each reports it gone.
  repeated string uninstalling = 9;
  // The package repository of the registry (`Repositories`) its hosts install it from: the
  // rollout file's `repository`, `komira` when it names none.
  string repository = 10;
  // The host groups that list the service, by name; empty from a coordinator that does not hold
  // host groups.
  repeated string host_groups = 11;
}

// An operator's assignment of a service, to a role or a host, or its removal from one.
message Assignment {
  oneof scope {
    string role = 1;
    string host = 2;
  }
  // The service is taken off the scope (that the rollout file or a role assigns it) rather than
  // assigned to it.
  bool removed = 3;
}

// A host a service is assigned to.
message AssignedHost {
  string node_id = 1;
  string role = 2;
  // The version installed, as the host last reported it; absent when it does not run the service.
  optional string installed_version = 3;
  // The minimum version that applies to the host: its own, else its role's, and never below the
  // rollout file's; absent when there is none.
  optional string min_version = 4;
  // The operator's holds that hold the pair.
  repeated HoldMark holds = 5;
}

// A minimum version, for a role or a host.
message MinVersion {
  oneof scope {
    // A role; from a coordinator that holds host groups, the group of that name.
    string role = 1;
    string host = 2;
  }
  // The version; empty in `SetMinVersion` removes the minimum an operator set for the scope.
  string version = 3;
}

message AssignRequest {
  string node_id = 1;
  string service = 2;
  // A role to assign the service to instead of one host: every host of the role, those that join
  // it later included. Exactly one of `node_id` and `role` is set.
  string role = 3;
}

message AssignResponse {
  AuditEntry entry = 1;
}

message UnassignRequest {
  string node_id = 1;
  string service = 2;
  // Order the host to uninstall the service; false (the default) leaves it running there,
  // unmanaged.
  bool uninstall = 3;
  // A role to take the service off instead of one host. Exactly one of `node_id` and `role` is
  // set.
  string role = 4;
}

message UnassignResponse {
  AuditEntry entry = 1;
}

message SetMinVersionRequest {
  string service = 1;
  MinVersion min_version = 2;
}

message SetMinVersionResponse {
  AuditEntry entry = 1;
}

message HoldRequest {
  HoldScope scope = 1;
  string service = 2;
  string reason = 3;
}

message HoldResponse {
  // The hold as it now stands.
  HoldMark hold = 1;
  AuditEntry entry = 2;
}

message UnholdRequest {
  HoldScope scope = 1;
  string service = 2;
  string reason = 3;
}

message UnholdResponse {
  AuditEntry entry = 1;
}

message ListAuditRequest {
  // Only entries with a greater `seq`; 0 for the oldest the log keeps.
  uint64 since_seq = 1;
  // The most entries to return; capped at 256, and 0 means the cap.
  uint32 limit = 2;
  // Only entries by this actor, by the token of `Actor` (`operator`, `ci`, `coordinator`).
  optional string actor = 3;
  // Only entries of this action (`AuditEntry.action`).
  optional string action = 4;
  optional string service = 5;
  optional string node_id = 6;
  // Only entries made under this name (`AuditEntry.by_name`), as a token is named: 1 to 32
  // bytes of `[a-z0-9-]`. A name no entry has lists none.
  optional string by_name = 7;
  // The newest `limit` matching entries after `since_seq`, oldest first, in place of the
  // oldest; `next_seq` goes on from the newest of them.
  bool newest = 8;
  // Only entries about this host group (`AuditEntry.host_group`); a coordinator that does not
  // hold host groups lists none.
  optional string host_group = 9;
}

message ListAuditResponse {
  // Newest last.
  repeated AuditEntry entries = 1;
  // The `since_seq` of the next page: the `seq` of the last entry returned, or the request's
  // `since_seq` when none was.
  uint64 next_seq = 2;
}

message ListAlertsRequest {}

message ListAlertsResponse {
  // By kind (in the order of `AlertKind`), then service, host id, version and request id.
  repeated Alert alerts = 1;
}

// A condition that needs a person, as the coordinator derives it from what it holds.
message Alert {
  AlertKind kind = 1;
  AlertSeverity severity = 2;
  // The host it concerns; empty for a condition of the fleet or of a service.
  string host_id = 3;
  // The service it concerns; empty for one of no service.
  string service = 4;
  // The version it concerns (the halted, failed or held version); empty for none.
  string version = 5;
  // What happened and what a person does about it, in plain words.
  string message = 6;
  // When this coordinator first saw the condition, by its own clock: unix seconds. A condition
  // that ends and comes back is seen anew; a restarted coordinator sees every condition anew.
  uint64 first_observed_unix = 7;
  // For `ALERT_KIND_WAITING_FOR_OPERATOR` and `ALERT_KIND_DUPLICATE_CLAIM_PENDING`: the pending
  // request (`PendingEnrollment.request_id`); empty otherwise.
  string request_id = 8;
  // For `ALERT_KIND_DUPLICATE_CLAIM_PENDING`: the enrolled host whose identity the request also
  // claims; empty when that is another pending request, or not known.
  string other_host_id = 9;
}

// What an `Alert` is about. These spellings are public; the `alert=` field of the coordinator's
// log line of each is its log token, named per value.
enum AlertKind {
  ALERT_KIND_UNSPECIFIED = 0;
  // A service is halted: nothing is ordered for it until an operator clears the halt. Its host is
  // the one that reported it (none for an operator's halt). Log token `halt`.
  ALERT_KIND_HALT = 1;
  // A host asked to enroll and waits for an operator's approval (`Enrollment.Approve`). Log token
  // `waiting_for_operator`.
  ALERT_KIND_WAITING_FOR_OPERATOR = 2;
  // Two live daemons report the host's identity (a cloned disk): it is ordered nothing. Log
  // token `duplicate`.
  ALERT_KIND_DUPLICATE = 3;
  // A pending request claims an identity another host or request has (its machine id, a bound
  // MAC, or a renewal from another machine): it is approved only with `replace`. Log token
  // `duplicate_claim`.
  ALERT_KIND_DUPLICATE_CLAIM_PENDING = 4;
  // The host, a canary of the service, failed the release of the version: the version is marked
  // bad and rolled back. Listed while the version stays marked bad. Log token `canary_failed`.
  ALERT_KIND_FAILED_CANARY = 5;
  // An operator holds the host on a version of the service that is marked bad: it is not ordered
  // off it until the hold is released. Log token `held_on_bad_version`.
  ALERT_KIND_HELD_ON_BAD_VERSION = 6;
  // An operator excluded the host from the service with `abandon`, which freed the update slot it
  // may hold mid-update. Listed while the host stays excluded and the change is among the last 64
  // the coordinator keeps. Log token `exclude_abandon`.
  ALERT_KIND_ABANDONED_WHILE_UPDATING = 7;
  // The host has not heartbeated for the coordinator's silent-host threshold or longer. Log token
  // `silent_host`.
  ALERT_KIND_SILENT_HOST = 8;
  // The certificate the coordinator serves its hosts expires within the coordinator's window, or
  // has expired: its renewal is failing. Log token `cert_near_expiry`.
  ALERT_KIND_CERT_NEAR_EXPIRY = 9;
  // The coordinator's session with its database is lost: it orders nothing, refuses every change
  // that lowers protection, and keeps the changes that raise it in memory until the session is
  // back. Log token `store_unreachable`.
  ALERT_KIND_STORE_UNREACHABLE = 10;
  // The host's last heartbeat said its Sigstore trusted root needs attention: stale, missing or
  // unparseable (`Host.trusted_root_reason`). A stale root goes on checking packages, and refuses
  // every package signed after a Sigstore key rotation it does not hold; with a missing or
  // unparseable one every package check fails. Listed while the host's last heartbeat says a
  // reason; a host whose last heartbeat said nothing of its root raises none. Log token
  // `trusted_root`.
  ALERT_KIND_TRUSTED_ROOT = 11;
}

// How soon an `Alert` needs a person.
enum AlertSeverity {
  ALERT_SEVERITY_UNSPECIFIED = 0;
  // Something is stopped or at risk now: a halt, a duplicate identity, a failed canary.
  ALERT_SEVERITY_CRITICAL = 1;
  // Something waits for a person, or will go wrong if left.
  ALERT_SEVERITY_WARNING = 2;
}
