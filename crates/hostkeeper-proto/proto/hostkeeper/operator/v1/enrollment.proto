// hostkeeper.operator.v1: the `Enrollment` service of the operator API, its refusals
// (`EnrollmentRefusal`) and its messages: the hosts waiting for an operator to approve their
// enrollment, and the host inventory the operator records them against. The rest of the package,
// `Audit` and `AuditRefusal` among it, is operator.proto; this file is the same package and API,
// kept apart so that each file stays under 1000 lines.
//
// Served by: the coordinator, on its control listener, as operator.proto says.
//
// Authentication: `Enrollment` takes the operator token only; no CI token reaches it (see
// operator.proto).
//
// Refusals: a gRPC status whose message is exactly one token of `EnrollmentRefusal`, written as
// the value's name without the prefix, in lower case; the status code is the one each value
// names. A refused request changes nothing.
//
// Units: as operator.proto says. A MAC is six octets of two hex digits, separated all by `:` or
// all by `-`, or twelve hex digits, in either case, and is answered as lower-case
// `aa:bb:cc:dd:ee:ff`.
//
// Extending: as operator.proto says: add fields, messages, enum values and RPCs; never renumber,
// rename, retype or remove one, and never reuse a number.
syntax = "proto3";

package hostkeeper.operator.v1;

import "hostkeeper/agent/v1/agent.proto";
import "hostkeeper/operator/v1/operator.proto";

// The hosts waiting for an operator to approve their enrollment.
service Enrollment {
  // The pending requests, oldest first, a page at a time; with `unenrolled`, the requests that
  // expired instead.
  rpc List(ListPendingRequest) returns (ListPendingResponse);
  // Approve a pending request: the host gets its certificate at its next `Poll`, with the host
  // id and host group the approval names. The group is optional: a host approved with none is
  // enrolled in no specific group: it is in the built-in group `all` alone, and runs the packages
  // `all` lists until `HostGroups.Move` puts it in one. The reason is optional too.
  rpc Approve(ApproveRequest) returns (ApproveResponse);
  // Reject a pending request: it leaves the queue, and its key is refused from then on (its
  // `Poll` answers `DENIED`, and posting it again changes nothing). A request already rejected
  // is answered as rejected and audited once.
  rpc Reject(RejectRequest) returns (RejectResponse);
  // Record a server the operator built, before it first boots: its host id, optional role, data
  // MACs, BMC MAC, serial, notes and optional platform. A record for the host id, or a MAC or
  // serial another record holds, is refused; remove the record first.
  //
  // A record that names a role is the approval of the host's enrollment: its window opens now
  // and stays open until `approve_until_unix`, for `approve_for_secs`, or for the coordinator's
  // `--record-approve-for` (24 hours unless set), and never longer than its
  // `--record-approve-max` (7 days unless set). While the window is open and the record unused,
  // a pending request (not a renewal) that matches it exactly and no other record, that no
  // other pending request contests, and that is not a `duplicate_claim`, is approved by the
  // coordinator itself, as the record's host id and role, bound to the SHA-256 of the request's
  // key: no `Approve` is needed. The approval uses the record (`InventoryRecord.state` USED),
  // which approves nothing again. Exactly: by one of its data MACs among the claimed addresses
  // and, when the record holds a BMC MAC, that BMC MAC claimed; a Mac by its serial. Every
  // other request waits for `Approve` as before. A record with no role has no window.
  rpc AddRecord(AddRecordRequest) returns (AddRecordResponse);
  // The records, by host id, a page at a time; all of them, or only those a host is enrolled
  // against, or only the others.
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse);
  // Remove the record of a host id. An enrolled host keeps its certificate.
  rpc RemoveRecord(RemoveRecordRequest) returns (RemoveRecordResponse);
  // Change the data MACs, the BMC MAC and the notes of the record of a host id, and nothing else
  // of it: its role, host group, serial, platform, window, use and `added_by` stay as they are,
  // which removing the record and adding it again would not keep. The three fields are set as
  // given (empty clears the BMC MAC and the notes), checked as `AddRecord` checks them, and the
  // record must still hold a data MAC or a serial. A MAC that another record holds is refused
  // `record_conflict`. A pending request that matches the record is approved then, as at
  // `AddRecord`.
  rpc UpdateRecord(UpdateRecordRequest) returns (UpdateRecordResponse);
  // Open the window of a record again, one whose window ended or that a release before windows
  // added, or move the end of one still open: as `AddRecord` opens it, from now. A record an
  // approval used is refused `record_used`: remove it and add it again. A pending request that
  // matches the record is approved then, as at `AddRecord`.
  rpc OpenRecord(OpenRecordRequest) returns (OpenRecordResponse);
}

// Why `Enrollment` refused a request. The token is the value's name without the prefix, in lower
// case.
enum EnrollmentRefusal {
  ENROLLMENT_REFUSAL_UNSPECIFIED = 0;
  // UNAUTHENTICATED: no bearer, or not the operator token.
  ENROLLMENT_REFUSAL_UNAUTHORIZED = 1;
  // PERMISSION_DENIED: the bearer is a valid CI token, which `Enrollment` does not take.
  ENROLLMENT_REFUSAL_FORBIDDEN = 2;
  // NOT_FOUND: the coordinator holds no request with the id.
  ENROLLMENT_REFUSAL_UNKNOWN_REQUEST = 3;
  // FAILED_PRECONDITION: `key_sha256` is not the SHA-256 of the pending request's key.
  ENROLLMENT_REFUSAL_KEY_MISMATCH = 4;
  // ALREADY_EXISTS: another host holds the host id, and `replace` is not set.
  ENROLLMENT_REFUSAL_HOST_ID_TAKEN = 5;
  // RESOURCE_EXHAUSTED: the pending queue is full. `Enroll` returns it, as `pending_full` of
  // `CoordinatorRefusal`; it is listed here so that this enum names every enrollment refusal.
  ENROLLMENT_REFUSAL_PENDING_FULL = 6;
  // FAILED_PRECONDITION: the request is flagged `duplicate_claim`, and `replace` is not set.
  ENROLLMENT_REFUSAL_DUPLICATE_CLAIM = 7;
  // INVALID_ARGUMENT: the host id breaks its rule.
  ENROLLMENT_REFUSAL_INVALID_HOST_ID = 8;
  // INVALID_ARGUMENT: the role breaks its rule; or `role` beside `host_group` is another name; or,
  // from a coordinator that holds no host groups, `Approve` names no role (from one that holds
  // host groups, naming no group is allowed).
  ENROLLMENT_REFUSAL_INVALID_ROLE = 9;
  // INVALID_ARGUMENT: a service name breaks its rule, or names no service the coordinator
  // manages.
  ENROLLMENT_REFUSAL_INVALID_SERVICE = 10;
  // INVALID_ARGUMENT: another field breaks its rule (a request id, a key hash, a reason, a page
  // token).
  ENROLLMENT_REFUSAL_INVALID_REQUEST = 11;
  // FAILED_PRECONDITION: the request is no longer pending: it was approved, issued or denied, or it
  // expired (`Reject` of a request approved or issued; `Reject` of one already rejected, or of
  // one that expired, succeeds).
  ENROLLMENT_REFUSAL_NOT_PENDING = 12;
  // FAILED_PRECONDITION: an operator denied the host id, and `replace` is not set.
  ENROLLMENT_REFUSAL_DENIED = 13;
  // INTERNAL: the change could not be written; nothing changed, and asking again is safe.
  ENROLLMENT_REFUSAL_STORE_FAILED = 14;
  // ALREADY_EXISTS: `AddRecord` for a host id that has a record.
  ENROLLMENT_REFUSAL_RECORD_EXISTS = 15;
  // ALREADY_EXISTS: `AddRecord` with a MAC or a serial that another host id's record holds.
  ENROLLMENT_REFUSAL_RECORD_CONFLICT = 16;
  // NOT_FOUND: `RemoveRecord` of a host id that has no record.
  ENROLLMENT_REFUSAL_NO_RECORD = 17;
  // RESOURCE_EXHAUSTED: `AddRecord` past the 10000 records the coordinator keeps.
  ENROLLMENT_REFUSAL_CAPACITY = 18;
  // UNAVAILABLE: the change's line could not be appended to the audit file (a full disk); nothing
  // changed, and asking again is safe once the file takes lines again.
  ENROLLMENT_REFUSAL_AUDIT_UNAVAILABLE = 19;
  // FAILED_PRECONDITION: `Approve` names a host id other than that of the one inventory record
  // the request matches, and `replace` is not set.
  ENROLLMENT_REFUSAL_RECORD_MISMATCH = 20;
  // FAILED_PRECONDITION: another pending request matches an inventory record this request
  // matches (`PendingEnrollment.contested_by` names them): reject all but one first. `replace`
  // does not set it aside.
  ENROLLMENT_REFUSAL_RECORD_CONTESTED = 21;
  // INVALID_ARGUMENT: the window of `AddRecord` or `OpenRecord`: both `approve_until_unix` and
  // `approve_for_secs` set, an `approve_until_unix` not after now, a window longer than the
  // coordinator's `--record-approve-max`, or a window for a record that names no role.
  ENROLLMENT_REFUSAL_INVALID_WINDOW = 22;
  // FAILED_PRECONDITION: `OpenRecord` of a record an approval used.
  ENROLLMENT_REFUSAL_RECORD_USED = 23;
  // INVALID_ARGUMENT: `Approve` that names `services`: the host's group decides what it runs.
  ENROLLMENT_REFUSAL_SERVICES_RETIRED = 24;
  // FAILED_PRECONDITION: `Approve` of a renewal, or with `replace` (a Mac taking its own host id
  // over too), that names another host group than the one that host is in; `HostGroups.Move`
  // moves a host.
  ENROLLMENT_REFUSAL_HOST_GROUP_DIFFERS = 25;
  // NOT_FOUND: `Approve` or `AddRecord` that names a host group the coordinator does not hold
  // (any, for a coordinator that holds none).
  ENROLLMENT_REFUSAL_UNKNOWN_HOST_GROUP = 26;
  // INVALID_ARGUMENT: `Approve` whose placement is half given (`rack` without `u` and
  // `placement_height_u`, or either without `rack`), or whose height or `u` is not a whole number
  // of U in the rack.
  ENROLLMENT_REFUSAL_PLACEMENT_INVALID = 27;
  // NOT_FOUND: `Approve` that names a `rack` the lab layout does not hold.
  ENROLLMENT_REFUSAL_UNKNOWN_RACK = 28;
  // FAILED_PRECONDITION: `Approve` whose placement shares a U with a server already in the rack.
  ENROLLMENT_REFUSAL_PLACEMENT_OVERLAP = 29;
  // FAILED_PRECONDITION: `Approve` whose placement is not within the rack's U 1 to its height.
  ENROLLMENT_REFUSAL_PLACEMENT_OUT_OF_RACK = 30;
}

message ListPendingRequest {
  // The most requests to return; capped at 256, and 0 means the cap.
  uint32 limit = 1;
  // Where to go on, as `next_page_token` gave it; empty for the first page.
  string page_token = 2;
  // List the requests that expired, whose hosts are unenrolled, in place of the pending ones:
  // each waited for an operator longer than the coordinator's `--enrollment-request-ttl` and is
  // no longer approved. The order and the page tokens are the same. A coordinator before
  // expiry ignores the field and lists the pending requests, each with `state` UNSPECIFIED.
  bool unenrolled = 3;
}

message ListPendingResponse {
  // Oldest first.
  repeated PendingEnrollment requests = 1;
  // The token of the next page; empty on the last.
  string next_page_token = 2;
}

// One pending enrollment request. It never carries the CSR bytes or a nonce value.
message PendingEnrollment {
  string request_id = 1;
  // The SHA-256 of the request's key, which an approval must name.
  string key_sha256 = 2;
  // What the host says it is; claims authorise nothing.
  hostkeeper.agent.v1.Claims claims = 3;
  // The image the host's daemon came from, as it named it.
  string image = 4;
  // When the coordinator first received the request.
  uint64 first_seen_unix = 5;
  // The host id this request would return, for a host whose certificate expired; empty
  // otherwise.
  string renewal_of = 6;
  // Another host presents the same machine id or key, or the request claims a MAC bound to an
  // enrolled host.
  bool duplicate_claim = 7;
  // The request carried a Mac nonce (its value is never listed).
  bool mac_nonce_presented = 8;
  // How the request matches the host inventory. UNSPECIFIED from a coordinator that does not
  // match.
  InventoryMatch inventory_match = 9;
  // The host id of the one matching record (MATCHED only).
  string record_host_id = 10;
  // The role of the one matching record; empty when it names none (MATCHED only). From a
  // coordinator that holds host groups, the record's group (the same name as
  // `record_host_group`).
  string record_role = 11;
  // The host ids of every matching record, sorted (AMBIGUOUS only); none is chosen.
  repeated string candidate_host_ids = 12;
  // Where the request stands. UNSPECIFIED from a coordinator before expiry, whose list holds
  // only pending requests.
  EnrollmentRequestState state = 13;
  // Why the host is unenrolled, as a token: `request_expired`, no operator approved the request
  // within `request_ttl_secs` of `first_seen_unix` (UNENROLLED only).
  string unenrolled_reason = 14;
  // When the request expired (UNENROLLED only).
  uint64 unenrolled_unix = 15;
  // The coordinator's request TTL the request expired under, in seconds (UNENROLLED only).
  uint64 request_ttl_secs = 16;
  // The request ids of the other pending requests that match an inventory record this request
  // matches, sorted; empty when no other does. A request with any is contested: its approval is
  // refused `record_contested` until all but one are rejected. Empty in the `unenrolled` view,
  // and from a coordinator before contested records.
  repeated string contested_by = 17;
  // The serial of the one matching record; empty when it holds none (MATCHED only).
  string record_serial = 18;
  // The BMC MAC of the one matching record; empty when it holds none (MATCHED only).
  string record_bmc_mac = 19;
  // Where the one matching record's window stands (MATCHED only): a request still pending
  // against an OPEN record waits for an operator for another reason (it is contested, a
  // duplicate claim, a renewal, or claims no BMC MAC or another one than the record's).
  // UNSPECIFIED otherwise, and from a coordinator before windows.
  RecordState record_state = 20;
  // The end of the one matching record's window, unix seconds; 0 when it has none (MATCHED
  // only).
  uint64 record_approve_until_unix = 21;
  // The host group of the one matching record; empty when it names none (MATCHED only), and from
  // a coordinator that does not hold host groups.
  string record_host_group = 22;
}

// Where an enrollment request stands, as `Enrollment.List` shows it.
enum EnrollmentRequestState {
  ENROLLMENT_REQUEST_STATE_UNSPECIFIED = 0;
  // Waiting for an operator (a duplicate claim also says `duplicate_claim`).
  ENROLLMENT_REQUEST_STATE_PENDING = 1;
  // No longer waiting: the request expired, and its host is unenrolled. An approval of it is
  // refused `not_pending`. The host's key posted again starts it over as a pending request.
  ENROLLMENT_REQUEST_STATE_UNENROLLED = 2;
}

// How a pending request matches the host inventory. A record matches a Linux request when one of
// its data MACs is among the claimed addresses, and the request claims no BMC MAC or the record's
// BMC MAC; it matches a Mac request when its serial equals the claimed Mac serial, letters
// compared without case.
enum InventoryMatch {
  INVENTORY_MATCH_UNSPECIFIED = 0;
  // Exactly one record matches: its host id and role are filled in.
  INVENTORY_MATCH_MATCHED = 1;
  // No record matches.
  INVENTORY_MATCH_UNMATCHED = 2;
  // More than one record matches; none is chosen.
  INVENTORY_MATCH_AMBIGUOUS = 3;
}

// One server the operator recorded when building it.
message InventoryRecord {
  string host_id = 1;
  // The role the host is meant for; empty when the record names none. From a coordinator that
  // holds host groups, the record's group (the same name as `host_group`), for readers that
  // predate it.
  string role = 2;
  // The MACs of the host's data interfaces, lower-case, colon-separated, sorted; one to 16, or
  // none for a record that holds a serial.
  repeated string data_macs = 3;
  // The MAC of the host's BMC; empty when the record names none (a Mac has no BMC).
  string bmc_mac = 4;
  // The serial number: a Mac's is what its request is matched by. 1 to 64 of `A-Za-z0-9._-`,
  // or empty.
  string serial = 5;
  // Free text, 0 to 256 bytes once trimmed, with no control character but the line break (`\n`).
  string notes = 6;
  // The name of the operator token that added it.
  string added_by = 7;
  uint64 added_unix = 8;
  // A host is enrolled against the record: the claims of the request its key was approved from
  // match this record and no other, and its host id is not denied (`Host.inventory_record_id`
  // names the record).
  bool enrolled = 9;
  // What the coordinator's enrollment store holds for the record's host id, read from the store
  // at each call: the same before and after a coordinator restart, and the same for a host never
  // heard from as for one heartbeating. Only `HOST_HELD_NONE` says no host holds the id; `UNSPECIFIED` (a
  // coordinator of a release before this field, or one without enrollment) says nothing.
  HostHeld host_held = 10;
  // The end of the record's approval window, unix seconds: the coordinator approves a request
  // that matches the record exactly while the time is before it. 0 for a record with no window
  // (one that names no role, or one a release before windows added).
  uint64 approve_until_unix = 11;
  // Where the window stands, at the time of the call.
  RecordState state = 12;
  // The request the coordinator approved by the record (USED only).
  string used_by_request_id = 13;
  // When it approved it, unix seconds (USED only).
  uint64 used_unix = 14;
  // The platform the server is to be installed as by network boot: `PLATFORM_LINUX_X86_64` or
  // `PLATFORM_LINUX_ARM64`, or `PLATFORM_UNSPECIFIED` when the record states none (a Mac's
  // record, a record added without one, or a coordinator of a release before this field).
  hostkeeper.agent.v1.Platform platform = 15;
  // The host group the host is to be in; empty when the record names none, and from a coordinator
  // that does not hold host groups.
  string host_group = 16;
  // The host id of the host enrolled against the record (see `enrolled`); empty when none is, and
  // from a coordinator of a release before this field, and in the answers of `AddRecord`,
  // `UpdateRecord` and `OpenRecord`, which leave it out: only `ListRecords` fills it in. When
  // several enrolled hosts match the record, the first by host id.
  string enrolled_host_id = 17;
}

// Where an inventory record's approval window stands.
enum RecordState {
  // Not said: a coordinator of a release before windows.
  RECORD_STATE_UNSPECIFIED = 0;
  // The window is open and no approval used the record: a request that matches it exactly is
  // approved by the coordinator.
  RECORD_STATE_OPEN = 1;
  // No approval used the record, and its window ended or it has none: a request that matches
  // it waits for an operator. `OpenRecord` opens it again.
  RECORD_STATE_CLOSED = 2;
  // The coordinator approved a request by the record (`used_by_request_id`, `used_unix`): it
  // approves nothing again, whatever its window.
  RECORD_STATE_USED = 3;
}

// What the coordinator's enrollment store holds for a host id, as `InventoryRecord.host_held`
// says it.
enum HostHeld {
  // Not said: the coordinator is of a release before `host_held`, or runs without enrollment,
  // so it has no store to read. A reader that needs to know whether a host holds the id takes
  // this as "it may".
  HOST_HELD_UNSPECIFIED = 0;
  // No host: the id was never approved, and it is not denied.
  HOST_HELD_NONE = 1;
  // A host was approved as the id and the id is not denied, whether or not it was heard from.
  HOST_HELD_APPROVED = 2;
  // The id is denied (`Hosts.Retire`) and its retirement is not final yet: an update may still
  // be in flight on it.
  HOST_HELD_DENIED = 3;
  // The id is denied and its retirement is final.
  HOST_HELD_RETIRED = 4;
}

message ApproveRequest {
  string request_id = 1;
  // The SHA-256 of the pending request's key, as `PendingEnrollment.key_sha256` lists it.
  string key_sha256 = 2;
  // The host id the certificate names. For a request (not a renewal) that matches exactly one
  // inventory record, empty means that record's host id, and another host id needs `replace`;
  // otherwise it is required.
  string host_id = 3;
  // The host's role. From a coordinator that holds host groups, an alias of `host_group` kept
  // for clients that predate it: read as the group's name when `host_group` is empty, and when
  // both are empty the host is enrolled in no group. A coordinator that holds no host groups
  // requires it.
  string role = 4;
  // Services to assign to the host; may be empty. Deprecated: a coordinator that holds host
  // groups refuses any (`services_retired`).
  repeated string services = 5;
  // Take the host id from the host that holds it, revoking that host's certificate; also needed
  // to approve a `duplicate_claim` request or a denied host id. It never approves a contested
  // request (`record_contested`).
  bool replace = 6;
  // Why, for the audit log: 1 to 256 bytes with no control character, or empty for none.
  string reason = 7;
  // The host group the host is in, which must exist (`unknown_host_group`; a coordinator that
  // does not hold host groups refuses any); empty for none (with `role` empty too, from a
  // coordinator that holds host groups): the host is enrolled in no specific group
  // (in `all` alone) until `HostGroups.Move`. `all`, which every host is in, is no group a request
  // names (`unknown_host_group`). With a renewal or `replace`, the group of that host
  // (`host_group_differs`); empty keeps it.
  string host_group = 8;
  // Where the server stands, an optional placement the approval makes in the same step
  // (`docs/design/ui-shell-lab.md`): the lab layout's rack id, which must exist
  // (`unknown_rack`); empty for none, and then `placement_u` and `placement_height_u` are 0
  // (`placement_invalid`): the host is unplaced until it is placed (`Place` of `Layout`). A coordinator that holds no
  // layout refuses a rack (`unknown_rack`). The placement is of the inventory entry the host id
  // names when there is one, so the server keeps its place across a wipe, else of the host.
  // A refused placement refuses the approval, and nothing changes (`placement_overlap`,
  // `placement_out_of_rack`).
  string rack = 9;
  // The lowest U the server occupies, from 1 (the bottom); required with `rack`.
  uint32 placement_u = 10;
  // How many U it occupies; required with `rack`.
  uint32 placement_height_u = 11;
  // Or the sled the server stands on (`Layout.Get`'s `sleds`) and its slot from 0 (left out:
  // the lowest free): `rack`, `placement_u` and `placement_height_u` left empty (`placement_invalid`
  // otherwise). A slot another subject holds is `placement_overlap`, a sled the layout lacks
  // `placement_invalid`. With `rack`, `placement_u` and `placement_height_u` instead, the approval
  // makes a sled of that U and height for the server, which goes when the server leaves it.
  string placement_sled = 12;
  optional uint32 placement_slot = 13;
}

message ApproveResponse {
  // The host id approved: the one named, or the matching record's when none was named.
  string host_id = 1;
  // Always true: the certificate goes to the host at its next `Poll`, never in this answer.
  bool certificate_issued_at_poll = 2;
  AuditEntry entry = 3;
}

message RejectRequest {
  // The request to reject, as `PendingEnrollment.request_id` lists it.
  string request_id = 1;
  // Why, for the audit log: 1 to 256 bytes with no control character, or empty for none.
  string reason = 2;
}

message RejectResponse {
  // The `enroll_reject` entry; absent when the request was already rejected (nothing is
  // audited twice), or when the entry could not be written (logged).
  AuditEntry entry = 1;
}

message AddRecordRequest {
  string host_id = 1;
  // Empty for none; from a coordinator that holds host groups, read as the group's name when
  // `host_group` is empty.
  string role = 2;
  // At least one, or a `serial`.
  repeated string data_macs = 3;
  // Empty for none.
  string bmc_mac = 4;
  // Empty for none.
  string serial = 5;
  // Empty for none; otherwise as `InventoryRecord.notes`.
  string notes = 6;
  // The end of the record's window, unix seconds: after now, and within the coordinator's
  // `--record-approve-max` of it. 0 for none given.
  uint64 approve_until_unix = 7;
  // The length of the record's window from now, in seconds: at most the coordinator's
  // `--record-approve-max`. 0 for none given. With neither, the window is the coordinator's
  // `--record-approve-for`; with both, the call is refused `invalid_window`. A record that names
  // no role takes neither, and has no window.
  uint64 approve_for_secs = 8;
  // The platform to install the server as by network boot: `PLATFORM_LINUX_X86_64` or
  // `PLATFORM_LINUX_ARM64` (`linux_x86_64` or `linux_arm64` as a command-line flag);
  // `PLATFORM_UNSPECIFIED` (the flag left out) for none. Any other value is refused
  // `invalid_request`.
  hostkeeper.agent.v1.Platform platform = 9;
  // The host group the host is to be in, which must exist (`unknown_host_group`; a coordinator
  // that does not hold host groups refuses any); empty for none. A record that names a group has
  // a window as one that names a role does.
  string host_group = 10;
}

message AddRecordResponse {
  // As kept: MACs in their one spelling.
  InventoryRecord record = 1;
  AuditEntry entry = 2;
}

message ListRecordsRequest {
  // The most records to return; capped at 256, and 0 means the cap.
  uint32 limit = 1;
  // Where to go on, as `next_page_token` gave it; empty for the first page.
  string page_token = 2;
  // Unset for every record; true for only the records a host is enrolled against
  // (`InventoryRecord.enrolled`), false for only the others.
  optional bool enrolled = 3;
}

message ListRecordsResponse {
  // By host id.
  repeated InventoryRecord records = 1;
  // The token of the next page; empty on the last.
  string next_page_token = 2;
}

message RemoveRecordRequest {
  string host_id = 1;
  string reason = 2;
}

message RemoveRecordResponse {
  AuditEntry entry = 1;
}

message UpdateRecordRequest {
  string host_id = 1;
  // As `AddRecordRequest.data_macs`: the whole list, not additions.
  repeated string data_macs = 2;
  // As `AddRecordRequest.bmc_mac`.
  string bmc_mac = 3;
  // As `AddRecordRequest.notes`.
  string notes = 4;
}

message UpdateRecordResponse {
  // As kept: MACs in their one spelling, every other field as it was.
  InventoryRecord record = 1;
  AuditEntry entry = 2;
}

message OpenRecordRequest {
  string host_id = 1;
  // As `AddRecordRequest.approve_until_unix`.
  uint64 approve_until_unix = 2;
  // As `AddRecordRequest.approve_for_secs`.
  uint64 approve_for_secs = 3;
  // Why, for the audit log: 1 to 256 bytes with no control character, or empty for none.
  string reason = 4;
}

message OpenRecordResponse {
  // As kept, with its new window.
  InventoryRecord record = 1;
  AuditEntry entry = 2;
}
