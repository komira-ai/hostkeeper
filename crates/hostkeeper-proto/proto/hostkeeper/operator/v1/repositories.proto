// hostkeeper.operator.v1: the `Repositories` service of the operator API and its refusals
// (`RepositoriesRefusal`): the coordinator's registry of package repositories
// (docs/design/packages-repositories.md section 3). Each entry is a
// `hostkeeper.release.v1.Repository`: a name, the package manager, the URI, the suites, the
// components, the signing keys' fingerprints and the keyring. Each package
// comes from one (`Services.SetRepository`, `komira` when none is set); the coordinator sends each Linux host
// the repositories its services name, and the host's daemon writes them as its repository
// configuration. A private repository (`access` `hosts`) is read from its origin by the
// coordinator alone, with the credential of its `credential_file`, and served to each host over
// the agent listener, its own group's suite and pool only (docs/design/hostgroups.md section
// 6.6). The rest of the package, `Enrollment` and `EnrollmentRefusal` (enrollment.proto) and
// `Audit` and `AuditRefusal` among it, is operator.proto; this file is the same package and API,
// kept apart so that each file stays short.
//
// Served by: the coordinator, on its control listener, as operator.proto says.
//
// Authentication: `Repositories` takes the operator token only; no CI token reaches it (see
// operator.proto).
//
// Refusals: a gRPC status whose message is exactly one token of `RepositoriesRefusal`, written
// as the value's name without the prefix, in lower case; the status code is the one each value
// names. A refused request changes nothing.
//
// Units: as operator.proto says. A repository's bounds are the comments of
// `hostkeeper.release.v1.Repository`; the registry holds at most 16. A reason is 1 to 256 bytes
// of UTF-8 with no control character.
//
// Extending: as operator.proto says: add fields, messages, enum values and RPCs; never renumber,
// rename, retype or remove one, and never reuse a number.
syntax = "proto3";

package hostkeeper.operator.v1;

import "hostkeeper/operator/v1/entry.proto";
import "hostkeeper/release/v1/release.proto";

// The coordinator's registry of package repositories.
service Repositories {
  // Every repository of the registry, by name, without its keyring (`keyring_sha256` names it),
  // and the registry's generation. Changes nothing.
  rpc List(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  // One repository, with its keyring. Changes nothing.
  rpc Get(GetRepositoryRequest) returns (GetRepositoryResponse);
  // Adds a repository, or replaces the one of its name: a new keyring or new fingerprints are a
  // key rotation, which reaches each host whose services name it at its next heartbeat. The
  // registry's generation grows by one. Writes the audit entry `repository_put`.
  rpc Put(PutRepositoryRequest) returns (PutRepositoryResponse);
  // Removes a repository no package comes from. The registry's generation grows
  // by one. Writes the audit entry `repository_remove`. The built-in repository `komira` is
  // removed by no `Remove`, unless an entry of its name was put over it: then the built-in is
  // back.
  rpc Remove(RemoveRepositoryRequest) returns (RemoveRepositoryResponse);
  // Reads what the repository at a URL serves: its descriptor (`<base_uri>/hostkeeper-repository.json`)
  // and the signing key it names, over HTTPS, and answers the platforms, the channels, the packages
  // and the key's fingerprints, computed from the keyring, for the operator to confirm. Changes
  // nothing (docs/deploy/package-repositories.md, "Structure of a repository").
  rpc Discover(DiscoverRepositoryRequest) returns (DiscoverRepositoryResponse);
  // Adds the repository at a URL, as `Discover` showed it: reads the descriptor and the key again,
  // refuses when either differs from what the operator confirmed, and then does what `Put` does
  // with the entry it builds (same refusals, one audit entry `repository_put`, the registry's
  // generation up by one).
  rpc Add(AddRepositoryRequest) returns (AddRepositoryResponse);
}

// Why `Repositories` refused a request. The token is the value's name without the prefix, in
// lower case.
enum RepositoriesRefusal {
  REPOSITORIES_REFUSAL_UNSPECIFIED = 0;
  // UNAUTHENTICATED: no bearer, or not the operator token.
  REPOSITORIES_REFUSAL_UNAUTHORIZED = 1;
  // PERMISSION_DENIED: the bearer is a valid CI token, which `Repositories` does not take.
  REPOSITORIES_REFUSAL_FORBIDDEN = 2;
  // INVALID_ARGUMENT: a name that is not 1 to 32 bytes of `[a-z0-9-]`, a reason that breaks its
  // rule, or a `Put` whose repository breaks a rule of its fields other than its keyring's.
  REPOSITORIES_REFUSAL_INVALID_REQUEST = 3;
  // INVALID_ARGUMENT: `Put` of a keyring that is not a binary OpenPGP keyring of public keys,
  // that lacks a fingerprint of `fingerprints`, or that holds a primary key none of whose
  // fingerprints is listed.
  REPOSITORIES_REFUSAL_KEYRING_INVALID = 4;
  // NOT_FOUND: `Get` or `Remove` of a name the registry does not hold.
  REPOSITORIES_REFUSAL_UNKNOWN_REPOSITORY = 5;
  // FAILED_PRECONDITION: `Remove` of a repository a package comes from.
  REPOSITORIES_REFUSAL_IN_USE = 6;
  // FAILED_PRECONDITION: `Put` of a repository one of whose entries `<name>-<suite>` is an entry
  // of another repository of the registry.
  REPOSITORIES_REFUSAL_CONFLICT = 7;
  // RESOURCE_EXHAUSTED: `Put` of a new repository while the registry holds 16.
  REPOSITORIES_REFUSAL_CAPACITY = 8;
  // INTERNAL: the registry could not be written. Nothing changed.
  REPOSITORIES_REFUSAL_STORE_FAILED = 9;
  // UNAVAILABLE: the audit entry could not be written. Nothing changed.
  REPOSITORIES_REFUSAL_AUDIT_UNAVAILABLE = 10;
  // FAILED_PRECONDITION: `Put` of a private repository (`access` `hosts`) whose
  // `credential_file` the coordinator cannot use: absent, not a regular file, a link, not the
  // coordinator user's, of a mode other than 0600 or 0400, empty, more than 4 KiB, or not one
  // line of printable ASCII.
  REPOSITORIES_REFUSAL_CREDENTIAL_UNUSABLE = 11;
  // UNAVAILABLE: `Discover` or `Add` could not read the repository's descriptor or keyring: the
  // URL is not one the coordinator can read, the connection or the answer failed, the answer was
  // not 200 or had no length or was longer than allowed, or was a redirect.
  REPOSITORIES_REFUSAL_DISCOVERY_FAILED = 12;
  // INVALID_ARGUMENT: the descriptor or the keyring it names breaks a rule, or the descriptor's
  // fingerprints are not the keyring's. The coordinator's log names the rule.
  REPOSITORIES_REFUSAL_DESCRIPTOR_INVALID = 13;
  // FAILED_PRECONDITION: `Add` reads a descriptor or a key other than the operator confirmed.
  REPOSITORIES_REFUSAL_DESCRIPTOR_CHANGED = 14;
  // FAILED_PRECONDITION: `Remove` of the built-in repository `komira`; or `Add` of the name
  // `komira` with a key other than the pinned one (a key rotation goes through `Put`).
  REPOSITORIES_REFUSAL_BUILTIN = 15;
}

// A repository of the registry, and what the coordinator knows of it.
message RegisteredRepository {
  // The repository; without its keyring in `List`'s answer.
  hostkeeper.release.v1.Repository repository = 1;
  // The SHA-256 of its keyring, 64 lower-case hex characters.
  string keyring_sha256 = 2;
  // The registry's generation when it was last put.
  uint64 generation = 3;
  // The packages that come from it, by name.
  repeated string services = 4;
  // Whether the entry is the built-in one (`komira`, in the coordinator's code), not one put.
  bool builtin = 5;
  // The platforms it serves, derived: `linux-x86_64` and `linux-arm64` for an apt entry (put
  // without a descriptor, or with one), and the platforms of its descriptor's `macos-pkg` format.
  repeated string platforms = 6;
}

message ListRepositoriesRequest {}

message ListRepositoriesResponse {
  // The repositories, by name.
  repeated RegisteredRepository repositories = 1;
  // The registry's generation: 0 until the first `Put`.
  uint64 generation = 2;
  // The repositories packages come from that the registry does not hold, by name. A host one of whose services names one is sent no repository.
  repeated string unregistered = 3;
}

message GetRepositoryRequest {
  // The repository's name.
  string name = 1;
}

message GetRepositoryResponse {
  RegisteredRepository repository = 1;
}

message PutRepositoryRequest {
  // The repository, every field set.
  hostkeeper.release.v1.Repository repository = 1;
  // Why, for the audit entry.
  string reason = 2;
}

message PutRepositoryResponse {
  // The repository as the registry now holds it, with its keyring.
  RegisteredRepository repository = 1;
  AuditEntry entry = 2;
}

message RemoveRepositoryRequest {
  // The repository's name.
  string name = 1;
  // Why, for the audit entry.
  string reason = 2;
}

message RemoveRepositoryResponse {
  // The registry's generation after the removal.
  uint64 generation = 1;
  AuditEntry entry = 2;
}

// A host's package repositories: what the coordinator's registry holds for it and what its
// daemon reported (`HeartbeatRequest.repositories`).
message HostRepositories {
  // The repositories its services name, by name.
  repeated string named = 1;
  // Those the registry does not hold: while any is, the host is sent no repository.
  repeated string unregistered = 2;
  // The digest of the set the coordinator sends it; empty when it sends none.
  string digest = 3;
  // The generation of the set in force on the host, as its daemon reported it; 0 while it holds
  // none the coordinator sent since the daemon started.
  uint64 generation = 4;
  // Whether the set in force on the host is `digest`.
  bool current = 5;
  // Why the daemon refused the set it was last sent, when it refused it and it is still `digest`;
  // empty otherwise.
  string refused = 6;
}

message DiscoverRepositoryRequest {
  // The repository's base URL: `https://`, a host, an optional port and path, with no trailing `/`.
  string base_uri = 1;
  // `public` (or empty), or `hosts` for a private repository.
  string access = 2;
  // `hosts` only: the credential file on the coordinator's machine, as `Repository.credential_file`.
  string credential_file = 3;
}

// What a repository at a URL serves, as the coordinator read it. The fingerprints are computed
// from the keyring the descriptor names, never taken from the descriptor.
message Discovery {
  // The name the descriptor suggests; may be empty.
  string name = 1;
  // The descriptor's description; may be empty.
  string description = 2;
  // The channels: the apt suites, the rpm directories, the macOS pointer names.
  repeated string channels = 3;
  // The platforms it serves: `linux-x86_64`, `linux-arm64`, `macos-arm64`.
  repeated string platforms = 4;
  // The packages the descriptor maps to a macOS installer directory of another name, by package.
  repeated string macos_packages = 5;
  // The fingerprints of the keys of the keyring: each primary key and its subkeys, upper-case hex.
  repeated string fingerprints = 6;
  // The user ids of the keyring's keys, as text.
  repeated string user_ids = 7;
  // The SHA-256 of the descriptor read, 64 lower-case hex characters; `Add` carries it back.
  string descriptor_sha256 = 8;
  // The SHA-256 of the keyring read, 64 lower-case hex characters.
  string keyring_sha256 = 9;
  // Whether the fingerprints are the pinned ones of the built-in repository `komira`.
  bool pinned = 10;
}

message DiscoverRepositoryResponse {
  Discovery discovery = 1;
}

message AddRepositoryRequest {
  // The name the repository is registered under: 1 to 32 bytes of `[a-z0-9-]`.
  string name = 1;
  // As `DiscoverRepositoryRequest.base_uri`.
  string base_uri = 2;
  // As `DiscoverRepositoryRequest.access`.
  string access = 3;
  // As `DiscoverRepositoryRequest.credential_file`.
  string credential_file = 4;
  // The `descriptor_sha256` the operator confirmed.
  string descriptor_sha256 = 5;
  // The `fingerprints` the operator confirmed: exactly the keyring's.
  repeated string fingerprints = 6;
  // Why, for the audit entry.
  string reason = 7;
}

message AddRepositoryResponse {
  // The repository as the registry now holds it, with its keyring.
  RegisteredRepository repository = 1;
  AuditEntry entry = 2;
}
