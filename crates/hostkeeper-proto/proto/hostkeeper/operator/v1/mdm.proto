// hostkeeper.operator.v1: the `Mdm` service of the operator API and its refusals
// (`MdmRefusal`): the devices the MDM policy gate knows (docs/design/hostkeeper-mdm.md section
// 6.1). The gate is linked into the coordinator (`--mdm-api-url`); it keeps a record per MDM
// enrollment from NanoHUB's webhook and from the answers of the devices to `DeviceInformation`
// and `SecurityInfo`. The rest of the package, `Enrollment` and `EnrollmentRefusal`
// (enrollment.proto) and `Audit` and `AuditRefusal` among it, is operator.proto; this file is the
// same package and API, kept apart so that each file stays short.
//
// Served by: the coordinator, on its control listener, as operator.proto says.
//
// Authentication: `Mdm` takes the operator token only; no CI token reaches it (see
// operator.proto).
//
// Refusals: a gRPC status whose message is exactly one token of `MdmRefusal`, written as the
// value's name without the prefix, in lower case; the status code is the one each value names.
// A refused request changes nothing.
//
// Units: as operator.proto says. An enrollment id is NanoMDM's, on a Mac its UDID: 1 to 64 ASCII
// letters, digits and `-`. A serial is 1 to 64 ASCII letters and digits.
//
// Extending: as operator.proto says: add fields, messages, enum values and RPCs; never renumber,
// rename, retype or remove one, and never reuse a number.
syntax = "proto3";

package hostkeeper.operator.v1;

// The devices of the MDM policy gate.
service Mdm {
  // The devices the gate has a record of, by enrollment id, from the records alone: no device
  // is asked. A coordinator that runs no gate answers none, with `gate` false. Changes nothing.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
}

// Why `Mdm` refused a request. The token is the value's name without the prefix, in lower case.
enum MdmRefusal {
  MDM_REFUSAL_UNSPECIFIED = 0;
  // UNAUTHENTICATED: no bearer, or not the operator token.
  MDM_REFUSAL_UNAUTHORIZED = 1;
  // PERMISSION_DENIED: the bearer is a valid CI token, which `Mdm` does not take.
  MDM_REFUSAL_FORBIDDEN = 2;
  // INVALID_ARGUMENT: the page token is not one an answer gave.
  MDM_REFUSAL_INVALID_REQUEST = 3;
}

// Where a device is in its MDM enrollment.
enum MdmPhase {
  MDM_PHASE_UNSPECIFIED = 0;
  // It sent `Authenticate` and no `TokenUpdate` since: not enrolled yet.
  MDM_PHASE_AUTHENTICATED = 1;
  // It sent a `TokenUpdate` and no `CheckOut` since: enrolled.
  MDM_PHASE_ENROLLED = 2;
  // It sent `CheckOut`: not enrolled.
  MDM_PHASE_CHECKED_OUT = 3;
}

message ListDevicesRequest {
  // At most this many devices; 0 means the cap.
  uint32 limit = 1;
  // Empty for the first page; else the `next_page_token` of the page before.
  string page_token = 2;
}

message ListDevicesResponse {
  // The devices, by enrollment id.
  repeated MdmDevice devices = 1;
  // The token of the next page; empty on the last.
  string next_page_token = 2;
  // Whether the coordinator runs the gate (`--mdm-api-url`).
  bool gate = 3;
}

// One command the gate sent a device that the device has not answered.
message MdmCommand {
  // `DeviceInformation` or `SecurityInfo`.
  string request_type = 1;
  // The command's UUID.
  string command_uuid = 2;
  // When NanoHUB queued it.
  uint64 sent_unix = 3;
}

// The gate's record of one MDM enrollment.
message MdmDevice {
  // The NanoMDM enrollment id.
  string enrollment_id = 1;
  // The device's UDID, as its check-ins name it.
  string udid = 2;
  // The serial its `DeviceInformation` answer gave in this enrollment; empty when none: the
  // coordinator approves no Mac by its nonce on a device without one.
  string serial = 3;
  // The `SerialNumber` of its last `Authenticate`, when it carried one; shown only.
  string authenticate_serial = 4;
  // Where it is in its enrollment.
  MdmPhase phase = 5;
  // How many enrollments the gate has seen it begin.
  uint32 enrollments = 6;
  // `IsSupervised` of its `DeviceInformation` answer; absent until it answers.
  optional bool supervised = 7;
  // `EnrolledViaDEP` of its `SecurityInfo` answer (enrolled through ADE); absent until it
  // answers. Shown only.
  optional bool enrolled_via_dep = 8;
  // `UserApprovedEnrollment` of its `SecurityInfo` answer; absent until it answers. Shown only.
  optional bool user_approved = 9;
  // The first `TokenUpdate` of this enrollment.
  optional uint64 enrolled_since_unix = 10;
  // Its last check-in.
  uint64 last_checkin_unix = 11;
  // Its `CheckOut`, when it checked out.
  optional uint64 checked_out_unix = 12;
  // When it answered `DeviceInformation` in this enrollment.
  optional uint64 device_information_unix = 13;
  // When it answered `SecurityInfo` in this enrollment.
  optional uint64 security_info_unix = 14;
  // The commands sent and not answered.
  repeated MdmCommand unanswered = 15;
  // The last thing that went wrong with a command for it; empty when nothing did.
  string last_error = 16;
}
