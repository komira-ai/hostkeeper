// hostkeeper.operator.v1: the `Mdm` service of the operator API and its refusals
// (`MdmRefusal`): the devices the MDM policy gate knows (docs/design/hostkeeper-mdm.md section
// 6.1). The gate is linked into the coordinator (`--mdm-api-url`); it keeps a record per MDM
// enrollment from NanoHUB's webhook and from the answers of the devices to `DeviceInformation`
// and `SecurityInfo`. The rest of the package, `Enrollment` and `EnrollmentRefusal`
// (enrollment.proto) and `Audit` and `AuditRefusal` among it, is operator.proto; this file is the
// same package and API, kept apart so that each file stays short.
//
// Served by: the coordinator, on its control listener, as operator.proto says.
//
// Authentication: `Mdm` takes the operator token only; no CI token reaches it (see
// operator.proto).
//
// Refusals: a gRPC status whose message is exactly one token of `MdmRefusal`, written as the
// value's name without the prefix, in lower case; the status code is the one each value names.
// A refused request changes nothing.
//
// Units: as operator.proto says. An enrollment id is NanoMDM's, on a Mac its UDID: 1 to 64 ASCII
// letters, digits and `-`. A serial is 1 to 64 ASCII letters and digits.
//
// The setup (`PutSecret`, `PutSetting`, `PutName`, `ListSecrets`, `ListSettings`, `Status`; docs/design/coordinator-mdm.md
// section 4.9): the secrets the MDM server keeps, sealed in the coordinator's store under the key of
// `--mdm-secrets-key-file`, and its settings. The three writes are session-only: a call that carries a
// bearer token, an operator token or one made in the UI, is refused `PERMISSION_DENIED` with the
// message `session_required`, and only a signed-in user's call (the JSON gateway with the session
// cookie) is served. The reads take either. No call returns a secret's value: what an answer
// shows of one is its kind, version, SHA-256 fingerprint and times, and no refusal, log line or
// audit row holds it either. `Status` computes from these records whether the setup is complete.
//
// The push certificate (`CreatePushRequest`, `PutPushReply`, `PutPushCertificate`;
// docs/design/coordinator-mdm.md section 4.4): the three calls that make a push certificate for the
// coordinator, all session-only as the setup writes are, each audited as `mdm_push_csr`,
// `mdm_push_reply_put` or `mdm_push_cert_put`, a refusal after the caller is known with its token as
// the reason. A key or a decryption key is never returned; what is returned is public (a CSR, a
// certificate request's signed form, the encryption certificate).
//
// Extending: as operator.proto says: add fields, messages, enum values and RPCs; never renumber,
// rename, retype or remove one, and never reuse a number.
syntax = "proto3";

package hostkeeper.operator.v1;

// The devices of the MDM policy gate.
service Mdm {
  // The devices the gate has a record of, by enrollment id, from the records alone: no device
  // is asked. A coordinator that runs no gate answers none, with `gate` false. Changes nothing.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);

  // Seals `material` as the next version of the secret of `kind` and keeps it; the version it
  // replaces is kept for the `secret_grace_days` setting, so that a wrong upload is undone by
  // uploading again. Session-only: a call with a bearer token is refused `PERMISSION_DENIED`
  // `session_required`, so `hkctl` cannot make it. Audited under the signed-in user's name as
  // `mdm_push_cert_put`, `mdm_abm_token_put`, `mdm_tls_put`, `mdm_acme_credential_put` or
  // `mdm_secret_put` by the kind, with the kind, the fingerprint and the expiry, and never the
  // material; a refusal after the caller is known is audited with its token. Answers what
  // `ListSecrets` shows of the version made. Refused `secrets_unavailable` when the coordinator
  // holds no master key.
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse);

  // Sets the setting `name` to `value`, replacing what it was. Session-only, as `PutSecret` is.
  // Audited as `mdm_setting_set` with the name and the value.
  rpc PutSetting(PutSettingRequest) returns (PutSettingResponse);

  // Every version of every secret the coordinator holds, by kind and version: what is shown of
  // each, never its value. Changes nothing.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  // Every setting this release knows, with its value and whether that is its default. Changes
  // nothing.
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse);

  // Makes a push certificate request: an RSA 2048 key, a CSR over it with the `email` in its
  // subject, and a second key and self-signed certificate that mdmcert.download encrypts its
  // reply to. Both keys are sealed and kept; a request pending before is replaced. With `submit`
  // the coordinator posts the CSR and the encryption certificate to mdmcert.download, which
  // **emails** the signed request to `email`: the reply is not in this answer, the operator
  // uploads the attachment with `PutPushReply`. Without `submit` nothing is sent, and the CSR is
  // for a vendor certificate or a signer of the operator's own. Session-only; audited as
  // `mdm_push_csr`. Refused `invalid_request` (the email is not one address),
  // `secrets_unavailable`, `mdmcert_unavailable` (the service could not be reached or did not
  // take it; the request stays pending), `audit_unavailable`, `store_failed`.
  rpc CreatePushRequest(CreatePushRequestRequest) returns (CreatePushRequestResponse);

  // Decrypts the reply of mdmcert.download (the attachment of its email, as the mail has it, hex
  // text, or its raw bytes) with the pending request's encryption key and checks that it is the
  // signed request for the pending CSR; answers it, for the operator to upload to Apple's push
  // portal, which returns the certificate for `PutPushCertificate`. Stores nothing. Session-only;
  // audited as `mdm_push_reply_put`. Refused `no_pending_request`, `reply_undecryptable` (not a
  // message encrypted to the pending request's key), `reply_not_for_request`, `audit_unavailable`.
  rpc PutPushReply(PutPushReplyRequest) returns (PutPushReplyResponse);

  // Stores a push certificate. Without `key_pem` the certificate must match the pending request's
  // key (what Apple returned for the request); with it, the pair is stored as it is (the
  // migration of an existing certificate and key; PKCS#1 `BEGIN RSA PRIVATE KEY` and PKCS#8 are
  // both read). It must match its key, be unexpired, carry a topic that starts
  // `com.apple.mgmt.External.`, and, when a certificate is already in use, the same topic.
  // Session-only; audited as `mdm_push_cert_put` with the topic and the expiry, never the key.
  // Refused `certificate_invalid`, `key_invalid`, `key_mismatch`, `certificate_expired`,
  // `topic_changed`, `no_pending_request`, `secrets_unavailable`, `audit_unavailable`,
  // `store_failed`.
  rpc PutPushCertificate(PutPushCertificateRequest) returns (PutPushCertificateResponse);
  // Whether the MDM setup is complete (`configured`), and when it is not, which conditions are
  // missing; the name, its enrollment URL, and what is shown of the push certificate and key, the
  // ABM token and the TLS certificate and key in use, with the expiry and topic read from their
  // material. Computed from the records at each call and never stored, so it cannot go stale.
  // Never returns a value of a secret. Changes nothing.
  rpc Status(MdmStatusRequest) returns (MdmStatusResponse);

  // Sets the MDM name, the host name the Macs enroll at (`https://<name>/enroll`). Session-only,
  // as `PutSecret` is. Audited as `mdm_name_set` with the name. The first name is always taken
  // (Macs that enrolled before this setup hold theirs); once a name is set and a Mac has enrolled,
  // another is refused `name_locked`, and the same name is taken again.
  rpc PutName(PutNameRequest) returns (PutNameResponse);

  // Takes the ABM server token (docs/design/coordinator-mdm.md, 4.5): either the JSON of its four
  // OAuth parts and expiry, which is what a takeover of NanoDEP's token uploads, or the `.p7m` file
  // ABM hands over, opened with the `abm_key` the coordinator holds. The token is proved to
  // Apple before it is kept (a session is opened with it and `GET /account` is read), so that one
  // that is not good is refused and nothing is stored. Session-only, as `PutSecret` is, and
  // audited as `mdm_abm_token_put` with the fingerprint and the expiry, never the token. Refused
  // `abm_unavailable` when this coordinator has no ABM client, `secrets_unavailable` with no
  // master key, `invalid_request` for a token that is not five parts or a request that gives both
  // forms or neither, `abm_key_missing` for a `.p7m` with no `abm_key` held, `abm_token_unreadable`
  // for a `.p7m` that does not open with it, `abm_credential_refused` and `abm_clock_refused`
  // for the two faults Apple names on the session, `abm_unreachable` when no answer came.
  rpc PutAbmToken(PutAbmTokenRequest) returns (PutAbmTokenResponse);

  // The certificate of the ABM server entry's key, in PEM, for the operator to add to the entry
  // in ABM (the public-key download of the fallback path, when NanoDEP's key cannot be taken
  // over). The key pair is made when none is held (RSA 2048, stored as `abm_key` and `abm_cert`),
  // which is why the call is session-only; once made, the same certificate is answered. Audited as
  // `mdm_abm_cert_get`. The private key is never returned.
  rpc GetAbmPublicKey(GetAbmPublicKeyRequest) returns (GetAbmPublicKeyResponse);
}

// Why `Mdm` refused a request. The token is the value's name without the prefix, in lower case.
enum MdmRefusal {
  MDM_REFUSAL_UNSPECIFIED = 0;
  // UNAUTHENTICATED: no bearer, or not the operator token.
  MDM_REFUSAL_UNAUTHORIZED = 1;
  // PERMISSION_DENIED: the bearer is a valid CI token, which `Mdm` does not take.
  MDM_REFUSAL_FORBIDDEN = 2;
  // INVALID_ARGUMENT: the page token is not one an answer gave.
  MDM_REFUSAL_INVALID_REQUEST = 3;
  // INTERNAL: the setup store did not take the change, or could not be read.
  MDM_REFUSAL_STORE_FAILED = 4;
  // UNAVAILABLE: the audit entry of a setup write could not be written, so the write was not made.
  MDM_REFUSAL_AUDIT_UNAVAILABLE = 5;
  // FAILED_PRECONDITION: the coordinator holds no master key (`--mdm-secrets-key-file` is not
  // given), so it keeps no secret.
  MDM_REFUSAL_SECRETS_UNAVAILABLE = 6;
  // UNAVAILABLE: mdmcert.download could not be reached, or answered that it did not take the
  // request.
  MDM_REFUSAL_MDMCERT_UNAVAILABLE = 7;
  // FAILED_PRECONDITION: no push certificate request is pending: make one (`CreatePushRequest`),
  // or give the key with the certificate.
  MDM_REFUSAL_NO_PENDING_REQUEST = 8;
  // INVALID_ARGUMENT: the upload does not decrypt with the pending request's encryption key: it is
  // not an enveloped message, or is encrypted to another key.
  MDM_REFUSAL_REPLY_UNDECRYPTABLE = 9;
  // INVALID_ARGUMENT: the upload decrypts, and is not the signed request for the pending CSR.
  MDM_REFUSAL_REPLY_NOT_FOR_REQUEST = 10;
  // INVALID_ARGUMENT: the certificate is not a PEM certificate, has no topic (`UID` of its
  // subject), or its topic does not start `com.apple.mgmt.External.`.
  MDM_REFUSAL_CERTIFICATE_INVALID = 11;
  // INVALID_ARGUMENT: the key is not a readable RSA private key.
  MDM_REFUSAL_KEY_INVALID = 12;
  // INVALID_ARGUMENT: the key is not the certificate's.
  MDM_REFUSAL_KEY_MISMATCH = 13;
  // INVALID_ARGUMENT: the certificate has expired.
  MDM_REFUSAL_CERTIFICATE_EXPIRED = 14;
  // INVALID_ARGUMENT: the certificate in use has another topic: every enrollment carries it, so a
  // renewal keeps it.
  MDM_REFUSAL_TOPIC_CHANGED = 15;
  // FAILED_PRECONDITION: a Mac has enrolled, and the enrollment profile it holds carries the
  // name, so the name cannot change (the Macs would have to enroll again).
  MDM_REFUSAL_NAME_LOCKED = 16;
  // FAILED_PRECONDITION: this coordinator has no ABM client.
  MDM_REFUSAL_ABM_UNAVAILABLE = 17;
  // FAILED_PRECONDITION: a `.p7m` was uploaded and no `abm_key` is held to open it.
  MDM_REFUSAL_ABM_KEY_MISSING = 18;
  // INVALID_ARGUMENT: the `.p7m` is not a CMS message encrypted to the `abm_key` held.
  MDM_REFUSAL_ABM_TOKEN_UNREADABLE = 19;
  // FAILED_PRECONDITION: Apple refused the token's signature (`signature_invalid`): the parts do
  // not belong together, or the token was revoked.
  MDM_REFUSAL_ABM_CREDENTIAL_REFUSED = 20;
  // FAILED_PRECONDITION: Apple refused the timestamp (`timestamp_refused`): the clock of the
  // machine the coordinator runs on is an hour or more off.
  MDM_REFUSAL_ABM_CLOCK_REFUSED = 21;
  // UNAVAILABLE: no answer came from Apple, or it answered something the call cannot use.
  MDM_REFUSAL_ABM_UNREACHABLE = 22;
}

// One condition of the setup that is not met, which keeps it from being `configured`. The token
// is the value's name without the prefix, in lower case.
enum MdmCondition {
  MDM_CONDITION_UNSPECIFIED = 0;
  // No `push_cert` is held.
  MDM_CONDITION_PUSH_CERT_MISSING = 1;
  // No `push_key` is held.
  MDM_CONDITION_PUSH_KEY_MISSING = 2;
  // The push certificate or key cannot be read, or the key is not the certificate's.
  MDM_CONDITION_PUSH_PAIR_INVALID = 3;
  // The push certificate has expired.
  MDM_CONDITION_PUSH_CERT_EXPIRED = 4;
  // No `abm_token` is held.
  MDM_CONDITION_ABM_TOKEN_MISSING = 5;
  // The ABM token cannot be read, or its expiry is not an RFC 3339 time.
  MDM_CONDITION_ABM_TOKEN_UNREADABLE = 6;
  // The ABM token has expired.
  MDM_CONDITION_ABM_TOKEN_EXPIRED = 7;
  // No MDM name is set.
  MDM_CONDITION_NAME_MISSING = 8;
  // No `tls_cert` is held.
  MDM_CONDITION_TLS_CERT_MISSING = 9;
  // No `tls_key` is held.
  MDM_CONDITION_TLS_KEY_MISSING = 10;
  // The TLS certificate or key cannot be read, or the key is not the certificate's.
  MDM_CONDITION_TLS_PAIR_INVALID = 11;
  // The TLS certificate has expired.
  MDM_CONDITION_TLS_CERT_EXPIRED = 12;
  // The TLS certificate does not name the MDM name.
  MDM_CONDITION_TLS_NAME_MISMATCH = 13;
  // The push certificate's validity has not begun.
  MDM_CONDITION_PUSH_CERT_NOT_YET_VALID = 14;
  // The TLS certificate's validity has not begun.
  MDM_CONDITION_TLS_CERT_NOT_YET_VALID = 15;
}

// How far the hostkeeper settings profile of the gate has got on a device in its enrollment.
enum MdmBaseline {
  // None was sent in this enrollment (not enrolled, or not a Mac the gate installs it on).
  MDM_BASELINE_UNSPECIFIED = 0;
  // Sent, and the device has not answered.
  MDM_BASELINE_PENDING = 1;
  // The device acknowledged it.
  MDM_BASELINE_APPLIED = 2;
  // The device answered with an error.
  MDM_BASELINE_FAILED = 3;
}

message PutAbmTokenRequest {
  // The token as JSON: an object of `consumer_key`, `consumer_secret`, `access_token`,
  // `access_secret` and `access_secret_expiry` (RFC 3339), each a non-empty string; up to 32768
  // bytes. Exactly one of the two fields is given.
  bytes token_json = 1;
  // The `.p7m` file ABM gave (DER or S/MIME text), up to 32768 bytes.
  bytes token_p7m = 2;
}

message PutAbmTokenResponse {
  // The version made, as `ListSecrets` shows it; `not_after_unix` is the token's expiry.
  SecretInfo secret = 1;
  // The name of the MDM server entry in ABM that Apple says the token belongs to.
  string server_name = 2;
  // The organisation Apple says it belongs to.
  string org_name = 3;
}

message GetAbmPublicKeyRequest {}

message GetAbmPublicKeyResponse {
  // The certificate, PEM.
  string certificate_pem = 1;
  // The SHA-256 of the key pair's certificate, 64 lower-case hex digits.
  string fingerprint_sha256 = 2;
  // Whether this call made the pair (false: one was held).
  bool created = 3;
}

// Where a device is in its MDM enrollment.
enum MdmPhase {
  MDM_PHASE_UNSPECIFIED = 0;
  // It sent `Authenticate` and no `TokenUpdate` since: not enrolled yet.
  MDM_PHASE_AUTHENTICATED = 1;
  // It sent a `TokenUpdate` and no `CheckOut` since: enrolled.
  MDM_PHASE_ENROLLED = 2;
  // It sent `CheckOut`: not enrolled.
  MDM_PHASE_CHECKED_OUT = 3;
}

message ListDevicesRequest {
  // At most this many devices; 0 means the cap.
  uint32 limit = 1;
  // Empty for the first page; else the `next_page_token` of the page before.
  string page_token = 2;
}

message ListDevicesResponse {
  // The devices, by enrollment id.
  repeated MdmDevice devices = 1;
  // The token of the next page; empty on the last.
  string next_page_token = 2;
  // Whether the coordinator runs the gate (`--mdm-api-url`).
  bool gate = 3;
  // Whether the MDM setup is complete, as `Status` says. The devices are listed either way.
  bool configured = 4;
  // When it is not, the conditions that are missing, as `Status` lists them.
  repeated MdmCondition missing = 5;
}

// One command the gate sent a device that the device has not answered.
message MdmCommand {
  // `DeviceInformation` or `SecurityInfo`.
  string request_type = 1;
  // The command's UUID.
  string command_uuid = 2;
  // When NanoHUB queued it.
  uint64 sent_unix = 3;
}

// The gate's record of one MDM enrollment.
message MdmDevice {
  // The NanoMDM enrollment id.
  string enrollment_id = 1;
  // The device's UDID, as its check-ins name it.
  string udid = 2;
  // The serial its `DeviceInformation` answer gave in this enrollment; empty when none: the
  // coordinator approves no Mac by its nonce on a device without one.
  string serial = 3;
  // The `SerialNumber` of its last `Authenticate`, when it carried one; shown only.
  string authenticate_serial = 4;
  // Where it is in its enrollment.
  MdmPhase phase = 5;
  // How many enrollments the gate has seen it begin.
  uint32 enrollments = 6;
  // `IsSupervised` of its `DeviceInformation` answer; absent until it answers.
  optional bool supervised = 7;
  // `EnrolledViaDEP` of its `SecurityInfo` answer (enrolled through ADE); absent until it
  // answers. Shown only.
  optional bool enrolled_via_dep = 8;
  // `UserApprovedEnrollment` of its `SecurityInfo` answer; absent until it answers. Shown only.
  optional bool user_approved = 9;
  // The first `TokenUpdate` of this enrollment.
  optional uint64 enrolled_since_unix = 10;
  // Its last check-in.
  uint64 last_checkin_unix = 11;
  // Its `CheckOut`, when it checked out.
  optional uint64 checked_out_unix = 12;
  // When it answered `DeviceInformation` in this enrollment.
  optional uint64 device_information_unix = 13;
  // When it answered `SecurityInfo` in this enrollment.
  optional uint64 security_info_unix = 14;
  // The commands sent and not answered.
  repeated MdmCommand unanswered = 15;
  // The last thing that went wrong with a command for it; empty when nothing did.
  string last_error = 16;
  // How many times NanoHUB queued the gate's `InstallEnterpriseApplication` of the hostkeeper
  // pkg in this enrollment; 0 before the first.
  uint32 install_sends = 17;
  // When the gate last sent it in this enrollment; absent before the first send.
  optional uint64 install_last_sent_unix = 18;
  // The SHA-256 of the pkg it last sent, 64 lower-case hex digits; empty before the first send.
  string install_sha256 = 19;
  // The host id of the inventory record whose serial is this device's; empty when no record, or
  // more than one, has it.
  string host_id = 20;
  // The host group that record names; empty when it names none.
  string group = 21;
  // How far the settings profile has got in this enrollment.
  MdmBaseline baseline = 22;
}

message PutSecretRequest {
  // The kind of secret: `push_key`, `push_cert`, `push_encryption_key`, `push_pending_key`, `abm_key`, `abm_cert`,
  // `abm_token`, `mdm_ca_key`, `acme_account_key`, `dns_credential`, `tls_key` or `tls_cert`;
  // else `invalid_request`.
  string kind = 1;
  // The value: 1 to 32768 bytes (else `invalid_request`). For `abm_token`, a JSON object of
  // `consumer_key`, `consumer_secret`, `access_token`, `access_secret` and
  // `access_secret_expiry` (RFC 3339), each a non-empty string. Never returned by any call.
  bytes material = 2;
  // When the value stops being good, when it says so; shown by `ListSecrets` and the status.
  optional int64 not_after_unix = 3;
}

// What `ListSecrets` shows of one version of one secret.
message SecretInfo {
  // The kind.
  string kind = 1;
  // 1 for the first upload of a kind, and one more for each replacement.
  uint32 version = 2;
  // The SHA-256 of the value, 64 lower-case hex digits.
  string fingerprint_sha256 = 3;
  // When the value stops being good, when it said so.
  optional int64 not_after_unix = 4;
  // When this version was stored.
  int64 created_unix = 5;
  // When a newer version took its place; absent for the version in use.
  optional int64 superseded_unix = 6;
}

message PutSecretResponse {
  // The version made.
  SecretInfo secret = 1;
}

message PutSettingRequest {
  // The setting, one `ListSettings` names: else `invalid_request`.
  string name = 1;
  // The value, in the form the setting takes (a number of days, or a falling list of them such as
  // `60,14`): else `invalid_request`.
  string value = 2;
}

message PutSettingResponse {
  // The setting.
  string name = 1;
  // The value as it is kept.
  string value = 2;
}

message ListSecretsRequest {}

message ListSecretsResponse {
  // Every version held, by kind and then version.
  repeated SecretInfo secrets = 1;
  // Whether the coordinator holds a master key, so that `PutSecret` is served.
  bool sealing = 2;
}

message ListSettingsRequest {}

message MdmSetting {
  // The setting's name.
  string name = 1;
  // Its value: what was set, or its default.
  string value = 2;
  // Whether `value` is the default, because none was set.
  bool is_default = 3;
}

message ListSettingsResponse {
  repeated MdmSetting settings = 1;
}

message CreatePushRequestRequest {
  // The address the request is made for: it is in the CSR's subject, and mdmcert.download emails
  // its reply to it. One plain address (`local@domain`), up to 254 bytes; else `invalid_request`.
  string email = 1;
  // Whether the coordinator posts the request to mdmcert.download.
  bool submit = 2;
}

message CreatePushRequestResponse {
  // The CSR, PEM: public.
  string csr_pem = 1;
  // The self-signed certificate mdmcert.download encrypts its reply to, PEM: public.
  string encryption_certificate_pem = 2;
  // Whether the request was posted to mdmcert.download: its reply is then in the email.
  bool submitted = 3;
}

message PutPushReplyRequest {
  // The attachment of mdmcert.download's email as the mail has it (hex text), or its raw bytes:
  // 1 to 32768 bytes, else `invalid_request`.
  bytes reply = 1;
}

message PutPushReplyResponse {
  // The signed push certificate request, a property list: what Apple's push portal takes.
  bytes signed_request = 1;
}

message PutPushCertificateRequest {
  // The certificate, PEM (a chain is read as its first certificate and kept whole): 1 to 16384
  // bytes, else `invalid_request`.
  bytes certificate_pem = 1;
  // The certificate's private key, PEM, for an existing certificate and key; empty for the
  // certificate of the pending request. At most 16384 bytes, else `invalid_request`.
  bytes key_pem = 2;
}

message PutPushCertificateResponse {
  // The topic of the certificate.
  string topic = 1;
  // When it starts to be valid.
  int64 not_before_unix = 2;
  // When it stops being valid.
  int64 not_after_unix = 3;
  // What `ListSecrets` shows of the version stored.
  SecretInfo secret = 4;
  // Whether it replaced a certificate that was in use.
  bool renewal = 5;
}

message MdmStatusRequest {}

message MdmStatusResponse {
  // Whether every condition is met: the push certificate and key are a pair and not expired, the
  // ABM token is held and not expired, the name is set, and a TLS certificate that names it and
  // its key are a pair and not expired.
  bool configured = 1;
  // The conditions that are not met; empty when `configured`.
  repeated MdmCondition missing = 2;
  // The MDM name; empty when none is set.
  string name = 3;
  // `https://<name>/enroll`; empty when no name is set.
  string enrollment_url = 4;
  // Whether the name is set and a Mac has enrolled, which locks it: `PutName` refuses another.
  bool name_locked = 5;
  // Whether the coordinator holds a master key, so that secrets are kept.
  bool sealing = 6;
  // What `ListSecrets` shows of the version in use of each; absent when none is held.
  optional SecretInfo push_cert = 7;
  optional SecretInfo push_key = 8;
  optional SecretInfo abm_token = 9;
  optional SecretInfo tls_cert = 10;
  optional SecretInfo tls_key = 11;
  // The push topic, the subject UID of the push certificate; empty when none reads.
  string push_topic = 12;
  // When the push certificate stops being valid, read from it; absent when none reads.
  optional int64 push_not_after_unix = 13;
  // When the ABM token expires, read from its `access_secret_expiry`; absent when none reads.
  optional int64 abm_not_after_unix = 14;
  // When the TLS certificate stops being valid, read from it; absent when none reads.
  optional int64 tls_not_after_unix = 15;
  // The DNS names the TLS certificate holds as subject alternative names.
  repeated string tls_names = 16;
}

message PutNameRequest {
  // The name: a DNS name of two or more labels of letters, digits and `-`, each 1 to 63 long and
  // not starting or ending with `-`, at most 253 in all, whose last label is not all digits;
  // kept in lower case. Else `invalid_request`.
  string name = 1;
}

message PutNameResponse {
  // The name as it is kept.
  string name = 1;
  // `https://<name>/enroll`.
  string enrollment_url = 2;
}
