// hostkeeper.local.v1 Root: the channel from a host's agent to the host's root part, a fixed
// menu of two calls.
//
// Served by: the root part (`hostkeeper root`), on the unix socket `/run/hostkeeper/root.sock`
// (mode 0660, group `hostkeeper`, in a 0750 directory). The agent runs unprivileged and faces the
// network; the root part runs hooks as root. This socket is the boundary between them, and it
// carries nothing but `RunStep` and `Status`.
//
// Authentication: the peer's credentials on the socket (`SO_PEERCRED`; on macOS
// `LOCAL_PEERCRED`), read on each connection before any request. Only the agent's account may
// connect: a connection from any other uid, root included, is closed before a request is read.
// The root part takes the agent's word for nothing: it checks each order's release (its signer
// and digest), the approved declaration and the step lock itself.
//
// Refusals: a gRPC status whose message is exactly one token of `RootRefusal`, written as the
// value's name without the `ROOT_REFUSAL_` prefix, in lower case (for example `pinned`);
// the status code is the one each value names. Nothing else is ever in the message. A refused
// order runs no hook, with one exception: `outcome_unrecorded` says a hook ran and its outcome
// could not be written, and its answer is a resend of the same try, never a new one.
//
// Units: times are unix seconds and durations whole seconds (fields end in `_unix` and `_secs`).
// A digest is SHA-256 as 64 lower-case hex characters. A version is the release's version
// string: 1 to 128 bytes, a digit first, then letters, digits and `.+~-`. A service name is 1 to
// 64 bytes of `[a-z0-9-]`. A token (a reason, a step name) is 1 to 64 bytes of `[a-z0-9_]`.
//
// Extending: add fields, messages and enum values; never renumber, rename, retype or remove one,
// and never reuse a number (the compatibility test in this crate refuses each). `Order` is
// closed: the root part refuses a value it does not know, and its zero value, rather than read it
// as another order; `UNINSTALL` is added by its own change. Every other enum is open: a reader
// treats a value it does not know as UNSPECIFIED. The menu itself grows only by a reviewed change
// to this file. Pending identity requests are added to `Status` by their own change.
syntax = "proto3";

package hostkeeper.local.v1;

import "hostkeeper/agent/v1/agent.proto";

service Root {
  // Run an order on one service: the root part runs the hook steps the order consists of itself,
  // in the step runner's order and under its crash-resume rules; the agent never sequences hook
  // steps. Every field is checked before anything runs.
  //
  // One order at a time: the step lock is taken only while this call is live, so a call that was
  // cancelled, or whose connection closed, before the lock was taken runs nothing. Once the lock
  // is taken, the order runs to its end under the step runner's rules even if the call goes away.
  //
  // Each try carries `order_try`, the agent's number for it. The numbers are per service, across
  // every order and target of it: each new try of any order of the service (a first order, a new
  // target, a retry after a deferral's wait or an approval, a forced order after a failure) takes
  // a number higher than every number the service's step record holds, and a resend of one try
  // keeps its number. The root part judges a request against the service's step record:
  // - the same `order_try` as the record's current or last order, with the same order, version,
  //   release digest and `forced`, is a resend: of a running order it resumes it under the
  //   crash-resume rules, of an ended one it returns the recorded outcome; neither repeats a
  //   committed step;
  // - the same `order_try` with any of those different is refused (`try_conflict`): one number
  //   never names two orders;
  // - a higher `order_try` is a new try, run once the last one ended;
  // - a lower `order_try` is refused (`stale_try`), whatever its order or target, so a delayed
  //   request for an earlier target never runs after a later one.
  //
  // An order whose release asks for rights the approved declaration does not grant, or a first
  // install no declaration was approved for, runs no hook and ends DEFERRED with the reason
  // `rights_change` or `first_install`, until `Admin.ApproveDeclaration` approves it. A forced
  // order is no exception: approval is never waived.
  //
  // Storage: when the step record cannot be read or written before a hook starts, nothing runs
  // and the call is refused (`journal_unavailable`), so a resend is safe. When a hook ran and its
  // outcome cannot be written, the call is refused (`outcome_unrecorded`): what the hook did
  // stands, the record still shows the order running, and a resend of the same try finishes it
  // under the crash-resume rules and writes the outcome, repeating no committed step.
  rpc RunStep(RunStepRequest) returns (RunStepResponse);
  // What the root part holds: each service's step records, pin and state, and the open adopt,
  // self-update or install operation. Changes nothing.
  rpc Status(StatusRequest) returns (StatusResponse);
}

// Why the root part refused a call. The token is the value's name without the prefix, in lower
// case.
enum RootRefusal {
  ROOT_REFUSAL_UNSPECIFIED = 0;
  // INVALID_ARGUMENT: the order is UNSPECIFIED or a value this root part does not know.
  ROOT_REFUSAL_UNKNOWN_ORDER = 1;
  // INVALID_ARGUMENT: a field breaks its rule: the service name, the version, or a digest that is
  // not 64 lower-case hex characters.
  ROOT_REFUSAL_INVALID_REQUEST = 2;
  // FAILED_PRECONDITION: an UPDATE of a service that is not declared on the host.
  ROOT_REFUSAL_NOT_DECLARED = 3;
  // FAILED_PRECONDITION: an INSTALL of a service that is declared already and matches no
  // recorded order (a retry is not refused).
  ROOT_REFUSAL_ALREADY_INSTALLED = 4;
  // FAILED_PRECONDITION: the release does not verify: its signer is not trusted, its digest is not
  // `release_digest`, or it is a release of another service or version.
  ROOT_REFUSAL_RELEASE_UNVERIFIED = 5;
  // FAILED_PRECONDITION: `declaration_digest` is not the digest of the release's declaration.
  ROOT_REFUSAL_DECLARATION_MISMATCH = 6;
  // FAILED_PRECONDITION: the service is pinned (`Admin.Pin`); no order runs until it is unpinned.
  ROOT_REFUSAL_PINNED = 7;
  // ABORTED: another order holds the step lock.
  ROOT_REFUSAL_BUSY = 8;
  // FAILED_PRECONDITION: `order_try` is lower than the newest the service's step record holds.
  ROOT_REFUSAL_STALE_TRY = 9;
  // UNAVAILABLE: the step record could not be read or written before any hook ran; nothing ran,
  // and a resend is safe.
  ROOT_REFUSAL_JOURNAL_UNAVAILABLE = 10;
  // INTERNAL: a hook ran and its outcome could not be written; a resend of the same try finishes
  // the order and records it.
  ROOT_REFUSAL_OUTCOME_UNRECORDED = 11;
  // FAILED_PRECONDITION: `order_try` is the step record's newest, and the request's order,
  // version, release digest or `forced` differs from the order it names.
  ROOT_REFUSAL_TRY_CONFLICT = 12;
}

// What the agent asks the root part to do to a service. Closed: see the header.
enum Order {
  ORDER_UNSPECIFIED = 0;
  // Move a declared service to another release.
  ORDER_UPDATE = 1;
  // Put a service on the host that is not there yet; its declaration comes from the verified
  // release, and its digest must be `declaration_digest`.
  ORDER_INSTALL = 2;
}

message RunStepRequest {
  Order order = 1;
  string service = 2;
  // The release to move to.
  string version = 3;
  // The release's digest; the root part checks the release it fetches against it.
  string release_digest = 4;
  // The digest of the release's declaration (with its extension record), which an operator
  // approves for the service with `Admin.ApproveDeclaration`.
  string declaration_digest = 5;
  // The order comes from an operator's force. It is never put on trial and never reverted, and
  // the hook's own deferral for its moment (a drain bound, a busy service) does not decline it.
  // Nothing else is waived: the release is verified, the declaration must be approved (an
  // unapproved right still ends DEFERRED with `rights_change` or `first_install`), and a pin
  // still holds the service.
  bool forced = 6;
  // The agent's number for this try, from 1, rising per service across every order and target of
  // it (see `RunStep`).
  uint64 order_try = 7;
}

// How an order ended.
enum StepOutcome {
  STEP_OUTCOME_UNSPECIFIED = 0;
  // The service runs the release and confirmed it healthy.
  STEP_OUTCOME_SUCCEEDED = 1;
  // The order did not end with the release running confirmed healthy. Where the service is now
  // is in its state: an ordinary order is reverted to the release it ran before (or never left
  // it); a forced one is not rolled back, and stays where it got to: on the release it ran before
  // when it failed before the switch, on its new release when it failed after.
  STEP_OUTCOME_FAILED = 2;
  // The order did not run, for a reason about its moment or a right not yet approved, not about
  // the release.
  STEP_OUTCOME_DEFERRED = 3;
}

message RunStepResponse {
  // The order, as the step record holds it once it ended.
  StepRecord record = 1;
}

// One order of a service, as the step record holds it.
message StepRecord {
  Order order = 1;
  string version = 2;
  string release_digest = 3;
  bool forced = 4;
  // When the root part took the step lock for it.
  uint64 started_unix = 5;
  // The hook step it is in, while it runs (`prepare`, `cutover`, `verify`).
  string step = 6;
  // The try of that step, from 1.
  uint32 attempt = 7;
  // It is past the hook's commit point.
  bool committed = 8;
  // How many seconds each step took, by step name.
  map<string, uint64> step_secs = 9;
  // How it ended; UNSPECIFIED while it runs.
  StepOutcome outcome = 10;
  // When it ended; 0 while it runs.
  uint64 finished_unix = 11;
  // Where a failure happened.
  hostkeeper.agent.v1.FailurePhase phase = 12;
  // Whom a failure is blamed on.
  hostkeeper.agent.v1.FailureClass class = 13;
  // The check or cause of a failure, or why the order was deferred, as a token.
  string reason = 14;
  // For a deferred order: how long the hook asks to wait before the order is given again.
  uint64 retry_after_secs = 15;
  // Serving, but not yet fully the service's own.
  bool promotion_pending = 16;
  // The try of the order this record is, as the request carried it.
  uint64 order_try = 17;
}

message StatusRequest {}

message StatusResponse {
  // Every service declared on the host, in name order.
  repeated ServiceRecord services = 1;
  // The adopt, self-update or install operation that is open, if one is. The agent confirms it
  // through its handoff file with this id, after its first heartbeat reply that arrives after it
  // read the id.
  Operation operation = 2;
}

// What the root part holds about one service.
message ServiceRecord {
  string service = 1;
  // The order running now; absent when none runs.
  StepRecord current = 2;
  // The last order that ended; absent before the first.
  StepRecord last = 3;
  // The pin root holds on the service; absent when it is not pinned.
  Pin pin = 4;
  // How the service runs now, as the service manager and its health check say.
  ServiceState state = 5;
  // Why `current` and `last` cannot be trusted as they are; UNSPECIFIED when the record reads.
  RecordProblem record_problem = 6;
}

// Why a service's step record cannot be read as it is.
enum RecordProblem {
  RECORD_PROBLEM_UNSPECIFIED = 0;
  // The record is unreadable or malformed. `current` and `last` are absent, and no order runs for
  // the service (`journal_unavailable`) until it reads again.
  RECORD_PROBLEM_UNREADABLE = 1;
  // The record was written by a newer root part. It is shown as far as it is understood and never
  // rewritten, and no order runs for the service.
  RECORD_PROBLEM_NEWER_SCHEMA = 2;
}

// A pin root holds on a service: no order runs for it until it is lifted.
message Pin {
  // The version of the release the pin holds the service on. Absent when the pin file cannot be
  // read, which pins the service all the same.
  optional string version = 1;
  // Why the pin cannot be read as it is; UNSPECIFIED when it reads.
  PinProblem problem = 2;
  // The operator's reason.
  string reason = 3;
  // When it was set.
  uint64 pinned_unix = 4;
  // The commit of the release the pin holds the service on (40 lower-case hex digits), as the
  // heartbeat reports it (`hostkeeper.agent.v1.PinReport`). Absent when the pin file cannot be
  // read.
  optional string commit = 5;
}

// Why a pin cannot be read as it is. Either way the service stays pinned.
enum PinProblem {
  PIN_PROBLEM_UNSPECIFIED = 0;
  // The pin file is unreadable or malformed.
  PIN_PROBLEM_UNREADABLE = 1;
  // Two pin files name different releases; an `Admin.Unpin` clears both.
  PIN_PROBLEM_CONFLICT = 2;
}

// Whether a service runs, from the service manager (systemd, or launchd on a Mac).
enum Liveness {
  LIVENESS_UNSPECIFIED = 0;
  // At least one of its units is active.
  LIVENESS_LIVE = 1;
  // No unit of it is loaded.
  LIVENESS_ABSENT = 2;
  // No unit of it is active: inactive or failed.
  LIVENESS_STOPPED = 3;
  // A unit is activating, deactivating or reloading, or a job is loaded and not yet running.
  // Not live.
  LIVENESS_TRANSITIONING = 4;
  // The service manager could not be asked, answered with an error, or answered with a state the
  // root part does not know. Never read as ABSENT or STOPPED.
  LIVENESS_UNOBSERVED = 5;
  // The declaration names no unit to watch. Never healthy.
  LIVENESS_UNMONITORED = 6;
}

// How a service runs now.
message ServiceState {
  Liveness liveness = 1;
  // The version the root part installed, when an active unit's main process runs that release's
  // binary. Absent when it is not live, and when the only active units have no main process.
  optional string version = 2;
  // At least one active unit runs the installed version and every such unit answers its health
  // check.
  bool healthy = 3;
  // Why it is not healthy; UNSPECIFIED when it is healthy or not live.
  Unhealthy unhealthy = 4;
  // The unit that decided it is not healthy, when one did.
  string unit = 5;
}

// Why a live service is not healthy.
enum Unhealthy {
  UNHEALTHY_UNSPECIFIED = 0;
  // No active unit runs the installed release's binary.
  UNHEALTHY_VERSION_MISMATCH = 1;
  // A unit on the installed version failed its health check, or did not answer in time.
  UNHEALTHY_HEALTH = 2;
  // The health check answered with a redirect, which is never followed.
  UNHEALTHY_HEALTH_REDIRECT = 3;
  // An active unit has no port the health check could be sent to.
  UNHEALTHY_HEALTH_UNMAPPED = 4;
  // The units changed during the last observation; the one before is reported until the next.
  UNHEALTHY_OBSERVING = 5;
  // An active unit has no main process, so its version is unknown.
  UNHEALTHY_NO_MAIN_PROCESS = 6;
}

// The kinds of operation that change which agent and root part a host runs.
enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  // `hostkeeper adopt`: hostkeeper takes the host over from kbf's agent.
  OPERATION_KIND_ADOPT = 1;
  // hostkeeper updates itself.
  OPERATION_KIND_SELF_UPDATE = 2;
  // `hostkeeper init`: a fresh install.
  OPERATION_KIND_INIT = 3;
}

// An operation waiting for the agent's confirmation.
message Operation {
  OperationKind kind = 1;
  // 16 random bytes, written when the operation's journal was created and kept across restarts.
  bytes id = 2;
}
