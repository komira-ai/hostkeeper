[package]
name = "hostkeeper-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The hostkeeper daemon: start-up, the order executor with its locks, checks and try rules, the held halts, and the enrollment and heartbeat loops."

# The library of the one root process of a host (docs/design/hostkeeper-design.md, sections 4.1,
# 5.1, 5.2, 6.2, 6.3, 8.1 and 8.3). Everything the daemon does is here, so that it is measured;
# the `hostkeeper` binary only forwards to `cli::main`. Everything privileged comes in through
# ports it is given: the step launcher (`hostkeeper_steps::StepLauncher`), the service manager
# (`hostkeeper_placed::UnitControl`), the filesystem the daemon's links are made through
# (`hostkeeper_placed::Fs`) and the service observer (`hostkeeper_observe::Observer`).

[features]
# The test doubles in `hostkeeper_daemon::testing` (a scripted launcher, a fake clock, fake
# notifiers and prunes), for this crate's tests and the tests of crates built on it;
# it turns on the fakes of the heartbeat loop's ports (`hostkeeper_link::testing`) too.
testing = ["hostkeeper-link/testing"]

[dependencies]
clap.workspace = true
hostkeeper-config = { path = "../hostkeeper-config" }
# The enrollment loop, over gRPC with TLS to the coordinator, the pki directory and the host's
# claims.
hostkeeper-enroll = { path = "../hostkeeper-enroll" }
hostkeeper-hook = { path = "../hostkeeper-hook" }
# The installers: the repository installer's backends, which the stage, the switch and the
# uninstall go through, and the installers the daemon announces (docs/design/packages.md,
# section 5), and the signers file of the macos-pkg installer, read and judged at the start
# (`cli::load_signers`).
hostkeeper-install = { path = "../hostkeeper-install" }
# The BMC's MAC address, claimed in a Linux host's enrollment request: `Get LAN Configuration
# Parameters` sent to `/dev/ipmi0` (`ipmi`).
ipmi-rs.workspace = true
# The macOS adapters (`adapters::Adapters::macos`): the launchd step launcher, service manager,
# unit control and process probe, the `Platform` the host's adapters are chosen by, and the
# process port `codesign` and `ioreg` run through (`mac`).
hostkeeper-launchd = { path = "../hostkeeper-launchd" }
# The heartbeat loop, and its ports, which `link_adapters` implements over the daemon.
hostkeeper-link = { path = "../hostkeeper-link" }
# The service observer whose `Observation` `Daemon::status` reports, and its real adapters.
hostkeeper-observe = { path = "../hostkeeper-observe" }
# The OpenRC adapters of an Alpine host: the step launcher, the unit control and the service
# manager (docs/design/two-programs.md, section 4.6).
hostkeeper-openrc = { path = "../hostkeeper-openrc" }
# The stores file a Mac's start renders from its managed preferences (`mac_files`).
hostkeeper-package = { path = "../hostkeeper-package" }
# The record of installed services (`placed.json`) and the switch of `current` and `previous`, and
# the service-manager port the daemon stops, starts and asks after units with.
hostkeeper-placed = { path = "../hostkeeper-placed" }
hostkeeper-proto = { path = "../hostkeeper-proto" }
# The receipt check of an order's entry and the grammars of its locations (packages.md section 4.4).
hostkeeper-release = { path = "../hostkeeper-release" }
hostkeeper-steps = { path = "../hostkeeper-steps" }
# The repository installer's stage into the packages directory (`HostFs`, `stage_filled`), the
# sweep of what a crashed stage left (`remove_orphans`) and its errors.
hostkeeper-unpack = { path = "../hostkeeper-unpack" }
# The SHA-256 of each keyring `check-repositories` prints, as hex (`repositories::report`); the
# tests' fixture digests too.
hex.workspace = true
# `O_NOFOLLOW` for the lock file.
libc.workspace = true
# The Mac config written at start reads the managed preferences of the MDM, a property list, binary or XML
# (`mac_config`).
plist.workspace = true
# `target.json`, the sealed copy of a repository version's entry: the entry encoded, then written
# and read as proto3 canonical JSON through its descriptor (`target`).
prost.workspace = true
prost-reflect = { workspace = true, features = ["serde"] }
# `lgetxattr`: the quarantine attribute of a staged entry on a Mac, read without following a
# link and without unsafe code (`mac`).
rustix = { workspace = true, features = ["fs"] }
# `target.json` and the built-in steps' last lines, as JSON.
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# A manifest's `[params]` table is handed to the hook's params file as TOML text.
toml.workspace = true
# `sync` for the notice that ends serving when the daemon exits for its own update.
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
# tests/hello.rs: the example service's real hook, run in process by a step launcher of the test.
hello = { path = "../../examples/hello" }
# The real coordinator of the end-to-end test, driven in process: its desired-state and
# convergence handlers over HTTP requests built in the test, its heartbeat with an explicit host
# identity. Its CI tokens come from the fake issuer of `hostkeeper-oidc`'s `testkit`.
bytes.workspace = true
hostkeeper-coordinator = { path = "../hostkeeper-coordinator" }
hostkeeper-oidc = { path = "../hostkeeper-oidc", features = ["testkit"] }
hostkeeper-wire = { path = "../hostkeeper-wire" }
# The public key of the enrollment request's CSR, whose SHA-256 is the request id the fake
# coordinator of tests/bmc_claim.rs answers with.
x509-cert.workspace = true
# tests/coordinator_link.rs: the shipped heartbeat link against the coordinator's own listener on
# loopback, behind the TLS of a test CA (`rcgen`) the coordinator serves with (`hostkeeper-tls`).
hostkeeper-tls = { path = "../hostkeeper-tls" }
rcgen.workspace = true
http-body-util.workspace = true
hyper.workspace = true
# tests/mdm_profile_files.rs: the MDM gate's config profile, as the coordinator builds it, whose
# stores and macos-pkg domains a Mac's daemon renders to the files its loaders read.
hostkeeper-mdm-gate = { path = "../hostkeeper-mdm-gate" }
# Its own tests turn on `testing`.
hostkeeper-daemon = { path = ".", features = ["testing"] }
hostkeeper-testkit = { path = "../hostkeeper-testkit" }
# The effective uid: the owner the tests' daemon config is trusted for; an extended attribute
# set on a scratch file, which the quarantine check reads.
rustix = { workspace = true, features = ["fs", "process"] }
tokio = { workspace = true, features = ["macros", "net", "rt"] }

[lints]
workspace = true
