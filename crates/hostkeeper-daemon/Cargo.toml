[package]
name = "hostkeeper-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The hostkeeper daemon: start-up, the order executor with its locks, checks and try rules, the held halts, and the root-only admin socket."

# The library of the one root process of a host (docs/design/hostkeeper-design.md, sections 4.1,
# 5.1, 5.2, 6.2, 6.3, 8.1 and 8.3). Everything the daemon does is here, so that it is measured;
# the `hostkeeper` binary only forwards to `cli::main`. Everything privileged comes in through
# ports it is given: the step launcher (`hostkeeper_steps::StepLauncher`), the package store
# (`packages::Packages`), the service manager (`hostkeeper_placed::UnitControl`) and the
# filesystem placed-path linking writes through (`hostkeeper_placed::Fs`).

[features]
# The test doubles in `hostkeeper_daemon::testing` (a scripted launcher, a fake clock, fake
# packages, a counting connection), for this crate's tests and the tests of crates built on it.
testing = []

[dependencies]
clap.workspace = true
hostkeeper-config = { path = "../hostkeeper-config" }
hostkeeper-hook = { path = "../hostkeeper-hook" }
# The placed-path linker a `force` links, unlinks and switches through, and the service-manager
# port it stops, starts and asks after units with.
hostkeeper-placed = { path = "../hostkeeper-placed" }
hostkeeper-proto = { path = "../hostkeeper-proto" }
hostkeeper-steps = { path = "../hostkeeper-steps" }
# `O_NOFOLLOW` for the lock file.
libc.workspace = true
thiserror.workspace = true
# A manifest's `[params]` table is handed to the hook's params file as TOML text.
toml.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["server"] }

[dev-dependencies]
# Its own tests turn on `testing`.
hostkeeper-daemon = { path = ".", features = ["testing"] }
hostkeeper-testkit = { path = "../hostkeeper-testkit" }
hyper-util = { workspace = true, features = ["tokio"] }
# The effective uid: the owner the tests' daemon config is trusted for.
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
tonic = { workspace = true, features = ["channel"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
