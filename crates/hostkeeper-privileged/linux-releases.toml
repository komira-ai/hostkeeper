# The Linux releases the packages are installed on (tests/linux_packages.rs, docs/design/packages.md
# section 5.4, "One build, every release"): the one deb, the one rpm and the one Arch package that
# `privileged.yml`'s job `privileged` builds (and pr-device.yml's copy of it) are installed and run in a
# container of each image below, the oldest and the newest release of each family. A release that is
# not here is not proved.
#
# Each entry has three keys: `name` (the release as people name it), `format` (`deb`, `rpm` or `arch`:
# the package the release installs, with dpkg, rpm and pacman) and `image` (the container image, pinned
# by the digest of its index, so a moved tag changes nothing). The job pulls each `image` in a step of
# its own (the workflow lint holds the steps to this list, one `docker pull <image>` per entry and no
# other), and the test runs the container with `--pull=never` and `--network=none`.
#
# The oldest of each family is the oldest still supported: Debian 11 and openSUSE Leap 15.6 are past
# their end of life, and Ubuntu 22.04 and AlmaLinux 8 are the oldest of theirs that are not. Arch is
# rolling, so one entry is both. The digests are the ones the images had on the day they were added;
# the list moves only by a pull request.
#
# The images of Debian, Ubuntu and openSUSE carry no systemd, and the containers run no service
# manager, so the test puts a stand-in for `systemctl` and `systemd-tmpfiles` where an image lacks
# them (the packages' scripts run unchanged); AlmaLinux and Arch run the real ones.

[[release]]
name = "debian:12"
format = "deb"
image = "debian@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8"

