url = "https://github.com/komira-ai/hostkeeper/releases/download/v0.1.194/hostkeeper-0.1.194-linux-arm64.tar.gz"
sha256 = "91bb180a1c570a11cb62275fa88aa5cbfbd2b7d781f1ff90b68754f485ec397c"

