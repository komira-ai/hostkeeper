# The published release of hostkeeper the cross-release rig runs (tests/self_update_across_releases.rs,
# docs/design/two-programs.md section 4.5, item X1): the release tag, its version, and for each release
# platform the URL of the release's binary tarball and the SHA-256 of that tarball.
#
# The `privileged` and `macos-device` jobs of privileged.yml, and their copies in pr-device.yml, download
# the URL of their platform with curl and check it against the SHA-256 (their env PREVIOUS_RELEASE_URL
# and PREVIOUS_RELEASE_SHA256, which the workflow lint holds equal to this file) into
# target/previous-release/hostkeeper.tar.gz. The test checks that file against this pin again, takes the
# daemon binary out of it, and fetches nothing itself (hostkeeper_privileged::across).
#
# The pin moves only by a pull request: to the release each floor pull request of the staged path
# names (S2a to R1, S3 to R2), in that same pull request.
tag = "v0.1.138"
version = "0.1.138"

