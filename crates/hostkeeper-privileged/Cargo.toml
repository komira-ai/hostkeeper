[package]
name = "hostkeeper-privileged"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The tests that run as root against the real service manager of a host (systemd, launchd on a Mac, and OpenRC in an Alpine container) and that run the coordinator and the daemon as programs, in .github/workflows/privileged.yml and in pr-device.yml's copies of its jobs, and the Linux packages installed on each release of linux-releases.toml, and network install end to end in .github/workflows/net-install.yml, and the workload fixture they drive."

# The one place where the adapters behind the fakes of the pull-request set meet the real host:
# the step launcher's transient units, the dead-man's stop by name, the observer's systemd and
# /proc adapters, the Linux unit control's systemctl, and hostkeeper's update of itself under its
# unit file, drop-in and fallback unit. The tests under tests/ that do so start with `#![cfg(feature = "privileged")]`:
# the feature is off by default and nothing of the workspace turns it on, so CI's `test` job
# compiles and runs none of them; privileged.yml builds them as the runner's user and runs them
# as root, after a merge to main, and pr-device.yml's copies of its jobs do the same on a pull
# request (the macOS one when the pull request changes a path the macOS jobs build or read). The library is what they share and what can be tested without
# root (the fixture's arguments and modes, the host check, the names and files of the rig, the
# pin of the cross-release rig's previous release, the list of Linux releases and the container script of the packages test), and is measured by the 99% gate like any crate.
[dependencies]
# The daemon of the program `hostkeeper-device-daemon` (the macOS device tests' daemon, and the
# first-boot tests' daemon), which forwards to its command line as the `hostkeeper`
# binary does.
hostkeeper-daemon = { path = "../hostkeeper-daemon" }
# The coordinator of the first-boot tests' program `hostkeeper-privileged-coordinator`, which
# forwards to its command line as the `hostkeeper-coordinator` binary does.
hostkeeper-coordinator = { path = "../hostkeeper-coordinator" }
# The hook contract the fixture speaks: the step, its arguments, the params file, the last line.
hostkeeper-hook = { path = "../hostkeeper-hook" }
# The SHA-256 of the fixture's own executable (mode `print-pid`).
hex.workspace = true
sha2.workspace = true
thiserror.workspace = true
# The cross-release rig's pin (`hostkeeper_privileged::across`): `previous-release.toml` read as
# TOML, and the pinned release's binary tarball, a gzip'd tar, checked and opened.
flate2.workspace = true
tar.workspace = true
toml.workspace = true
# The program `hostkeeper-selfupdate-daemon` of the self-update tests: the daemon's command line
# and start (above), on the Linux adapters and placement roots of the host's platform
# (`hostkeeper-launchd`, `hostkeeper-placed`), with a package store of sealed trees
# (`hostkeeper-steps`) and a heartbeat link of files read and written as JSON (`hostkeeper-link`,
# `hostkeeper-config`'s names, `serde_json`), in a runtime of its own (`tokio`).
clap.workspace = true
hostkeeper-config = { path = "../hostkeeper-config" }
hostkeeper-launchd = { path = "../hostkeeper-launchd" }
hostkeeper-link = { path = "../hostkeeper-link" }
hostkeeper-placed = { path = "../hostkeeper-placed" }
# The entry an order set by targets carries, which the program reads from its order file and
# records the package store was given (`hostkeeper_proto::hostkeeper::release::v1`); and, for the
# tests, the operator's calls of the end-to-end and first-boot tests (the generated clients of the
# operator API, and the descriptors their replies are read with).
hostkeeper-proto = { path = "../hostkeeper-proto" }
hostkeeper-steps = { path = "../hostkeeper-steps" }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

# hello's update hook and server (`examples/hello`), for the program `hello-e2e` below.
hello = { path = "../../examples/hello" }

# The workload fixture (`hostkeeper_privileged::fixture` says what it does). Built by cargo with
# the crate's tests, nothing prebuilt or checked in; a program of the tests, not shipped. Its
# decisions and the start of its child are in the library, measured; the program only forwards
# to them and blocks.
[[bin]]
name = "hostkeeper-fixture-hook"
path = "tests/bin/fixture_hook.rs"

# The daemon the macOS device tests start as a launchd job, and the first-boot tests as a child
# process: `hostkeeper`, built here so that the tests have its path.
# It only forwards to `hostkeeper_daemon::cli::main`.
[[bin]]
name = "hostkeeper-device-daemon"
path = "tests/bin/device_daemon.rs"

# The coordinator the first-boot tests (`tests/first_boot.rs`, `tests/install_uninstall.rs`) start
# as a child process: `hostkeeper-coordinator`, built here so that the tests have its path (cargo
# gives a test the path of its own package's programs only). It only forwards to
# `hostkeeper_coordinator::config::main`.
[[bin]]
name = "hostkeeper-privileged-coordinator"
path = "tests/bin/coordinator.rs"

# The `hostkeeper` binary of the Linux self-update tests (`tests/self_update.rs`): the daemon of
# `hostkeeper_daemon` with the package store and the coordinator link of the test, its version
# the name it is staged under. What it does is documented in the program.
[[bin]]
name = "hostkeeper-selfupdate-daemon"
path = "tests/bin/selfupdate_daemon.rs"

# The boot server the network-install tests (`tests/net_install.rs`, `tests/net_install_arm64.rs`)
# run, `fetch` once and `serve` as a child process: `hostkeeper-pxe`, built here so that the
# tests have its path. It only forwards to `hostkeeper_pxe::cli::main`.
[[bin]]
name = "hostkeeper-privileged-pxe"
path = "tests/bin/pxe.rs"

# The tierstore-shaped fixture of `tests/tierstore_shaped.rs`: a stand-in service and its update
# hook in one program, which the tests put at `bin/tierstore-like` of a package they build at
# test time (`fixtures/tierstore-shaped/` holds the rest of that package as source). A program of
# the tests, outside the measured set like every file under `tests/` (design question Q9).
[[bin]]
name = "tierstore-like"
path = "tests/bin/tierstore_like.rs"

# The `bin/hello` of the hello packages of `tests/device_mac_e2e.rs`: hello's hook and server,
# its `/version` the version of the manifest it is unpacked with (the program says why). A
# program of the tests, outside the measured set like every file under `tests/`.
[[bin]]
name = "hello-e2e"
path = "tests/bin/hello_e2e.rs"

# The `hostkeeper` binary of this build in the cross-release rig
# (`tests/self_update_across_releases.rs`): the daemon of `hostkeeper_daemon` on the host's real
# ports (the release channel, the attestation check, the coordinator over mutual TLS), its version
# the name of the file it runs from (`hostkeeper_privileged::across::program_version`), so that one
# build staged under two names runs as two versions. Every other verb is forwarded to the daemon's
# command line. A program of the tests, outside the measured set like every file under `tests/`.
[[bin]]
name = "hostkeeper-named-daemon"
path = "tests/bin/named_daemon.rs"

# The `hostkeeper` binary of this build made to fail its start, in the cross-release rig: every
# verb but `daemon` forwarded to the daemon's command line (so it answers the probe and runs the
# no-op hook); `daemon` adds its start to the start log, as the daemon's does first, and exits 1.
[[bin]]
name = "hostkeeper-failing-daemon"
path = "tests/bin/failing_daemon.rs"

# The boot server of the network-install tests' program `hostkeeper-privileged-pxe`, which
# forwards to its command line as the `hostkeeper-pxe` binary does. It builds on Linux only, as
# `hostkeeper-pxe` does (its sockets and its privilege drop are Linux's).
[target.'cfg(target_os = "linux")'.dependencies]
hostkeeper-pxe = { path = "../hostkeeper-pxe" }

# The `lego` and `caddy` of `tests/mdm_cert_units.rs`: copied under both names into the test's
# tree, it records how the `mdm` package's certificate and proxy units start it. A program of
# the tests, outside the measured set like every file under `tests/`.
[[bin]]
name = "mdm-units-fixture"
path = "tests/bin/mdm_units_fixture.rs"

[features]
# The tests that run as root against the host's systemd. Only privileged.yml, pr-device.yml's copies of
# its jobs and net-install.yml turn it on.
privileged = []

[dev-dependencies]
# The end-to-end rig of `tests/tierstore_shaped.rs` and `tests/tierstore_rig.rs` (`tests/e2e/`):
# the real coordinator in process (a normal dependency, above) with its fake OIDC issuer's
# config (`testkit`), the production attestation verifier (`gh` with a test trust root) and
# package fetch, the certificates of the loopback release channel (rcgen, rustls, below; ureq
# for its test client), the package archive (ruzstd, and tar of the normal dependencies), and the Sigstore bundle of the
# fixture signer (p256, getrandom, and base64 below).
getrandom.workspace = true
hostkeeper-oidc = { path = "../hostkeeper-oidc", features = ["testkit"] }
hostkeeper-package = { path = "../hostkeeper-package" }
p256.workspace = true
ruzstd.workspace = true
rustls-pki-types.workspace = true
ureq.workspace = true
# What the privileged tests drive: the production launcher and dead-man (`hostkeeper-steps`,
# above), and the observer's real adapters; on a Mac the launchd adapters (`hostkeeper-launchd`,
# above), the process probe over `proc_pidpath`, the package check
# (`hostkeeper_unpack::MacVerify`) over `codesign` and `getxattr`, and the enrollment claims over
# `ioreg`.
hostkeeper-observe = { path = "../hostkeeper-observe" }
hostkeeper-unpack = { path = "../hostkeeper-unpack" }
# The macOS device test of the enrollment claims: `MacClaims` over the daemon's `HostIoreg`, the
# real `ioreg`.
hostkeeper-enroll = { path = "../hostkeeper-enroll" }
# The macOS self-update test that the real coordinator in process drives: each heartbeat read as
# the coordinator's JSON route reads it, from the host it names.
hostkeeper-wire = { path = "../hostkeeper-wire" }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tonic = { workspace = true, features = ["channel"] }
hostkeeper-testkit = { path = "../hostkeeper-testkit" }
# The `mdm` package's units and the drop-ins of its settings, which `tests/mdm_cert_units.rs`
# loads into the host's systemd.
hostkeeper-mdm-core = { path = "../hostkeeper-mdm-core" }
# The first-boot and end-to-end tests: the attestation bundle of the fixture package (base64),
# the test CA of the coordinator's private listener and of the release
# channel (rcgen), the release channel's TLS server (rustls), the JSON of the operator API's replies (serde_json),
# and the subject, serial and key of the certificate the daemon was issued (x509-parser).
base64.workspace = true
rcgen.workspace = true
rustls.workspace = true
serde_json.workspace = true
x509-parser.workspace = true
# The effective uid the privileged tests check before they act; and the network namespace a
# thread of the network-install tests moves into, to make the router's DHCP socket there.
rustix = { workspace = true, features = ["fs", "process", "thread"] }
# The network-install rig (`tests/netinstall/`): the router's DHCP reads a client's packet with
# the packet crate of `hostkeeper-pxe`, and binds its socket to the LAN's interface
# (SO_BINDTODEVICE, which neither std nor rustix sets).
hostkeeper-pxe-packets = { path = "../hostkeeper-pxe-packets" }
socket2.workspace = true

[lints]
workspace = true
