# kbf's own service as an entry of a services file (the coordinator's --services-file). It was
# built in to the coordinator that kbf shipped; here it is plain data like any other service.
#
# All four roles, limits from the desired state; a frontend is never the last one up and
# waits for every other role. kbf hard-coded the `min_up` keys a desired state of kbf must
# name (storage and frontend); `require_min_up` says them as data.

[[service]]
name = "kbf"
require_min_up = ["storage", "frontend"]

[service.roles.frontend]
never_last = true
after = ["storage", "daemon", "mac-daemon"]

[service.roles.storage]

[service.roles.daemon]

[service.roles.mac-daemon]

# tierstore as a service of the coordinator. An entry of a services file: appended to the
# file named by --services-file (after kbf's own entry), it makes tierstore a service the
# coordinator rolls to the hosts of the storage role.
#
# Six storage hosts is the farm this is written for: one updates at a time, and four of the
# other five must stay up. The first host goes alone, and no other starts until it has beaten
# healthy three times at the new version. A release that fails after its commit on two
# hosts is rolled back by the coordinator to the last version that converged and baked.

[[service]]
name = "tierstore"
bake_beats = 3
canary = { count = 1 }
rollback = "automatic"
rollback_after_failed = { percent = 25, min_hosts = 2 }
install_when_absent = false

[service.selector]
roles = ["storage"]

[service.roles.storage]
max_updating = 1
min_up = 4
