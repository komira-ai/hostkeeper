[package]
name = "hostkeeper-coordinator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The update coordinator: tells each host's updater which version to run, within per-role limits."

# The update coordinator (docs/design/host-updates.md): a deployable of its own that tells each
# host's updater which version to run, within per-role limits. Updaters dial it over mutual
# TLS; CI sets the desired state of a service with a GitHub Actions OIDC token
# (hostkeeper-oidc); an operator reads the status with the operator token. The decision is a
# pure function (`decide`) over the heartbeats the coordinator has seen. On disk it keeps three
# files: the desired state of each service, the operations file (operator actions, version
# marks, the audit ring) and the halts file beside it (halt reports, clear generations).
# The services it manages are data: the rollout file named by `--rollout-file`. An operator is
# one of the named tokens of `--tokens-file`.
[[bin]]
name = "hostkeeper-coordinator"
path = "src/main.rs"

[dependencies]
hostkeeper-oidc = { path = "../hostkeeper-oidc" }
hostkeeper-tls = { path = "../hostkeeper-tls" }
hostkeeper-wire = { path = "../hostkeeper-wire" }
bytes.workspace = true
clap.workspace = true
futures.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
hostkeeper-oidc = { path = "../hostkeeper-oidc", features = ["testkit"] }
hostkeeper-testkit = { path = "../hostkeeper-testkit" }
rcgen.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
