[package]
name = "hostkeeper-coordinator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The update coordinator: tells each host's updater which version to run, each service by its update plan of stages."

# The update coordinator (docs/design/host-updates.md): a deployable of its own that tells each
# host's updater which version to run, each service by its update plan: stages of a growing
# share of its hosts (docs/design/rollout-update-plans.md), the hosts of a stage updating in
# parallel under the limits and minimums a desired state carries per role, and by default one
# service's rollout live at a time. Updaters dial it over mutual TLS; CI sets the desired state
# of a service with a GitHub Actions OIDC token (hostkeeper-oidc); an operator reads the status
# with a named token. The decision is a pure function (`decide`) over the heartbeats the
# coordinator has seen. On disk it keeps three files: the desired state of each service (with
# the package digest of every version CI has set), the operations file (operator actions, version
# marks, the audit ring, with every change also a line of the audit file beside it) and the halts
# file beside it (halt reports, who raised each halt, clear generations, where each service's
# update plan stands); beside the state file, the spent ids of CI's tokens and the lock that
# keeps a second coordinator off these files.
# With `--enrollment-dir` it is also the hosts' certificate authority (hostkeeper-enrollment): it
# keeps the enrollment store and the CA key file, answers Enroll, Poll and Renew, and makes its
# own server certificate. With `--mdm-api-url` it also runs the MDM policy gate's device side
# (hostkeeper-mdm-gate), whose records say whether a Mac is enrolled and supervised.
# The services it manages are data: the rollout file named by `--rollout-file`. An operator is
# one of the named tokens of `--tokens-file`.
[[bin]]
name = "hostkeeper-coordinator"
path = "src/main.rs"

[dependencies]
# The release index (`index.json`) a desired state may carry: parsed once when it is set, to learn
# the package digest of each platform.
hostkeeper-config = { path = "../hostkeeper-config" }
# The CA and the enrollment store (`--enrollment-dir`, `--ca-key-file`).
hostkeeper-enrollment = { path = "../hostkeeper-enrollment" }
# The MDM policy gate's device side (`--mdm-api-url`): its records answer the Mac path's
# `DeviceState`, and it serves NanoHUB's webhook.
hostkeeper-mdm-gate = { path = "../hostkeeper-mdm-gate" }
hostkeeper-oidc = { path = "../hostkeeper-oidc" }
# The messages and refusals of the operator's calls, the orders a typed heartbeat answer
# carries, and the messages of `Enroll`, `Poll` and `Renew`.
hostkeeper-proto = { path = "../hostkeeper-proto" }
hostkeeper-tls = { path = "../hostkeeper-tls" }
hostkeeper-wire = { path = "../hostkeeper-wire" }
# The PEM of the CA bundle and of the server certificate file.
base64.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
# The poll nonces.
getrandom.workspace = true
http-body-util.workspace = true
# The server of the listeners; the client of the release channel's fetch (`src/channel_https.rs`).
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
# `O_NOFOLLOW`, for reading the files of a snapshot without following a link (`src/backup.rs`).
libc.workspace = true
# The Postgres store of `--database-dsn-file` (`src/store/postgres`), on the store's own threads.
postgres.workspace = true
prost.workspace = true
# The descriptors the JSON gateway of the operator API reads and writes messages by.
prost-reflect = { workspace = true, features = ["serde"] }
# The key of the coordinator's server certificate.
rcgen.workspace = true
# The TLS client of the release channel's fetch (`--release-channel`), and the host's roots it
# trusts.
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls.workspace = true
# The gRPC services: the generated servers, called in process by the listeners' router
# (`src/grpc`), and the status of a refusal (`Code`, `Status`). No transport of tonic's: the
# listeners are hyper's.
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The validity of the server certificate file, for its renewal at start.
x509-parser.workspace = true

[dev-dependencies]
hostkeeper-oidc = { path = "../hostkeeper-oidc", features = ["testkit"] }
hostkeeper-testkit = { path = "../hostkeeper-testkit" }
# The HTTP/2 client that calls a listener in the listener's tests.
hyper = { workspace = true, features = ["client"] }
# The MDM commands and profiles a fake NanoHUB heard, read in the gate's tests.
plist.workspace = true
# The descriptors of the enrollment calls, read in their tests.
prost-types.workspace = true
# The compose file of the deployment (docs/deploy/coordinator/compose.yaml), whose coordinator
# command the deployment test (tests/deploy.rs) starts, read with the workflow lint's YAML reader.
saphyr-parser.workspace = true
rustls = { workspace = true, features = ["tls12"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
