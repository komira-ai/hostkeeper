[package]
name = "hostkeeper-package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Fetch an entry's artifact from the host's stores by its pin within bounds, the stores file, and the offline check of an attestation."

# Step 1 (download) of docs/design/hostkeeper-design.md, section 5.5, for an entry pinned by its
# digest: the artifact is downloaded from the host's stores into a root-only staging file with byte
# counting and deadlines on the injected clock, and refused when its size or SHA-256 is not the
# entry's. The network and the verifier sit behind the ports `Fetcher` and `Verifier`; `net` and
# `gh` are their one real adapter each. Nothing here opens, decompresses or unpacks the archive.
# The daemon uses `stores`, `entry::fetch_pinned` and `remove_orphan_fetches`; `bundle`, `net`, `gh`
# and `ports` serve `hostkeeper-pxe`.
[dependencies]
base64.workspace = true
# The daemon config's `TrustedSigners`, `Bounds` and `Sha256Hex`, the trust error, and
# the service name grammar.
hostkeeper-config = { path = "../hostkeeper-config" }
# `Outcome` and `Class`, the vocabulary a refusal is reported in.
hostkeeper-hook = { path = "../hostkeeper-hook" }
# `hostkeeper.release.v1.Target`, the entry an order carries.
hostkeeper-proto = { path = "../hostkeeper-proto" }
# The locator and store-name grammar of the entry's locations.
hostkeeper-release = { path = "../hostkeeper-release" }
# `Clock` and `Stamp`: every deadline is a point on the injected monotonic clock.
hostkeeper-steps = { path = "../hostkeeper-steps" }
hex.workspace = true
# `O_NOFOLLOW` and `O_NONBLOCK`, to open a file without following a link or waiting on a pipe.
libc.workspace = true
# The stores file's strict tables.
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
ureq.workspace = true

[dev-dependencies]
hostkeeper-testkit = { path = "../hostkeeper-testkit" }
regex.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true

[lints]
workspace = true
