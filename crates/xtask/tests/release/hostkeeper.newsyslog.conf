# The hostkeeper daemon's standard output and standard error, the StandardOutPath and
# StandardErrorPath of its launchd job. Installed by the hostkeeper pkg.
# logfilename	[owner:group]	mode	count	size	when	flags
/var/log/hostkeeper/daemon.out.log	root:wheel	640	5	10240	*	NJ
/var/log/hostkeeper/daemon.err.log	root:wheel	640	5	10240	*	NJ
