[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The CI steps of this repository (cargo xtask <verb>)."

[dependencies]
clap.workspace = true
flate2.workspace = true
hex.workspace = true
# The zstd compression of the hostkeeper package (`release package`).
ruzstd.workspace = true
# The JSON `gh` prints: workflow runs, issues, releases and verified attestations.
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
# The member manifests `release set-version` checks.
toml.workspace = true

[dev-dependencies]
# The manifest loader the package test loads the produced `manifest.toml` with.
hostkeeper-config = { path = "../hostkeeper-config" }
# The daemon's unpacker (design 5.5), which the package test unpacks the produced archive with.
hostkeeper-unpack = { path = "../hostkeeper-unpack" }
saphyr-parser.workspace = true

[lints]
workspace = true
