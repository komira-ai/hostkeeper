[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The CI steps of this repository (cargo xtask <verb>)."
# `cargo xtask` (the alias in .cargo/config.toml) runs this binary; the crate's other one is a
# program of its tests.
default-run = "xtask"

[dependencies]
# The DSSE payload of an attestation bundle (`release channel-stage` reads its subjects); the
# HTTP Basic credentials of `mdm-signing-test send`.
base64.workspace = true
clap.workspace = true
flate2.workspace = true
hex.workspace = true
# The release index, the platforms, the channel paths and the service and version grammars of
# `release channel-stage`, which stages exactly the tree the daemon's fetch reads. The packaging
# test (tests/packaging) also loads the config template with the daemon config's loader, and the
# package test loads the produced `manifest.toml` with the manifest loader.
hostkeeper-config = { path = "../hostkeeper-config" }
# The release asset `hkctl-<version>` (`release hkctl`): the script the emitter makes from the
# command table of the protos. The operator docs' test (tests/enrollment_doc.rs) reads hkctl's
# global flags from its docs/cli.md text, its command table, and the protos' descriptors.
hostkeeper-hkctl = { path = "../hostkeeper-hkctl" }
hostkeeper-proto = { path = "../hostkeeper-proto" }
# The daemon's launchd label, plist and paths the macOS installer pkg installs
# (`release macos-pkg`), and the launchd plists of a macOS service package
# (`release package --service hello`), rendered with the renderer the daemon's own plists use.
hostkeeper-launchd = { path = "../hostkeeper-launchd" }
# The mdm package (`release package --service mdm`, `release mdm-fetch`): its manifest, units and
# the pins of the tools it carries from hostkeeper-mdm-core, and the tools taken out of their
# archives by the kit's own archive reader in hostkeeper-mdm.
hostkeeper-mdm = { path = "../hostkeeper-mdm" }
hostkeeper-mdm-core = { path = "../hostkeeper-mdm-core" }
# The zstd compression of the hostkeeper package (`release package`).
ruzstd.workspace = true
# Reads back the launchd plist of the installer pkg (`release check-macos-pkg`); writes the
# commands and the root's profile of `mdm-signing-test`.
plist.workspace = true
# `kit.toml` and `results.toml` of `mdm-signing-test`, read and written by their types.
serde.workspace = true
# The JSON `gh` prints: workflow runs, issues, releases and verified attestations; NanoHUB's
# answer to `mdm-signing-test send`.
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
# The member manifests `release set-version` checks.
toml.workspace = true

# The program the package launch test (tests/package_launch.rs) packages as bin/hostkeeper and
# starts through the committed unit of hostkeeper's own package: it prints what it was started
# with. A program of the tests, not shipped: it is built only with `test-support`, which only the
# tests of this crate turn on.
[[bin]]
name = "xtask-exec-fixture"
path = "tests/bin/exec_fixture.rs"
required-features = ["test-support"]

# The `gh` the channel-sync deploy test (tests/channel_sync.rs) runs the committed unit's and
# sidecar's commands with: it answers from files beside it. A program of the tests, not shipped.
[[bin]]
name = "xtask-gh-fixture"
path = "tests/bin/gh_fixture.rs"
required-features = ["test-support"]

# The `docker` the database backup test (tests/coordinator_deploy.rs) runs the committed backup
# unit's command with: it prints its arguments as the dump, or fails, as files beside it say. A
# program of the tests, not shipped.
[[bin]]
name = "xtask-dump-fixture"
path = "tests/bin/dump_fixture.rs"
required-features = ["test-support"]

[features]
# Builds the launch test's fixture program and `xtask::test_support`. Off for everything else.
test-support = []

[dev-dependencies]
# Its own tests turn on `test-support`.
xtask = { path = ".", features = ["test-support"] }
# The packaging test (tests/packaging/daemon_flags.rs) parses the unit's command lines with the
# binary's own flag parser and reads its default paths.
hostkeeper-daemon = { path = "../hostkeeper-daemon" }
# The package test runs the manifest's hook command line, as the hook contract builds it, through
# the binary's own parser and its `update-hook` verb.
hostkeeper-hook = { path = "../hostkeeper-hook" }
# The packaging test (tests/packaging/unit_file.rs) holds the unit's watchdog to the heartbeat
# loop's longest call.
hostkeeper-link = { path = "../hostkeeper-link" }
# The daemon's fetch and proof (`fetch_package`, `prove`), which the channel-stage tests run
# against the staged tree through an in-process origin; hostkeeper-steps for their `Clock`.
hostkeeper-package = { path = "../hostkeeper-package" }
hostkeeper-steps = { path = "../hostkeeper-steps" }
# The daemon's unpacker (design 5.5), which the package test unpacks the produced archive with.
hostkeeper-unpack = { path = "../hostkeeper-unpack" }
# The netboot test holds the served names of the shim and GRUB in netboot.json to the ones the
# packet handling of network install serves them by (`LoaderNames`), for each platform.
hostkeeper-pxe-packets = { path = "../hostkeeper-pxe-packets" }
hostkeeper-wire = { path = "../hostkeeper-wire" }
# The example service hello, whose command-line parser and served version the hello package test
# checks the package's units and manifest against: the version a package names is the one its
# server answers `/version` with.
hello = { path = "../../examples/hello" }
# The operator docs' test (tests/enrollment_doc.rs) reads the refusal tokens from the protos'
# descriptors.
prost-reflect.workspace = true
saphyr-parser.workspace = true

[lints]
workspace = true
