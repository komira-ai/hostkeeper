// hostkeeper.fixture.v1: the protos hostkeeper-ctl's tests build `ctl` from. Not an API.
//
// Served by: the tests' fake transports only.
//
// Authentication: none.
//
// Refusals: whatever status a test's fake returns.
//
// Units: none.
//
// Extending: add what a test needs.
syntax = "proto3";

package hostkeeper.fixture.v1;

import "hostkeeper/options.proto";

// Widgets, for the tests.
service Widgets {
  // Make a widget from every kind of field.
  rpc Make(Widget) returns (Widget);
  // A method no real proto has.
  rpc BrandNewMethod(Empty) returns (Empty);
  // Log in with secrets.
  rpc Login(LoginRequest) returns (LoginResponse);
}

// Gadgets, a second service.
service Gadgets {
  // Every gadget.
  rpc List(Empty) returns (Empty);
}

message Empty {}

enum Colour {
  COLOUR_UNSPECIFIED = 0;
  COLOUR_RED = 1;
  COLOUR_DARK_BLUE = 2;
}

message Inner {
  string note = 1;
  uint64 count = 2;
  // A secret inside a nested message.
  string token = 3 [(hostkeeper.secret) = true];
}

// One field of every kind.
message Widget {
  // The widget's name.
  string name = 1;
  int32 i32 = 2;
  int64 i64 = 3;
  uint32 u32 = 4;
  uint64 u64 = 5;
  sint32 s32 = 6;
  sint64 s64 = 7;
  fixed32 f32 = 8;
  fixed64 f64 = 9;
  sfixed32 sf32 = 10;
  sfixed64 sf64 = 11;
  float ratio = 12;
  double weight = 13;
  bool flag = 14;
  optional bool maybe = 15;
  Colour colour = 16;
  repeated Colour colours = 17;
  repeated string tags = 18;
  map<string, string> labels = 19;
  Inner inner = 20;
  oneof shape {
    string round = 21;
    Inner square = 22;
  }
  bytes blob = 23;
  map<string, uint64> counts = 24;
  repeated Inner inners = 25;
  map<string, Inner> by_name = 26;
  map<uint32, string> by_number = 27;
  map<bool, string> by_truth = 28;
  map<int64, string> by_long = 29;
  repeated int64 longs = 30;
  // A name whose JSON name differs from it (`nodeId`).
  string node_id = 31;
}

message LoginRequest {
  string user = 1;
  // The password.
  string password = 2 [(hostkeeper.secret) = true];
  bytes key = 3 [(hostkeeper.secret) = true];
}

message LoginResponse {
  string user = 1;
  string session = 2 [(hostkeeper.secret) = true];
  Inner inner = 3;
  repeated Inner inners = 4;
  map<string, Inner> by_name = 5;
}
