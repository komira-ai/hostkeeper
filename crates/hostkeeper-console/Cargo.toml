[package]
name = "hostkeeper-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The coordinator's console library: the console operators, targets and BMC credential files, and the reason of a console audit line."

# docs/design/console-broker.md decision D1: the pure part of the console. It reads files and
# opens no socket, starts no process and reads no clock; the coordinator serves the calls.
[dependencies]
# `MacAddress`, the inventory's own MAC type: a target's MAC is compared with a record's.
hostkeeper-enrollment = { path = "../hostkeeper-enrollment" }
# `read_secret`: the BMC credential file is held to the secret file rule.
hostkeeper-wire = { path = "../hostkeeper-wire" }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
hostkeeper-testkit = { path = "../hostkeeper-testkit" }

