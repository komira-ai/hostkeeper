#cloud-config
autoinstall:
  version: 1
  refresh-installer:
    update: false
  apt:
    geoip: false
    mirror-selection:
      primary:
        - uri: "http://192.0.2.10/no-mirror/"
    fallback: offline-install
  storage:
    layout:
      name: direct
      match:
        ssd: true
        size: smallest
  ssh:
    install-server: true
    allow-pw: false
  late-commands:
    - "curl --fail --silent --show-error --output /target/var/tmp/hostkeeper.deb http://192.0.2.10/deb/hostkeeper_amd64.deb"
    - "curtin in-target -- dpkg -i /var/tmp/hostkeeper.deb"
  user-data:
    hostname: "node-a"
    users:
      - name: operator
        lock_passwd: true
        shell: /bin/bash
        sudo: "ALL=(ALL) NOPASSWD:ALL"
        ssh_authorized_keys:
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEB operator-laptop"
    write_files:
      - path: /etc/hostkeeper/repositories/example-archive-keyring.gpg
        owner: "root:root"
        permissions: "0644"
        encoding: b64
        content: mQENAP8=
      - path: /etc/hostkeeper/repositories/example-stable.sources
        owner: "root:root"
        permissions: "0644"
        encoding: b64
        content: VHlwZXM6IGRlYgpVUklzOiBodHRwczovL3BhY2thZ2VzLmV4YW1wbGUuY29tL2FwdApTdWl0ZXM6IHN0YWJsZQpDb21wb25lbnRzOiBtYWluClNpZ25lZC1CeTogL2V0Yy9ob3N0a2VlcGVyL3JlcG9zaXRvcmllcy9leGFtcGxlLWFyY2hpdmUta2V5cmluZy5ncGcK
      - path: /etc/hostkeeper/repositories/example-testing.sources
        owner: "root:root"
        permissions: "0644"
        encoding: b64
        content: VHlwZXM6IGRlYgpVUklzOiBodHRwczovL3BhY2thZ2VzLmV4YW1wbGUuY29tL2FwdApTdWl0ZXM6IHRlc3RpbmcKQ29tcG9uZW50czogbWFpbgpTaWduZWQtQnk6IC9ldGMvaG9zdGtlZXBlci9yZXBvc2l0b3JpZXMvZXhhbXBsZS1hcmNoaXZlLWtleXJpbmcuZ3BnCg==
      - path: /etc/hostkeeper/hostkeeper.toml
        owner: "root:root"
        permissions: "0600"
        encoding: b64
        content: 
      - path: /etc/cloud/cloud.cfg.d/99_hostkeeper.cfg
        owner: "root:root"
        permissions: "0644"
        content: "datasource_list: [ NoCloud, None ]\n"
