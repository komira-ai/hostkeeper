[package]
name = "hostkeeper-hk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "`hk`: the operator's command line for hostkeeper's coordinator, with the SSH tunnel built in: the byte-stream proxy to a host's sshd, `ssh` with a short-lived certificate, revoking certificates, and the status of a host's pins; and `hk xcode-push`, which uploads an Xcode archive to the coordinator's store from the operator's Mac."

# docs/design/ssh-through-coordinator.md section 8. A gateway call, and `hk ssh`, `hk ssh-proxy`,
# `hk ssh-revoke` and `hk ssh-status` (the `ssh` module of this crate), read the operator's token
# from the file a flag names (or stdin, or the runner), once per call, and never put it in an
# argument, a file of their own or the environment of a program they run; nor does `hk xcode-push`.
[[bin]]
name = "hk"
path = "src/main.rs"

# A stand-in for the OpenSSH programs that records the environment it is started with; only the
# tests run it. It is built only with `test-support`, which only the tests of this crate turn on.
[[bin]]
name = "hk-fake-openssh"
path = "tests/bin/fake_openssh.rs"
required-features = ["test-support"]

# A stand-in for `xcodes`, `pkgutil`, `xip` and `plutil`, by the name it is run as, that records
# its arguments and environment; only the tests run it, with `test-support`.
[[bin]]
name = "hk-fake-mac-tool"
path = "tests/bin/fake_mac_tool.rs"
required-features = ["test-support"]

[features]
# Builds the fake OpenSSH program of the tests. Off for everything else.
test-support = []

[dependencies]
# The standard base64 of a secret of kind `bytes`.
base64.workspace = true
# The tail of each ssh verb: `--identity`, `--reason`, revoke's flags and `-- ssh args`.
clap.workspace = true
# The command table `hk` is generated from, and the `Ssh` client and its messages.
hostkeeper-proto = { path = "../hostkeeper-proto" }
# The system's roots, which the runner's token request is trusted by.
rustls-native-certs.workspace = true
# The SHA-256 of an Xcode archive, which names it in the store.
sha2.workspace = true
thiserror.workspace = true
# The runtime the ssh verbs run on, and the byte streams of the tunnel.
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "sync"] }
# The sender half of the tunnel's request stream, as the stream gRPC reads.
tokio-stream.workspace = true
# The channel to the coordinator over TLS that trusts the CA file given, and the client side of
# the tunnel's bidirectional stream.
tonic = { workspace = true, features = ["channel", "tls-ring"] }
# The HTTPS client of a gateway call: rustls with the ring provider, the roots it is given.
ureq.workspace = true

[build-dependencies]
# The fixture protos of the tests compile to a fixture command table with the generator
# hostkeeper-proto's build script runs.
prost-reflect.workspace = true
protox.workspace = true

[dev-dependencies]
# Its own tests turn on `test-support`.
hostkeeper-hk = { path = ".", features = ["test-support"] }
bytes.workspace = true
# The real coordinator, built from serve's flags, whose router answers the gateway calls the
# tests forward to it.
hostkeeper-coordinator = { path = "../hostkeeper-coordinator" }
hostkeeper-oidc = { path = "../hostkeeper-oidc", features = ["testkit"] }
hostkeeper-testkit = { path = "../hostkeeper-testkit" }
http-body-util.workspace = true
hyper.workspace = true
# Reads the recorded request bodies back as the fixture's and the real protos' messages.
prost-reflect = { workspace = true, features = ["serde"] }
rcgen.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["server", "tls-ring"] }

[lints]
workspace = true
