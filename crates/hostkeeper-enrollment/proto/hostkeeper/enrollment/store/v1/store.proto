// hostkeeper.enrollment.store.v1: the files of the coordinator's enrollment store
// (crates/hostkeeper-enrollment, src/enroll). Private to that crate: no RPC carries these
// messages, and nothing outside the crate reads them.
//
// One message per file, binary protobuf, written whole (temporary file, fsync, rename,
// directory fsync):
//
//   requests/<request id, hex>.pb   Request
//   issued/<request id, hex>.pb     Issued
//   hosts/<host id>.pb              Host
//   deny/<host id>.pb               Deny
//   serial.pb                       SerialCounter
//   mac-nonces/<nonce sha256, hex>.pb  MacNonce
//
// Field 1 of every message is `schema`, and this release writes 1. A reader refuses a schema
// above the one it knows, a missing schema, and a state value it does not know; it ignores
// fields it does not know.
//
// Extending: add fields and enum values, never renumber, rename, retype or re-mean one. Every
// enum's zero value is UNSPECIFIED and is never written.
//
// Times are unix seconds. A request id and a key hash are the 32 bytes of the SHA-256 of a
// DER SubjectPublicKeyInfo.
syntax = "proto3";

package hostkeeper.enrollment.store.v1;

// What a host said about itself when it asked to join. Informational: claims authorise nothing.
message Claims {
  string machine_id = 1;
  string dmi_serial = 2;
  string dmi_product_uuid = 3;
  repeated string addresses = 4;
  // A Mac's serial number and platform UUID.
  string mac_serial = 5;
  string mac_platform_uuid = 6;
  // The MAC address of the host's BMC, as the host claimed it; empty when it claimed none.
  string bmc_mac = 7;
}

enum RequestState {
  REQUEST_STATE_UNSPECIFIED = 0;
  // Waiting for an operator.
  REQUEST_STATE_PENDING = 1;
  // Waiting for an operator, and flagged: its machine id is another request's, or the same key
  // came back with another machine id, or a renewal names a host recorded with another machine
  // id. Never approved but by an operator, like any pending request.
  REQUEST_STATE_DUPLICATE_CLAIM = 2;
  // An operator approved it; its certificate is made at the next poll.
  REQUEST_STATE_APPROVED = 3;
  // Its certificate for the current round is in issued/.
  REQUEST_STATE_ISSUED = 4;
  // The host it was approved for is denied.
  REQUEST_STATE_DENIED = 5;
}

// What the operator approved a request as.
message Approval {
  string host_id = 1;
  string role = 2;
  repeated string services = 3;
  // The approval took the host id over from another key, or out of a deny row.
  bool replace = 4;
  // Who approved it: the name of the operator's token, or `mdm-nonce` for a Mac approved by
  // its nonce. Empty when the approval was recorded without one (no audit entry is due).
  string approver = 5;
  uint64 approved_unix = 6;
  // The operator's reason.
  string reason = 7;
  // The SHA-256 of the Mac nonce this approval consumed; empty when none. This field is the
  // consumption: the nonce's own file is marked after it, and again at the store's next open.
  bytes mac_nonce_sha256 = 8;
}

message Request {
  uint32 schema = 1;
  bytes request_id = 2;
  // The PKCS#10 request as the host posted it.
  bytes csr_der = 3;
  Claims claims = 4;
  // The boot image or package the host says it was installed from.
  string image = 5;
  uint64 posted_unix = 6;
  // The host id this request renews; empty when it is not a renewal.
  string renewal_of = 7;
  RequestState state = 8;
  // Set from APPROVED on.
  Approval approved = 9;
  // The SubjectPublicKeyInfo of the CSR, whose SHA-256 is `request_id`.
  bytes spki_der = 10;
  // The issuance round: 0 for the first enrollment of this key, one more for each renewal the
  // store accepted after a certificate was issued.
  uint32 round = 11;
  // The serial reserved for this round's certificate; 0 until one is reserved.
  uint64 serial = 12;
  // The host presented a Mac nonce with the request (the nonce itself is not kept here).
  bool mac_nonce_presented = 13;
  // When the request expired: it waited for an operator longer than `expired_after_secs`, and
  // its host is unenrolled. 0 while it has not. `state` keeps the waiting state it expired in
  // (PENDING or DUPLICATE_CLAIM), so that a release that does not know this field reads the
  // request as still waiting instead of refusing the file. A request that expired is never
  // approved; the same key posted again starts it over, waiting from the time of that post.
  uint64 expired_unix = 14;
  // The coordinator's request TTL the request expired under, in seconds; 0 while it has not.
  uint64 expired_after_secs = 15;
}

// The certificate made for one round of a request.
message Issued {
  uint32 schema = 1;
  bytes request_id = 2;
  uint32 round = 3;
  uint64 serial = 4;
  bytes certificate_der = 5;
  string host_id = 6;
  uint64 not_after = 7;
}

// A host id and the key it was approved for.
message Host {
  uint32 schema = 1;
  string host_id = 2;
  // The SHA-256 of the host's SubjectPublicKeyInfo: also the id of the request it came from.
  bytes key_hash = 3;
  string machine_id = 4;
  string role = 5;
  repeated string services = 6;
  // Two live daemons with different machine ids reported this host id within one window.
  bool duplicate = 7;
  // When the coordinator accepted the first heartbeat of this host since its approval; absent
  // until then. Written once; an approval writes the file anew without it.
  optional uint64 first_heartbeat_unix = 8;
}

enum DenyState {
  DENY_STATE_UNSPECIFIED = 0;
  // Denied; an update may still be in flight on the host.
  DENY_STATE_RETIRING = 1;
  // Denied, and final.
  DENY_STATE_RETIRED = 2;
  // An approval with `replace` took the id out of the deny row; `cleared_by` names it.
  DENY_STATE_CLEARED = 3;
}

message Deny {
  uint32 schema = 1;
  string host_id = 2;
  DenyState state = 3;
  // The request whose approval cleared the row (DENY_STATE_CLEARED only).
  bytes cleared_by = 4;
}

// The serial number the next certificate gets.
message SerialCounter {
  uint32 schema = 1;
  uint64 next = 2;
}

// A one-time Mac nonce the policy gate issued for one serial. Only its SHA-256 is kept.
message MacNonce {
  uint32 schema = 1;
  bytes nonce_sha256 = 2;
  // The Mac serial number it was issued for.
  string serial = 3;
  uint64 issued_unix = 4;
  // The request whose approval consumed it; empty while it is unused.
  bytes consumed_by = 5;
  // The request id (key hash) of the pending request it was issued for: it approves that
  // request only. Empty on a nonce written before this field, which is judged without it; a
  // release before the field ignores it.
  bytes request_id = 6;
}
