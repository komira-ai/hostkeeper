[package]
name = "hostkeeper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The hostkeeper binary: `hostkeeper daemon`, the one root process of a host."

# The binary only forwards to `hostkeeper_daemon::cli::main`: everything it does is in the
# library, where coverage measures it (AGENTS.md T4).
[dependencies]
hostkeeper-daemon = { path = "../hostkeeper-daemon" }

# The `launchctl` of the pkg postinstall test (tests/postinstall.rs): it logs its arguments and
# exits with a code a file beside it holds. A program of the tests, not shipped: it is built only
# with `test-support`, which only the tests of this crate turn on.
[[bin]]
name = "hostkeeper-launchctl-fixture"
path = "tests/bin/launchctl_fixture.rs"
required-features = ["test-support"]

[features]
# Builds the postinstall test's `launchctl` fixture program. Off for everything else.
test-support = []

[dev-dependencies]
# Its own tests turn on `test-support`.
hostkeeper = { path = ".", features = ["test-support"] }
# The macOS pkg's postinstall script, which tests/postinstall.rs runs against this binary.
hostkeeper-launchd = { path = "../hostkeeper-launchd" }
hostkeeper-testkit = { path = "../hostkeeper-testkit" }

[lints]
workspace = true
