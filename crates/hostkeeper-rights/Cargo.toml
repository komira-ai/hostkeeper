[package]
name = "hostkeeper-rights"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The transient unit that runs one step of a hook, and the part of the old declaration it is still built from."

# The transient systemd unit that runs one step of a hook, and the part of the old declaration it
# is built from (`Declaration`, `Declared`, `recheck_targets`). The declaration loader, the
# widening check, the approvals and the gate were deleted when the daemon config and the package
# manifest (hostkeeper-config) replaced the declaration; B3 rewrites what is left. The crate
# names no product and depends on no crate of this workspace but the hook contract and the config
# crate (crates/xtask/tests/layering keeps both true).
[dependencies]
# The service name and path grammars.
hostkeeper-config = { path = "../hostkeeper-config" }
# `Step`, `Invocation`, `Outcome` and `Report`.
hostkeeper-hook = { path = "../hostkeeper-hook" }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

# The program the root tests run as a hook, with the operations that probe the rights it was
# given. A program of the tests, not shipped: it is built only with `test-support`, which only
# the tests of this crate turn on. The root tests themselves need root and the real systemd and
# are not part of the pull-request test set (MIGRATION.md).
[[bin]]
name = "hostkeeper-rights-probe"
path = "tests/bin/probe_hook.rs"
required-features = ["test-support"]

# The program the spawner tests run in place of the real `systemd-run` (tests/launch.rs): it
# prints its arguments, its environment or its input, or exits with a status, so the tests need no
# program of the host. A program of the tests, not shipped; built only with `test-support`.
[[bin]]
name = "hostkeeper-rights-spawn-fixture"
path = "tests/bin/spawn_fixture.rs"
required-features = ["test-support"]

[features]
# `Declared::by_hand`, for the tests of this crate: a declaration with a hook uid and the host's
# names. Off for everything else.
test-support = []

[dev-dependencies]
# Its own tests turn on `test-support`.
hostkeeper-rights = { path = ".", features = ["test-support"] }
hostkeeper-testkit = { path = "../hostkeeper-testkit" }

[lints]
workspace = true
