[package]
name = "hostkeeper-ui-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The checks of the operator web app under ui/: every call it makes is a method of the protobuf descriptors, its sources store no token and load nothing from the network, and its data layer and pages, run in a JavaScript engine against a fake gateway, send and show what they should; and every call it lists is served by the real coordinator to an operator's token. Tests only; not shipped."

# No crate of the workspace depends on this one. Its library is the checks the tests apply to
# the sources of ui/ (read with include_str!, so no path or working directory is needed).

[dependencies]
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
boa_engine.workspace = true
# `tests/real_router.rs`: the real coordinator, built from its flags as the binary builds it,
# that every call of ui/calls.json is sent to through its router, and what that takes (the
# flags, TLS files, a tokens file, the requests and their gRPC statuses). Nothing is fetched and
# no socket is opened: the router is called in process.
bytes.workspace = true
clap.workspace = true
hostkeeper-coordinator = { path = "../hostkeeper-coordinator" }
hostkeeper-oidc = { path = "../hostkeeper-oidc", features = ["testkit"] }
hostkeeper-proto = { path = "../hostkeeper-proto" }
hostkeeper-testkit = { path = "../hostkeeper-testkit" }
http-body-util.workspace = true
hyper.workspace = true
prost.workspace = true
prost-reflect = { workspace = true, features = ["serde"] }
rcgen.workspace = true
rustls.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tonic.workspace = true

[lints]
workspace = true
