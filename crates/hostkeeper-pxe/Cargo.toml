[package]
name = "hostkeeper-pxe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "pxe, the boot server of network install: its hook's prepare step downloads the boot sets and debs of a release, verifies them against its attestation and netboot.json, and seals them; serve checks the seal and serves them by proxyDHCP or behind the router, TFTP and HTTP, to the machines the inventory may install."

# docs/design/network-install.md sections 3 and 5, item N8: the fetch, which is the `prepare` step
# of the `pxe` package's hook (docs/design/two-programs.md section 6.1), writes a new directory
# holding, for each Linux platform asked for, the boot set `netboot.json` pins (the live-server
# ISO, and the kernel, initrd, shim and network GRUB taken out of it) and the hostkeeper deb, each
# checked as it is written, `netboot.json` and the debs attested by the daemon config's trusted
# signer through the daemon's own verifier, and a seal over all of it. Item N9: `pxe serve` checks
# that seal and serves the sealed files, the menus and the seeds, answering only the machines the
# coordinator's inventory says may be installed.
[[bin]]
name = "pxe"
path = "src/main.rs"

[dependencies]
# The body of an HTTP answer.
bytes.workspace = true
clap.workspace = true
# The stream an HTTP answer's sealed file is sent as.
futures.workspace = true
# The gzip decoder of a deb whose `data.tar` is gzip.
flate2.workspace = true
# The daemon config's loader (its trusted signer and bounds) and `TrustedSigners`.
hostkeeper-config = { path = "../hostkeeper-config" }
# The daemon's verifier (`gh attestation verify`, offline), its bundle reader and its HTTPS
# transport.
hostkeeper-package = { path = "../hostkeeper-package" }
# The MAC grammar of the inventory (`MacAddress`).
hostkeeper-enrollment = { path = "../hostkeeper-enrollment" }
# The operator API's messages and clients: `Enrollment.ListRecords`, `Enrollment.List`, `Hosts.List`.
hostkeeper-proto = { path = "../hostkeeper-proto" }
# The packets of `serve`: proxyDHCP answers, router-mode learning, TFTP requests and transfers.
hostkeeper-pxe-packets = { path = "../hostkeeper-pxe-packets" }
# The fixed grub.cfg, the menu of a MAC and the seed of a machine.
hostkeeper-pxe-seed = { path = "../hostkeeper-pxe-seed" }
# The contract of the update hook the `pxe` package ships: `Params`, `Report`, `Outcome`, `Step`.
hostkeeper-hook = { path = "../hostkeeper-hook" }
# `Clock` and `Stamp`: the attestation's deadline is a point on the injected clock.
hostkeeper-steps = { path = "../hostkeeper-steps" }
# The host id and role grammars, the platform, and the operator token opened before the privilege
# drop and read after it (`open_token`).
hostkeeper-wire = { path = "../hostkeeper-wire" }
hex.workspace = true
# The HTTP/1.1 server of `serve`.
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
# `O_NOFOLLOW` and `O_NONBLOCK`: each sealed file is opened without following a link.
libc.workspace = true
lzma-rs.workspace = true
# The zstd decoder of a deb whose `data.tar` is zstd.
ruzstd.workspace = true
# The CA bundle the HTTPS client trusts, read as PEM.
rustls-pki-types.workspace = true
# The privilege drop of `serve`: the groups, the gid and the uid of the thread, and the check that
# root cannot be taken back.
# The `flock` a hook step holds on the boot directory.
rustix = { workspace = true, features = ["fs", "process", "thread"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2.workspace = true
# The `data.tar` of a deb.
tar.workspace = true
thiserror.workspace = true
# The settings file (`/etc/pxe/pxe.toml`) is TOML.
toml.workspace = true
# The runtime of `serve`: its sockets, the coordinator client and the stop signal.
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# The client of the coordinator's operator API, over TLS that trusts the coordinator's CA alone.
tonic = { workspace = true, features = ["channel", "tls-ring"] }

[dev-dependencies]
base64.workspace = true
hostkeeper-testkit = { path = "../hostkeeper-testkit" }
# A CA certificate for the CA bundle of the command's tests, made at run time.
rcgen.workspace = true
# The fake `gh` matches the signer identity as `gh` does, as a regular expression.
regex.workspace = true
# The fake coordinator of `serve`'s tests: a loopback gRPC server with TLS.
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["server", "tls-ring"] }

[lints]
workspace = true
