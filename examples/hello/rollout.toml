# hello as a service of the coordinator: an entry of a rollout file (the coordinator's
# --rollout-file). `cargo test -p hostkeeper-coordinator --test hello_rollout` loads this file
# with the coordinator's own reader.
#
# On a coordinator that holds host groups, the entry only defines hello: the rollout file still
# gives a package its version scheme, its repository and the floor of its `min_version`
# (docs/operations/hostgroups.md, "Group mode"). Placement and policy are the group's: the group
# `farm` of host-group.json lists hello, and its policy (a lone canary, two baked beats,
# automatic rollback after one failed host) is what the keys below say, put with
# `hkctl host-groups put` (docs/hello.md). The `roles`, `selector` and policy keys of the entry
# are not read there.
#
# On a coordinator that holds no host group, the keys place and roll hello themselves, until the
# migration into groups retires the rollout file. Appended to that file, the entry makes hello a
# service the coordinator rolls to the hosts of the role `farm`; replace `farm` with the role of
# the hosts that run the proof. A host of the role on which hello is not installed is ordered to
# install it, because the entry assigns hello to the role; the daemon must announce `install-v1`.
# The first host goes alone (the canary is the first stage of the update plan), and no other
# starts until it has beaten healthy twice at the new version. The plan then rolls the rest by
# its default stages, 1, 10, 50 and 100 percent of the hosts (`stages = [...]` sets another
# list), each baked before the next. A release that fails after its commit on one host is rolled
# back by the coordinator to the last version that converged and baked.

[[service]]
name = "hello"
roles = ["farm"]
bake_beats = 2
canary = { count = 1 }
rollback = "automatic"
rollback_after_failed = { percent = 25, min_hosts = 1 }

[service.selector]
roles = ["farm"]
