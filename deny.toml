# cargo-deny configuration. Run: cargo deny check bans licenses sources
# CI (ci.yml) checks bans, licences and sources. Advisories never block a pull request
# (AGENTS.md B9, R6), so CI does not check them: advisories.yml runs
# `cargo xtask advisories`, which runs `cargo deny check advisories` daily and on every push to
# main and keeps its findings in one issue.

[graph]
all-features = true

# What `cargo xtask advisories` reports. No advisory is ignored here: a finding goes to the
# issue, not into an `ignore` list.
[advisories]
version = 2
# The RustSec advisory database, cargo-deny's default, named so that it is pinned.
db-urls = ["https://github.com/rustsec/advisory-db"]
# A yanked crate in Cargo.lock is a finding, listed in the issue like an advisory.
yanked = "deny"

[licenses]
version = 2
# Permissive licences only. Anything not listed, including every copyleft licence
# (GPL, LGPL, AGPL, MPL, EPL, CDDL, EUPL, OSL), is refused.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are not published; their licence is the workspace's Apache-2.0.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependency: every crate comes from crates.io or this workspace.
allow-git = []
