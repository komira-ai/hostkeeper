# The directories of the hostkeeper daemon (docs/design/hostkeeper-design.md, sections 4.1 and
# 10). Installed as /usr/lib/tmpfiles.d/hostkeeper.conf; systemd-tmpfiles makes them at boot,
# and the package's post-install script makes them at once. A directory that exists gets the
# mode and owner below. Nothing here cleans or removes a directory. /run/hostkeeper is the
# daemon's run directory and holds the console's issue file; the daemon binds no socket; the units have no
# RuntimeDirectory=, so it is made here alone and stays while the unit is stopped. The data
# directory of a service (/var/lib/<service>) is not hostkeeper's and is not here. The packages
# directory is passed through by every user and listed by root alone (0711): a service an earlier
# release runs from its archive version, as its own user, reaches its program through it, and what
# is kept of a package below it is closed by its own mode (crates/hostkeeper-install/src/version).
#
# Type Path                         Mode User Group Age
d      /run/hostkeeper              0700 root root  -
d      /etc/hostkeeper              0755 root root  -
d      /var/lib/hostkeeper/packages 0711 root root  -
d      /var/lib/updater/state       0700 root root  -
d      /var/lib/updater/hooks       0700 root root  -
