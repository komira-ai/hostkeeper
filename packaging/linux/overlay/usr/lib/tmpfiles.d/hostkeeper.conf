# The directories of the hostkeeper daemon (docs/design/hostkeeper-design.md, sections 4.1 and
# 10). Installed as /usr/lib/tmpfiles.d/hostkeeper.conf; systemd-tmpfiles makes them at boot,
# and the package's post-install script makes them at once. A directory that exists gets the
# mode and owner below. Nothing here cleans or removes a directory; /run/hostkeeper is also the
# unit's RuntimeDirectory=, which systemd removes when the unit stops and makes again, with the
# same mode, when it starts. The data directory of a service (/var/lib/<service>) is not
# hostkeeper's and is not here.
#
# Type Path                         Mode User Group Age
d      /run/hostkeeper              0700 root root  -
d      /etc/hostkeeper              0755 root root  -
d      /var/lib/hostkeeper/packages 0755 root root  -
d      /var/lib/updater/state       0700 root root  -
d      /var/lib/updater/hooks       0700 root root  -
