# The directories of the hostkeeper coordinator. Installed as
# /usr/lib/tmpfiles.d/hostkeeper-coordinator.conf; systemd-tmpfiles makes them at boot, and the
# package's post-install script makes them at once. /etc/hostkeeper-coordinator holds serve.toml
# and the files it names, readable by the coordinator's group and written by root;
# /var/lib/hostkeeper-coordinator is the coordinator's own (its state files, the CA key, the
# server certificate). Nothing here cleans or removes a directory.
#
# Type Path                            Mode User                   Group                  Age
d      /etc/hostkeeper-coordinator     0750 root                   hostkeeper-coordinator -
d      /var/lib/hostkeeper-coordinator 0700 hostkeeper-coordinator hostkeeper-coordinator -
