[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/komira-ai/hostkeeper"
publish = false

# Every external dependency is declared here once and used from a member as
# `name.workspace = true` (members add features they need).
[workspace.dependencies]
# Argon2id, the operator password hash of hostkeeper-coordinator (docs/design/operator-login.md
# section 6.1). Pure Rust, MIT OR Apache-2.0; the PHC string format comes with it.
argon2 = "0.6.0"
# The JWT segments of a CI token (hostkeeper-oidc); the attestation bundle's DSSE payload and
# certificate (hostkeeper-package).
base64 = "0.23.1"
# A JavaScript engine in pure Rust, in which the tests of hostkeeper-ui-tests run the web app's
# data layer and pages (`ui/`) against a fake gateway; dev-dependency only. Pinned exactly: its
# embedding API changes between minor versions.
boa_engine = "=0.22.0"
# The byte buffers of HTTP bodies and of gRPC messages.
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
# gzip for the tarballs `cargo xtask install-tool` unpacks; the pure-Rust backend.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures = "0.3.34"
# The operating system's random bytes, from which hostkeeper-enroll makes the host's key. Already in
# the tree through the P-256 crates below.
getrandom = "0.4.3"
hex = "0.4.3"
# A jq interpreter in pure Rust, in which the workflow lint's tests (crates/xtask/tests/workflows)
# run the outputs program of `set-desired.yml` on fixtures, with no shell; dev-dependency only.
jaq-core = "3.1.2"
jaq-json = "2.0.3"
jaq-std = "3.0.4"
# The coordinator's HTTP/1.1 and HTTP/2 server and the OIDC key fetch's client (hostkeeper-coordinator,
# hostkeeper-oidc); members turn on the parts they use.
http-body-util = "0.1.5"
# The dates of `Last-Modified` and `If-Modified-Since` (hostkeeper-coordinator's package proxy).
httpdate = "1.0.3"
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
# The Linux daemon's reader of the BMC over `/dev/ipmi0` (hostkeeper-daemon's `ipmi`): the
# kernel IPMI device's `ioctl`s behind a safe `File`, so the workspace keeps `unsafe` out. Only
# its device file connection (`unix-file`), not the RMCP+ client's MD5.
ipmi-rs = { version = "0.6.0", default-features = false, features = ["unix-file"] }
# `O_NOFOLLOW` and `O_NONBLOCK` for the daemon config and the manifest (hostkeeper-config) and
# the secret files (hostkeeper-wire).
libc = "0.2.190"
# The xz decoder of `pxe update-hook prepare`, which takes the shim out of Ubuntu's `shim-signed` deb
# (its `data.tar.xz`); pure Rust (MIT). Its tests compress with it too.
lzma-rs = "0.3.0"
# A named pipe in the tests of the crates that refuse a file that is not regular
# (hostkeeper-testkit's `fifo`): rustix has no mkfifo on macOS, nix has it on every Unix.
nix = { version = "0.30.1", default-features = false, features = ["fs"] }
# The host's P-256 key, its ECDSA signatures (RFC 6979: the same key and message give the same
# signature, so a reposted enrollment request is byte for byte the same) and its PKCS#8 encoding
# (hostkeeper-enroll). Pure Rust: no OpenSSL, no C.
p256 = { version = "0.14.0", features = ["ecdsa", "pem", "pkcs8"] }
# `proc_pidpath` and the start time of a process on macOS (hostkeeper-launchd's process probe), a
# safe wrapper over libproc: a macOS-only target dependency, never compiled on Linux. Its build
# script runs bindgen on macOS.
libproc = "0.14.11"
# A property-list reader and writer (MIT), without its serde support: the Mac config the daemon
# writes at its start (`mac_config::at_start`) and the enroller's nonce read (hostkeeper-enroll) read the managed preferences of the MDM with
# it, binary or XML; hostkeeper-mdm-core writes the MDM enrollment profile (an XML plist) with it;
# the MDM gate (hostkeeper-mdm-gate) writes the commands it sends and reads the check-ins and
# results; the tests of hostkeeper-launchd read back the launchd plists it generates.
plist = { version = "1.10.3", default-features = false }
# The coordinator's Postgres store (hostkeeper-coordinator, `--database-dsn-file`): the blocking
# client, driven only from the store's own threads, never from inside the tokio runtime. No TLS
# yet: a connection string that asks for it is refused. `with-serde_json-1` writes and reads the
# `jsonb` columns with the same serde code as the files.
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
# The protobuf runtime of the code hostkeeper-proto generates, and the descriptor types its tests read.
prost = "0.14.4"
prost-types = "0.14.4"
# Reads custom options (`(hostkeeper.secret)`) off compiled descriptors in hostkeeper-proto's tests;
# hostkeeper-ui-tests and hostkeeper-testkit add `serde` to read a message's canonical JSON against
# its descriptor.
prost-reflect = "0.16.5"
# Compiles .proto files in pure Rust, with no protoc: hostkeeper-proto's and
# hostkeeper-enrollment's build scripts, and tests.
protox = "0.10.0"
# Certificates: the CA module of hostkeeper-enrollment signs with it (members add `x509-parser`,
# which reads a public key back for signing), and the TLS tests of hostkeeper-enroll,
# hostkeeper-testkit and the coordinator crates make their test certificates with it at run time,
# so that no key is committed. The ring backend.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
# ECDSA P-256 / SHA-256 signature checks and SHA-256 digests (hostkeeper-enrollment: a CSR's
# self-signature, a poll's signed nonce, the request id); the RS256 signature of a CI token
# (hostkeeper-oidc).
ring = "0.17.14"
# The RPM packages `cargo xtask channels rpm` reads (the header of each package, for the
# repository's `primary.xml` and the signature header it signs) and the tests build; the reader
# and builder only (no signing, no zstd, xz or bzip2), pure Rust (MIT).
rpm = { version = "0.30.2", default-features = false, features = ["payload", "gzip-compression"] }
# The zstd of the packages hostkeeper-pxe reads (the decoder of a .deb's `data.tar.zst`) and of
# `cargo xtask release package`'s checks (the decoder, and the encoder their tests use), pure Rust
# (MIT). `hash` (twox-hash, MIT) checks a frame's content checksum; no dictionary builder.
ruzstd = { version = "0.9.1", default-features = false, features = ["hash", "std"] }
# hostkeeper-package's tests: the signer identity it passes to `gh` is compiled and matched as
# the regular expression `gh` reads it as.
regex = "1.13.1"
# hostkeeper-package's tests: a TLS server on loopback for its HTTPS client, with the ring
# provider ureq already brings; and reading the test certificates.
# The coordinator client of hostkeeper-enroll reads the certificate chain the coordinator presents
# with it, and builds the trust anchors of its calls.
# hostkeeper-enrollment's tests (dev only): verify the certificates its CA issues as TLS would.
# The coordinator crates' TLS (hostkeeper-tls, hostkeeper-oidc, hostkeeper-coordinator), which
# add `tls12`.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
# The host's roots, which the OIDC key fetch trusts.
rustls-native-certs = "0.8.4"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
# A TypeScript parser in pure Rust (Apache-2.0), with which a test of hostkeeper-ui-tests reads the
# generated `ui/gen/client.d.ts`: only its TypeScript syntax, with `.d.ts` rules; dev-dependency
# only. Pinned exactly, with its `swc_common` (the parser's input and positions): their APIs change
# between versions.
swc_common = "=27.0.0"
swc_ecma_ast = "=30.0.0"
swc_ecma_parser = { version = "=47.0.0", default-features = false, features = ["typescript"] }
# Safe system calls: the effective uid, flock, the monotonic clock, kill of a process group; and
# `poll` on a listener in hello's socket tests.
rustix = "1.1.5"
# The YAML parser the workflow lint (crates/xtask/tests/workflows) reads each workflow with.
saphyr-parser = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The sockets of `pxe serve`, set up before they are bound: SO_REUSEADDR, SO_BROADCAST
# and SO_BINDTODEVICE (`--interface`), which neither std nor rustix sets. Already in the tree
# through tokio and hyper-util.
socket2 = { version = "0.6.5", features = ["all"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
# NFKC of a password before it is hashed (hostkeeper-coordinator). MIT OR Apache-2.0; already in
# the tree through the URL parsers.
unicode-normalization = "0.1.25"
# The operator token compared in constant time (hostkeeper-coordinator).
subtle = "2.6.1"
# `sysctlbyname` behind a safe interface (MIT): the boot id of a Mac, `kern.bootsessionuuid`
# (hostkeeper-launchd), a macOS-only target dependency, never compiled on Linux.
sysctl = "0.7.1"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
# The validity of a certificate, in the type rcgen takes (hostkeeper-enrollment).
time = { version = "0.3.45", default-features = false }
# The `--params` file, the daemon config, the manifest and the coordinator's rollout and tokens
# files are TOML.
toml = { version = "1.1.8", default-features = false, features = ["display", "parse", "serde", "std"] }
# The daemon's runtime (hostkeeper-daemon); the runtime of the operator client of
# hostkeeper-testkit and of each call of the coordinator client of hostkeeper-enroll; the
# coordinator's server and the OIDC key fetch (hostkeeper-coordinator,
# hostkeeper-oidc, hostkeeper-tls). Members add the features they use.
tokio = { version = "1.54.1", default-features = false }
# The TLS of the coordinator's listeners and of the OIDC key fetch, on rustls with ring.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
# The loopback listener of the gRPC tests of hostkeeper-enroll and hostkeeper-testkit.
tokio-stream = { version = "0.1.19", default-features = false }
# gRPC: the service traits and clients hostkeeper-proto generates. Code generation only here: no
# transport and no TLS. hostkeeper-coordinator calls the generated servers in process under its
# own hyper listeners. hostkeeper-link adds `channel` for the daemon's gRPC heartbeat, over a TLS
# stream it makes itself. hostkeeper-enroll and hostkeeper-testkit add `channel` and `tls-ring` for
# their clients (and `server` in their tests, for a loopback server).
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
# The alerts of hostkeeper-enrollment (a duplicate claim, a duplicate host): warn events with
# fields; the coordinator's logs.
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# The root certificates of the public web, which the APNs and mdmcert.download clients trust
# (hostkeeper-mdm-push). Licence CDLA-Permissive-2.0, allowed in deny.toml.
webpki-roots = "1.0.12"
# Reads a CSR and a certificate (hostkeeper-enrollment), and its tests read issued certificates
# back; a certificate's subjectAltNames and validity (hostkeeper-wire, hostkeeper-tls).
x509-parser = "0.18.1"
# `service_fn`, the connector of the tests' gRPC client in hostkeeper-daemon; dev-dependency only.
tower = { version = "0.5.3", default-features = false }
# The package fetch's HTTPS client (hostkeeper-package): blocking, rustls with the ring provider and
# the root certificates its caller gives it. No default features: no gzip, no cookies, no SOCKS,
# and no webpki-roots (the package fetch trusts the roots its caller gives it, not a bundled set). The ring provider is ureq's
# `_ring` feature, which its public `rustls` feature turns on together with webpki-roots; a
# feature with a leading underscore is not covered by semver, so the version is exact.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "_ring"] }
# The certificate request hostkeeper-enroll sends and the certificates it checks; `builder` makes the
# PKCS#10 request (and the test CA's certificates).
x509-cert = { version = "0.3.0", features = ["builder", "pem"] }
# The SCEP server library of hostkeeper-mdm-scep (docs/design/coordinator-mdm.md 4.2, task CM12b):
# no Rust SCEP crate exists, so the CMS and X.509 layers are the RustCrypto crates. `cms` is a
# release candidate, pinned exactly (R6: its licence is MIT or Apache-2.0; `cargo deny` passes); it
# builds the signed and enveloped replies, and everything it lacks (the verify and decrypt side) is
# written in the crate.
aes = "0.9.4"
cbc = "0.2.1"
cipher = { version = "0.5.2", features = ["alloc", "block-padding"] }
cms = { version = "=0.3.0-rc.2", default-features = false, features = ["builder", "std"] }
const-oid = { version = "0.10.2", features = ["db"] }
der = { version = "0.8.3", features = ["alloc", "oid", "std"] }
des = "0.9.0"
# The tests of hostkeeper-mdm-scep draw their keys and nonces from the thread generator.
rand = "0.10.3"
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
# The CMS reply of mdmcert.download (hostkeeper-mdm-push) is read with the RustCrypto 0.8-era
# ciphers and rsa 0.9, which that crate was written against; the newer lines above belong to
# hostkeeper-mdm-scep. The `-legacy` aliases keep both lines apart.
aes-legacy = { package = "aes", version = "0.8.4" }
cbc-legacy = { package = "cbc", version = "0.1.2", features = ["alloc"] }
des-legacy = { package = "des", version = "0.8.1" }
rand_core-legacy = { package = "rand_core", version = "0.6.4", features = ["getrandom"] }
rsa-legacy = { package = "rsa", version = "0.9.10", default-features = false, features = ["std", "pem", "sha2"] }
signature = { version = "3.0.0", features = ["alloc", "digest"] }
spki = { version = "0.8.1", features = ["alloc"] }

[workspace.lints.rust]
# `coverage` is set by cargo-llvm-cov.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
# No unsafe code (AGENTS.md R2).
unsafe_code = "forbid"

[workspace.lints.clippy]
# The methods and types `clippy.toml` bans, each with the reason clippy prints.
disallowed_methods = "deny"
disallowed_types = "deny"

# Dev and test builds: line tables keep panic backtraces and profilers at file:line;
# variable-level debug info is the part dropped. `test` inherits `dev`; it is spelled out so the
# two cannot drift. Release is untouched.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

# The RSA keys of a push certificate request (hostkeeper-mdm-push) are generated with the `rsa`
# crate's big-number arithmetic, which takes tens of seconds a key unoptimized; the tests make
# keys, so these two packages are optimized in dev and test builds.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.test.package.num-bigint-dig]
opt-level = 3
