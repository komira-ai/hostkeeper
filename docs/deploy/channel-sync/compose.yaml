# The release channel's sync as a sidecar of a docker deployment (docs/deploy/release-channel.md,
# "Sync new releases into the channel"): `cargo xtask release channel-sync --every-secs 600`,
# which syncs, waits ten minutes after each run ends, and syncs again, never exiting. Merge the
# service into the deployment's compose file, and give it the volume the channel's web server
# serves in place of `channel` (that service mounts it read-only).
#
# The image is distroless (glibc, CA certificates, no shell), pinned by digest like the
# coordinator's (packaging/container/Dockerfile), and runs as its `nonroot` user, 65532, which
# must be able to write the channel's volume. Into it are mounted, read-only:
#   - bin/xtask, the xtask binary of a hostkeeper checkout (`cargo build --release -p xtask`);
#   - bin/gh, the GitHub command line tool, which the sync runs to list, download and verify;
# and its configuration is its flags. channel-sync.env holds one line, `GH_TOKEN=<token>`: a
# GitHub token that can read public repositories and nothing else, gh's credential.
#
# A run that refuses something prints each refusal to the container's log and the loop goes on.
services:
  channel-sync:
    image: gcr.io/distroless/cc-debian13:nonroot@sha256:08476c244888bfb425bae1ae4dd7c17f093e972aab8426883d97f3c6f280f7c1
    entrypoint: ["/usr/local/bin/xtask"]
    command:
      - release
      - channel-sync
      - --repo
      - komira-ai/hostkeeper
      - --repo
      - komira-ai/tierstore
      - --channel-dir
      - /channel
      - --every-secs
      - "600"
    env_file: channel-sync.env
    volumes:
      - ./bin/xtask:/usr/local/bin/xtask:ro
      - ./bin/gh:/usr/local/bin/gh:ro
      - channel:/channel
    restart: unless-stopped

volumes:
  channel: {}
