<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Host lifecycle state machine: unenrolled, pending, enrolled and retired for a host; absent, installing, running, updating, rolled back, halted, pinned and removing for each service on an enrolled host.">
<title>Host lifecycle state machine</title>
<desc>A host moves from unenrolled to pending to enrolled and finally retired, and may fall back from pending when the request expires. Each service on an enrolled host moves between absent, installing, running, updating, rolled back, halted, pinned and removing as orders and failures arrive.</desc>
<defs><marker id="host-lifecycle-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="host-lifecycle-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.dash{stroke-dasharray:6 4}
.tb{stroke:#FD4F1D;fill:none;stroke-width:2.2;stroke-dasharray:8 5}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-od{stroke:#FD4F1D;fill:none;stroke-width:1.6;stroke-dasharray:6 4}
.life{stroke:#5A5A57;stroke-width:1;stroke-dasharray:2 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="1200" height="660" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16" text-anchor="start">Host lifecycle: the host, and each service on an enrolled host</text>
<rect x="50" y="90" width="150" height="50" rx="5" class="box-b"/>
<text x="125" y="120" class="b" text-anchor="middle">unenrolled</text>
<rect x="330" y="90" width="150" height="50" rx="5" class="box-b dash"/>
<text x="405" y="120" class="b" text-anchor="middle">pending</text>
<rect x="610" y="90" width="150" height="50" rx="5" class="box-b dash"/>
<text x="685" y="120" class="b" text-anchor="middle">enrolled</text>
<rect x="890" y="90" width="150" height="50" rx="5" class="box dash"/>
<text x="965" y="120" class="b" text-anchor="middle">retired</text>
<circle cx="24" cy="115" r="5" fill="#0B0B0A"/>
<path d="M29,115 L50,115" class="ln" marker-end="url(#host-lifecycle-ak)"/>
<path d="M200,115 L330,115" class="ln" marker-end="url(#host-lifecycle-ak)"/>
<text x="265" y="108" class="t-m lbl" text-anchor="middle">post request</text>
<path d="M480,115 L610,115" class="ln" marker-end="url(#host-lifecycle-ak)"/>
<text x="545" y="108" class="t-m lbl" text-anchor="middle">approve (key hash)</text>
<path d="M760,115 L890,115" class="ln" marker-end="url(#host-lifecycle-ak)"/>
<text x="825" y="108" class="t-m lbl" text-anchor="middle">revoke, deny row</text>
<path d="M405,140 L405,180 L125,180 L125,140" class="ln-d" marker-end="url(#host-lifecycle-ak)"/>
<text x="265" y="174" class="t-m lbl" text-anchor="middle">request expired</text>
<path d="M650,90 L650,62 L720,62 L720,90" class="ln" marker-end="url(#host-lifecycle-ak)"/>
<text x="685" y="56" class="t-m lbl" text-anchor="middle">renew at half life</text>
<rect x="20" y="240" width="1160" height="380" rx="6" class="box-p"/>
<text x="36" y="262" class="b" text-anchor="start">per service (on an enrolled host)</text>
<rect x="60" y="320" width="120" height="50" rx="5" class="box"/>
<text x="120" y="350" class="b" text-anchor="middle">absent</text>
<rect x="270" y="320" width="120" height="50" rx="5" class="box dash"/>
<text x="330" y="350" class="b" text-anchor="middle">installing</text>
<rect x="480" y="320" width="120" height="50" rx="5" class="box"/>
<text x="540" y="350" class="b" text-anchor="middle">running</text>
<rect x="690" y="320" width="120" height="50" rx="5" class="box"/>
<text x="750" y="350" class="b" text-anchor="middle">updating</text>
<rect x="900" y="320" width="120" height="50" rx="5" class="box"/>
<text x="960" y="350" class="b" text-anchor="middle">halted</text>
<rect x="270" y="470" width="120" height="50" rx="5" class="box dash"/>
<text x="330" y="500" class="b" text-anchor="middle">removing</text>
<rect x="480" y="470" width="120" height="50" rx="5" class="box"/>
<text x="540" y="500" class="b" text-anchor="middle">pinned</text>
<rect x="690" y="470" width="120" height="50" rx="5" class="box"/>
<text x="750" y="500" class="b" text-anchor="middle">rolled back</text>
<circle cx="40" cy="345" r="5" fill="#0B0B0A"/>
<path d="M45,345 L60,345" class="ln" marker-end="url(#host-lifecycle-ak)"/>
<path d="M180,345 L270,345" class="ln" marker-end="url(#host-lifecycle-ak)"/>
<text x="225" y="338" class="t-m lbl" text-anchor="middle">Install order</text>
<path d="M390,345 L480,345" class="ln" marker-end="url(#host-lifecycle-ak)"/>
<text x="435" y="338" class="t-m lbl" text-anchor="middle">Succeeded</text>
<path d="M600,338 L690,338" class="ln" marker-end="url(#host-lifecycle-ak)"/>
<text x="645" y="331" class="t-m lbl" text-anchor="middle">update order</text>
<path d="M690,358 L600,358" class="ln-d" marker-end="url(#host-lifecycle-ak)"/>
<text x="645" y="372" class="t-m lbl" text-anchor="middle">Succeeded</text>
<path d="M810,345 L900,345" class="ln" marker-end="url(#host-lifecycle-ak)"/>
<text x="855" y="338" class="t-m lbl" text-anchor="middle">exit 76</text>
<path d="M960,320 L960,268 L500,268 L500,320" class="ln-d" marker-end="url(#host-lifecycle-ak)"/>
<text x="730" y="262" class="t-m lbl" text-anchor="middle">operator clears</text>
<path d="M770,320 L770,300 L570,300 L570,320" class="ln-od" marker-end="url(#host-lifecycle-ao)"/>
<text x="670" y="294" class="t-m lbl" text-anchor="middle">Failed (after commit), coordinator may roll back</text>
<path d="M750,370 L750,470" class="ln" marker-end="url(#host-lifecycle-ak)"/>
<text x="758" y="425" class="t-m lbl" text-anchor="start">Failed before commit</text>
<path d="M700,470 L590,370" class="ln-d" marker-end="url(#host-lifecycle-ak)"/>
<text x="678" y="463" class="t-m lbl" text-anchor="end">same release</text>
<path d="M520,370 L520,470" class="ln" marker-end="url(#host-lifecycle-ak)"/>
<text x="514" y="425" class="t-m lbl" text-anchor="end">pin</text>
<path d="M560,470 L560,370" class="ln-d" marker-end="url(#host-lifecycle-ak)"/>
<text x="568" y="425" class="t-m lbl" text-anchor="start">unpin</text>
<path d="M490,370 L490,400 L330,400 L330,470" class="ln" marker-end="url(#host-lifecycle-ak)"/>
<text x="410" y="394" class="t-m lbl" text-anchor="middle">Uninstall order</text>
<path d="M270,495 L100,495 L100,370" class="ln" marker-end="url(#host-lifecycle-ak)"/>
<text x="185" y="489" class="t-m lbl" text-anchor="middle">service gone</text>
<rect x="30" y="633" width="22" height="14" rx="3" class="box-o"/>
<text x="60" y="645" class="t-m" text-anchor="start">runs as root</text>
<rect x="159.538" y="633" width="22" height="14" rx="3" class="box-b"/>
<text x="189.538" y="645" class="t-m" text-anchor="start">parses network input</text>
<rect x="340.769" y="633" width="22" height="14" rx="3" class="box"/>
<text x="370.769" y="645" class="t-m" text-anchor="start">local only</text>
<rect x="509.077" y="633" width="22" height="14" rx="3" class="box-p"/>
<text x="539.077" y="645" class="t-m" text-anchor="start">dashed outline: designed, not built</text>
<path d="M787.231,641 L817.231,641" class="ln" marker-end="url(#host-lifecycle-ak)"/>
<text x="825.231" y="645" class="t-m" text-anchor="start">request</text>
<path d="M892.462,641 L922.462,641" class="ln-d" marker-end="url(#host-lifecycle-ak)"/>
<text x="930.462" y="645" class="t-m" text-anchor="start">reply or report</text>
</svg>
