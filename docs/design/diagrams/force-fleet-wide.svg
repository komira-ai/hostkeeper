<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Force across the fleet: the operator's Releases.Force reaches the coordinator, which orders every targeted host at once; on each host the daemon fetches and verifies if needed, stops the units, switches current, links, starts the units and reports, with no hook.">
<title>Force across the fleet</title>
<desc>One Releases.Force call from the operator makes the coordinator order a hookless force on every targeted host in the same heartbeat round, ignoring the one-live-update slot. Each daemon fetches and verifies the target version if it is not kept, stops the service's units, switches the current link, links units and files, starts the units and reports. No hook runs, and running work may be cut.</desc>
<defs><marker id="force-fleet-wide-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="force-fleet-wide-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.dash{stroke-dasharray:6 4}
.tb{stroke:#FD4F1D;fill:none;stroke-width:2.2;stroke-dasharray:8 5}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-od{stroke:#FD4F1D;fill:none;stroke-width:1.6;stroke-dasharray:6 4}
.life{stroke:#5A5A57;stroke-width:1;stroke-dasharray:2 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="1200" height="720" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16" text-anchor="start">Force: one coordinator call switches the version on every targeted host, with no hook</text>
<rect x="668" y="108" width="520" height="470" rx="6" class="box" style="stroke:#FD4F1D;stroke-width:1.4"/>
<rect x="654" y="94" width="520" height="470" rx="6" class="box" style="stroke:#FD4F1D;stroke-width:1.4"/>
<rect x="640" y="80" width="520" height="470" rx="6" fill="#FFFFFF" class="box-t"/>
<text x="656" y="102" class="b" text-anchor="start">Host (each target, in the same heartbeat round)</text>
<rect x="20" y="90" width="180" height="70" rx="5" class="box"/>
<text x="110" y="112" class="b" text-anchor="middle">Operator</text>
<text x="110" y="130" class="t-m" text-anchor="middle">Releases.Force: service,</text>
<text x="110" y="146" class="t-m" text-anchor="middle">version, reason, targets</text>
<path d="M200,125 L250,125" class="ln" marker-end="url(#force-fleet-wide-ak)"/>
<rect x="250" y="70" width="270" height="130" rx="5" class="box-b"/>
<text x="385" y="90" class="b" text-anchor="middle">Coordinator</text>
<text x="385" y="112" class="t-m" text-anchor="middle">targets: the fleet, a role or hosts</text>
<text x="385" y="128" class="t-m" text-anchor="middle">marks the version it leaves bad</text>
<text x="385" y="144" class="t-m" text-anchor="middle">passes the one-live-update slot,</text>
<text x="385" y="160" class="t-m" text-anchor="middle">canary, bake, deferral and halts</text>
<text x="385" y="176" class="t-m" text-anchor="middle">audit log: token, targets, slot passed</text>
<path d="M520,130 L660,130" class="ln" marker-end="url(#force-fleet-wide-ak)"/>
<text x="590" y="116" class="t-m lbl" text-anchor="middle">force S V D</text>
<text x="590" y="146" class="t-m lbl" text-anchor="middle">every target</text>
<path d="M660,176 L520,176" class="ln-d" marker-end="url(#force-fleet-wide-ak)"/>
<text x="590" y="170" class="t-m lbl" text-anchor="middle">Forced verdict</text>
<rect x="660" y="112" width="300" height="420" rx="5" class="box-o"/>
<text x="810" y="132" class="b" text-anchor="middle">Daemon (root): verb force</text>
<circle cx="680" cy="162" r="9" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="680" y="166" class="b" font-size="12" text-anchor="middle">1</text>
<text x="696" y="166" class="t-m" text-anchor="start">fetch, verify, unpack if not kept here;</text>
<text x="696" y="182" class="t-m" text-anchor="start">check manifest and paths; failure: no change</text>
<circle cx="680" cy="214" r="9" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="680" y="218" class="b" font-size="12" text-anchor="middle">2</text>
<text x="696" y="218" class="t-m" text-anchor="start">a step of this service runs: set forced,</text>
<text x="696" y="234" class="t-m" text-anchor="start">stop its unit, runner yields, no queueing</text>
<circle cx="680" cy="266" r="9" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="680" y="270" class="b" font-size="12" text-anchor="middle">3</text>
<text x="696" y="270" class="t-m" text-anchor="start">service lock only, never the step lock;</text>
<text x="696" y="286" class="t-m" text-anchor="start">close record forced_over, write force record</text>
<circle cx="680" cy="318" r="9" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="680" y="322" class="b" font-size="12" text-anchor="middle">4</text>
<text x="696" y="322" class="t-m" text-anchor="start">stop the current manifest's run units</text>
<text x="696" y="338" class="t-m" text-anchor="start">work may be cut: no drain</text>
<circle cx="680" cy="370" r="9" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="680" y="374" class="b" font-size="12" text-anchor="middle">5</text>
<text x="696" y="374" class="t-m" text-anchor="start">switch current atomically,</text>
<text x="696" y="390" class="t-m" text-anchor="start">link units and files/</text>
<circle cx="680" cy="422" r="9" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="680" y="426" class="b" font-size="12" text-anchor="middle">6</text>
<text x="696" y="426" class="t-m" text-anchor="start">daemon-reload, start the target's units</text>
<circle cx="680" cy="474" r="9" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="680" y="478" class="b" font-size="12" text-anchor="middle">7</text>
<text x="696" y="478" class="t-m" text-anchor="start">report Forced in the next heartbeat</text>
<text x="696" y="494" class="t-m" text-anchor="start">nothing waits, nothing rolls back</text>
<text x="810" y="520" class="b" text-anchor="middle">no hook runs, on any step</text>
<text x="1070" y="132" class="b" text-anchor="middle">packages/&lt;service&gt;/</text>
<rect x="990" y="146" width="160" height="40" rx="4" class="box-b"/>
<text x="1070" y="163" class="b" text-anchor="middle">1.5.0</text>
<text x="1070" y="178" class="t-m" text-anchor="middle">current (broken)</text>
<rect x="990" y="198" width="160" height="40" rx="4" class="box-o"/>
<text x="1070" y="215" class="b" text-anchor="middle">1.4.2</text>
<text x="1070" y="230" class="t-m" text-anchor="middle">previous: the target</text>
<rect x="990" y="250" width="160" height="40" rx="4" class="box-b"/>
<text x="1070" y="267" class="b" text-anchor="middle">1.4.1</text>
<text x="1070" y="282" class="t-m" text-anchor="middle">kept (keep_versions)</text>
<path d="M960,378 L990,218" class="ln-o" marker-end="url(#force-fleet-wide-ao)"/>
<text x="975" y="300" class="t-m lbl" text-anchor="middle">current</text>
<text x="975" y="314" class="t-m lbl" text-anchor="middle">moves</text>
<rect x="990" y="360" width="160" height="64" rx="4" class="box"/>
<text x="1070" y="382" class="b" text-anchor="middle">Service units</text>
<text x="1070" y="400" class="t-m" text-anchor="middle">stop (4), then start (6)</text>
<text x="1070" y="416" class="t-m" text-anchor="middle">from each manifest</text>
<path d="M960,424 L990,412" class="ln" marker-end="url(#force-fleet-wide-ak)"/>
<rect x="990" y="450" width="160" height="40" rx="4" class="box-p"/>
<text x="1070" y="474" class="t-m" text-anchor="middle">Hook: not run</text>
<text x="900" y="604" class="t-m" text-anchor="middle">Hosts 2 to N: the same seven steps, in the same round</text>
<rect x="20" y="618" width="1160" height="34" rx="4" class="box"/>
<text x="600" y="640" class="b" text-anchor="middle">The one sanctioned exception to "drains never cut work": a force may cut running work. A failed fetch or verify (step 2) cuts nothing.</text>
<text x="600" y="672" class="t-m" text-anchor="middle">Break-glass, not the plan: if the daemon itself is broken or the host is off the network, root on the host switches current by hand;</text>
<text x="600" y="688" class="t-m" text-anchor="middle">hostkeeper's self-update already rolls itself back if the new binary does not start.</text>
<rect x="30" y="700" width="22" height="14" rx="3" class="box-o"/><text x="60" y="712" class="t-m" text-anchor="start">runs as root</text>
<rect x="162.862" y="700" width="22" height="14" rx="3" class="box-b"/><text x="192.862" y="712" class="t-m" text-anchor="start">parses network input</text>
<rect x="349.631" y="700" width="22" height="14" rx="3" class="box"/><text x="379.631" y="712" class="t-m" text-anchor="start">passive or external</text>
<rect x="522.923" y="700" width="22" height="14" rx="3" class="box-p"/><text x="552.923" y="712" class="t-m" text-anchor="start">dashed outline: not run on a force</text>
<path d="M810.769,708 L840.769,708" class="ln" marker-end="url(#force-fleet-wide-ak)"/><text x="848.769" y="712" class="t-m" text-anchor="start">request</text>
<path d="M917.938,708 L947.938,708" class="ln-d" marker-end="url(#force-fleet-wide-ak)"/><text x="955.938" y="712" class="t-m" text-anchor="start">reply or report</text>
</svg>
