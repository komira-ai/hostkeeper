<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-label="Time runs down the page across the operator client, coordinator, relay and the Mac. The broker carries Screen Sharing's RFB bytes unchanged and holds no Mac credential.">
<title>Open a Mac screen: a plain TCP relay, the Mac's own login</title>
<desc>Time runs down the page across the operator client, coordinator, relay and the Mac. The broker carries Screen Sharing's RFB bytes unchanged and holds no Mac credential.</desc>
<defs><marker id="console-mac-screen-sequence-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="console-mac-screen-sequence-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.dash{stroke-dasharray:6 4}
.tb{stroke:#FD4F1D;fill:none;stroke-width:2.2;stroke-dasharray:8 5}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-od{stroke:#FD4F1D;fill:none;stroke-width:1.6;stroke-dasharray:6 4}
.life{stroke:#5A5A57;stroke-width:1;stroke-dasharray:2 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="1200" height="570" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16" text-anchor="start">Open a Mac screen: a plain TCP relay, the Mac's own login</text>
<path d="M130,76 L130,540" class="life"/>
<path d="M400,76 L400,540" class="life"/>
<path d="M680,76 L680,540" class="life"/>
<path d="M960,76 L960,540" class="life"/>
<rect x="55" y="44" width="150" height="32" rx="5" class="box"/>
<text x="130" y="65" class="b" text-anchor="middle">Operator client</text>
<rect x="325" y="44" width="150" height="32" rx="5" class="box-b"/>
<text x="400" y="65" class="b" text-anchor="middle">Coordinator</text>
<rect x="605" y="44" width="150" height="32" rx="5" class="box-o"/>
<text x="680" y="65" class="b" text-anchor="middle">Relay (lab host)</text>
<rect x="885" y="44" width="150" height="32" rx="5" class="box"/>
<text x="960" y="65" class="b" text-anchor="middle">Mac (TCP 5900)</text>
<path d="M130,110 L400,110" class="ln" marker-end="url(#console-mac-screen-sequence-ak)"/>
<circle cx="144" cy="96" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="144" y="100" class="b" font-size="12" text-anchor="middle">1</text>
<text x="265" y="90" class="t-m lbl" text-anchor="middle">Console/Open(mac, screen) + token</text>
<rect x="290" y="136" width="220" height="28" rx="5" class="box-o"/>
<text x="400" y="154" class="t-m" text-anchor="middle">token, console cap, audit line</text>
<circle cx="275" cy="150" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="275" y="154" class="b" font-size="12" text-anchor="middle">2</text>
<path d="M400,190 L130,190" class="ln-d" marker-end="url(#console-mac-screen-sequence-ak)"/>
<circle cx="386" cy="176" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="386" y="180" class="b" font-size="12" text-anchor="middle">3</text>
<text x="265" y="170" class="t-m lbl" text-anchor="middle">ticket</text>
<path d="M130,230 L400,230" class="ln" marker-end="url(#console-mac-screen-sequence-ak)"/>
<circle cx="144" cy="216" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="144" y="220" class="b" font-size="12" text-anchor="middle">4</text>
<text x="265" y="210" class="t-m lbl" text-anchor="middle">attach + ticket (Upgrade)</text>
<path d="M400,270 L680,270" class="ln-d" marker-end="url(#console-mac-screen-sequence-ak)"/>
<circle cx="414" cy="256" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="414" y="260" class="b" font-size="12" text-anchor="middle">5</text>
<text x="540" y="250" class="t-m lbl" text-anchor="middle">open cmd (held poll)</text>
<rect x="570" y="296" width="220" height="28" rx="5" class="box-o"/>
<text x="680" y="314" class="t-m" text-anchor="middle">data MAC -&gt; address</text>
<circle cx="555" cy="310" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="555" y="314" class="b" font-size="12" text-anchor="middle">6</text>
<path d="M680,350 L960,350" class="ln" marker-end="url(#console-mac-screen-sequence-ak)"/>
<circle cx="694" cy="336" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="694" y="340" class="b" font-size="12" text-anchor="middle">7</text>
<text x="820" y="330" class="t-m lbl" text-anchor="middle">TCP connect, read RFB 003.889</text>
<path d="M680,390 L400,390" class="ln" marker-end="url(#console-mac-screen-sequence-ak)"/>
<circle cx="666" cy="376" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="666" y="380" class="b" font-size="12" text-anchor="middle">8</text>
<text x="540" y="370" class="t-m lbl" text-anchor="middle">data connection (Upgrade)</text>
<path d="M130,430 L960,430" class="ln" marker-end="url(#console-mac-screen-sequence-ak)"/>
<circle cx="144" cy="416" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="144" y="420" class="b" font-size="12" text-anchor="middle">9</text>
<text x="545" y="410" class="t-m lbl" text-anchor="middle">viewer on 127.0.0.1:port: RFB + Mac login</text>
<path d="M960,470 L130,470" class="ln-d" marker-end="url(#console-mac-screen-sequence-ak)"/>
<circle cx="946" cy="456" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="946" y="460" class="b" font-size="12" text-anchor="middle">10</text>
<text x="545" y="450" class="t-m lbl" text-anchor="middle">framebuffer updates (black until enabled)</text>
<path d="M130,510 L400,510" class="ln" marker-end="url(#console-mac-screen-sequence-ak)"/>
<circle cx="144" cy="496" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="144" y="500" class="b" font-size="12" text-anchor="middle">11</text>
<text x="265" y="490" class="t-m lbl" text-anchor="middle">close: close line</text>
</svg>
