<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Components and trust boundaries: coordinator, agent, root part, hook, service, signer, operator and CI, with the trust boundary drawn at each crossing.">
<title>Components and trust boundaries</title>
<desc>Operator and CI reach the coordinator over TLS; the coordinator talks to one agent per host over mutual TLS and asks a separate signer for certificates. On the host the agent runs unprivileged and hands steps to the root part over a socket, and the root part runs each hook with only its declared rights.</desc>
<defs><marker id="components-and-trust-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="components-and-trust-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.dash{stroke-dasharray:6 4}
.tb{stroke:#FD4F1D;fill:none;stroke-width:2.2;stroke-dasharray:8 5}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-od{stroke:#FD4F1D;fill:none;stroke-width:1.6;stroke-dasharray:6 4}
.life{stroke:#5A5A57;stroke-width:1;stroke-dasharray:2 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="1200" height="800" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16" text-anchor="start">Components and trust boundaries: what crosses each line, and who may send it</text>
<rect x="30" y="80" width="200" height="70" rx="5" class="box"/>
<text x="130" y="99" class="b" text-anchor="middle">Operator</text>
<text x="130" y="117" class="t-m" text-anchor="middle">person with a token</text>
<rect x="30" y="200" width="200" height="70" rx="5" class="box"/>
<text x="130" y="219" class="b" text-anchor="middle">CI release job</text>
<text x="130" y="237" class="t-m" text-anchor="middle">sets the desired version</text>
<rect x="30" y="560" width="200" height="70" rx="5" class="box"/>
<text x="130" y="579" class="b" text-anchor="middle">Local root shell</text>
<text x="130" y="597" class="t-m" text-anchor="middle">uid 0 on the host</text>
<rect x="340" y="80" width="260" height="220" rx="5" class="box-b"/>
<text x="470" y="99" class="b" text-anchor="middle">Coordinator</text>
<rect x="356" y="118" width="228" height="40" rx="5" class="box-b"/>
<text x="470" y="143" class="b" text-anchor="middle">decide()</text>
<rect x="356" y="168" width="228" height="40" rx="5" class="box-b"/>
<text x="470" y="193" class="b" text-anchor="middle">desired + ops files</text>
<rect x="356" y="218" width="228" height="40" rx="5" class="box-b"/>
<text x="470" y="243" class="b" text-anchor="middle">OIDC verifier</text>
<rect x="340" y="360" width="260" height="90" rx="5" class="box-o dash"/>
<text x="470" y="379" class="b" text-anchor="middle">Signer (hostkeeper-ca)</text>
<text x="470" y="397" class="t-m" text-anchor="middle">key readable by its owner only</text>
<path d="M470,300 L470,360" class="ln" marker-end="url(#components-and-trust-ak)"/>
<text x="478" y="326" class="t-m lbl" text-anchor="start">sign agent,</text>
<text x="478" y="341" class="t-m lbl" text-anchor="start">service, server</text>
<rect x="750" y="60" width="430" height="640" rx="6" class="box-t"/>
<text x="766" y="84" class="b" text-anchor="start">Host</text>
<rect x="775" y="90" width="190" height="70" rx="5" class="box"/>
<rect x="775" y="90" width="190" height="22" rx="5" class="box-b"/>
<text x="870" y="105" class="t-m" text-anchor="middle">parses network data</text>
<text x="870" y="138" class="b" text-anchor="middle">Agent (user hostkeeper)</text>
<text x="870" y="153" class="t-m" text-anchor="middle">unprivileged</text>
<line x1="750" y1="199" x2="1180" y2="199" class="tb"/>
<text x="1170" y="193" class="b lbl" text-anchor="end">privilege</text>
<rect x="775" y="190" width="220" height="18" rx="3" class="box-o"/>
<text x="885" y="203" class="t-m" text-anchor="middle">root.sock 0660, peer uid checked</text>
<rect x="775" y="208" width="190" height="232" rx="5" class="box-o"/>
<text x="870" y="232" class="b" text-anchor="middle">Root part (root)</text>
<text x="870" y="250" class="t-m" text-anchor="middle">verifies and seals releases</text>
<text x="870" y="266" class="t-m" text-anchor="middle">writes the step record</text>
<text x="870" y="282" class="t-m" text-anchor="middle">starts hooks with declared</text>
<text x="870" y="298" class="t-m" text-anchor="middle">rights only</text>
<path d="M870,160 L870,190" class="ln" marker-end="url(#components-and-trust-ak)"/>
<text x="880" y="181" class="t-m lbl" text-anchor="start">RunStep, Status</text>
<rect x="660" y="432" width="160" height="18" rx="3" class="box-o"/>
<text x="740" y="445" class="t-m" text-anchor="middle">admin.sock 0600, uid 0</text>
<path d="M230,595 L636,595 L636,441 L660,441" class="ln" marker-end="url(#components-and-trust-ak)"/>
<text x="626" y="520" class="t-m lbl" text-anchor="end">uid 0 only</text>
<line x1="750" y1="480" x2="1180" y2="480" class="tb"/>
<text x="1170" y="474" class="b lbl" text-anchor="end">rights = declaration</text>
<path d="M870,440 L870,520" class="ln" marker-end="url(#components-and-trust-ak)"/>
<text x="878" y="466" class="t-m lbl" text-anchor="start">systemd-run step</text>
<rect x="775" y="520" width="190" height="70" rx="5" class="box"/>
<text x="870" y="539" class="b" text-anchor="middle">Hook (declared user)</text>
<text x="870" y="557" class="t-m" text-anchor="middle">transient unit,</text>
<text x="870" y="573" class="t-m" text-anchor="middle">declared rights only</text>
<path d="M870,590 L870,630" class="ln" marker-end="url(#components-and-trust-ak)"/>
<text x="878" y="615" class="t-m lbl" text-anchor="start">start, stop, drain</text>
<rect x="775" y="630" width="190" height="50" rx="5" class="box"/>
<text x="870" y="660" class="b" text-anchor="middle">Service</text>
<path d="M1030,239 v62 a67.5,9 0 0 0 135,0 v-62 a67.5,9 0 0 0 -135,0 z" class="box-b"/>
<ellipse cx="1097.5" cy="239" rx="67.5" ry="9" class="box-b"/>
<text x="1097.5" y="257" class="b" text-anchor="middle">Release tree</text>
<text x="1097.5" y="274" class="t-m" text-anchor="middle">(0555, sealed)</text>
<path d="M1030,359 v62 a67.5,9 0 0 0 135,0 v-62 a67.5,9 0 0 0 -135,0 z" class="box-b"/>
<ellipse cx="1097.5" cy="359" rx="67.5" ry="9" class="box-b"/>
<text x="1097.5" y="377" class="b" text-anchor="middle">/etc/updater.d</text>
<text x="1097.5" y="394" class="t-m" text-anchor="middle">(root-owned)</text>
<path d="M965,270 L1030,270" class="ln" marker-end="url(#components-and-trust-ak)"/>
<text x="997" y="263" class="t-m lbl" text-anchor="middle">verify, seal</text>
<path d="M965,400 L1030,400" class="ln" marker-end="url(#components-and-trust-ak)"/>
<text x="997" y="377" class="t-m lbl" text-anchor="middle">install</text>
<text x="997" y="392" class="t-m lbl" text-anchor="middle">verified</text>
<line x1="612" y1="62" x2="612" y2="700" class="tb"/>
<text x="612" y="54" class="b lbl" text-anchor="middle">network</text>
<path d="M230,115 L340,115" class="ln" marker-end="url(#components-and-trust-ak)"/>
<text x="285" y="94" class="t-m lbl" text-anchor="middle">operator token</text>
<text x="285" y="109" class="t-m lbl" text-anchor="middle">TLS</text>
<path d="M230,238 L356,238" class="ln" marker-end="url(#components-and-trust-ak)"/>
<text x="285" y="216" class="t-m lbl" text-anchor="middle">OIDC token</text>
<text x="285" y="231" class="t-m lbl" text-anchor="middle">TLS</text>
<path d="M600,125 L775,125" class="ln" marker-end="url(#components-and-trust-ak)"/>
<text x="684" y="119" class="t-m lbl" text-anchor="middle">mutual TLS heartbeat</text>
<path d="M775,150 L600,150" class="ln-d" marker-end="url(#components-and-trust-ak)"/>
<text x="684" y="167" class="t-m lbl" text-anchor="middle">version only</text>
<text x="600" y="740" class="b" text-anchor="middle">Coordinator sends a service and a version. Never a URL, path or command.</text>
<rect x="30" y="768" width="22" height="14" rx="3" class="box-o"/>
<text x="60" y="780" class="t-m" text-anchor="start">runs as root</text>
<rect x="159.538" y="768" width="22" height="14" rx="3" class="box-b"/>
<text x="189.538" y="780" class="t-m" text-anchor="start">parses network input</text>
<rect x="340.769" y="768" width="22" height="14" rx="3" class="box"/>
<text x="370.769" y="780" class="t-m" text-anchor="start">unprivileged local</text>
<rect x="509.077" y="768" width="22" height="14" rx="3" class="box-p"/>
<text x="539.077" y="780" class="t-m" text-anchor="start">dashed outline: designed, not built</text>
<path d="M787.231,776 L817.231,776" class="ln-d" marker-end="url(#components-and-trust-ak)"/>
<text x="825.231" y="780" class="t-m" text-anchor="start">reply or report</text>
<line x1="944.154" y1="776" x2="974.154" y2="776" class="tb"/>
<text x="982.154" y="780" class="t-m" text-anchor="start">trust boundary</text>
</svg>
