<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="UI, CLI and API: the generated CLI and the static web app both call the coordinator's HTTP/JSON gateway with the operator token. The coordinator has no UI-specific code.">
<title>UI, CLI and API</title>
<desc>The operator uses the generated command-line tool or a static web app in the browser. Both call the same operator API through the coordinator's private HTTP/JSON gateway with the operator's token, and every call is audited. The coordinator serves the app's static files from the same listener and nothing else for the UI.</desc>
<defs><marker id="ui-api-cli-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="ui-api-cli-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.dash{stroke-dasharray:6 4}
.tb{stroke:#FD4F1D;fill:none;stroke-width:2.2;stroke-dasharray:8 5}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-od{stroke:#FD4F1D;fill:none;stroke-width:1.6;stroke-dasharray:6 4}
.life{stroke:#5A5A57;stroke-width:1;stroke-dasharray:2 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="1200" height="540" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16" text-anchor="start">The UI is a front end for the API: the CLI and the web app make the same calls (the UI is designed, not built)</text>
<rect x="30" y="150" width="200" height="70" rx="5" class="box"/>
<text x="130" y="169" class="b" text-anchor="middle">Operator</text>
<text x="130" y="187" class="t-m" text-anchor="middle">person with a token</text>
<rect x="300" y="80" width="230" height="74" rx="5" class="box"/>
<text x="415" y="99" class="b" text-anchor="middle">CLI (hostkeeper ctl)</text>
<text x="415" y="117" class="t-m" text-anchor="middle">generated from the API</text>
<text x="415" y="135" class="t-m" text-anchor="middle">schema (B10)</text>
<rect x="300" y="200" width="230" height="74" rx="5" class="box-p"/>
<text x="415" y="219" class="b" text-anchor="middle">Web app (in the browser)</text>
<text x="415" y="237" class="t-m" text-anchor="middle">static files, client-side</text>
<text x="415" y="255" class="t-m" text-anchor="middle">token held in page memory</text>
<path d="M230,175 L300,125" class="ln" marker-end="url(#ui-api-cli-ak)"/>
<path d="M230,195 L300,240" class="ln" marker-end="url(#ui-api-cli-ak)"/>
<line x1="565" y1="60" x2="565" y2="470" class="tb"/>
<text x="565" y="52" class="b lbl" text-anchor="middle">private network</text>
<rect x="600" y="60" width="570" height="410" rx="5" class="box-b"/>
<text x="616" y="82" class="b" text-anchor="start">Coordinator</text>
<rect x="630" y="100" width="230" height="70" rx="5" class="box-b"/>
<text x="745" y="119" class="b" text-anchor="middle">HTTP/JSON gateway</text>
<text x="745" y="137" class="t-m" text-anchor="middle">private listener, TLS</text>
<text x="745" y="155" class="t-m" text-anchor="middle">bearer token (operator or CI)</text>
<rect x="920" y="100" width="230" height="110" rx="5" class="box-b"/>
<text x="1035" y="119" class="b" text-anchor="middle">Operator API</text>
<text x="1035" y="137" class="t-m" text-anchor="middle">protobuf services; one</text>
<text x="1035" y="155" class="t-m" text-anchor="middle">method per action; the</text>
<text x="1035" y="173" class="t-m" text-anchor="middle">method list is section 4.8</text>
<path d="M860,135 L920,135" class="ln" marker-end="url(#ui-api-cli-ak)"/>
<rect x="920" y="260" width="230" height="60" rx="5" class="box"/>
<text x="1035" y="279" class="b" text-anchor="middle">Audit log (append-only)</text>
<text x="1035" y="297" class="t-m" text-anchor="middle">one entry per call,</text>
<text x="1035" y="315" class="t-m" text-anchor="middle">token name recorded</text>
<path d="M1035,210 L1035,260" class="ln" marker-end="url(#ui-api-cli-ak)"/>
<rect x="630" y="260" width="230" height="60" rx="5" class="box"/>
<text x="745" y="279" class="b" text-anchor="middle">State files</text>
<text x="745" y="297" class="t-m" text-anchor="middle">desired, rollout, ops (holds)</text>
<rect x="630" y="380" width="520" height="64" rx="5" class="box-p"/>
<text x="890" y="399" class="b" text-anchor="middle">Static files</text>
<text x="890" y="417" class="t-m" text-anchor="middle">served from this listener: same-origin calls, no CORS;</text>
<text x="890" y="435" class="t-m" text-anchor="middle">the coordinator has no UI handlers, no rendering and no session cookie</text>
<path d="M530,110 L630,125" class="ln" marker-end="url(#ui-api-cli-ak)"/>
<text x="585" y="140" class="t-m lbl" text-anchor="middle">API call, token</text>
<path d="M530,245 L630,150" class="ln" marker-end="url(#ui-api-cli-ak)"/>
<text x="592" y="236" class="t-m lbl" text-anchor="middle">API call, token</text>
<path d="M630,412 L548,274" class="ln-d" marker-end="url(#ui-api-cli-ak)"/>
<text x="545" y="350" class="t-m lbl" text-anchor="end">load the app</text>
<text x="600" y="500" class="b" text-anchor="middle">Every page is a view over API calls and every button is one call. Neither front end reaches a host: only the coordinator's orders do.</text>
</svg>
