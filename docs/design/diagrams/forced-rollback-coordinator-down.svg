<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Forced rollback with the coordinator unreachable: the operator on the host runs activate over the admin socket, the root part takes the step lock, switches links to a kept release, restarts units, writes the pin, and the agent reports pinned when the coordinator returns.">
<title>Forced rollback with the coordinator unreachable</title>
<desc>The operator logs in to the host as root and runs the admin command, which talks to the root part over a root-only socket. The root part switches to a kept release without a trial, and the agent reports the pin to the coordinator once it is reachable again.</desc>
<defs><marker id="forced-rollback-coordinator-down-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="forced-rollback-coordinator-down-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.dash{stroke-dasharray:6 4}
.tb{stroke:#FD4F1D;fill:none;stroke-width:2.2;stroke-dasharray:8 5}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-od{stroke:#FD4F1D;fill:none;stroke-width:1.6;stroke-dasharray:6 4}
.life{stroke:#5A5A57;stroke-width:1;stroke-dasharray:2 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="1200" height="720" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16" text-anchor="start">Forced rollback with the coordinator down: one local command, no network</text>
<rect x="840" y="50" width="300" height="56" rx="5" class="box-p"/>
<text x="990" y="84" class="b" text-anchor="middle">Coordinator (unreachable)</text>
<path d="M1105,60 L1130,96" class="ln-o"/>
<path d="M1130,60 L1105,96" class="ln-o"/>
<rect x="20" y="170" width="180" height="56" rx="5" class="box"/>
<text x="110" y="189" class="b" text-anchor="middle">Operator</text>
<text x="110" y="207" class="t-m" text-anchor="middle">SSH as root</text>
<rect x="260" y="140" width="890" height="500" rx="6" class="box-t"/>
<text x="276" y="162" class="b" text-anchor="start">Host</text>
<path d="M200,198 L300,198" class="ln" marker-end="url(#forced-rollback-coordinator-down-ak)"/>
<text x="250" y="190" class="t-m lbl" text-anchor="middle">ssh, run it</text>
<rect x="300" y="170" width="200" height="56" rx="5" class="box-o"/>
<text x="400" y="189" class="b" text-anchor="middle">hostkeeper admin</text>
<text x="400" y="207" class="t-m" text-anchor="middle">CLI, uid 0</text>
<path d="M400,226 L400,252" class="ln" marker-end="url(#forced-rollback-coordinator-down-ak)"/>
<rect x="300" y="252" width="200" height="18" rx="3" class="box-o"/>
<text x="400" y="265" class="t-m" text-anchor="middle">admin.sock 0600 uid 0</text>
<path d="M400,270 L400,282" class="ln" marker-end="url(#forced-rollback-coordinator-down-ak)"/>
<rect x="300" y="282" width="440" height="140" rx="5" class="box-o"/>
<text x="520" y="302" class="b" text-anchor="middle">Root part (root)</text>
<circle cx="322" cy="318" r="8" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="322" y="322" class="b" font-size="12" text-anchor="middle">1</text>
<text x="340" y="322" class="t-m" text-anchor="start">take step lock, no wait (refuse and name holder if busy)</text>
<circle cx="322" cy="338" r="8" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="322" y="342" class="b" font-size="12" text-anchor="middle">2</text>
<text x="340" y="342" class="t-m" text-anchor="start">check target is a kept release</text>
<circle cx="322" cy="358" r="8" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="322" y="362" class="b" font-size="12" text-anchor="middle">3</text>
<text x="340" y="362" class="t-m" text-anchor="start">switch links, restart declared units</text>
<circle cx="322" cy="378" r="8" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="322" y="382" class="b" font-size="12" text-anchor="middle">4</text>
<text x="340" y="382" class="t-m" text-anchor="start">write hold file, then mark pinned (only with --pin)</text>
<circle cx="322" cy="398" r="8" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="322" y="402" class="b" font-size="12" text-anchor="middle">5</text>
<text x="340" y="402" class="t-m" text-anchor="start">return; no trial, never reverted</text>
<text x="995" y="168" class="b" text-anchor="middle">Kept releases</text>
<rect x="850" y="180" width="290" height="40" rx="4" class="box-b"/>
<text x="995" y="205" text-anchor="middle">current (broken)</text>
<rect x="850" y="226" width="290" height="40" rx="4" class="box-o"/>
<text x="995" y="251" class="b" text-anchor="middle">previous</text>
<rect x="850" y="272" width="290" height="40" rx="4" class="box-b"/>
<text x="995" y="297" text-anchor="middle">pinned</text>
<rect x="850" y="318" width="290" height="40" rx="4" class="box-b"/>
<text x="995" y="343" text-anchor="middle">last_good</text>
<rect x="850" y="364" width="290" height="40" rx="4" class="box-b"/>
<text x="995" y="389" text-anchor="middle">newest 4 others</text>
<path d="M740,300 L850,246" class="ln-o" marker-end="url(#forced-rollback-coordinator-down-ao)"/>
<text x="795" y="322" class="t-m lbl" text-anchor="middle">switch links</text>
<path d="M520,422 L520,470" class="ln" marker-end="url(#forced-rollback-coordinator-down-ak)"/>
<text x="528" y="450" class="t-m lbl" text-anchor="start">hold file</text>
<rect x="300" y="470" width="440" height="60" rx="5" class="box"/>
<text x="520" y="489" class="b" text-anchor="middle">Agent</text>
<text x="520" y="507" class="t-m" text-anchor="middle">reads the hold file every heartbeat and before every order</text>
<path d="M740,500 L1172,500 L1172,78 L1140,78" class="ln-d" marker-end="url(#forced-rollback-coordinator-down-ak)"/>
<text x="950" y="494" class="t-m lbl" text-anchor="middle">pinned, when it returns</text>
<rect x="20" y="660" width="1160" height="34" rx="4" class="box"/>
<text x="600" y="682" class="t-m" text-anchor="middle">Binary that runs the switch: /usr/libexec/hostkeeper/hostkeeper, not writable by any release. The release being left runs nothing.</text>
<rect x="30" y="700" width="22" height="14" rx="3" class="box-o"/>
<text x="60" y="712" class="t-m" text-anchor="start">runs as root</text>
<rect x="162.862" y="700" width="22" height="14" rx="3" class="box-b"/>
<text x="192.862" y="712" class="t-m" text-anchor="start">parses network input</text>
<rect x="349.631" y="700" width="22" height="14" rx="3" class="box"/>
<text x="379.631" y="712" class="t-m" text-anchor="start">unprivileged local</text>
<rect x="522.923" y="700" width="22" height="14" rx="3" class="box-p"/>
<text x="552.923" y="712" class="t-m" text-anchor="start">dashed outline: designed, not built</text>
<path d="M810.769,708 L840.769,708" class="ln" marker-end="url(#forced-rollback-coordinator-down-ak)"/>
<text x="848.769" y="712" class="t-m" text-anchor="start">request</text>
<path d="M917.938,708 L947.938,708" class="ln-d" marker-end="url(#forced-rollback-coordinator-down-ak)"/>
<text x="955.938" y="712" class="t-m" text-anchor="start">reply or report</text>
</svg>
