<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" width="1200" height="1040" role="img" aria-label="Enrollment and remote install: a boot image carrying the daemon and its daemon config with the coordinator address and CA fingerprint but no secret; a pending request; approval by the operator or a Mac nonce; a certificate; an assignment; and an install order that runs through the update path.">
<title>Enrollment and remote install</title>
<desc>A new host makes its own key and asks to enroll; nothing is installed until an operator approves the request and the coordinator signs a short-lived certificate. After that the operator assigns services to the host or its role, and the coordinator sends an install order that the daemon verifies and runs through the same steps as an update.</desc>
<defs><marker id="enrollment-and-remote-install-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="enrollment-and-remote-install-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.dash{stroke-dasharray:6 4}
.tb{stroke:#FD4F1D;fill:none;stroke-width:2.2;stroke-dasharray:8 5}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-od{stroke:#FD4F1D;fill:none;stroke-width:1.6;stroke-dasharray:6 4}
.life{stroke:#5A5A57;stroke-width:1;stroke-dasharray:2 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="1200" height="1040" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16" text-anchor="start">Enrollment and remote install: from a bare image to a running service</text>
<path d="M150,76 L150,990" class="life"/>
<path d="M520,76 L520,990" class="life"/>
<path d="M900,76 L900,990" class="life"/>
<rect x="75" y="44" width="150" height="32" rx="5" class="box-o"/>
<text x="150" y="65" class="b" text-anchor="middle">Boot image / daemon</text>
<rect x="455" y="44" width="130" height="32" rx="5" class="box-b"/>
<text x="520" y="65" class="b" text-anchor="middle">Coordinator</text>
<rect x="845" y="44" width="110" height="32" rx="5" class="box"/>
<text x="900" y="65" class="b" text-anchor="middle">Operator</text>
<circle cx="30" cy="116" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="30" y="120" class="b" font-size="12" text-anchor="middle">1</text>
<rect x="44" y="96" width="330" height="50" rx="5" class="box-b"/>
<text x="209" y="113" class="t-m" text-anchor="middle">image carries the daemon and hostkeeper.toml:</text>
<text x="209" y="129" class="t-m" text-anchor="middle">coordinator, CA hash, signers; no secret</text>
<path d="M150,175 L190,175 L190,195 L150,195" class="ln" marker-end="url(#enrollment-and-remote-install-ak)"/>
<circle cx="134" cy="185" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="134" y="189" class="b" font-size="12" text-anchor="middle">2</text>
<text x="200" y="182" class="t-m lbl" text-anchor="start">make P-256 key,</text>
<text x="200" y="197" class="t-m lbl" text-anchor="start">collect claims</text>
<path d="M150,235 L520,235" class="ln" marker-end="url(#enrollment-and-remote-install-ak)"/>
<circle cx="164" cy="221" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="164" y="225" class="b" font-size="12" text-anchor="middle">3</text>
<text x="182" y="229" class="t-m lbl" text-anchor="start">POST request {csr, claims}</text>
<text x="535" y="229" class="t-m lbl" text-anchor="start">first contact pinned to CA hash</text>
<path d="M520,268 L150,268" class="ln-d" marker-end="url(#enrollment-and-remote-install-ak)"/>
<text x="164" y="262" class="t-m lbl" text-anchor="start">202 pending</text>
<circle cx="300" cy="310" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="300" y="314" class="b" font-size="12" text-anchor="middle">4</text>
<rect x="316" y="292" width="230" height="40" rx="5" class="box-b"/>
<text x="431" y="309" class="t-m" text-anchor="middle">pending: nothing installed;</text>
<text x="431" y="324" class="t-m" text-anchor="middle">cap, then pending_full</text>
<rect x="560" y="292" width="170" height="40" rx="4" class="box-p"/>
<text x="645" y="316" class="t-m" text-anchor="middle">claims are not proof</text>
<path d="M900,390 L520,390" class="ln" marker-end="url(#enrollment-and-remote-install-ak)"/>
<circle cx="534" cy="376" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="534" y="380" class="b" font-size="12" text-anchor="middle">5</text>
<text x="552" y="384" class="t-m lbl" text-anchor="start">approve host id, role, key hash</text>
<text x="890" y="410" class="t-m lbl" text-anchor="end">UI or CLI, operator token</text>
<rect x="440" y="424" width="430" height="44" rx="3" class="box-p"/>
<text x="448" y="442" class="b" text-anchor="start">alt</text>
<text x="474" y="442" class="t-m lbl" text-anchor="start">Mac only: MDM nonce, consumed with the approval</text>
<circle cx="534" cy="516" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="534" y="520" class="b" font-size="12" text-anchor="middle">6</text>
<rect x="552" y="498" width="300" height="40" rx="5" class="box-b"/>
<text x="702" y="515" class="t-m" text-anchor="middle">CA module signs a host certificate</text>
<text x="702" y="530" class="t-m" text-anchor="middle">(7 days), one per request id</text>
<path d="M150,580 L520,580" class="ln" marker-end="url(#enrollment-and-remote-install-ak)"/>
<circle cx="164" cy="566" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="164" y="570" class="b" font-size="12" text-anchor="middle">7</text>
<text x="182" y="574" class="t-m lbl" text-anchor="start">poll with signed nonce</text>
<path d="M520,610 L150,610" class="ln-d" marker-end="url(#enrollment-and-remote-install-ak)"/>
<text x="164" y="604" class="t-m lbl" text-anchor="start">certificate, host id, CA bundle</text>
<path d="M150,682 L520,682" class="ln" marker-end="url(#enrollment-and-remote-install-ak)" marker-start="url(#enrollment-and-remote-install-ak)"/>
<circle cx="164" cy="642" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="164" y="646" class="b" font-size="12" text-anchor="middle">8</text>
<text x="182" y="650" class="t-m lbl" text-anchor="start">mutual TLS heartbeats;</text>
<text x="182" y="665" class="t-m lbl" text-anchor="start">renew at half life</text>
<path d="M900,752 L520,752" class="ln" marker-end="url(#enrollment-and-remote-install-ak)"/>
<circle cx="534" cy="724" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="534" y="728" class="b" font-size="12" text-anchor="middle">9</text>
<text x="552" y="732" class="t-m lbl" text-anchor="start">assign services to the host</text>
<text x="552" y="747" class="t-m lbl" text-anchor="start">or its role (a coordinator change)</text>
<path d="M520,800 L150,800" class="ln-d" marker-end="url(#enrollment-and-remote-install-ak)"/>
<circle cx="164" cy="786" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="164" y="790" class="b" font-size="12" text-anchor="middle">10</text>
<text x="182" y="794" class="t-m lbl" text-anchor="start">order: install S V</text>
<text x="535" y="822" class="t-m lbl" text-anchor="start">only if the one live update slot is free</text>
<path d="M150,870 L190,870 L190,890 L150,890" class="ln" marker-end="url(#enrollment-and-remote-install-ak)"/>
<circle cx="134" cy="880" r="10" fill="#FFFFFF" stroke="#0B0B0A" stroke-width="1.4"/>
<text x="134" y="884" class="b" font-size="12" text-anchor="middle">11</text>
<text x="200" y="866" class="t-m lbl" text-anchor="start">fetch, verify against the trusted signers, unpack</text>
<text x="200" y="882" class="t-m lbl" text-anchor="start">then prepare, cutover, verify, cleanup</text>
<text x="200" y="898" class="t-m lbl" text-anchor="start">(no previous version)</text>
<text x="150" y="950" class="t-m" text-anchor="start">The coordinator cannot make the daemon run code that no trusted signer signed.</text>
<path d="M30,1018 L60,1018" class="ln" marker-end="url(#enrollment-and-remote-install-ak)"/>
<text x="68" y="1022" class="t-m" text-anchor="start">request</text>
<path d="M130,1018 L160,1018" class="ln-d" marker-end="url(#enrollment-and-remote-install-ak)"/>
<text x="168" y="1022" class="t-m" text-anchor="start">reply or report</text>
</svg>
