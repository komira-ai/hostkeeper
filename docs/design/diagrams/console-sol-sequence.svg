<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 674" width="1200" height="674" role="img" aria-label="Time runs down the page across the browser, coordinator, ipmitool and the BMC. The audit line is written before the device is contacted; the MAC check runs in the same IPMI session as the console.">
<title>Console open: from the Console link to the first byte of the node's serial port</title>
<desc>Time runs down the page across the browser, coordinator, ipmitool and the BMC. The audit line is written before the device is contacted; the MAC check runs in the same IPMI session as the console.</desc>
<defs><marker id="console-sol-sequence-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.dash{stroke-dasharray:6 4}
.tb{stroke:#FD4F1D;fill:none;stroke-width:2.2;stroke-dasharray:8 5}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-od{stroke:#FD4F1D;fill:none;stroke-width:1.6;stroke-dasharray:6 4}
.life{stroke:#5A5A57;stroke-width:1;stroke-dasharray:2 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="1200" height="674" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16" text-anchor="start">Console open: from the Console link to the first byte of the node's serial port</text>
<path d="M150,92 L150,634" class="life"/>
<path d="M450,92 L450,634" class="life"/>
<path d="M750,92 L750,634" class="life"/>
<path d="M1050,92 L1050,634" class="life"/>
<rect x="40" y="44" width="220" height="48" rx="5" class="box"/>
<text x="150" y="64" class="b" text-anchor="middle">Operator's browser</text>
<text x="150" y="82" class="t-m" text-anchor="middle">the web UI page</text>
<rect x="340" y="44" width="220" height="48" rx="5" class="box-b"/>
<text x="450" y="64" class="b" text-anchor="middle">Coordinator</text>
<text x="450" y="82" class="t-m" text-anchor="middle">operator API + console module</text>
<rect x="640" y="44" width="220" height="48" rx="5" class="box-p"/>
<text x="750" y="64" class="b" text-anchor="middle">ipmitool</text>
<text x="750" y="82" class="t-m" text-anchor="middle">child of the coordinator</text>
<rect x="940" y="44" width="220" height="48" rx="5" class="box"/>
<text x="1050" y="64" class="b" text-anchor="middle">BMC</text>
<text x="1050" y="82" class="t-m" text-anchor="middle">UDP 623, lab LAN</text>
<path d="M150,140 L450,140" class="ln" marker-end="url(#console-sol-sequence-ak)"/>
<text x="300" y="133" class="t-m lbl" text-anchor="middle">1. POST Console/Open(host, reason) + Bearer   [T + F]</text>
<rect x="275.65" y="174" width="348.7" height="28" rx="5" class="box-o"/>
<text x="450" y="192" class="t-m" text-anchor="middle">2. token, operators file, target address, audit line</text>
<path d="M450,236 L150,236" class="ln-d" marker-end="url(#console-sol-sequence-ak)"/>
<text x="300" y="229" class="t-m lbl" text-anchor="middle">3. session id (256 bits), expires_in_s</text>
<path d="M150,284 L450,284" class="ln" marker-end="url(#console-sol-sequence-ak)"/>
<text x="300" y="277" class="t-m lbl" text-anchor="middle">4. WebSocket upgrade, bearer in subprotocol   [3T]</text>
<path d="M450,332 L750,332" class="ln" marker-end="url(#console-sol-sequence-ak)"/>
<text x="600" y="325" class="t-m lbl" text-anchor="middle">5. spawn: password in environment, not argv</text>
<path d="M750,380 L1050,380" class="ln" marker-end="url(#console-sol-sequence-ak)"/>
<text x="900" y="373" class="t-m lbl" text-anchor="middle">6. RMCP+ session; lan print: MAC = record?   [~28 exchanges]</text>
<path d="M750,428 L1050,428" class="ln" marker-end="url(#console-sol-sequence-ak)"/>
<text x="900" y="421" class="t-m lbl" text-anchor="middle">7. sol set bit rate if not 115.2; sol activate</text>
<path d="M1050,476 L150,476" class="ln-d" marker-end="url(#console-sol-sequence-ak)"/>
<text x="600" y="469" class="t-m lbl" text-anchor="middle">8. serial bytes: BMC &gt; ipmitool &gt; coordinator &gt; xterm</text>
<path d="M150,524 L1050,524" class="ln" marker-end="url(#console-sol-sequence-ak)"/>
<text x="600" y="517" class="t-m lbl" text-anchor="middle">9. keystrokes, the same path in reverse</text>
<path d="M150,572 L450,572" class="ln" marker-end="url(#console-sol-sequence-ak)"/>
<text x="300" y="565" class="t-m lbl" text-anchor="middle">10. close, tab closed or idle: sol deactivate, close line</text>
<text x="20" y="656" class="t-m" text-anchor="start">T browser-coordinator round trip, F audit fsync, exchange = one IPMI request and answer (R + B). Figures in section 11.1.</text>
</svg>
